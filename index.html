erary(vacation_id, day, sort);\ncreate unique index if not exists vitin_ext on public.vacation_itinerary(vacation_id, source, ext_id) where ext_id is not null;\ncreate table if not exists public.vacation_budget (\n  id uuid primary key default gen_random_uuid(),\n  vacation_id uuid not null references public.vacations(id) on delete cascade,\n  category text not null default 'other' check (category in ('flights','transport','gas','hotel','food','activities','tickets','other')),\n  label text not null default '' check (char_length(label) <= 120),\n  amount numeric(14,2) not null check (amount >= 0 and amount < 1e10),   -- always in the vacation's currency\n  entered_amount numeric(16,2), entered_currency text, rate numeric(18,8), rate_estimate boolean not null default false,\n  source text not null default 'manual', source_id uuid, added_by text not null,\n  created_at timestamptz not null default now(), updated_at timestamptz not null default now()\n);\ncreate index if not exists vbudget_vac on public.vacation_budget(vacation_id);\ncreate unique index if not exists vbudget_src on public.vacation_budget(vacation_id, source, source_id) where source_id is not null;\ncreate table if not exists public.vacation_items (      -- saved places / events / hotels\n  id uuid primary key default gen_random_uuid(),\n  vacation_id uuid not null references public.vacations(id) on delete cascade,\n  kind text not null check (kind in ('place','event','hotel')),\n  ext_id text, name text not null check (char_length(name) between 1 and 160),\n  data jsonb not null default '{}' check (pg_column_size(data) < 20000),\n  created_by text not null, created_at timestamptz not null default now()\n);\ncreate index if not exists vitems_vac on public.vacation_items(vacation_id, kind);\ncreate unique index if not exists vitems_ext on public.vacation_items(vacation_id, kind, ext_id) where ext_id is not null;\ncreate table if not exists public.vacation_activity (\n  id bigint generated always as identity primary key,\n  vacation_id uuid not null references public.vacations(id) on delete cascade,\n  uid text, kind text not null, data jsonb not null default '{}' check (pg_column_size(data) < 4000),\n  created_at timestamptz not null default now()\n);\ncreate index if not exists vact_vac on public.vacation_activity(vacation_id, id desc);\ncreate table if not exists public.vacation_trips (       -- live-trip clock (explicit Start / Stop); elapsed time is computed from these timestamps\n  vacation_id uuid primary key references public.vacations(id) on delete cascade,\n  transport_id uuid references public.vacation_transport(id) on delete set null,\n  state text not null default 'stopped' check (state in ('running','stopped')),\n  started_at timestamptz, ended_at timestamptz, started_by text, updated_at timestamptz not null default now()\n);\ncreate table if not exists public.vacation_tracks (      -- latest shared position, only while a member opted in; deleted on stop\n  vacation_id uuid not null references public.vacations(id) on delete cascade,\n  uid text not null, state text not null default 'active' check (state in ('active','paused')),\n  lat double precision, lng double precision, acc real, speed real, heading real, dist_m double precision not null default 0,\n  updated_at timestamptz not null default now(),\n  primary key (vacation_id, uid)\n);\ncreate sequence if not exists lgx.vseq;\ncreate table if not exists public.vacation_pings (       -- the only table the realtime channel can read: random key + counter, no data\n  ping text primary key, seq bigint not null, at timestamptz not null default now()\n);\ndo $$ declare t text; begin\n  foreach t in array array['vault_users','vault_tokens','app_secrets','api_usage','api_cache','vacations','vacation_members','vacation_contributions','vacation_transport','vacation_flights','vacation_tickets','vacation_itinerary','vacation_budget','vacation_items','vacation_activity','vacation_trips','vacation_tracks'] loop\n    execute format('alter table public.%I enable row level security', t);\n    execute format('revoke all on public.%I from anon, authenticated, public', t);\n    execute format('drop policy if exists deny_all on public.%I', t);\n    execute format('create policy deny_all on public.%I as restrictive for all to anon, authenticated using (false) with check (false)', t);\n  end loop;\nend $$;\nalter table public.vacation_pings enable row level security;\nrevoke all on public.vacation_pings from anon, authenticated, public;\ngrant select on public.vacation_pings to anon, authenticated;\ndrop policy if exists ping_read on public.vacation_pings;\ncreate policy ping_read on public.vacation_pings for select to anon, authenticated using (true);\ndo $$ begin\n  if exists (select 1 from pg_publication where pubname = 'supabase_realtime')\n     and not exists (select 1 from pg_publication_tables where pubname = 'supabase_realtime' and schemaname = 'public' and tablename = 'vacation_pings') then\n    alter publication supabase_realtime add table public.vacation_pings;\n  end if;\nend $$;\ncreate or replace function lgx.who(tok text) returns text language plpgsql security definer set search_path = public as $$\ndeclare u text; h text;\nbegin\n  if tok is null or length(tok) < 40 or length(tok) > 128 then raise exception 'auth'; end if;\n  h := encode(sha256(convert_to(tok, 'utf8')), 'hex');\n  select t.uid into u from public.vault_tokens t where t.thash = h and t.expires_at > now();\n  if u is null then raise exception 'auth'; end if;\n  update public.vault_tokens set last_used = now() where thash = h and last_used < now() - interval '5 minutes';\n  return u;\nend $$;\ncreate or replace function lgx.mem(v uuid, u text) returns text language sql stable security definer set search_path = public as $$\n  select case when status = 'active' then role else 'invited' end from public.vacation_members where vacation_id = v and uid = u $$;\ncreate or replace function lgx.need(v uuid, u text, lvl text) returns text language plpgsql stable security definer set search_path = public as $$\ndeclare m text := lgx.mem(v, u);\nbegin\n  if m is null then raise exception 'not found'; end if;\n  if m = 'invited' then raise exception 'forbidden'; end if;\n  if lvl = 'owner' and m <> 'owner' then raise exception 'forbidden'; end if;\n  return m;\nend $$;\ncreate or replace function lgx.rate(u text, b text, lim int) returns void language plpgsql security definer set search_path = public as $$\ndeclare k int; w timestamptz := date_trunc('hour', now());\nbegin\n  insert into public.api_usage(uid, bucket, win, n) values (u, b, w, 1) on conflict (uid, bucket, win) do update set n = public.api_usage.n + 1 returning n into k;\n  if k > lim then raise exception 'rate limit'; end if;\n  if random() < 0.01 then delete from public.api_usage where win < now() - interval '2 days'; end if;\nend $$;\ncreate or replace function lgx.touch(p text) returns void language sql security definer set search_path = public as $$\n  insert into public.vacation_pings(ping, seq, at) values (p, nextval('lgx.vseq'), now())\n  on conflict (ping) do update set seq = excluded.seq, at = excluded.at $$;\ncreate or replace function lgx.touch_v(v uuid) returns void language plpgsql security definer set search_path = public as $$\ndeclare p text;\nbegin select ping into p from public.vacations where id = v; if p is not null then perform lgx.touch(p); end if; end $$;\ncreate or replace function lgx.touch_u(u text) returns void language plpgsql security definer set search_path = public as $$\ndeclare p text;\nbegin select ping into p from public.vault_users where uid = u; if p is not null then perform lgx.touch(p); end if; end $$;\ncreate or replace function lgx.act(v uuid, u text, k text, d jsonb) returns void language sql security definer set search_path = public as $$\n  insert into public.vacation_activity(vacation_id, uid, kind, data) values (v, u, k, coalesce(d, '{}')) $$;\ncreate or replace function lgx.total(v uuid) returns numeric language sql stable security definer set search_path = public as $$\n  select coalesce(sum(amount), 0) from public.vacation_contributions where vacation_id = v and not voided $$;\ncreate or replace function lgx.top(v uuid) returns text language sql stable security definer set search_path = public as $$\n  select case when count(*) filter (where s = m) = 1 then (array_agg(uid order by s desc))[1] end\n  from (select uid, sum(amount) s, max(sum(amount)) over () m from public.vacation_contributions where vacation_id = v and not voided group by uid) q $$;\ncreate or replace function lgx.is_owner(u text) returns boolean language sql stable security definer set search_path = public as $$\n  select exists (select 1 from public.kv where path = 's/meta/owner' and not deleted and value->>'uid' = u) $$;\ncreate or replace function lgx.t(d jsonb, k text, n int) returns text language sql immutable as $$ select left(btrim(coalesce(d->>k, '')), n) $$;\ncreate or replace function lgx.num(d jsonb, k text) returns numeric language sql immutable as $$ select nullif(btrim(coalesce(d->>k, '')), '')::numeric $$;\ncreate or replace function lgx.bline(v uuid, u text, src text, sid uuid, cat text, lbl text, amt numeric, d jsonb) returns void\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if amt is null or amt <= 0 then delete from public.vacation_budget where vacation_id = v and source = src and source_id = sid; return; end if;\n  insert into public.vacation_budget(vacation_id, category, label, amount, entered_amount, entered_currency, rate, rate_estimate, source, source_id, added_by)\n  values (v, cat, left(lbl, 120), round(amt, 2), lgx.num(d, 'entered_amount'), nullif(upper(lgx.t(d, 'entered_currency', 3)), ''), lgx.num(d, 'rate'), coalesce((d->>'rate_estimate')::boolean, false), src, sid, u)\n  on conflict (vacation_id, source, source_id) where source_id is not null\n  do update set category = excluded.category, label = excluded.label, amount = excluded.amount, entered_amount = excluded.entered_amount,\n    entered_currency = excluded.entered_currency, rate = excluded.rate, rate_estimate = excluded.rate_estimate, updated_at = now();\nend $$;\ncreate or replace function lgx.vjson(v public.vacations, u text, fl boolean) returns jsonb language plpgsql stable security definer set search_path = public as $$\ndeclare m text := lgx.mem(v.id, u); base jsonb;\nbegin\n  base := jsonb_build_object('id', v.id, 'ping', v.ping, 'name', v.name, 'destination', v.destination, 'origin', v.origin,\n    'start_date', v.start_date, 'end_date', v.end_date, 'currency', v.currency, 'travelers', v.travelers, 'transport', v.transport,\n    'cover_v', v.cover_v, 'owner_uid', v.owner_uid, 'status', v.status, 'role', coalesce(m, 'none'),\n    'members_n', (select count(*) from public.vacation_members where vacation_id = v.id and status = 'active'), 'updated_at', v.updated_at);\n  if m = 'invited' then return base; end if;\n  base := base || jsonb_build_object('target', v.target, 'total', lgx.total(v.id),\n    'contributors_n', (select count(distinct uid) from public.vacation_contributions where vacation_id = v.id and not voided),\n    'my_total', (select coalesce(sum(amount), 0) from public.vacation_contributions where vacation_id = v.id and uid = u and not voided));\n  if fl then base := base || jsonb_build_object('description', v.description, 'notes', v.notes, 'geo', v.geo, 'road', v.road, 'created_at', v.created_at); end if;\n  return base;\nend $$;\ncreate or replace function public.vault_open(u text, secret text) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare un text := lower(btrim(coalesce(u, ''))); rec jsonb; vu public.vault_users; h text; tok text;\nbegin\n  if un !~ '^[a-z0-9_]{3,20}$' or secret is null or length(secret) < 32 or length(secret) > 200 then raise exception 'bad request'; end if;\n  select value into rec from public.kv where path = 'auth/' || un and not deleted;\n  if rec is null or coalesce(rec->>'uid', '') = '' then raise exception 'unknown account'; end if;\n  h := encode(sha256(convert_to(secret, 'utf8')), 'hex');\n  select * into vu from public.vault_users where uid = rec->>'uid' for update;\n  if not found then\n    insert into public.vault_users(uid, username, vrf) values (rec->>'uid', un, h) returning * into vu;\n  else\n    if vu.locked_until is not null and vu.locked_until > now() then return jsonb_build_object('ok', false, 'err', 'locked'); end if;\n    if vu.vrf = '' then\n      update public.vault_users set vrf = h, fails = 0, locked_until = null, username = un where uid = vu.uid;\n    elsif vu.vrf <> h then\n      update public.vault_users set fails = fails + 1, locked_until = case when fails + 1 >= 8 then now() + interval '10 minutes' end where uid = vu.uid;\n      return jsonb_build_object('ok', false, 'err', 'bad_secret');\n    elsif vu.fails > 0 then\n      update public.vault_users set fails = 0, locked_until = null where uid = vu.uid;\n    end if;\n  end if;\n  delete from public.vault_tokens where uid = vu.uid and (expires_at < now() or thash in (select thash from public.vault_tokens where uid = vu.uid order by last_used desc offset 9));\n  tok := replace(gen_random_uuid()::text, '-', '') || replace(gen_random_uuid()::text, '-', '');\n  insert into public.vault_tokens(thash, uid) values (encode(sha256(convert_to(tok, 'utf8')), 'hex'), vu.uid);\n  return jsonb_build_object('ok', true, 'token', tok, 'uid', vu.uid, 'ping', vu.ping);\nend $$;\ncreate or replace function public.vault_check(tok text) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok);\nbegin return jsonb_build_object('uid', u, 'ping', (select ping from public.vault_users where uid = u), 'owner', lgx.is_owner(u)); end $$;\ncreate or replace function public.vault_close(tok text) returns void language plpgsql security definer set search_path = public as $$\nbegin delete from public.vault_tokens where thash = encode(sha256(convert_to(coalesce(tok, ''), 'utf8')), 'hex'); end $$;\ncreate or replace function public.vault_reset(tok text, target text) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); tu text;\nbegin\n  if not lgx.is_owner(u) then raise exception 'forbidden'; end if;\n  select uid into tu from public.vault_users where username = lower(btrim(coalesce(target, '')));\n  if tu is null then raise exception 'not found'; end if;\n  update public.vault_users set vrf = '', fails = 0, locked_until = null where uid = tu;\n  delete from public.vault_tokens where uid = tu;\n  return jsonb_build_object('ok', true);\nend $$;\ncreate or replace function public.secret_set(tok text, nm text, val text) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok);\nbegin\n  if not lgx.is_owner(u) then raise exception 'forbidden'; end if;\n  if nm not in ('aviationstack', 'ticketmaster') then raise exception 'bad request'; end if;\n  if val is null or btrim(val) = '' then delete from public.app_secrets where name = nm;\n  else\n    if length(val) < 8 or length(val) > 200 or val ~ '\\s' then raise exception 'bad key'; end if;\n    insert into public.app_secrets(name, value, updated_by) values (nm, btrim(val), u)\n    on conflict (name) do update set value = excluded.value, updated_at = now(), updated_by = excluded.updated_by;\n  end if;\n  return public.api_caps(tok);\nend $$;\ncreate or replace function public.api_caps(tok text) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok);\nbegin\n  return jsonb_build_object('flights', exists (select 1 from public.app_secrets where name = 'aviationstack'),\n    'events', exists (select 1 from public.app_secrets where name = 'ticketmaster'), 'owner', lgx.is_owner(u));\nend $$;\ncreate or replace function public.api_gate(tok text, bucket text, vid uuid) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); nm text; k text;\nbegin\n  if bucket not in ('flights', 'events') then raise exception 'bad request'; end if;\n  nm := case bucket when 'flights' then 'aviationstack' else 'ticketmaster' end;\n  if vid is not null and lgx.mem(vid, u) is distinct from 'owner' and lgx.mem(vid, u) is distinct from 'member' then raise exception 'forbidden'; end if;\n  perform lgx.rate(u, 'api:' || bucket, case bucket when 'flights' then 40 else 80 end);\n  select value into k from public.app_secrets where name = nm;\n  if k is null then raise exception 'not configured'; end if;\n  return jsonb_build_object('uid', u, 'key', k);\nend $$;\ncreate or replace function public.flight_apply(vid uuid, fid uuid, d jsonb) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare f public.vacation_flights; ps text; pd int;\nbegin\n  select * into f from public.vacation_flights where id = fid and vacation_id = vid for update;\n  if not found then raise exception 'not found'; end if;\n  ps := f.status; pd := f.delay_min;\n  update public.vacation_flights set\n    status = coalesce(nullif(d->>'status', ''), status), delay_min = case when d ? 'delay_min' then nullif(d->>'delay_min', '')::int else delay_min end,\n    est_dep = coalesce((d->>'est_dep')::timestamptz, est_dep), est_arr = coalesce((d->>'est_arr')::timestamptz, est_arr),\n    act_dep = coalesce((d->>'act_dep')::timestamptz, act_dep), act_arr = coalesce((d->>'act_arr')::timestamptz, act_arr),\n    gate = coalesce(nullif(left(d->>'gate', 8), ''), gate), terminal = coalesce(nullif(left(d->>'terminal', 8), ''), terminal),\n    arr_gate = coalesce(nullif(left(d->>'arr_gate', 8), ''), arr_gate), arr_terminal = coalesce(nullif(left(d->>'arr_terminal', 8), ''), arr_terminal),\n    dep_time = coalesce(dep_time, (d->>'dep_time')::timestamptz), arr_time = coalesce(arr_time, (d->>'arr_time')::timestamptz),\n    dep_tz = coalesce(nullif(left(d->>'dep_tz', 40), ''), dep_tz), arr_tz = coalesce(nullif(left(d->>'arr_tz', 40), ''), arr_tz),\n    airline = coalesce(nullif(left(d->>'airline', 60), ''), airline),\n    live = d->'live', status_source = 'api', fetched_at = now(), updated_at = now()\n  where id = fid returning * into f;\n  if f.status is distinct from ps or f.delay_min is distinct from pd then\n    perform lgx.act(vid, null, 'flight_status', jsonb_build_object('no', f.flight_no, 'status', f.status, 'delay', f.delay_min));\n  end if;\n  perform lgx.touch_v(vid);\n  return to_jsonb(f);\nend $$;\ncreate or replace function public.vac_list(tok text) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok);\nbegin\n  return coalesce((select jsonb_agg(lgx.vjson(v, u, false) order by coalesce(v.start_date, v.created_at::date), v.created_at)\n    from public.vacations v join public.vacation_members m on m.vacation_id = v.id and m.uid = u), '[]'::jsonb);\nend $$;\ncreate or replace function public.vac_pulse(tok text) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok);\nbegin\n  return jsonb_build_object(\n    'me', (select seq from public.vacation_pings p join public.vault_users x on x.ping = p.ping where x.uid = u),\n    'v', coalesce((select jsonb_object_agg(v.id, coalesce(p.seq, 0)) from public.vacations v join public.vacation_members m on m.vacation_id = v.id and m.uid = u left join public.vacation_pings p on p.ping = v.ping), '{}'::jsonb));\nend $$;\ncreate or replace function public.vac_cover(tok text, vid uuid) returns text language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); c text;\nbegin\n  if lgx.mem(vid, u) is null then raise exception 'not found'; end if;\n  select cover into c from public.vacations where id = vid; return c;\nend $$;\ncreate or replace function public.vac_blob(tok text, vid uuid, knd text, rid uuid) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); m text := lgx.mem(vid, u); r jsonb;\nbegin\n  if m is null or m = 'invited' then raise exception 'not found'; end if;\n  perform lgx.rate(u, 'vac_blob', 120);\n  if knd = 'ticket' then\n    select jsonb_build_object('data', k.file, 'name', k.file_name, 'type', k.file_type) into r from public.vacation_tickets k\n      where k.id = rid and k.vacation_id = vid and (k.visibility = 'group' or k.uid = u);\n  elsif knd = 'itinerary' then\n    select jsonb_build_object('data', i.image, 'name', '', 'type', 'image') into r from public.vacation_itinerary i where i.id = rid and i.vacation_id = vid;\n  else raise exception 'bad kind'; end if;\n  if r is null then raise exception 'not found'; end if;\n  return r;\nend $$;\ncreate or replace function public.vac_get(tok text, vid uuid) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); m text := lgx.mem(vid, u); v public.vacations;\nbegin\n  if m is null then raise exception 'not found'; end if;\n  select * into v from public.vacations where id = vid;\n  if m = 'invited' then return jsonb_build_object('vacation', lgx.vjson(v, u, false), 'role', 'invited'); end if;\n  return jsonb_build_object(\n    'role', m,\n    'seq', coalesce((select seq from public.vacation_pings where ping = v.ping), 0),\n    'vacation', lgx.vjson(v, u, true),\n    'members', coalesce((select jsonb_agg(jsonb_build_object('uid', q.uid, 'role', q.role, 'status', q.status, 'display', q.display, 'plan_type', q.plan_type,\n        'plan_value', q.plan_value, 'plan_monthly', q.plan_monthly, 'joined_at', q.joined_at, 'total', coalesce(q.s, 0), 'count', coalesce(q.n, 0), 'last', q.l)\n        order by coalesce(q.s, 0) desc, q.created_at nulls last)\n      from (select coalesce(mm.uid, c.uid) uid, coalesce(mm.role, 'member') role, coalesce(mm.status, 'left') status, coalesce(mm.display, '') display,\n              mm.plan_type, mm.plan_value, mm.plan_monthly, mm.joined_at, mm.created_at, c.s, c.n, c.l\n            from (select * from public.vacation_members where vacation_id = vid and (status = 'active' or m = 'owner')) mm\n            full join (select uid, sum(amount) s, count(*) n, max(created_at) l from public.vacation_contributions where vacation_id = vid and not voided group by uid) c on c.uid = mm.uid) q), '[]'),\n    'contributions', coalesce((select jsonb_agg(to_jsonb(c) - 'vacation_id' order by c.created_at desc) from (select * from public.vacation_contributions where vacation_id = vid order by created_at desc limit 300) c), '[]'),\n    'transport', coalesce((select jsonb_agg(to_jsonb(t) - 'vacation_id' order by t.position, t.created_at) from public.vacation_transport t where vacation_id = vid), '[]'),\n    'flights', coalesce((select jsonb_agg(to_jsonb(f) - 'vacation_id' order by f.dep_time nulls last, f.created_at) from public.vacation_flights f where vacation_id = vid), '[]'),\n    'tickets', coalesce((select jsonb_agg(to_jsonb(k) - 'vacation_id' - 'file' || jsonb_build_object('has_file', k.file is not null) order by k.at nulls last, k.created_at) from public.vacation_tickets k where vacation_id = vid and (k.visibility = 'group' or k.uid = u)), '[]'),\n    'itinerary', coalesce((select jsonb_agg(to_jsonb(i) - 'vacation_id' - 'image' || jsonb_build_object('has_image', i.image is not null) order by i.day, i.at nulls last, i.sort, i.created_at) from public.vacation_itinerary i where vacation_id = vid), '[]'),\n    'budget', coalesce((select jsonb_agg(to_jsonb(b) - 'vacation_id' order by b.created_at) from public.vacation_budget b where vacation_id = vid), '[]'),\n    'items', coalesce((select jsonb_agg(to_jsonb(x) - 'vacation_id' order by x.created_at) from public.vacation_items x where vacation_id = vid), '[]'),\n    'activity', coalesce((select jsonb_agg(to_jsonb(a) - 'vacation_id' order by a.id desc) from (select * from public.vacation_activity where vacation_id = vid order by id desc limit 150) a), '[]'),\n    'trip', (select to_jsonb(tr) - 'vacation_id' from public.vacation_trips tr where vacation_id = vid),\n    'tracks', coalesce((select jsonb_agg(to_jsonb(k) - 'vacation_id') from public.vacation_tracks k where vacation_id = vid), '[]'));\nend $$;\ncreate or replace function public.vac_create(tok text, d jsonb) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); v public.vacations;\nbegin\n  perform lgx.rate(u, 'vac_create', 20);\n  if (select count(*) from public.vacations where owner_uid = u) >= 30 then raise exception 'too many vacations'; end if;\n  insert into public.vacations(owner_uid, name, destination, origin, start_date, end_date, target, currency, description, notes, travelers, transport, cover, geo, road)\n  values (u, lgx.t(d, 'name', 80), lgx.t(d, 'destination', 160), lgx.t(d, 'origin', 160), nullif(d->>'start_date', '')::date, nullif(d->>'end_date', '')::date,\n    coalesce(lgx.num(d, 'target'), 0), coalesce(nullif(upper(lgx.t(d, 'currency', 3)), ''), 'USD'), lgx.t(d, 'description', 2000), lgx.t(d, 'notes', 4000),\n    coalesce(lgx.num(d, 'travelers')::int, 1), coalesce(nullif(lgx.t(d, 'transport', 10), ''), 'flight'), nullif(d->>'cover', ''), d->'geo', d->'road')\n  returning * into v;\n  if v.cover is not null then update public.vacations set cover_v = 1 where id = v.id; end if;\n  insert into public.vacation_members(vacation_id, uid, role, status, display, joined_at) values (v.id, u, 'owner', 'active', lgx.t(d, 'display', 40), now());\n  perform lgx.act(v.id, u, 'created', jsonb_build_object('name', v.name));\n  perform lgx.touch_v(v.id); perform lgx.touch_u(u);\n  return public.vac_get(tok, v.id);\nend $$;\ncreate or replace function public.vac_update(tok text, vid uuid, d jsonb) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); v public.vacations; o public.vacations; ch text[] := '{}';\nbegin\n  perform lgx.need(vid, u, 'owner'); perform lgx.rate(u, 'vac_write', 400);\n  select * into o from public.vacations where id = vid;\n  update public.vacations set\n    name = case when d ? 'name' then lgx.t(d, 'name', 80) else name end,\n    destination = case when d ? 'destination' then lgx.t(d, 'destination', 160) else destination end,\n    origin = case when d ? 'origin' then lgx.t(d, 'origin', 160) else origin end,\n    start_date = case when d ? 'start_date' then nullif(d->>'start_date', '')::date else start_date end,\n    end_date = case when d ? 'end_date' then nullif(d->>'end_date', '')::date else end_date end,\n    target = case when d ? 'target' then coalesce(lgx.num(d, 'target'), 0) else target end,\n    currency = case when d ? 'currency' then coalesce(nullif(upper(lgx.t(d, 'currency', 3)), ''), currency) else currency end,\n    description = case when d ? 'description' then lgx.t(d, 'description', 2000) else description end,\n    notes = case when d ? 'notes' then lgx.t(d, 'notes', 4000) else notes end,\n    travelers = case when d ? 'travelers' then coalesce(lgx.num(d, 'travelers')::int, travelers) else travelers end,\n    transport = case when d ? 'transport' then coalesce(nullif(lgx.t(d, 'transport', 10), ''), transport) else transport end,\n    cover = case when d ? 'cover' then nullif(d->>'cover', '') else cover end,\n    cover_v = case when d ? 'cover' then cover_v + 1 else cover_v end,\n    geo = case when d ? 'geo' then d->'geo' else geo end,\n    road = case when d ? 'road' then d->'road' else road end,\n    status = case when d ? 'status' and d->>'status' in ('active', 'done', 'cancelled') then d->>'status' else status end,\n    updated_at = now()\n  where id = vid returning * into v;\n  if v.target is distinct from o.target then perform lgx.act(vid, u, 'target', jsonb_build_object('from', o.target, 'to', v.target));\n  elsif v.start_date is distinct from o.start_date or v.end_date is distinct from o.end_date then perform lgx.act(vid, u, 'dates', jsonb_build_object('start', v.start_date, 'end', v.end_date));\n  else perform lgx.act(vid, u, 'edit', '{}'); end if;\n  perform lgx.touch_v(vid);\n  return lgx.vjson(v, u, true);\nend $$;\ncreate or replace function public.vac_delete(tok text, vid uuid) returns void language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); r record;\nbegin\n  perform lgx.need(vid, u, 'owner');\n  for r in select uid from public.vacation_members where vacation_id = vid loop perform lgx.touch_u(r.uid); end loop;\n  delete from public.vacation_pings where ping = (select ping from public.vacations where id = vid);\n  delete from public.vacations where id = vid;\nend $$;\ncreate or replace function public.vac_invite(tok text, vid uuid, uids text[]) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); x text; un text; n int := 0;\nbegin\n  perform lgx.need(vid, u, 'owner'); perform lgx.rate(u, 'vac_invite', 60);\n  if uids is null or array_length(uids, 1) > 20 then raise exception 'bad request'; end if;\n  foreach x in array uids loop\n    continue when x is null or x = u;\n    continue when exists (select 1 from public.vacation_members where vacation_id = vid and uid = x);\n    exit when (select count(*) from public.vacation_members where vacation_id = vid) >= 40;\n    select substr(path, 6) into un from public.kv where path like 'auth/%' and not deleted and value->>'uid' = x limit 1;\n    continue when un is null;\n    insert into public.vault_users(uid, username, vrf) values (x, un, '') on conflict (uid) do nothing;\n    insert into public.vacation_members(vacation_id, uid, role, status, invited_by) values (vid, x, 'member', 'invited', u);\n    perform lgx.act(vid, u, 'invite', jsonb_build_object('who', x));\n    perform lgx.touch_u(x); n := n + 1;\n  end loop;\n  perform lgx.touch_v(vid);\n  return jsonb_build_object('invited', n);\nend $$;\ncreate or replace function public.vac_respond(tok text, vid uuid, accept boolean, disp text default '') returns void language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok);\nbegin\n  if lgx.mem(vid, u) is distinct from 'invited' then raise exception 'not found'; end if;\n  if accept then\n    update public.vacation_members set status = 'active', joined_at = now(), display = left(btrim(coalesce(disp, '')), 40) where vacation_id = vid and uid = u;\n    perform lgx.act(vid, u, 'join', '{}');\n  else\n    delete from public.vacation_members where vacation_id = vid and uid = u;\n    perform lgx.act(vid, u, 'decline', '{}');\n  end if;\n  perform lgx.touch_v(vid); perform lgx.touch_u(u);\nend $$;\ncreate or replace function public.vac_leave(tok text, vid uuid) returns void language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); m text := lgx.mem(vid, u);\nbegin\n  if m is null then raise exception 'not found'; end if;\n  if m = 'owner' then raise exception 'owner cannot leave'; end if;\n  delete from public.vacation_members where vacation_id = vid and uid = u;\n  delete from public.vacation_tracks where vacation_id = vid and uid = u;\n  if m = 'member' then perform lgx.act(vid, u, 'leave', '{}'); end if;\n  perform lgx.touch_v(vid); perform lgx.touch_u(u);\nend $$;\ncreate or replace function public.vac_kick(tok text, vid uuid, target text) returns void language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok);\nbegin\n  perform lgx.need(vid, u, 'owner');\n  if target = u then raise exception 'forbidden'; end if;\n  delete from public.vacation_members where vacation_id = vid and uid = target;\n  delete from public.vacation_tracks where vacation_id = vid and uid = target;\n  perform lgx.act(vid, u, 'kick', jsonb_build_object('who', target));\n  perform lgx.touch_v(vid); perform lgx.touch_u(target);\nend $$;\ncreate or replace function public.vac_plan(tok text, vid uuid, ptype text, pvalue numeric, pmonthly numeric) returns void language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok);\nbegin\n  perform lgx.need(vid, u, 'member');\n  if ptype is not null and ptype not in ('fixed', 'percent') then raise exception 'bad request'; end if;\n  update public.vacation_members set plan_type = ptype, plan_value = case when ptype is null then null else pvalue end, plan_monthly = case when ptype is null then null else pmonthly end\n    where vacation_id = vid and uid = u;\n  perform lgx.touch_v(vid);\nend $$;\ncreate or replace function public.vac_contribute(tok text, vid uuid, amount numeric, note text default '') returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); v public.vacations; before_t numeric; after_t numeric; top0 text; top1 text; pa int; pb int; th int; cid uuid;\nbegin\n  perform lgx.need(vid, u, 'member'); perform lgx.rate(u, 'contribute', 40);\n  if amount is null or amount <= 0 or amount >= 1e9 then raise exception 'bad amount'; end if;\n  select * into v from public.vacations where id = vid;\n  before_t := lgx.total(vid); top0 := lgx.top(vid);\n  insert into public.vacation_contributions(vacation_id, uid, amount, currency, note) values (vid, u, round(amount, 2), v.currency, left(btrim(coalesce(note, '')), 200)) returning id into cid;\n  after_t := lgx.total(vid); top1 := lgx.top(vid);\n  perform lgx.act(vid, u, 'contrib', jsonb_build_object('amount', round(amount, 2), 'cid', cid, 'currency', v.currency, 'note', left(btrim(coalesce(note, '')), 80)));\n  if v.target > 0 then\n    pa := floor(before_t / v.target * 100); pb := floor(after_t / v.target * 100);\n    foreach th in array array[25, 50, 75, 100] loop\n      if pa < th and pb >= th then perform lgx.act(vid, null, 'milestone', jsonb_build_object('pct', th)); end if;\n    end loop;\n  end if;\n  if top1 is not null and top1 is distinct from top0 and top0 is not null then perform lgx.act(vid, top1, 'top', '{}'); end if;\n  perform lgx.touch_v(vid);\n  return jsonb_build_object('id', cid, 'total', after_t);\nend $$;\ncreate or replace function public.vac_void(tok text, vid uuid, cid uuid) returns void language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); m text := lgx.need(vid, u, 'member'); c public.vacation_contributions;\nbegin\n  select * into c from public.vacation_contributions where id = cid and vacation_id = vid and not voided for update;\n  if not found then raise exception 'not found'; end if;\n  if c.uid <> u and m <> 'owner' then raise exception 'forbidden'; end if;\n  update public.vacation_contributions set voided = true, voided_by = u, voided_at = now() where id = cid;\n  perform lgx.act(vid, u, 'void', jsonb_build_object('amount', c.amount, 'who', c.uid));\n  perform lgx.touch_v(vid);\nend $$;\ncreate or replace function lgx.ts(d jsonb, k text) returns timestamptz language sql immutable as $$ select nullif(btrim(coalesce(d->>k, '')), '')::timestamptz $$;\ncreate or replace function public.vac_save(tok text, vid uuid, knd text, d jsonb) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); m text := lgx.need(vid, u, 'member'); own boolean := (m = 'owner');\n  rid uuid; n int; res jsonb; isnew boolean; tid uuid; st text; md text; fc numeric; dist numeric; mpg numeric; fp numeric; cat text; ek text;\n  ostops jsonb; odep timestamptz; nm text; lbl text; amt numeric; fr text; tt text;\nbegin\n  perform lgx.rate(u, 'vac_write', 500);\n  if d is null or jsonb_typeof(d) <> 'object' then raise exception 'bad request'; end if;\n  rid := coalesce(nullif(d->>'id', '')::uuid, gen_random_uuid());\n  if knd = 'flight' then\n    isnew := not exists (select 1 from public.vacation_flights where id = rid);\n    tid := nullif(d->>'transport_id', '')::uuid;\n    if tid is not null and not exists (select 1 from public.vacation_transport where id = tid and vacation_id = vid) then raise exception 'bad request'; end if;\n    st := lower(lgx.t(d, 'status', 20));\n    if st not in ('', 'scheduled', 'active', 'landed', 'cancelled', 'incident', 'diverted', 'delayed', 'on_time', 'boarding') then raise exception 'bad status'; end if;\n    insert into public.vacation_flights as f (id, vacation_id, transport_id, leg, airline, flight_no, dep_airport, arr_airport, dep_time, arr_time, dep_tz, arr_tz,\n        gate, terminal, arr_gate, arr_terminal, seat, boarding_time, status, delay_min, added_by)\n      values (rid, vid, tid, coalesce(nullif(lgx.t(d, 'leg', 12), ''), 'outbound'), lgx.t(d, 'airline', 60), upper(regexp_replace(lgx.t(d, 'flight_no', 10), '\\s', '', 'g')),\n        upper(lgx.t(d, 'dep_airport', 4)), upper(lgx.t(d, 'arr_airport', 4)), lgx.ts(d, 'dep_time'), lgx.ts(d, 'arr_time'), nullif(lgx.t(d, 'dep_tz', 40), ''), nullif(lgx.t(d, 'arr_tz', 40), ''),\n        lgx.t(d, 'gate', 8), lgx.t(d, 'terminal', 8), lgx.t(d, 'arr_gate', 8), lgx.t(d, 'arr_terminal', 8), lgx.t(d, 'seat', 8), lgx.ts(d, 'boarding_time'), st, lgx.num(d, 'delay_min')::int, u)\n      on conflict (id) do update set transport_id = excluded.transport_id, leg = excluded.leg, airline = excluded.airline, flight_no = excluded.flight_no,\n        dep_airport = excluded.dep_airport, arr_airport = excluded.arr_airport, dep_time = excluded.dep_time, arr_time = excluded.arr_time, dep_tz = excluded.dep_tz, arr_tz = excluded.arr_tz,\n        gate = excluded.gate, terminal = excluded.terminal, arr_gate = excluded.arr_gate, arr_terminal = excluded.arr_terminal, seat = excluded.seat, boarding_time = excluded.boarding_time,\n        status = case when f.status_source = 'api' then f.status else excluded.status end,\n        delay_min = case when f.status_source = 'api' then f.delay_min else excluded.delay_min end,\n        updated_at = now()\n      where f.vacation_id = vid and (f.added_by = u or own);\n    get diagnostics n = row_count;\n    if n = 0 then raise exception 'forbidden'; end if;\n    if isnew then perform lgx.act(vid, u, 'flight_add', jsonb_build_object('no', upper(lgx.t(d, 'flight_no', 10)), 'from', upper(lgx.t(d, 'dep_airport', 4)), 'to', upper(lgx.t(d, 'arr_airport', 4)))); end if;\n    select to_jsonb(x) - 'vacation_id' into res from public.vacation_flights x where id = rid;\n  elsif knd = 'transport' then\n    md := lgx.t(d, 'mode', 10);\n    if md not in ('flight', 'drive', 'train', 'bus', 'cruise', 'rental', 'other') then raise exception 'bad mode'; end if;\n    select stops, depart_at into ostops, odep from public.vacation_transport where id = rid and vacation_id = vid;\n    isnew := not found;\n    if isnew and exists (select 1 from public.vacation_transport where id = rid) then raise exception 'forbidden'; end if;\n    if isnew and (select count(*) from public.vacation_transport where vacation_id = vid) >= 24 then raise exception 'too many segments'; end if;\n    dist := lgx.num(d, 'distance_m'); mpg := lgx.num(d, 'mpg'); fp := lgx.num(d, 'fuel_price');\n    fc := case when dist is not null and mpg > 0 and fp is not null then round(dist / 1609.344 / mpg * fp, 2) else lgx.num(d, 'fuel_cost') end;\n    if jsonb_typeof(coalesce(d->'stops', '[]')) <> 'array' or jsonb_array_length(coalesce(d->'stops', '[]')) > 12 then raise exception 'bad stops'; end if;\n    insert into public.vacation_transport as t (id, vacation_id, position, mode, from_name, to_name, from_lat, from_lng, to_lat, to_lng, depart_at, arrive_at, depart_tz, arrive_tz,\n        distance_m, duration_s, route_source, route, vehicle, mpg, fuel_type, fuel_price, fuel_cost, cost, provider, confirmation, notes, stops, added_by)\n      values (rid, vid, coalesce(lgx.num(d, 'position')::int, (select coalesce(max(position) + 1, 0) from public.vacation_transport where vacation_id = vid)), md,\n        lgx.t(d, 'from_name', 120), lgx.t(d, 'to_name', 120), lgx.num(d, 'from_lat'), lgx.num(d, 'from_lng'), lgx.num(d, 'to_lat'), lgx.num(d, 'to_lng'),\n        lgx.ts(d, 'depart_at'), lgx.ts(d, 'arrive_at'), nullif(lgx.t(d, 'depart_tz', 40), ''), nullif(lgx.t(d, 'arrive_tz', 40), ''),\n        dist, lgx.num(d, 'duration_s')::int, coalesce(nullif(lgx.t(d, 'route_source', 8), ''), ''), d->'route', lgx.t(d, 'vehicle', 60), mpg, lgx.t(d, 'fuel_type', 20), fp, fc,\n        lgx.num(d, 'cost'), lgx.t(d, 'provider', 80), lgx.t(d, 'confirmation', 40), lgx.t(d, 'notes', 1000), coalesce(d->'stops', '[]'), u)\n      on conflict (id) do update set position = excluded.position, mode = excluded.mode, from_name = excluded.from_name, to_name = excluded.to_name,\n        from_lat = excluded.from_lat, from_lng = excluded.from_lng, to_lat = excluded.to_lat, to_lng = excluded.to_lng, depart_at = excluded.depart_at, arrive_at = excluded.arrive_at,\n        depart_tz = excluded.depart_tz, arrive_tz = excluded.arrive_tz, distance_m = excluded.distance_m, duration_s = excluded.duration_s, route_source = excluded.route_source,\n        route = excluded.route, vehicle = excluded.vehicle, mpg = excluded.mpg, fuel_type = excluded.fuel_type, fuel_price = excluded.fuel_price, fuel_cost = excluded.fuel_cost,\n        cost = excluded.cost, provider = excluded.provider, confirmation = excluded.confirmation, notes = excluded.notes, stops = excluded.stops, updated_at = now()\n      where t.vacation_id = vid;\n    nm := case md when 'flight' then 'Flight' when 'drive' then 'Drive' when 'train' then 'Train' when 'bus' then 'Bus' when 'cruise' then 'Cruise' when 'rental' then 'Rental car' else 'Transport' end\n          || ' ' || lgx.t(d, 'from_name', 60) || ' \u2192 ' || lgx.t(d, 'to_name', 60);\n    perform lgx.bline(vid, u, 'transport:fare', rid, case md when 'flight' then 'flights' else 'transport' end, nm, lgx.num(d, 'cost'), '{}');\n    perform lgx.bline(vid, u, 'transport:fuel', rid, 'gas', 'Fuel \u00b7 ' || lgx.t(d, 'from_name', 50) || ' \u2192 ' || lgx.t(d, 'to_name', 50), fc, '{}');\n    if isnew then perform lgx.act(vid, u, 'transport_add', jsonb_build_object('mode', md, 'from', lgx.t(d, 'from_name', 60), 'to', lgx.t(d, 'to_name', 60)));\n    else\n      if odep is distinct from lgx.ts(d, 'depart_at') then perform lgx.act(vid, u, 'depart_change', jsonb_build_object('mode', md, 'from', lgx.t(d, 'from_name', 60), 'to', lgx.t(d, 'to_name', 60), 'at', lgx.ts(d, 'depart_at'))); end if;\n      if jsonb_array_length(coalesce(d->'stops', '[]')) > jsonb_array_length(coalesce(ostops, '[]')) then\n        perform lgx.act(vid, u, 'stop_add', jsonb_build_object('name', left(coalesce(d->'stops'->-1->>'name', ''), 80))); end if;\n    end if;\n    select to_jsonb(x) - 'vacation_id' into res from public.vacation_transport x where id = rid;\n  elsif knd = 'ticket' then\n    st := lgx.t(d, 'visibility', 8);\n    if st not in ('private', 'group') then st := 'private'; end if;\n    md := lgx.t(d, 'kind', 10);\n    if md not in ('flight', 'train', 'bus', 'cruise', 'rental', 'hotel', 'event', 'other') then md := 'other'; end if;\n    isnew := not exists (select 1 from public.vacation_tickets where id = rid);\n    insert into public.vacation_tickets as k (id, vacation_id, uid, visibility, kind, provider, passenger, confirmation, from_name, to_name, location, at, seat, terminal, gate, cost, notes, file, file_name, file_type)\n      values (rid, vid, u, st, md, lgx.t(d, 'provider', 80), lgx.t(d, 'passenger', 80), lgx.t(d, 'confirmation', 40), lgx.t(d, 'from_name', 80), lgx.t(d, 'to_name', 80), lgx.t(d, 'location', 160),\n        lgx.ts(d, 'at'), lgx.t(d, 'seat', 12), lgx.t(d, 'terminal', 12), lgx.t(d, 'gate', 12), lgx.num(d, 'cost'), lgx.t(d, 'notes', 600), nullif(d->>'file', ''), lgx.t(d, 'file_name', 80), lgx.t(d, 'file_type', 60))\n      on conflict (id) do update set visibility = excluded.visibility, kind = excluded.kind, provider = excluded.provider, passenger = excluded.passenger, confirmation = excluded.confirmation,\n        from_name = excluded.from_name, to_name = excluded.to_name, location = excluded.location, at = excluded.at, seat = excluded.seat, terminal = excluded.terminal, gate = excluded.gate,\n        cost = excluded.cost, notes = excluded.notes,\n        file = case when d ? 'file' then excluded.file else k.file end, file_name = case when d ? 'file' then excluded.file_name else k.file_name end, file_type = case when d ? 'file' then excluded.file_type else k.file_type end,\n        updated_at = now()\n      where k.vacation_id = vid and k.uid = u;\n    get diagnostics n = row_count;\n    if n = 0 then raise exception 'forbidden'; end if;\n    perform lgx.bline(vid, u, 'ticket', rid, case md when 'flight' then 'flights' when 'event' then 'tickets' else 'tickets' end, 'Ticket \u00b7 ' || coalesce(nullif(lgx.t(d, 'provider', 60), ''), md), case when st = 'group' then lgx.num(d, 'cost') end, '{}');\n    if isnew and st = 'group' then perform lgx.act(vid, u, 'ticket_add', jsonb_build_object('kind', md)); end if;\n    select to_jsonb(x) - 'vacation_id' - 'file' || jsonb_build_object('has_file', x.file is not null) into res from public.vacation_tickets x where id = rid;\n  elsif knd = 'itinerary' then\n    cat := lgx.t(d, 'category', 10);\n    if cat not in ('hotel', 'food', 'activity', 'place', 'transport', 'flight', 'holiday', 'event', 'other') then cat := 'other'; end if;\n    st := lgx.t(d, 'source', 10);\n    if st not in ('manual', 'holiday', 'event', 'place', 'hotel', 'flight', 'transport') then st := 'manual'; end if;\n    isnew := not exists (select 1 from public.vacation_itinerary where id = rid);\n    if isnew and (select count(*) from public.vacation_itinerary where vacation_id = vid) >= 600 then raise exception 'itinerary is full'; end if;\n    ek := nullif(lgx.t(d, 'ext_id', 80), '');\n    begin\n      insert into public.vacation_itinerary as i (id, vacation_id, day, at, title, category, location, description, notes, cost, image, geo, tz, source, ext_id, sort, added_by)\n        values (rid, vid, (d->>'day')::date, nullif(d->>'at', '')::time, lgx.t(d, 'title', 120), cat, lgx.t(d, 'location', 160), lgx.t(d, 'description', 1000), lgx.t(d, 'notes', 1000), lgx.num(d, 'cost'),\n          nullif(d->>'image', ''), d->'geo', nullif(lgx.t(d, 'tz', 40), ''), st, ek,\n          coalesce(lgx.num(d, 'sort')::int, (select coalesce(max(sort) + 1, 0) from public.vacation_itinerary where vacation_id = vid and day = (d->>'day')::date)), u)\n        on conflict (id) do update set day = excluded.day, at = excluded.at, title = excluded.title, category = excluded.category, location = excluded.location, description = excluded.description,\n          notes = excluded.notes, cost = excluded.cost, image = case when d ? 'image' then excluded.image else i.image end, geo = excluded.geo, tz = excluded.tz, sort = excluded.sort, updated_at = now()\n        where i.vacation_id = vid;\n    exception when unique_violation then raise exception 'already on the itinerary';\n    end;\n    get diagnostics n = row_count;\n    if n = 0 then raise exception 'forbidden'; end if;\n    perform lgx.bline(vid, u, 'itinerary', rid,\n      case cat when 'hotel' then 'hotel' when 'food' then 'food' when 'transport' then 'transport' when 'flight' then 'flights' when 'holiday' then 'other' when 'other' then 'other' else 'activities' end,\n      lgx.t(d, 'title', 100), case when st in ('holiday') then null else lgx.num(d, 'cost') end, '{}');\n    if st <> 'holiday' then perform lgx.act(vid, u, case when isnew then 'it_add' else 'it_edit' end, jsonb_build_object('title', lgx.t(d, 'title', 80), 'day', d->>'day')); end if;\n    select to_jsonb(x) - 'vacation_id' - 'image' || jsonb_build_object('has_image', x.image is not null) into res from public.vacation_itinerary x where id = rid;\n  elsif knd = 'budget' then\n    cat := lgx.t(d, 'category', 10);\n    if cat not in ('flights', 'transport', 'gas', 'hotel', 'food', 'activities', 'tickets', 'other') then cat := 'other'; end if;\n    amt := lgx.num(d, 'amount');\n    if amt is null or amt < 0 then raise exception 'bad amount'; end if;\n    isnew := not exists (select 1 from public.vacation_budget where id = rid);\n    insert into public.vacation_budget as b (id, vacation_id, category, label, amount, entered_amount, entered_currency, rate, rate_estimate, source, added_by)\n      values (rid, vid, cat, lgx.t(d, 'label', 120), round(amt, 2), lgx.num(d, 'entered_amount'), nullif(upper(lgx.t(d, 'entered_currency', 3)), ''), lgx.num(d, 'rate'),\n        coalesce((d->>'rate_estimate')::boolean, false), 'manual', u)\n      on conflict (id) do update set category = excluded.category, label = excluded.label, amount = excluded.amount, entered_amount = excluded.entered_amount,\n        entered_currency = excluded.entered_currency, rate = excluded.rate, rate_estimate = excluded.rate_estimate, updated_at = now()\n      where b.vacation_id = vid and b.source = 'manual' and (b.added_by = u or own);\n    get diagnostics n = row_count;\n    if n = 0 then raise exception 'forbidden'; end if;\n    if isnew then perform lgx.act(vid, u, 'budget_add', jsonb_build_object('label', lgx.t(d, 'label', 80), 'amount', round(amt, 2))); end if;\n    select to_jsonb(x) - 'vacation_id' into res from public.vacation_budget x where id = rid;\n  elsif knd = 'item' then\n    md := lgx.t(d, 'kind', 6);\n    if md not in ('place', 'event', 'hotel') then raise exception 'bad kind'; end if;\n    ek := nullif(lgx.t(d, 'ext_id', 120), '');\n    if ek is not null and nullif(d->>'id', '') is null then select id into rid from public.vacation_items where vacation_id = vid and kind = md and ext_id = ek; rid := coalesce(rid, gen_random_uuid()); end if;\n    isnew := not exists (select 1 from public.vacation_items where id = rid);\n    if isnew and (select count(*) from public.vacation_items where vacation_id = vid) >= 300 then raise exception 'too many saved items'; end if;\n    nm := lgx.t(d, 'name', 160);\n    insert into public.vacation_items as x (id, vacation_id, kind, ext_id, name, data, created_by)\n      values (rid, vid, md, ek, nm, coalesce(d->'data', '{}'), u)\n      on conflict (id) do update set name = excluded.name, data = excluded.data where x.vacation_id = vid and (x.created_by = u or own);\n    get diagnostics n = row_count;\n    if n = 0 then raise exception 'forbidden'; end if;\n    amt := lgx.num(d->'budget', 'amount');\n    perform lgx.bline(vid, u, 'item:' || md, rid, case md when 'hotel' then 'hotel' when 'event' then 'activities' else 'other' end,\n      case md when 'hotel' then 'Hotel \u00b7 ' when 'event' then 'Event \u00b7 ' else 'Place \u00b7 ' end || left(nm, 90), amt, coalesce(d->'budget', '{}'));\n    if isnew then perform lgx.act(vid, u, 'item_add', jsonb_build_object('kind', md, 'name', left(nm, 80))); end if;\n    select to_jsonb(x) - 'vacation_id' into res from public.vacation_items x where id = rid;\n  else\n    raise exception 'bad kind';\n  end if;\n  perform lgx.touch_v(vid);\n  update public.vacations set updated_at = now() where id = vid;\n  return res;\nend $$;\ncreate or replace function public.vac_remove(tok text, vid uuid, knd text, rid uuid) returns void language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); m text := lgx.need(vid, u, 'member'); own boolean := (m = 'owner'); n int; nm text; src text;\nbegin\n  perform lgx.rate(u, 'vac_write', 500);\n  if knd = 'flight' then\n    select flight_no into nm from public.vacation_flights where id = rid and vacation_id = vid and (added_by = u or own);\n    if not found then raise exception 'forbidden'; end if;\n    delete from public.vacation_flights where id = rid; perform lgx.act(vid, u, 'flight_del', jsonb_build_object('no', nm));\n  elsif knd = 'transport' then\n    select concat(from_name, ' \u2192 ', to_name) into nm from public.vacation_transport where id = rid and vacation_id = vid and (added_by = u or own);\n    if not found then raise exception 'forbidden'; end if;\n    delete from public.vacation_budget where vacation_id = vid and source in ('transport:fare', 'transport:fuel') and source_id = rid;\n    delete from public.vacation_transport where id = rid; perform lgx.act(vid, u, 'transport_del', jsonb_build_object('name', left(nm, 100)));\n  elsif knd = 'ticket' then\n    delete from public.vacation_tickets where id = rid and vacation_id = vid and uid = u;\n    get diagnostics n = row_count; if n = 0 then raise exception 'forbidden'; end if;\n    delete from public.vacation_budget where vacation_id = vid and source = 'ticket' and source_id = rid;\n  elsif knd = 'itinerary' then\n    select title into nm from public.vacation_itinerary where id = rid and vacation_id = vid and (added_by = u or own);\n    if not found then raise exception 'forbidden'; end if;\n    delete from public.vacation_budget where vacation_id = vid and source = 'itinerary' and source_id = rid;\n    delete from public.vacation_itinerary where id = rid; perform lgx.act(vid, u, 'it_del', jsonb_build_object('title', left(nm, 80)));\n  elsif knd = 'budget' then\n    select source into src from public.vacation_budget where id = rid and vacation_id = vid and (added_by = u or own);\n    if not found then raise exception 'forbidden'; end if;\n    if src <> 'manual' then raise exception 'remove the item it came from instead'; end if;\n    delete from public.vacation_budget where id = rid;\n  elsif knd = 'item' then\n    select name into nm from public.vacation_items where id = rid and vacation_id = vid and (created_by = u or own);\n    if not found then raise exception 'forbidden'; end if;\n    delete from public.vacation_budget where vacation_id = vid and source in ('item:place', 'item:event', 'item:hotel') and source_id = rid;\n    delete from public.vacation_items where id = rid;\n  else raise exception 'bad kind'; end if;\n  perform lgx.touch_v(vid);\nend $$;\ncreate or replace function public.vac_reorder(tok text, vid uuid, knd text, ids uuid[]) returns void language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok);\nbegin\n  perform lgx.need(vid, u, 'member'); perform lgx.rate(u, 'vac_write', 500);\n  if ids is null or array_length(ids, 1) > 700 then raise exception 'bad request'; end if;\n  if knd = 'itinerary' then\n    update public.vacation_itinerary t set sort = o.ord::int from unnest(ids) with ordinality o(rid, ord) where t.id = o.rid and t.vacation_id = vid;\n  elsif knd = 'transport' then\n    update public.vacation_transport t set position = o.ord::int from unnest(ids) with ordinality o(rid, ord) where t.id = o.rid and t.vacation_id = vid;\n  else raise exception 'bad kind'; end if;\n  perform lgx.touch_v(vid);\nend $$;\ncreate or replace function public.vac_trip(tok text, vid uuid, op text, tid uuid default null) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); tr public.vacation_trips;\nbegin\n  perform lgx.need(vid, u, 'member'); perform lgx.rate(u, 'vac_trip', 60);\n  select * into tr from public.vacation_trips where vacation_id = vid for update;\n  if op = 'start' then\n    if found and tr.state = 'running' then raise exception 'already running'; end if;\n    if tid is not null and not exists (select 1 from public.vacation_transport where id = tid and vacation_id = vid) then raise exception 'bad request'; end if;\n    insert into public.vacation_trips(vacation_id, transport_id, state, started_at, ended_at, started_by) values (vid, tid, 'running', now(), null, u)\n      on conflict (vacation_id) do update set transport_id = excluded.transport_id, state = 'running', started_at = now(), ended_at = null, started_by = u, updated_at = now();\n    perform lgx.act(vid, u, 'trip_start', '{}');\n  elsif op = 'stop' then\n    if not found or tr.state <> 'running' then raise exception 'not running'; end if;\n    update public.vacation_trips set state = 'stopped', ended_at = now(), updated_at = now() where vacation_id = vid;\n    delete from public.vacation_tracks where vacation_id = vid;\n    perform lgx.act(vid, u, 'trip_stop', '{}');\n  else raise exception 'bad request'; end if;\n  perform lgx.touch_v(vid);\n  return (select to_jsonb(x) - 'vacation_id' from public.vacation_trips x where vacation_id = vid);\nend $$;\ncreate or replace function public.vac_track(tok text, vid uuid, d jsonb) returns void language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok); op text := coalesce(d->>'op', 'update'); la double precision; lo double precision;\nbegin\n  perform lgx.need(vid, u, 'member'); perform lgx.rate(u, 'vac_track', 400);\n  if op = 'stop' then delete from public.vacation_tracks where vacation_id = vid and uid = u; perform lgx.touch_v(vid); return; end if;\n  if not exists (select 1 from public.vacation_trips where vacation_id = vid and state = 'running') then raise exception 'trip is not running'; end if;\n  if op = 'pause' then\n    insert into public.vacation_tracks(vacation_id, uid, state, lat, lng, acc, speed, heading, dist_m) values (vid, u, 'paused', null, null, null, null, null, coalesce(lgx.num(d, 'dist_m'), 0))\n      on conflict (vacation_id, uid) do update set state = 'paused', lat = null, lng = null, acc = null, speed = null, heading = null, dist_m = excluded.dist_m, updated_at = now();\n    return;\n  end if;\n  la := lgx.num(d, 'lat'); lo := lgx.num(d, 'lng');\n  if la is null or lo is null or la not between -90 and 90 or lo not between -180 and 180 then raise exception 'bad position'; end if;\n  insert into public.vacation_tracks(vacation_id, uid, state, lat, lng, acc, speed, heading, dist_m)\n    values (vid, u, 'active', round(la::numeric, 5), round(lo::numeric, 5), lgx.num(d, 'acc'), lgx.num(d, 'speed'), lgx.num(d, 'heading'), coalesce(lgx.num(d, 'dist_m'), 0))\n    on conflict (vacation_id, uid) do update set state = 'active', lat = excluded.lat, lng = excluded.lng, acc = excluded.acc, speed = excluded.speed, heading = excluded.heading, dist_m = excluded.dist_m, updated_at = now();\nend $$;\ncreate or replace function public.vac_tracks(tok text, vid uuid) returns jsonb language plpgsql security definer set search_path = public as $$\ndeclare u text := lgx.who(tok);\nbegin\n  perform lgx.need(vid, u, 'member');\n  return coalesce((select jsonb_agg(to_jsonb(k) - 'vacation_id') from public.vacation_tracks k where vacation_id = vid), '[]');\nend $$;\ndo $$ declare r record; begin\n  for r in select p.oid::regprocedure as sig, p.proname from pg_proc p join pg_namespace n on n.oid = p.pronamespace\n           where n.nspname = 'public' and (p.proname like 'vac\\_%' or p.proname like 'vault\\_%' or p.proname in ('secret_set', 'api_caps', 'api_gate', 'flight_apply')) loop\n    execute format('revoke all on function %s from public, anon, authenticated', r.sig);\n    if r.proname in ('api_gate', 'flight_apply') then\n      if exists (select 1 from pg_roles where rolname = 'service_role') then execute format('grant execute on function %s to service_role', r.sig); end if;\n    else execute format('grant execute on function %s to anon, authenticated', r.sig); end if;\n  end loop;\nend $$;";
/* ═══ STORE: per-user finance data + settings (single source of truth for finance) ═══ */
const Store=(function(){
const DB_NAME='LogosticsFinanceDB',DB_VERSION=3,FIN_KEY='logostics_fin_v1';
let idb=null,useIDB=false,_last=0,_hk=null,_lastGoalCount=-1;

const IncomeEstimator=(function(){

function wAvg(v){if(!v.length)return 0;let num=0,den=0;for(let i=0;i<v.length;i++){const w=1/(i+1);num+=v[i]*w;den+=w}return num/den}
function trend(v){if(v.length<2)return 0;const h=Math.max(1,Math.floor(v.length/2));const a=v.slice(0,h),b=v.slice(h);return a.reduce((s,x)=>s+x,0)/a.length-b.reduce((s,x)=>s+x,0)/b.length}
const perMonth=f=>({weekly:4.33,biweekly:2.17,semimonthly:2,monthly:1})[f]||4.33;
function history(){return Store.transactions.filter(t=>t.type==='income'&&t.category==='paycheck'&&Number(t.amount)>0).map(t=>Number(t.amount))}

if(h.length>=1){const avg=wAvg(h),tr=trend(h);const weekly=freq==='weekly'?avg:freq==='biweekly'?avg/2:freq==='semimonthly'?avg/2.165:avg/perMonth(freq);const best=c.netWeekly>0?Math.max(weekly,c.netWeekly):weekly;
return{source:'history',historyCount:h.length,avgPaycheck:r2(avg),nextPaycheck:r2(Math.max(0,avg+tr*.5)),avgWeeklyIncome:r2(best),avgMonthlyIncome:r2(best*52/12),annualIncome:r2(best*52),trend:r2(tr),trendDirection:tr>5?'up':tr<-5?'down':'flat',confidence:h.length>=6?'high':h.length>=3?'medium':'low',payFrequency:freq}}
if(c.netWeekly>0)return{source:'schedule',historyCount:0,avgPaycheck:r2(c.netPeriod),nextPaycheck:r2(c.netPeriod),avgWeeklyIncome:r2(c.netWeekly),avgMonthlyIncome:r2(c.monthlyNet),annualIncome:r2(c.annualNet),trend:0,trendDirection:'flat',confidence:'low',payFrequency:freq};
return{source:'none',historyCount:0,avgPaycheck:0,nextPaycheck:0,avgWeeklyIncome:0,avgMonthlyIncome:0,annualIncome:0,trend:0,trendDirection:'flat',confidence:'none',payFrequency:freq}}
/* paycheck schedule: real upcoming paydays from the Income Estimator's next payday + frequency */
const CPW={weekly:1,biweekly:.5,semimonthly:24/52,monthly:12/52};
const localDate=s=>{const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(s);return s&&!isNaN(d.getTime())?d:null};
const checksPerWeek=f=>CPW[f||Store.incomeSettings.payFrequency]||1;

const CLOUD_SQL=`-- Logostics friends sync — run this ONCE in Supabase: SQL Editor → New query → paste → Run
create sequence if not exists public.kv_seq;
create table if not exists public.kv (
  path text primary key,
  value jsonb,
  deleted boolean not null default false,
  seq bigint not null default nextval('public.kv_seq'),
  updated_at timestamptz not null default clock_timestamp()
);
create index if not exists kv_updated_idx on public.kv (updated_at);
alter table public.kv enable row level security;
drop policy if exists kv_read on public.kv;
create policy kv_read on public.kv for select to anon, authenticated using (path like 's/%');
revoke all on public.kv from anon, authenticated;
grant select on public.kv to anon, authenticated;

create or replace function public.kv_apply(ops jsonb) returns jsonb
language plpgsql security definer set search_path = public as $$
declare o jsonb; k text; p text; v jsonb; n int; sv boolean; res jsonb := '[]'::jsonb; parts text[];
begin
  if jsonb_typeof(ops) is distinct from 'array' or jsonb_array_length(ops) > 800 then raise exception 'bad request'; end if;
  delete from public.kv where deleted and updated_at < now() - interval '3 days';
  for o in select e from jsonb_array_elements(ops) e loop
    k := o->>'k'; p := o->>'p'; v := o->'v'; sv := false;
    if p is null or length(p) > 400 or p !~ '^(s|auth)(/[^/]{1,128}){1,8}$' then raise exception 'bad path'; end if;
    if k = 'add' then
      if v is null or jsonb_typeof(v) <> 'object' then raise exception 'bad value'; end if;
      insert into public.kv (path, value, deleted, seq, updated_at) values (p, v, false, nextval('public.kv_seq'), clock_timestamp())
        on conflict (path) do update set value = excluded.value, deleted = false, seq = excluded.seq, updated_at = excluded.updated_at where public.kv.deleted;
      get diagnostics n = row_count;
      res := res || to_jsonb(n > 0);
      continue;
    end if;
    if p like 'auth/%' or p = 's/meta' or p like 's/meta/%' then raise exception 'protected path'; end if;
    if k = 'set' then
      if v is not null and jsonb_typeof(v) = 'object' and v ? '.sv' then v := to_jsonb((extract(epoch from clock_timestamp()) * 1000)::bigint); sv := true; end if;
      if v is null or jsonb_typeof(v) in ('object', 'null') or octet_length(v::text) > 600000 then raise exception 'bad value'; end if;
      parts := string_to_array(p, '/');
      update public.kv set deleted = true, value = null, seq = nextval('public.kv_seq'), updated_at = clock_timestamp()
        where not deleted and path in (select array_to_string(parts[1:g], '/') from generate_series(2, array_length(parts, 1) - 1) g);
      insert into public.kv (path, value, deleted, seq, updated_at) values (p, v, false, nextval('public.kv_seq'), clock_timestamp())
        on conflict (path) do update set value = excluded.value, deleted = false, seq = excluded.seq, updated_at = excluded.updated_at
        where public.kv.deleted or public.kv.value is distinct from excluded.value;
      res := res || case when sv then v else 'true'::jsonb end;
    elsif k = 'del' then
      update public.kv set deleted = true, value = null, seq = nextval('public.kv_seq'), updated_at = clock_timestamp()
        where not deleted and (path = p or starts_with(path, p || '/'));
      res := res || 'true'::jsonb;
    else
      raise exception 'bad op';
    end if;
  end loop;
  return res;
end $$;

function openAddExpense(){openSheet(`<div class="sheet-title">Add Expense</div><div class="field"><label class="field-label">Amount</label><input class="field-input" id="ex-amount" type="number" inputmode="decimal" placeholder="$0.00"></div><div class="field"><label class="field-label">Description</label><input class="field-input" id="ex-desc" placeholder="Coffee, groceries…"></div><div class="field"><label class="field-label">Category</label><div class="chips" id="ex-cats"><button class="chip selected" onclick="pickChip(this)" data-cat="food"><span class="emoji">🍔</span>Food</button><button class="chip" onclick="pickChip(this)" data-cat="shopping"><span class="emoji">🛍</span>Shopping</button><button class="chip" onclick="pickChip(this)" data-cat="transport"><span class="emoji">🚗</span>Transport</button><button class="chip" onclick="pickChip(this)" data-cat="bills"><span class="emoji">📄</span>Bills</button><button class="chip" onclick="pickChip(this)" data-cat="other"><span class="emoji">◈</span>Other</button></div></div><button class="btn btn-primary" onclick="submitExpense()">Add Expense</button><button class="btn btn-secondary" style="margin-top:8px" onclick="closeSheet()">Cancel</button>`)}
async function submitExpense(){const amt=parseFloat($v('ex-amount')),desc=$v('ex-desc'),cat=(document.querySelector('#ex-cats .chip.selected')||{dataset:{}}).dataset.cat||'other';if(!amt||amt<=0){toast('Enter a valid amount');return}await Store.addTransaction({type:'expense',amount:amt,description:desc||'Expense',category:cat});closeSheet();haptic('success');SoundManager.spending();toast('Expense added');render()}
function openTxDetail(id){const t=Store.getSnapshot().transactions.find(x=>x.id===id);if(!t)return;const inc=t.type==='income';openSheet(`<div style="text-align:center;margin-bottom:28px"><div style="font-size:44px;font-weight:700;letter-spacing:-.04em;color:${inc?'var(--green)':'var(--text)'}">${inc?'+':'−'}${fmt(t.amount)}</div><div style="font-size:14px;color:var(--gray-500);margin-top:6px;font-weight:500">${escapeHtml(t.description||(inc?'Income':'Expense'))}</div><div style="font-size:12px;color:var(--gray-600);margin-top:4px">${escapeHtml(t.category)} · ${fmtDate(t.date)}</div></div><div class="btn-row"><button class="btn btn-secondary" onclick="closeSheet();openEditTx(${t.id})">Edit</button><button class="btn btn-danger" onclick="confirmDeleteTx(${t.id})">Delete</button></div><button class="btn btn-secondary" style="margin-top:8px" onclick="closeSheet()">Close</button>`)}
function openEditTx(id){const t=Store.getSnapshot().transactions.find(x=>x.id===id);if(!t)return;openSheet(`<div class="sheet-title">Edit</div><div class="field"><label class="field-label">Amount</label><input class="field-input" id="e-amount" type="number" inputmode="decimal" value="${t.amount}"></div><div class="field"><label class="field-label">Description</label><input class="field-input" id="e-desc" value="${escapeHtml(t.description)}"></div><div class="field"><label class="field-label">Type</label><div class="segmented" id="e-type"><button class="seg ${t.type==='expense'?'active':''}" onclick="pickSeg(this)" data-t="expense">Expense</button><button class="seg ${t.type==='income'?'active':''}" onclick="pickSeg(this)" data-t="income">Income</button></div></div><button class="btn btn-primary" onclick="submitEditTx(${t.id})">Save</button><button class="btn btn-secondary" style="margin-top:8px" onclick="closeSheet()">Cancel</button>`)}
async function submitEditTx(id){const amt=parseFloat($v('e-amount')),desc=$v('e-desc'),type=(document.querySelector('#e-type .seg.active')||{dataset:{}}).dataset.t||'expense';if(!amt||amt<=0){toast('Enter a valid amount');return}await Store.updateTransaction(id,{amount:amt,description:desc,type});closeSheet();haptic('success');toast('Updated');render()}
