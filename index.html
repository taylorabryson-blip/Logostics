  <style>
    /* ═══════════════════════════════════════════════════════════
       LOGOSTICS FINANCE — iPhone-first, capability-honest web app
       Palette: black, white, gray, green ONLY
       ═══════════════════════════════════════════════════════════ */

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --black: #000000;
      --white: #ffffff;
      --gray-950: #0a0a0a;
      --gray-900: #121212;
      --gray-850: #1a1a1a;
      --gray-800: #222222;
      --gray-700: #2e2e2e;
      --gray-600: #3a3a3a;
      --gray-500: #555555;
      --gray-400: #777777;
      --gray-300: #999999;
      --gray-200: #bbbbbb;
      --gray-100: #dddddd;
      --green: #30d158;
      --green-dim: #1f8a3a;
      --green-glow: rgba(48, 209, 88, 0.15);
      --red: #ff453a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --nav-h: 76px;
    }

    html {
      background: var(--black);
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      height: 100%;
    }

    body {
      font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
      user-select: none;
      letter-spacing: -0.01em;
      position: relative;
      /* Leave room for fixed bottom nav + home indicator */
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 8px);
      -webkit-user-select: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
      touch-action: manipulation;
    }

    /* ── REDUCED MOTION ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── LIGHT MODE (opt-in, respects system preference) ── */
    @media (prefers-color-scheme: light) {
      /* Kept dark by design — financial app prefers dark, but honours reduced motion */
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 0; height: 0; }

    /* ── TYPOGRAPHY ── */
    .t-large { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
    .t-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .t-caption { font-size: 12px; font-weight: 500; color: var(--gray-400); letter-spacing: 0.01em; }
    .t-label { font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.08em; }

    /* ── LIQUID GLASS ── */
    .glass-deep {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .glass {
      background: rgba(18, 18, 18, 0.72);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* ── LAYOUT ── */
    .container { max-width: 430px; margin: 0 auto; padding: 0 20px; width: 100%; }
    .section { margin-bottom: 28px; }
    .section-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 2px; }

    /* ── TOP HEADER ── */
    .top-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 8px; }
    .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; color: var(--white); }
    .brand-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); margin-left: 6px; vertical-align: middle;
      box-shadow: 0 0 8px var(--green-glow);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.85); } }

    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; cursor: pointer;
      background: var(--gray-850); border: 1px solid var(--gray-700);
      color: var(--gray-300); transition: all 0.2s var(--ease);
      font-family: inherit;
    }
    .icon-btn:active { transform: scale(0.9); background: var(--gray-800); }

    /* ── HERO ── */
    .hero { text-align: center; padding: 32px 0 24px; }
    .hero-label { font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 14px; }
    .hero-amount {
      font-size: 64px; font-weight: 700; letter-spacing: -0.045em; line-height: 1;
      font-variant-numeric: tabular-nums; color: var(--white); transition: color 0.3s;
      word-break: break-all;
    }
    .hero-status { font-size: 12px; color: var(--gray-500); margin-top: 10px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: pulse-dot 2s ease-in-out infinite; }

    /* ── CASH CARD ── */
    .cash-card { border-radius: 28px; padding: 24px; margin-bottom: 20px; position: relative; overflow: hidden; }
    .cash-card::before {
      content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    }
    .cash-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .cash-main { font-size: 38px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
    .cash-main-label { font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }
    .cash-badge {
      padding: 6px 12px; border-radius: 20px;
      background: var(--green-glow); border: 1px solid rgba(48, 209, 88, 0.25);
      color: var(--green); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .cash-rows { border-top: 1px solid var(--gray-800); padding-top: 16px; }
    .cash-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 14px; }
    .cash-row .lbl { color: var(--gray-400); display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .cash-row .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
    .cash-row .amt.pos { color: var(--green); }
    .cash-row .amt.neg { color: var(--gray-200); }
    .cash-proj { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--gray-800); display: flex; justify-content: space-between; align-items: baseline; }
    .cash-proj .lbl { font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.08em; }
    .cash-proj .amt { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; color: var(--green); font-variant-numeric: tabular-nums; }

    /* ── QUICK ACTIONS ── */
    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 28px; }
    .quick-btn {
      border-radius: 18px; padding: 16px 8px 12px; text-align: center; cursor: pointer;
      transition: all 0.2s var(--ease); display: flex; flex-direction: column; align-items: center; gap: 8px;
      background: var(--gray-900); border: 1px solid var(--gray-800); font-family: inherit;
    }
    .quick-btn:active { transform: scale(0.92); background: var(--gray-850); }
    .quick-btn .ico { font-size: 22px; line-height: 1; filter: grayscale(1); }
    .quick-btn.primary .ico { filter: none; }
    .quick-btn .lbl { font-size: 10px; font-weight: 600; color: var(--gray-400); letter-spacing: 0.02em; }

    /* ── INSIGHTS ── */
    .insight {
      border-radius: 18px; padding: 16px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start;
      background: var(--gray-900); border: 1px solid var(--gray-800);
    }
    .insight .ico { font-size: 18px; flex-shrink: 0; margin-top: 1px; filter: grayscale(1); }
    .insight .txt { font-size: 13.5px; line-height: 1.45; color: var(--gray-300); font-weight: 400; }
    .insight .txt strong { color: var(--white); font-weight: 600; }

    /* ── ACTIVITY ── */
    .activity-item {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px;
      margin-bottom: 6px; background: var(--gray-900); border: 1px solid var(--gray-800);
      transition: all 0.2s var(--ease); cursor: pointer;
    }
    .activity-item:active { transform: scale(0.98); background: var(--gray-850); }
    .activity-ico {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
      background: var(--gray-850); border: 1px solid var(--gray-700); filter: grayscale(1);
    }
    .activity-ico.income { filter: none; border-color: rgba(48, 209, 88, 0.3); background: var(--green-glow); }
    .activity-body { flex: 1; min-width: 0; }
    .activity-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
    .activity-meta { font-size: 11.5px; color: var(--gray-500); margin-top: 2px; display: flex; gap: 8px; font-weight: 500; }
    .activity-amt { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; letter-spacing: -0.01em; }
    .activity-amt.pos { color: var(--green); }
    .activity-amt.neg { color: var(--gray-200); }

    /* ── GOAL CARDS ── */
    .goal-card {
      border-radius: 24px; padding: 22px; margin-bottom: 12px;
      background: var(--gray-900); border: 1px solid var(--gray-800);
      transition: all 0.2s var(--ease); cursor: pointer;
    }
    .goal-card:active { transform: scale(0.985); }
    .goal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .goal-name { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .goal-pct { font-size: 12px; color: var(--gray-500); font-weight: 600; margin-top: 3px; }
    .goal-emoji { font-size: 26px; filter: grayscale(1); opacity: 0.7; }
    .goal-card.active .goal-emoji { filter: none; opacity: 1; }
    .goal-bar { width: 100%; height: 6px; background: var(--gray-800); border-radius: 3px; overflow: hidden; margin: 14px 0 10px; }
    .goal-fill {
      height: 100%; border-radius: 3px; background: var(--green);
      transition: width 0.7s var(--ease-out); position: relative; overflow: hidden;
    }
    .goal-fill::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      animation: shimmer 2.5s infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .goal-stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--gray-400); font-weight: 500; font-variant-numeric: tabular-nums; }
    .goal-stats .hl { color: var(--white); font-weight: 600; }
    .goal-eta { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-800); font-size: 12px; color: var(--gray-500); display: flex; align-items: center; gap: 6px; font-weight: 500; }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: space-around; align-items: center;
      padding: 8px 0 calc(8px + var(--safe-bottom));
      z-index: 100; border-top: 1px solid var(--gray-800);
      /* Prevent nav from being pushed off by keyboard */
      transform: translateZ(0);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 14px; border-radius: 14px; cursor: pointer;
      transition: all 0.25s var(--ease); background: none; border: none;
      color: var(--gray-500); font-family: inherit; min-width: 60px;
      touch-action: manipulation;
    }
    .nav-item.active { color: var(--white); }
    .nav-item.active .nav-ico { filter: none; transform: scale(1.05); }
    .nav-item:active { transform: scale(0.88); }
    .nav-ico { font-size: 21px; line-height: 1; filter: grayscale(1); transition: all 0.25s var(--ease); }
    .nav-lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.01em; }

    /* ── SHEETS ── */
    .sheet-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      z-index: 1000; display: none; align-items: flex-end; justify-content: center;
      animation: fade-in 0.25s ease;
    }
    .sheet-overlay.on { display: flex; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .sheet {
      width: 100%; max-width: 430px; max-height: 92vh; overflow-y: auto;
      border-radius: 32px 32px 0 0;
      padding: 12px 20px calc(24px + var(--safe-bottom));
      animation: slide-up 0.4s var(--ease-out);
      background: var(--gray-950);
      border-top: 1px solid var(--gray-800);
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-grip { width: 36px; height: 4px; background: var(--gray-600); border-radius: 2px; margin: 0 auto 20px; }
    .sheet-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 24px; text-align: center; }

    /* ── FORMS ── */
    .field { margin-bottom: 18px; }
    .field-label {
      font-size: 11px; font-weight: 600; color: var(--gray-500);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; display: block;
    }
    .field-input {
      width: 100%; background: var(--gray-900); border: 1px solid var(--gray-800);
      border-radius: 14px; padding: 16px; font-size: 17px; color: var(--white);
      font-family: inherit; transition: all 0.2s var(--ease);
      -webkit-appearance: none; appearance: none; letter-spacing: -0.01em;
    }
    .field-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-glow); }
    .field-input::placeholder { color: var(--gray-600); }

    /* ── CHIPS ── */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 10px 16px; border-radius: 20px;
      background: var(--gray-900); border: 1px solid var(--gray-800);
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.2s var(--ease); display: flex; align-items: center; gap: 6px;
      color: var(--gray-300); font-family: inherit;
    }
    .chip:active { transform: scale(0.92); }
    .chip.selected { background: var(--green); border-color: var(--green); color: var(--black); }
    .chip .emoji { filter: grayscale(1); }
    .chip.selected .emoji { filter: none; }

    /* ── BUTTONS ── */
    .btn {
      padding: 16px 24px; border-radius: 14px; font-size: 17px; font-weight: 600;
      border: none; cursor: pointer; transition: all 0.2s var(--ease);
      font-family: inherit; width: 100%; display: flex; align-items: center; justify-content: center;
      gap: 8px; letter-spacing: -0.01em;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--white); color: var(--black); }
    .btn-primary:active { background: var(--gray-100); }
    .btn-green { background: var(--green); color: var(--black); }
    .btn-secondary { background: var(--gray-900); border: 1px solid var(--gray-800); color: var(--white); }
    .btn-danger { background: transparent; border: 1px solid var(--gray-700); color: var(--gray-300); }
    .btn-danger:active { background: var(--gray-900); border-color: var(--gray-600); }
    .btn-row { display: flex; gap: 10px; margin-top: 8px; }
    .btn-row .btn { flex: 1; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 56px 24px; }
    .empty-ico { font-size: 44px; margin-bottom: 18px; opacity: 0.3; filter: grayscale(1); }
    .empty-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.02em; }
    .empty-sub { font-size: 14px; color: var(--gray-500); line-height: 1.5; max-width: 260px; margin: 0 auto; }

    /* ── TOAST ── */
    .toast {
      position: fixed; top: calc(20px + var(--safe-top)); left: 50%;
      transform: translateX(-50%) translateY(-140%);
      padding: 12px 20px; border-radius: 14px;
      font-size: 14px; font-weight: 600; z-index: 2000;
      transition: transform 0.45s var(--ease-out);
      display: flex; align-items: center; gap: 10px;
      max-width: 90vw; background: var(--gray-900);
      border: 1px solid var(--gray-700); color: var(--white);
      letter-spacing: -0.01em; box-shadow: 0 12px 40px rgba(0,0,0,0.7);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

    /* ── AUTH GATE ── */
    .auth-gate {
      position: fixed; inset: 0; background: var(--black); z-index: 5000;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; padding: 24px; animation: fade-in 0.3s ease;
    }
    .auth-gate.on { display: flex; }
    .auth-icon {
      width: 88px; height: 88px; border-radius: 28px;
      border: 2px solid var(--gray-700);
      display: flex; align-items: center; justify-content: center;
      font-size: 42px; filter: grayscale(1);
    }
    .auth-icon.available { border-color: var(--green); filter: none; }
    .auth-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; text-align: center; }
    .auth-sub { font-size: 14px; color: var(--gray-500); text-align: center; max-width: 300px; line-height: 1.5; }
    .auth-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }

    /* ── PRIVACY BTN ── */
    .privacy-btn {
      position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); right: 20px;
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer; z-index: 90;
      transition: all 0.25s var(--ease);
      background: var(--gray-900); border: 1px solid var(--gray-700);
      color: var(--gray-300); font-family: inherit;
    }
    .privacy-btn:active { transform: scale(0.88); }
    .privacy-btn.active { background: var(--green); color: var(--black); border-color: var(--green); }

    /* ── PRIVACY BLUR ── */
    .privacy-blur { filter: blur(14px); transition: filter 0.35s var(--ease); pointer-events: none; user-select: none; }

    /* ── ANIMATIONS ── */
    .fade-in { animation: fade-up 0.35s var(--ease-out); }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stagger > * { animation: fade-up 0.4s var(--ease-out) backwards; }
    .stagger > *:nth-child(1) { animation-delay: 0.02s; }
    .stagger > *:nth-child(2) { animation-delay: 0.06s; }
    .stagger > *:nth-child(3) { animation-delay: 0.10s; }
    .stagger > *:nth-child(4) { animation-delay: 0.14s; }
    .stagger > *:nth-child(5) { animation-delay: 0.18s; }
    .stagger > *:nth-child(6) { animation-delay: 0.22s; }

    /* ── SCROLL ROW ── */
    .scroll-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    .scroll-row::-webkit-scrollbar { display: none; }
    .scroll-row > * { flex-shrink: 0; }

    /* ── SEGMENTED ── */
    .segmented { display: flex; background: var(--gray-900); border: 1px solid var(--gray-800); border-radius: 12px; padding: 3px; }
    .seg {
      flex: 1; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 600;
      text-align: center; cursor: pointer; transition: all 0.2s var(--ease);
      background: none; border: none; color: var(--gray-500); font-family: inherit; letter-spacing: -0.01em;
    }
    .seg.active { background: var(--white); color: var(--black); }
    .seg:active { transform: scale(0.96); }

    /* ── STATS ── */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat { border-radius: 18px; padding: 18px 16px; background: var(--gray-900); border: 1px solid var(--gray-800); text-align: center; }
    .stat-val { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .stat-lbl { font-size: 10px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }

    /* ── CHART ── */
    .chart-card { border-radius: 22px; padding: 20px; margin-bottom: 12px; background: var(--gray-900); border: 1px solid var(--gray-800); }
    .chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 18px; letter-spacing: -0.01em; }

    /* ── SETTINGS ── */
    .set-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 16px; border-radius: 14px; margin-bottom: 6px;
      background: var(--gray-900); border: 1px solid var(--gray-800);
      cursor: pointer; transition: all 0.2s var(--ease);
    }
    .set-row:active { background: var(--gray-850); transform: scale(0.985); }
    .set-row.static { cursor: default; }
    .set-row.static:active { transform: none; background: var(--gray-900); }
    .set-left { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; }
    .set-left .ico { font-size: 16px; width: 20px; text-align: center; filter: grayscale(1); opacity: 0.7; }
    .set-right { color: var(--gray-500); font-size: 13px; display: flex; align-items: center; gap: 6px; font-weight: 500; }

    /* ── TOGGLE ── */
    .toggle {
      position: relative; width: 50px; height: 30px; background: var(--gray-700);
      border-radius: 15px; cursor: pointer; transition: background 0.3s var(--ease); flex-shrink: 0;
    }
    .toggle.on { background: var(--green); }
    .toggle::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 26px; height: 26px; background: var(--white); border-radius: 50%;
      transition: transform 0.3s var(--ease); box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .toggle.on::after { transform: translateX(20px); }

    /* ── CAP BADGE ── */
    .cap-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 700; padding: 3px 8px;
      border-radius: 8px; letter-spacing: 0.04em; text-transform: uppercase;
    }
    .cap-badge.ok { background: var(--green-glow); color: var(--green); border: 1px solid rgba(48,209,88,0.25); }
    .cap-badge.no { background: var(--gray-850); color: var(--gray-500); border: 1px solid var(--gray-700); }
    .cap-badge.warn { background: rgba(255, 159, 10, 0.12); color: #ff9f0a; border: 1px solid rgba(255,159,10,0.25); }

    /* ── LANDSCAPE ── */
    @media (orientation: landscape) and (max-height: 500px) {
      :root { --nav-h: 60px; }
      .hero { padding: 16px 0 12px; }
      .hero-amount { font-size: 40px; }
      .cash-main { font-size: 28px; }
      .bottom-nav { padding: 4px 0 calc(4px + var(--safe-bottom)); }
      .nav-item { padding: 4px 10px; }
    }

    /* ── SMALL DEVICES ── */
    @media (max-width: 375px) {
      .hero-amount { font-size: 48px; }
      .cash-main { font-size: 32px; }
      .quick-grid { gap: 6px; }
      .quick-btn { padding: 12px 4px 10px; }
      .quick-btn .ico { font-size: 18px; }
      .quick-btn .lbl { font-size: 9px; }
    }

    /* ── PWA STANDALONE TUNING ── */
    @media (display-mode: standalone) {
      /* Already handled naturally; explicit hook in case we want tweaks */
      body { overscroll-behavior-y: none; }
    }
  </style>

<body>

  <!-- AUTH GATE -->
  <div class="auth-gate" id="auth-gate">
    <div class="auth-icon" id="auth-icon">🔒</div>

  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"><span class="dot"></span><span id="toast-text"></span></div>

  <!-- MAIN -->
  <div id="app"></div>

  <!-- PRIVACY TOGGLE -->
  <button class="privacy-btn" id="privacy-btn" onclick="togglePrivacy()" title="Toggle privacy mode">👁</button>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav glass-deep" id="bottom-nav">
    <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
      <span class="nav-ico">🏠</span><span class="nav-lbl">Home</span>
    </button>
    <button class="nav-item" data-tab="activity" onclick="switchTab('activity')">
      <span class="nav-ico">📋</span><span class="nav-lbl">Activity</span>
    </button>
    <button class="nav-item" data-tab="goals" onclick="switchTab('goals')">
      <span class="nav-ico">🎯</span><span class="nav-lbl">Goals</span>
    </button>
    <button class="nav-item" data-tab="analytics" onclick="switchTab('analytics')">
      <span class="nav-ico">📊</span><span class="nav-lbl">Analytics</span>
    </button>
  </nav>

  <!-- SHEET -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet(event)">
    <div class="sheet" id="sheet" onclick="event.stopPropagation()">
      <div class="sheet-grip"></div>
      <div id="sheet-content"></div>
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════
       LOGOSTICS FINANCE — FULL IMPLEMENTATION
       - Honest platform capability detection
       - Real PWA (service worker, cache, offline)
       - IndexedDB persistence with migrations
       - Real WebAuthn / Notification / Share / etc.
       - No fake native features anywhere
       ═══════════════════════════════════════════════════════════ */

    'use strict';

    // ═══════════════════════════════════════════════════════════
    //  1. PLATFORM CAPABILITY ENGINE
    //  Feature-detect every capability. Return honest status.
    // ═══════════════════════════════════════════════════════════

    const PlatformCapabilities = (function() {
      function detectEnvironment() {
        const ua = navigator.userAgent || '';
        const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                             window.navigator.standalone === true;
        const isNativeWrapper = !!(window.webkit && window.webkit.messageHandlers &&
                                   window.webkit.messageHandlers.logostics);
        const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);
        const isChromeIOS = /CriOS/.test(ua);

        let type = 'web';
        if (isNativeWrapper) type = 'native-ios';
        else if (isIOS && isStandalone) type = 'pwa-ios';
        else if (isIOS) type = 'ios-safari';
        else if (isStandalone) type = 'pwa';

        return { type, isIOS, isStandalone, isSafari, isChromeIOS, isNativeWrapper };
      }

      const env = detectEnvironment();

      // ── Generic feature test ──
      function test(path) {
        try {
          const parts = path.split('.');
          let obj = window;
          for (const p of parts) {
            if (obj == null) return false;
            obj = obj[p];
          }
          return obj !== undefined;
        } catch (e) { return false; }
      }

      // ── WebAuthn / platform authenticator ──
      async function checkWebAuthn() {
        if (!window.PublicKeyCredential) {
          return { available: false, reason: 'WebAuthn not supported in this browser' };
        }
        if (!window.isSecureContext) {
          return { available: false, reason: 'WebAuthn requires HTTPS (secure context)' };
        }
        try {
          const avail = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          return {
            available: avail,
            reason: avail
              ? 'Platform authenticator available (Face ID / Touch ID / device passcode)'
              : 'No platform authenticator enrolled on this device'
          };
        } catch (e) {
          return { available: false, reason: 'WebAuthn check failed: ' + e.message };
        }
      }

      // ── Notifications ──
      function checkNotifications() {
        if (!('Notification' in window)) {
          return { supported: false, permission: 'unsupported',
                   reason: 'Notification API not available in this browser' };
        }
        const perm = Notification.permission;
        // iOS Safari: notifications ONLY work in installed PWA (iOS 16.4+)
        const iosSafariNeedsPWA = env.isIOS && !env.isStandalone;
        if (iosSafariNeedsPWA && perm === 'default') {
          return {
            supported: false,
            permission: perm,
            reason: 'On iOS, web notifications require installing Logostics to the Home Screen (iOS 16.4+)',
            requiresInstall: true
          };
        }
        return {
          supported: true,
          permission: perm,
          reason: perm === 'granted' ? 'Notifications allowed'
                : perm === 'denied' ? 'Notifications blocked in browser settings'
                : 'Not yet decided'
        };
      }

      // ── Service Worker ──
      function checkServiceWorker() {
        return { supported: 'serviceWorker' in navigator && window.isSecureContext };
      }

      // ── Haptics (Vibration API — not available on iOS Safari) ──
      function checkHaptics() {
        const supported = typeof navigator.vibrate === 'function';
        return {
          supported,
          reason: supported
            ? 'Vibration API available'
            : (env.isIOS ? 'iOS Safari does not expose vibration to web apps' : 'Vibration API not available')
        };
      }

      // ── Share ──
      function checkShare() {
        return {
          supported: typeof navigator.share === 'function',
          canShareFiles: typeof navigator.canShare === 'function'
        };
      }

      // ── Clipboard ──
      function checkClipboard() {
        return {
          write: !!(navigator.clipboard && navigator.clipboard.writeText),
          read: !!(navigator.clipboard && navigator.clipboard.readText)
        };
      }

      // ── Camera / Microphone / Geolocation ──
      function checkMedia() {
        return {
          getUserMedia: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
          camera: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
          geolocation: 'geolocation' in navigator
        };
      }

      // ── Motion / Orientation (requires permission on iOS) ──
      function checkMotion() {
        return {
          deviceMotion: 'DeviceMotionEvent' in window,
          deviceOrientation: 'DeviceOrientationEvent' in window,
          requiresPermission: typeof DeviceMotionEvent !== 'undefined' &&
                              typeof DeviceMotionEvent.requestPermission === 'function'
        };
      }

      // ── File picker ──
      function checkFilePicker() {
        return { supported: 'FileReader' in window && 'File' in window };
      }

      // ── Storage ──
      async function checkStorage() {
        const result = { indexedDB: false, localStorage: false, cacheAPI: false, persistent: false, estimate: null };
        try {
          const k = '__logostics_test__';
          localStorage.setItem(k, '1');
          localStorage.removeItem(k);
          result.localStorage = true;
        } catch (e) {}
        try {
          result.indexedDB = !!window.indexedDB;
          if (result.indexedDB) {
            await new Promise((resolve, reject) => {
              const req = indexedDB.open('__logostics_test__', 1);
              req.onsuccess = () => { req.result.close(); indexedDB.deleteDatabase('__logostics_test__'); resolve(); };
              req.onerror = () => reject(req.error);
              setTimeout(() => reject(new Error('timeout')), 1500);
            });
          }
        } catch (e) { result.indexedDB = false; }
        try {
          result.cacheAPI = 'caches' in window;
        } catch (e) {}
        try {
          if (navigator.storage && navigator.storage.persisted) {
            result.persistent = await navigator.storage.persisted();
          }
          if (navigator.storage && navigator.storage.estimate) {
            const est = await navigator.storage.estimate();
            result.estimate = { usage: est.usage, quota: est.quota };
          }
        } catch (e) {}
        return result;
      }

      // ── Network info ──
      function checkNetwork() {
        return {
          online: navigator.onLine,
          connection: navigator.connection ? {
            effectiveType: navigator.connection.effectiveType,
            downlink: navigator.connection.downlink,
            rtt: navigator.connection.rtt
          } : null
        };
      }

      // ── Screen info ──
      function checkScreen() {
        return {
          width: window.screen.width,
          height: window.screen.height,
          availWidth: window.screen.availWidth,
          availHeight: window.screen.availHeight,
          pixelRatio: window.devicePixelRatio,
          colorDepth: window.screen.colorDepth,
          orientation: window.screen.orientation ? window.screen.orientation.type : 'unknown'
        };
      }

      // ── Standalone / PWA ──
      function checkPWA() {
        return {
          standalone: env.isStandalone,
          canInstall: 'BeforeInstallPromptEvent' in window || env.isIOS,
          displayMode: env.isStandalone ? 'standalone' : 'browser'
        };
      }

      // ── Badge API ──
      function checkBadge() {
        return { supported: 'setAppBadge' in navigator };
      }

      // ── Wake Lock ──
      function checkWakeLock() {
        return { supported: 'wakeLock' in navigator };
      }

      // ── Media Session ──
      function checkMediaSession() {
        return { supported: 'mediaSession' in navigator };
      }

      // ── Web Audio ──
      function checkWebAudio() {
        return { supported: !!(window.AudioContext || window.webkitAudioContext) };
      }

      // ── Fullscreen ──
      function checkFullscreen() {
        return { supported: !!(document.documentElement.requestFullscreen ||
                               document.documentElement.webkitRequestFullscreen) };
      }

      // ── Speech Recognition (voice input) ──
      function checkSpeech() {
        return {
          recognition: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
          synthesis: 'speechSynthesis' in window
        };
      }

      // ── Payment Request ──
      function checkPayment() {
        return { supported: 'PaymentRequest' in window };
      }

      // ── Contact Picker ──
      function checkContactPicker() {
        return { supported: 'contacts' in navigator };
      }

      // ── Battery ──
      async function checkBattery() {
        if (!navigator.getBattery) return { available: false, reason: 'Battery API not available' };
        try {
          const b = await navigator.getBattery();
          return { available: true, level: Math.round(b.level * 100), charging: b.charging };
        } catch (e) {
          return { available: false, reason: 'Battery API access denied' };
        }
      }

      // ── Bluetooth ──
      function checkBluetooth() {
        return { supported: 'bluetooth' in navigator };
      }

      // ── NFC ──
      function checkNFC() {
        return { supported: 'NDEFReader' in window };
      }

      return {
        env,
        test,
        checkWebAuthn,
        checkNotifications,
        checkServiceWorker,
        checkHaptics,
        checkShare,
        checkClipboard,
        checkMedia,
        checkMotion,
        checkFilePicker,
        checkStorage,
        checkNetwork,
        checkScreen,
        checkPWA,
        checkBadge,
        checkWakeLock,
        checkMediaSession,
        checkWebAudio,
        checkFullscreen,
        checkSpeech,
        checkPayment,
        checkContactPicker,
        checkBattery,
        checkBluetooth,
        checkNFC
      };
    })();

    // ═══════════════════════════════════════════════════════════
    //  2. HAPTICS ABSTRACTION (honest — no-op if unsupported)
    // ═══════════════════════════════════════════════════════════
    const Haptics = (function() {
      const supported = typeof navigator.vibrate === 'function';
      const patterns = {
        light: 8,
        medium: 14,
        heavy: 22,
        success: [10, 40, 10],
        warning: [20, 30, 20],
        error: [20, 30, 20, 30, 20]
      };
      function trigger(style) {
        if (!supported) return false;
        try { navigator.vibrate(patterns[style] || 10); return true; }
        catch (e) { return false; }
      }
      return {
        supported,
        light: () => trigger('light'),
        medium: () => trigger('medium'),
        heavy: () => trigger('heavy'),
        success: () => trigger('success'),
        warning: () => trigger('warning'),
        error: () => trigger('error')
      };
    })();

    // ═══════════════════════════════════════════════════════════
    //  3. NOTIFICATION MANAGER (real Notification API only)
    // ═══════════════════════════════════════════════════════════
    const NotificationManager = (function() {
      async function requestPermission() {
        if (!('Notification' in window)) {
          return { granted: false, reason: 'Notification API not supported in this browser' };
        }
        // iOS Safari: requires PWA install
        if (PlatformCapabilities.env.isIOS && !PlatformCapabilities.env.isStandalone) {
          return {
            granted: false,
            reason: 'On iOS, web notifications require installing Logostics to the Home Screen (iOS 16.4+)',
            requiresInstall: true
          };
        }
        try {
          const result = await Notification.requestPermission();
          return { granted: result === 'granted', permission: result };
        } catch (e) {
          return { granted: false, reason: 'Permission request failed: ' + e.message };
        }
      }

      // Returns { sent: bool, reason: string, via: 'sw' | 'constructor' | 'none' }
      async function send(title, body, options) {
        options = options || {};
        if (!('Notification' in window)) {
          return { sent: false, reason: 'Notification API not supported', via: 'none' };
        }
        if (Notification.permission !== 'granted') {
          return { sent: false, reason: 'Permission not granted (currently: ' + Notification.permission + ')', via: 'none' };
        }
        // Prefer service worker notifications (required on Android Chrome, works on iOS PWA)
        if ('serviceWorker' in navigator) {
          try {
            const reg = await navigator.serviceWorker.ready;
            if (reg && reg.showNotification) {
              await reg.showNotification(title, {
                body,
                tag: options.tag || 'logostics',
                icon: options.icon,
                badge: options.badge,
                silent: options.silent || false,
                data: options.data || {}
              });
              return { sent: true, reason: 'Delivered via service worker', via: 'sw' };
            }
          } catch (e) {
            // fall through to constructor
          }
        }
        try {
          const n = new Notification(title, {
            body,
            tag: options.tag || 'logostics',
            silent: options.silent || false
          });
          setTimeout(() => { try { n.close(); } catch (e) {} }, 6000);
          return { sent: true, reason: 'Delivered via Notification constructor', via: 'constructor' };
        } catch (e) {
          return { sent: false, reason: 'Notification failed: ' + e.message, via: 'none' };
        }
      }

      return { requestPermission, send, getStatus: PlatformCapabilities.checkNotifications };
    })();

    // ═══════════════════════════════════════════════════════════
    //  4. AUTH MANAGER (real WebAuthn only)
    // ═══════════════════════════════════════════════════════════
    const AuthManager = (function() {
      let credentialIdB64 = null; // stored as base64url string; NEVER biometric data

      function bufToB64(buf) {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      function b64ToBuf(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        return buf.buffer;
      }

      async function authenticate() {
        const cap = await PlatformCapabilities.checkWebAuthn();
        if (!cap.available) {
          return { success: false, supported: false, reason: cap.reason };
        }
        if (!credentialIdB64) {
          return { success: false, supported: true, reason: 'No credential registered on this device. Enable App Lock to register.' };
        }
        try {
          const challenge = new Uint8Array(32);
          crypto.getRandomValues(challenge);
          const assertion = await navigator.credentials.get({
            publicKey: {
              challenge,
              timeout: 60000,
              userVerification: 'required',
              rpId: window.location.hostname || 'localhost',
              allowCredentials: [{
                id: b64ToBuf(credentialIdB64),
                type: 'public-key',
                transports: ['internal']
              }]
            }
          });
          if (assertion) {
            return { success: true, supported: true, reason: 'Verified via platform authenticator' };
          }
          return { success: false, supported: true, reason: 'No credential returned' };
        } catch (e) {
          const reasons = {
            NotAllowedError: 'Authentication was cancelled or timed out',
            SecurityError: 'WebAuthn security error — ensure the page is served over HTTPS',
            InvalidStateError: 'Stored credential is no longer valid — disable and re-enable App Lock',
            AbortError: 'Authentication aborted'
          };
          return { success: false, supported: true, reason: reasons[e.name] || ('WebAuthn error: ' + e.name) };
        }
      }

      async function register() {
        const cap = await PlatformCapabilities.checkWebAuthn();
        if (!cap.available) {
          return { success: false, supported: false, reason: cap.reason };
        }
        try {
          const challenge = new Uint8Array(32);
          crypto.getRandomValues(challenge);
          const userId = new Uint8Array(16);
          crypto.getRandomValues(userId);

          const credential = await navigator.credentials.create({
            publicKey: {
              challenge,
              rp: { name: 'Logostics Finance', id: window.location.hostname || 'localhost' },
              user: { id: userId, name: 'logostics-user', displayName: 'Logostics User' },
              pubKeyCredParams: [
                { type: 'public-key', alg: -7 },
                { type: 'public-key', alg: -257 }
              ],
              authenticatorSelection: {
                authenticatorAttachment: 'platform',
                userVerification: 'required',
                residentKey: 'preferred'
              },
              timeout: 60000,
              attestation: 'none'
            }
          });

          if (credential && credential.rawId) {
            credentialIdB64 = bufToB64(credential.rawId);
            return { success: true, supported: true, reason: 'Platform authenticator registered' };
          }
          return { success: false, supported: true, reason: 'Registration returned no credential' };
        } catch (e) {
          const reasons = {
            NotAllowedError: 'Registration cancelled or timed out',
            InvalidStateError: 'A credential already exists for this account',
            SecurityError: 'Security error — ensure HTTPS and correct rpId'
          };
          return { success: false, supported: true, reason: reasons[e.name] || ('Registration error: ' + e.name) };
        }
      }

      return {
        authenticate,
        register,
        hasCredential: () => !!credentialIdB64,
        setCredential: (b64) => { credentialIdB64 = b64; },
        getCredential: () => credentialIdB64
      };
    })();

    // ═══════════════════════════════════════════════════════════
    //  5. STORE — IndexedDB primary, localStorage for prefs only
    //  Versioned migrations, real persistence.
    // ═══════════════════════════════════════════════════════════
    const Store = (function() {
      const DB_NAME = 'LogosticsFinanceDB';
      const DB_VERSION = 1;
      const PREFS_KEY = 'logostics_finance_prefs_v1';

      let db = null;
      let useIndexedDB = false;

      // Fallback in-memory store when IndexedDB is blocked (private mode)
      const memory = { transactions: [], goals: [], paychecks: [] };

      let state = {
        balance: 0,
        transactions: [],
        paychecks: [],
        goals: [],
        recurringExpenses: [],
        incomeSettings: { hourlyRate: 0, hoursPerWeek: 0, payFrequency: 'weekly', withholdingPct: 20, nextPayday: null },
        preferences: {
          currency: 'USD',
          appLockEnabled: false,
          notificationsEnabled: false,
          hapticsEnabled: true,
          privacyMode: false,
          webAuthnCredential: null
        },
        lastUpdated: Date.now(),
        _nextId: 1,
        _listeners: []
      };

      // ── Migrations go here as versions increase ──
      function openDB() {
        return new Promise((resolve) => {
          if (!window.indexedDB || !window.isSecureContext) { resolve(null); return; }
          let req;
          try { req = indexedDB.open(DB_NAME, DB_VERSION); }
          catch (e) { resolve(null); return; }

          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            const oldVersion = e.oldVersion;
            if (!d.objectStoreNames.contains('transactions')) {
              const s = d.createObjectStore('transactions', { keyPath: 'id', autoIncrement: true });
              s.createIndex('date', 'date');
              s.createIndex('type', 'type');
            }
            if (!d.objectStoreNames.contains('goals')) {
              d.createObjectStore('goals', { keyPath: 'id', autoIncrement: true });
            }
            if (!d.objectStoreNames.contains('paychecks')) {
              const s = d.createObjectStore('paychecks', { keyPath: 'id', autoIncrement: true });
              s.createIndex('date', 'date');
            }
            if (!d.objectStoreNames.contains('meta')) {
              d.createObjectStore('meta', { keyPath: 'key' });
            }
            // Future migrations go here, e.g.:
            // if (oldVersion < 2) { /* migrate */ }
          };
          req.onsuccess = (e) => { db = e.target.result; useIndexedDB = true; resolve(db); };
          req.onerror = () => { db = null; resolve(null); };
          // Safari sometimes hangs — safe timeout
          setTimeout(() => { if (!db) resolve(null); }, 2500);
        });
      }

      function txStore(store, mode) {
        if (!db) return null;
        try { return db.transaction(store, mode).objectStore(store); }
        catch (e) { return null; }
      }

      async function dbAdd(store, data) {
        const s = txStore(store, 'readwrite');
        if (!s) return null;
        return new Promise((resolve) => {
          try {
            const r = s.add(data);
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => resolve(null);
          } catch (e) { resolve(null); }
        });
      }
      async function dbPut(store, data) {
        const s = txStore(store, 'readwrite');
        if (!s) return null;
        return new Promise((resolve) => {
          try {
            const r = s.put(data);
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => resolve(null);
          } catch (e) { resolve(null); }
        });
      }
      async function dbDelete(store, id) {
        const s = txStore(store, 'readwrite');
        if (!s) return;
        return new Promise((resolve) => {
          try {
            const r = s.delete(id);
            r.onsuccess = () => resolve();
            r.onerror = () => resolve();
          } catch (e) { resolve(); }
        });
      }
      async function dbGetAll(store) {
        const s = txStore(store, 'readonly');
        if (!s) return [];
        return new Promise((resolve) => {
          try {
            const r = s.getAll();
            r.onsuccess = () => resolve(r.result || []);
            r.onerror = () => resolve([]);
          } catch (e) { resolve([]); }
        });
      }

      // ── Prefs in localStorage (small values only) ──
      function loadPrefs() {
        try {
          const raw = localStorage.getItem(PREFS_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            state.preferences = { ...state.preferences, ...(p.preferences || {}) };
            state.incomeSettings = { ...state.incomeSettings, ...(p.incomeSettings || {}) };
          }
        } catch (e) {}
      }
      function savePrefs() {
        try {
          localStorage.setItem(PREFS_KEY, JSON.stringify({
            preferences: state.preferences,
            incomeSettings: state.incomeSettings
          }));
        } catch (e) {}
      }

      async function init() {
        loadPrefs();
        // Restore stored credential ID if present
        if (state.preferences.webAuthnCredential) {
          AuthManager.setCredential(state.preferences.webAuthnCredential);
        }
        await openDB();
        if (useIndexedDB) {
          const txs = await dbGetAll('transactions');
          const goals = await dbGetAll('goals');
          const pcs = await dbGetAll('paychecks');
          state.transactions = txs.sort((a, b) => new Date(b.date) - new Date(a.date));
          state.goals = goals;
          state.paychecks = pcs.sort((a, b) => new Date(b.date) - new Date(a.date));
        } else {
          // In-memory fallback — same shape, honest limitation
          state.transactions = [...memory.transactions];
          state.goals = [...memory.goals];
          state.paychecks = [...memory.paychecks];
        }
        // Recompute balance from real data
        state.balance = state.transactions.reduce((sum, t) => {
          return t.type === 'income' ? sum + t.amount : sum - t.amount;
        }, 0);
        const allIds = [...state.transactions, ...state.goals, ...state.paychecks].map(x => x.id || 0);
        state._nextId = (Math.max(0, ...allIds) || 0) + 1;
        state.lastUpdated = Date.now();
      }

      function notify() {
        state.lastUpdated = Date.now();
        savePrefs();
        state._listeners.forEach(fn => { try { fn(snapshot()); } catch (e) {} });
      }
      function subscribe(fn) {
        state._listeners.push(fn);
        return () => { state._listeners = state._listeners.filter(f => f !== fn); };
      }
      function snapshot() {
        return {
          balance: state.balance,
          transactions: [...state.transactions],
          paychecks: [...state.paychecks],
          goals: [...state.goals],
          recurringExpenses: [...state.recurringExpenses],
          incomeSettings: { ...state.incomeSettings },
          preferences: { ...state.preferences },
          lastUpdated: state.lastUpdated,
          storageMode: useIndexedDB ? 'indexeddb' : 'memory'
        };
      }

      // ── TRANSACTIONS ──
      async function addTransaction(tx) {
        const t = {
          id: state._nextId++,
          type: tx.type,
          amount: Math.abs(tx.amount),
          category: tx.category || 'other',
          description: tx.description || '',
          date: tx.date || new Date().toISOString(),
          account: tx.account || 'cash',
          createdAt: new Date().toISOString()
        };
        state.transactions.unshift(t);
        if (t.type === 'income') state.balance += t.amount;
        else state.balance -= t.amount;
        if (useIndexedDB) await dbAdd('transactions', t);
        else memory.transactions.unshift(t);
        notify();
        return t;
      }

      async function updateTransaction(id, u) {
        const i = state.transactions.findIndex(t => t.id === id);
        if (i === -1) return null;
        const old = state.transactions[i];
        const upd = { ...old, ...u, amount: Math.abs(u.amount ?? old.amount) };
        if (old.type === 'income') state.balance -= old.amount;
        else state.balance += old.amount;
        if (upd.type === 'income') state.balance += upd.amount;
        else state.balance -= upd.amount;
        state.transactions[i] = upd;
        if (useIndexedDB) await dbPut('transactions', upd);
        else memory.transactions = state.transactions;
        notify();
        return upd;
      }

      async function deleteTransaction(id) {
        const i = state.transactions.findIndex(t => t.id === id);
        if (i === -1) return false;
        const t = state.transactions[i];
        if (t.type === 'income') state.balance -= t.amount;
        else state.balance += t.amount;
        state.transactions.splice(i, 1);
        if (useIndexedDB) await dbDelete('transactions', id);
        else memory.transactions = state.transactions;
        notify();
        return true;
      }

      function getTransactions(f) {
        let list = [...state.transactions];
        if (f) {
          if (f.type) list = list.filter(t => t.type === f.type);
          if (f.category && f.category !== 'all') list = list.filter(t => t.category === f.category);
          if (f.search) {
            const q = f.search.toLowerCase();
            list = list.filter(t => t.description.toLowerCase().includes(q) || t.category.toLowerCase().includes(q));
          }
        }
        return list.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      // ── GOALS ──
      async function addGoal(g) {
        const goal = {
          id: state._nextId++,
          name: g.name,
          emoji: g.emoji || '◈',
          target: Math.abs(g.target),
          current: Math.abs(g.current || 0),
          targetDate: g.targetDate || null,
          weeklySavings: g.weeklySavings || 0,
          createdAt: new Date().toISOString()
        };
        state.goals.push(goal);
        if (useIndexedDB) await dbAdd('goals', goal);
        else memory.goals.push(goal);
        notify();
        return goal;
      }
      async function updateGoal(id, u) {
        const i = state.goals.findIndex(g => g.id === id);
        if (i === -1) return null;
        state.goals[i] = { ...state.goals[i], ...u };
        if (useIndexedDB) await dbPut('goals', state.goals[i]);
        else memory.goals = state.goals;
        notify();
        return state.goals[i];
      }
      async function deleteGoal(id) {
        const len = state.goals.length;
        state.goals = state.goals.filter(g => g.id !== id);
        if (state.goals.length !== len) {
          if (useIndexedDB) await dbDelete('goals', id);
          else memory.goals = state.goals;
          notify();
          return true;
        }
        return false;
      }
      function getGoals() { return [...state.goals]; }

      // ── PAYCHECKS ──
      async function addPaycheck(p) {
        const pc = {
          id: state._nextId++,
          date: p.date || new Date().toISOString(),
          gross: p.gross || 0,
          takeHome: p.takeHome || 0,
          expected: p.expected || 0,
          hours: p.hours || 0,
          createdAt: new Date().toISOString()
        };
        state.paychecks.unshift(pc);
        if (pc.takeHome > 0) {
          state.balance += pc.takeHome;
          const t = {
            id: state._nextId++,
            type: 'income',
            amount: pc.takeHome,
            category: 'paycheck',
            description: 'Paycheck',
            date: pc.date,
            account: 'cash',
            createdAt: new Date().toISOString()
          };
          state.transactions.unshift(t);
          if (useIndexedDB) await dbAdd('transactions', t);
          else memory.transactions.unshift(t);
        }
        if (useIndexedDB) await dbAdd('paychecks', pc);
        else memory.paychecks.unshift(pc);
        notify();
        return pc;
      }
      function getPaychecks() { return [...state.paychecks]; }

      // ── SETTINGS ──
      function updateIncomeSettings(s) {
        state.incomeSettings = { ...state.incomeSettings, ...s };
        notify();
        return { ...state.incomeSettings };
      }
      function updatePreferences(p) {
        state.preferences = { ...state.preferences, ...p };
        notify();
        return { ...state.preferences };
      }

      // ── COMPUTED ──
      function computePaycheckEstimate() {
        const { hourlyRate, hoursPerWeek, withholdingPct } = state.incomeSettings;
        const gross = hourlyRate * hoursPerWeek;
        const withholding = gross * (withholdingPct / 100);
        return { gross, withholding, takeHome: gross - withholding, hourlyRate, hoursPerWeek, withholdingPct };
      }
      function computeMonthlyIncome() {
        const { hourlyRate, hoursPerWeek, payFrequency } = state.incomeSettings;
        const weekly = hourlyRate * hoursPerWeek;
        const mult = payFrequency === 'weekly' ? 4.33 : payFrequency === 'biweekly' ? 2.17 : payFrequency === 'semimonthly' ? 2 : payFrequency === 'monthly' ? 1 : 4.33;
        return weekly * mult;
      }
      function computeGoalProgress(g) {
        const pct = g.target > 0 ? Math.min(100, Math.round((g.current / g.target) * 100)) : 0;
        const remaining = Math.max(0, g.target - g.current);
        let estimatedDate = null;
        if (g.weeklySavings > 0 && remaining > 0) {
          const weeks = remaining / g.weeklySavings;
          estimatedDate = new Date(Date.now() + weeks * 7 * 24 * 60 * 60 * 1000);
        } else if (g.targetDate) {
          estimatedDate = new Date(g.targetDate);
        }
        return { pct, remaining, estimatedDate };
      }
      function computeProjectedBalance() {
        const est = computePaycheckEstimate();
        const planned = state.recurringExpenses.filter(e => e.active !== false).reduce((s, e) => s + (e.amount || 0), 0);
        return state.balance + est.takeHome - planned;
      }
      function computeSpendingByCategory(days) {
        days = days || 7;
        const cutoff = Date.now() - days * 864e5;
        const by = {};
        state.transactions
          .filter(t => t.type === 'expense' && new Date(t.date).getTime() >= cutoff)
          .forEach(t => { by[t.category] = (by[t.category] || 0) + t.amount; });
        return by;
      }
      function computeTotalSpending(days) {
        days = days || 7;
        const cutoff = Date.now() - days * 864e5;
        return state.transactions
          .filter(t => t.type === 'expense' && new Date(t.date).getTime() >= cutoff)
          .reduce((s, t) => s + t.amount, 0);
      }
      function computeTotalIncome(days) {
        days = days || 7;
        const cutoff = Date.now() - days * 864e5;
        return state.transactions
          .filter(t => t.type === 'income' && new Date(t.date).getTime() >= cutoff)
          .reduce((s, t) => s + t.amount, 0);
      }
      function computeSavingsRate() {
        const inc = computeTotalIncome(30);
        const sp = computeTotalSpending(30);
        if (inc === 0) return 0;
        return Math.max(0, Math.round(((inc - sp) / inc) * 100));
      }
      function computeAverageTransaction() {
        const ex = state.transactions.filter(t => t.type === 'expense');
        if (!ex.length) return 0;
        return ex.reduce((s, t) => s + t.amount, 0) / ex.length;
      }
      function computeLargestCategory() {
        const by = computeSpendingByCategory(30);
        let cat = '—', amt = 0;
        Object.entries(by).forEach(([k, v]) => { if (v > amt) { amt = v; cat = k; } });
        return { category: cat, amount: amt };
      }
      function generateInsights() {
        const out = [];
        const wk = computeTotalSpending(7);
        const now = Date.now();
        const wkAgo = now - 7 * 864e5;
        const wk2Ago = now - 14 * 864e5;
        const prev = state.transactions
          .filter(t => t.type === 'expense' && new Date(t.date).getTime() >= wk2Ago && new Date(t.date).getTime() < wkAgo)
          .reduce((s, t) => s + t.amount, 0);
        if (prev > 0) {
          const ch = ((wk - prev) / prev) * 100;
          if (Math.abs(ch) >= 5) {
            out.push({ ico: ch < 0 ? '↓' : '↑', txt: `Spending is <strong>${ch < 0 ? 'down' : 'up'} ${Math.abs(Math.round(ch))}%</strong> this week.` });
          }
        }
        const lc = computeLargestCategory();
        if (lc.amount > 0) {
          out.push({ ico: '◈', txt: `<strong>${lc.category}</strong> is your top category at <strong>${fmt(lc.amount)}</strong>.` });
        }
        if (state.goals.length) {
          const g = state.goals[0];
          const p = computeGoalProgress(g);
          if (p.remaining > 0) out.push({ ico: '→', txt: `<strong>${fmt(p.remaining)}</strong> away from "${g.name}".` });
          else out.push({ ico: '✓', txt: `"${g.name}" goal reached.` });
        }
        const proj = computeProjectedBalance();
        if (proj > state.balance) out.push({ ico: '↑', txt: `Projected balance after next paycheck: <strong>${fmt(proj)}</strong>.` });
        if (!out.length) out.push({ ico: '·', txt: 'Add transactions to see insights.' });
        return out;
      }

      return {
        init, subscribe, getSnapshot: snapshot,
        addTransaction, updateTransaction, deleteTransaction, getTransactions,
        addGoal, updateGoal, deleteGoal, getGoals,
        addPaycheck, getPaychecks,
        updateIncomeSettings, updatePreferences,
        computePaycheckEstimate, computeMonthlyIncome,
        computeGoalProgress, computeProjectedBalance,
        computeSpendingByCategory, computeTotalSpending, computeTotalIncome,
        computeSavingsRate, computeAverageTransaction, computeLargestCategory,
        generateInsights,
        get balance() { return state.balance; },
        get transactions() { return [...state.transactions]; },
        get goals() { return [...state.goals]; },
        get paychecks() { return [...state.paychecks]; },
        get incomeSettings() { return { ...state.incomeSettings }; },
        get preferences() { return { ...state.preferences }; }
      };
    })();

    // ═══════════════════════════════════════════════════════════
    //  SHARE MANAGER (real Web Share API)
    // ═══════════════════════════════════════════════════════════
    const ShareManager = (function() {
      async function shareText(title, text, url) {
        if (typeof navigator.share !== 'function') {
          return { shared: false, reason: 'Web Share API not supported on this browser' };
        }
        try {
          await navigator.share({ title, text, url });
          return { shared: true };
        } catch (e) {
          if (e.name === 'AbortError') return { shared: false, reason: 'Share cancelled' };
          return { shared: false, reason: 'Share failed: ' + e.message };
        }
      }
      async function shareFile(file, title, text) {
        if (typeof navigator.share !== 'function' || typeof navigator.canShare !== 'function') {
          return { shared: false, reason: 'Web Share API with files not supported' };
        }
        try {
          if (!navigator.canShare({ files: [file] })) {
            return { shared: false, reason: 'This browser cannot share files via Web Share' };
          }
          await navigator.share({ files: [file], title, text });
          return { shared: true };
        } catch (e) {
          if (e.name === 'AbortError') return { shared: false, reason: 'Share cancelled' };
          return { shared: false, reason: 'Share failed: ' + e.message };
        }
      }
      return { shareText, shareFile };
    })();

    // ═══════════════════════════════════════════════════════════
    //  6. UI LAYER
    // ═══════════════════════════════════════════════════════════

    let currentTab = 'home';
    let privacyMode = false;
    let authenticated = false;
    let sheetReturnFocus = null;
    let notifStatusCache = null;

    /* ── HELPERS ── */
    function fmt(n) {
      if (n === undefined || n === null) return '$0.00';
      const abs = Math.abs(n);
      const str = abs.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return '$' + str;
    }
    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diff = Math.round((today - target) / 864e5);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Yesterday';
      if (diff < 7) return diff + 'd ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 5) return 'just now';
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      return Math.floor(s / 3600) + 'h ago';
    }
    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function haptic(style) {
      if (!Store.preferences.hapticsEnabled) return;
      Haptics[style] ? Haptics[style]() : Haptics.light();
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2400);
      haptic('light');
    }

    function openSheet(html) {
      document.getElementById('sheet-content').innerHTML = html;
      document.getElementById('sheet-overlay').classList.add('on');
      sheetReturnFocus = document.activeElement;
      haptic('light');
    }
    function closeSheet(e) {
      if (e && e.target !== document.getElementById('sheet-overlay')) return;
      document.getElementById('sheet-overlay').classList.remove('on');
      if (sheetReturnFocus && sheetReturnFocus.focus) {
        try { sheetReturnFocus.focus(); } catch (err) {}
      }
    }

    /* ── AUTH ── */
    async function checkAppLock() {
      if (!Store.preferences.appLockEnabled) { authenticated = true; return; }
      await showAuthGate();
    }
    async function showAuthGate() {
      const gate = document.getElementById('auth-gate');
      const icon = document.getElementById('auth-icon');
      const title = document.getElementById('auth-title');
      const sub = document.getElementById('auth-sub');
      const actions = document.getElementById('auth-actions');
      gate.classList.add('on');

      const cap = await PlatformCapabilities.checkWebAuthn();
      if (!cap.available) {
        icon.textContent = '⚠';
        icon.classList.remove('available');
        title.textContent = 'App Lock Unavailable';
        sub.textContent = cap.reason + ' You can still use Logostics, or disable app lock in Settings.';
        actions.innerHTML = `
          <button class="btn btn-primary" onclick="skipLock()">Continue Without Lock</button>
          <button class="btn btn-secondary" onclick="disableLockAndContinue()">Disable App Lock</button>
        `;
        return;
      }
      icon.textContent = '🔒';
      icon.classList.add('available');
      title.textContent = 'Logostics is Locked';
      sub.textContent = 'Use your device passcode or biometric to unlock.';
      actions.innerHTML = `
        <button class="btn btn-primary" id="auth-btn" onclick="doAuthenticate()">Unlock</button>
        <button class="btn btn-secondary" onclick="skipLock()">Cancel</button>
      `;
      setTimeout(() => doAuthenticate(), 400);
    }
    async function doAuthenticate() {
      const sub = document.getElementById('auth-sub');
      const btn = document.getElementById('auth-btn');
      if (btn) btn.disabled = true;
      sub.textContent = 'Waiting for device authentication…';
      haptic('medium');
      const result = await AuthManager.authenticate();
      if (result.success) {
        sub.textContent = 'Authenticated';
        haptic('success');
        setTimeout(() => {
          document.getElementById('auth-gate').classList.remove('on');
          authenticated = true;
          render();
        }, 250);
      } else {
        sub.textContent = result.reason;
        haptic('error');
        if (btn) btn.disabled = false;
      }
    }
    function skipLock() {
      document.getElementById('auth-gate').classList.remove('on');
      authenticated = true;
      render();
      toast('Lock skipped for this session');
    }
    async function disableLockAndContinue() {
      await Store.updatePreferences({ appLockEnabled: false });
      document.getElementById('auth-gate').classList.remove('on');
      authenticated = true;
      render();
      toast('App lock disabled');
    }

    /* ── PRIVACY ── */
    function togglePrivacy() {
      privacyMode = !privacyMode;
      const btn = document.getElementById('privacy-btn');
      btn.textContent = privacyMode ? '🙈' : '👁';
      btn.classList.toggle('active', privacyMode);
      document.getElementById('app').classList.toggle('privacy-blur', privacyMode);
      haptic('medium');
      toast(privacyMode ? 'Privacy mode on' : 'Privacy mode off');
    }

    /* ── RENDER: HOME ── */
    function renderHome() {
      const snap = Store.getSnapshot();
      const bal = snap.balance;

    /* ── ACTIVITY ── */

        groups[d].push(t);
      });
      const cats = [
        { id: 'all', label: 'All', emoji: '◌' },
        { id: 'food', label: 'Food', emoji: '🍔' },
        { id: 'shopping', label: 'Shopping', emoji: '🛍' },
        { id: 'transport', label: 'Transport', emoji: '🚗' },
        { id: 'bills', label: 'Bills', emoji: '📄' },

        <div class="container fade-in">
          <div class="top-header">

            <button class="icon-btn" onclick="openAddExpense()" style="background:var(--white);color:var(--black);border-color:var(--white);">+</button>

    /* ── GOALS ── */

      const goals = Store.getGoals();
      return `
        <div class="container fade-in">
          <div class="top-header">
            <div class="t-large">Goals</div>

                  <div class="goal-card ${active ? 'active' : ''}" onclick="openGoalDetail(${g.id})">

    /* ── ANALYTICS ── */
    function renderAnalytics() {
      const snap = Store.getSnapshot();
      const inc = Store.computeTotalIncome(30);
      const sp = Store.computeTotalSpending(30);
      const rate = Store.computeSavingsRate();
      const avg = Store.computeAverageTransaction();
      const lc = Store.computeLargestCategory();
      const last7 = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const ds = d.toDateString();
        const val = snap.transactions
          .filter(t => t.type === 'expense' && new Date(t.date).toDateString() === ds)
          .reduce((s, t) => s + t.amount, 0);
        last7.push({ label: d.toLocaleDateString('en-US', { weekday: 'narrow' }), value: val });
      }
      const maxV = Math.max(...last7.map(d => d.value), 1);
      return `
        <div class="container fade-in">
          <div class="top-header"><div class="t-large">Analytics</div></div>
          <div class="stat-grid stagger">
            <div class="stat"><div class="stat-val" style="color:var(--green);">${fmt(inc)}</div><div class="stat-lbl">Income · 30d</div></div>
            <div class="stat"><div class="stat-val" style="color:var(--gray-200);">${fmt(sp)}</div><div class="stat-lbl">Spending · 30d</div></div>
            <div class="stat"><div class="stat-val">${rate}%</div><div class="stat-lbl">Savings Rate</div></div>
            <div class="stat"><div class="stat-val">${fmt(avg)}</div><div class="stat-lbl">Avg Transaction</div></div>
          </div>
          <div class="chart-card">
            <h3>Weekly Spending</h3>
            <div style="display:flex;align-items:flex-end;justify-content:space-between;height:110px;gap:8px;">
              ${last7.map(d => `
                <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;">
                  <div style="width:100%;height:${Math.max(4, (d.value / maxV) * 84)}px;background:${d.value > 0 ? 'var(--green)' : 'var(--gray-800)'};border-radius:6px 6px 0 0;transition:height 0.5s var(--ease-out);"></div>
                  <span style="font-size:10px;color:var(--gray-500);font-weight:700;">${d.label}</span>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="chart-card">
            <h3>Top Category</h3>
            ${lc.amount > 0 ? `
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:15px;font-weight:600;">${escapeHtml(lc.category)}</span>
                <span style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.03em;">${fmt(lc.amount)}</span>
              </div>
            ` : `<p style="color:var(--gray-500);font-size:14px;">No spending data yet.</p>`}
          </div>
          ${snap.goals.length > 0 ? `
            <div class="chart-card">
              <h3>Goal Progress</h3>
              ${snap.goals.map(g => {
                const p = Store.computeGoalProgress(g);
                return `
                  <div style="margin-bottom:16px;">
                    <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:8px;">
                      <span>${g.emoji} ${escapeHtml(g.name)}</span>
                      <span style="color:var(--gray-400);">${p.pct}%</span>
                    </div>
                    <div class="goal-bar" style="height:5px;margin:0;"><div class="goal-fill" style="width:${p.pct}%"></div></div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    /* ── NAV ── */
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === tab);
      });
      haptic('light');
      render();
    }

    /* ── RENDER ── */
    function render() {
      if (!authenticated) return;
      const app = document.getElementById('app');
      const views = { home: renderHome, activity: renderActivity, goals: renderGoals, analytics: renderAnalytics };
      app.innerHTML = views[currentTab] ? views[currentTab]() : renderHome();
      app.classList.toggle('privacy-blur', privacyMode);
      // Persist current tab for deep-link restore
      try { sessionStorage.setItem('logostics_tab', currentTab); } catch (e) {}
    }

    /* ── NOTIFICATIONS ── */
    async function enableNotifications() {
      const result = await NotificationManager.requestPermission();
      if (result.granted) {
        await Store.updatePreferences({ notificationsEnabled: true });
        toast('Notifications enabled');
        const sent = await NotificationManager.send('Logostics', 'Notifications are now enabled.');
        if (!sent.sent) toast('Permission granted but notification failed: ' + sent.reason);
      } else {
        toast(result.reason || 'Notifications not enabled');
      }
      render();
    }
    async function sendTestNotification() {
      const sent = await NotificationManager.send('Logostics', 'Test notification — this is a real browser notification.');
      toast(sent.sent ? 'Notification sent' : 'Not sent: ' + sent.reason);
    }

    async function addToGoal(id) {
      const amt = parseFloat(document.getElementById('g-add').value);
      if (!amt || amt <= 0) { toast('Enter a valid amount'); return; }
      const g = Store.getGoals().find(x => x.id === id);
      if (!g) return;
      await Store.updateGoal(id, { current: g.current + amt });
      closeSheet();
      haptic('success');
      toast('Added to goal');
      render();
    }
    async function confirmDeleteGoal(id) {
      if (confirm('Delete this goal?')) {
        await Store.deleteGoal(id);
        closeSheet();
        haptic('heavy');
        toast('Goal deleted');
        render();
      }
    }
    async function shareGoal(id) {
      const g = Store.getGoals().find(x => x.id === id);
      if (!g) return;
      const p = Store.computeGoalProgress(g);
      const text = `${g.name}: ${fmt(g.current)} of ${fmt(g.target)} — ${p.pct}% complete, ${fmt(p.remaining)} remaining.`;
      const result = await ShareManager.shareText('Logostics Goal', text);
      toast(result.shared ? 'Shared' : result.reason);

    async function submitTransfer() {
      const goalId = parseInt(document.querySelector('#t-goal .chip.selected')?.dataset.goal);

      if (!goalId || !amt || amt <= 0) { toast('Select a goal and enter an amount'); return; }
      const g = Store.getGoals().find(x => x.id === goalId);

      await Store.updateGoal(goalId, { current: g.current + amt });

      haptic('success');

    async function toggleAppLock() {
      const enabled = Store.preferences.appLockEnabled;
      if (!enabled) {
        const cap = await PlatformCapabilities.checkWebAuthn();
        if (!cap.available) { toast('Cannot enable lock: ' + cap.reason); return; }
        const reg = await AuthManager.register();
        if (!reg.success) { toast('Registration failed: ' + reg.reason); return; }
        const cred = AuthManager.getCredential();
        await Store.updatePreferences({ appLockEnabled: true, webAuthnCredential: cred });
        toast('App lock enabled with real platform authenticator');
      } else {
        await Store.updatePreferences({ appLockEnabled: false, webAuthnCredential: null });
        toast('App lock disabled');
      }
      openSettings();
    }
