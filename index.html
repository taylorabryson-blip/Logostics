/* the balance card in brushed titanium */
html.apple .hero{position:relative;border-radius:22px;padding:22px 20px 20px;margin:4px 0 18px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 90% at 18% 0%,rgba(255,255,255,.22),transparent 55%),repeating-linear-gradient(100deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(150deg,var(--ti1),var(--ti2) 55%,var(--ti3));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.35)}
html.apple .hero::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.06) 40%,rgba(255,255,255,.25));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
html.apple-light .hero{color:#1c1c1e;box-shadow:inset 0 1px 0 #fff,0 14px 34px rgba(0,0,0,.12)}
html.apple .hero-label{font-size:13px;font-weight:500;opacity:.75;text-transform:none;letter-spacing:0}
html.apple .hero-amount{font-family:-apple-system,'SF Pro Rounded','SF Pro Display',system-ui;font-size:46px;font-weight:700;letter-spacing:-.02em}
/* controls */
html.apple .btn{border-radius:12px;font-size:17px;font-weight:600;letter-spacing:-.02em;min-height:50px}
html.apple .btn-primary,html.apple .btn-green{background:var(--green);color:var(--on-accent);border:none}
html.apple .btn-secondary{background:var(--ap-fill);color:var(--green);border:none}
html.apple .btn-danger{background:var(--ap-fill);color:var(--ap-red);border:none}
html.apple .mini-btn{border:none;background:var(--ap-fill);color:var(--green);border-radius:999px;font-weight:600}
html.apple .mini-btn.go{background:var(--green);color:var(--on-accent)}
html.apple .segmented{background:var(--ap-fill);border:none;border-radius:9px;padding:2px}
html.apple .seg{padding:7px 8px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text)}
html.apple .seg.active{background:#636366;color:#fff;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
html.apple-light .seg.active{background:#fff;color:#000}
html.apple .toggle{width:51px;height:31px;border-radius:16px;background:var(--ap-fill)}html.apple .toggle.on{background:var(--ap-green)}
html.apple .toggle::after{top:2px;left:2px;width:27px;height:27px;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06)}
html.apple .field-input{background:var(--ap-fill2);border:none;border-radius:10px;font-size:17px}
html.apple .chip{border:none;background:var(--ap-fill);border-radius:999px}html.apple .chip.selected{background:var(--green);color:var(--on-accent)}
/* the tab bar: translucent with a hairline, tinted icon for the current tab */
html.apple .bottom-nav{background:var(--ap-bar)!important;backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-top:.5px solid var(--ap-sep)!important;box-shadow:none!important}
html.apple .nav-item{color:#8e8e93}html.apple .nav-item.active{color:var(--green)}html.apple .nav-lbl{font-size:10px;font-weight:500;letter-spacing:.01em}
html.apple .nav-item.active .nav-ico svg{stroke-width:2.1;transform:none}
/* sheets */
html.apple .sheet{border-radius:12px 12px 0 0;background:var(--bg)}html.apple-light .sheet{background:#f2f2f7}
html.apple .sheet-grip{width:36px;height:5px;border-radius:3px;background:var(--ap-label3)}
/* the AI button and privacy button as glass circles */
html.apple .ai-fab,html.apple .privacy-btn{background:var(--ap-bar);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:.5px solid var(--ap-sep)}
/* Apple finish picker */
.ap-pick{margin:0 0 16px}.ap-discs{display:flex;gap:14px;flex-wrap:wrap}
.ap-disc{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--text);font:inherit;font-size:12px}
.ap-disc i{width:52px;height:52px;border-radius:50%;box-shadow:inset 0 1px 1px rgba(255,255,255,.45),inset 0 -2px 4px rgba(0,0,0,.35),0 4px 12px rgba(0,0,0,.35);outline:2px solid transparent;outline-offset:3px;transition:outline-color .2s}
.ap-disc.on i{outline-color:var(--green)}
/* your patterns */
.pt-sub{font-size:12px;color:var(--gray-500);font-weight:600;margin:2px 0 10px}
.pt-days{display:flex;gap:6px;align-items:flex-end;height:112px}.pt-d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.pt-d i{display:block;width:70%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--gray-700);transform-origin:bottom}.pt-d.top i{background:var(--green)}
.pt-d span{font-size:11px;color:var(--gray-500);font-weight:600}.pt-d .pt-v{font-size:10px;color:var(--gray-400);font-variant-numeric:tabular-nums}.pt-d.top span{color:var(--text)}
#app.enter .pt-d i{animation:an-grow calc(.7s*var(--am,1)) cubic-bezier(.22,1,.36,1) backwards}
.pt-hours{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:26px}.pt-hours i{display:block;border-radius:3px;background:var(--green)}
.pt-hl{display:flex;justify-content:space-between;font-size:10px;color:var(--gray-500);margin-top:4px}
.pt-pl{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--gray-800)}.pt-pl:last-of-type{border-bottom:0}
.pt-lg{flex:0 0 32px;height:32px;border-radius:50%;background:var(--gray-800);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--gray-300)}
.pt-pn{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pt-pn small{display:block;font-size:11.5px;color:var(--gray-500);font-weight:500}
.pt-tips{margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.4;color:var(--gray-300)}
html.apple .hero-label,html.apple .hero .hero-split,html.apple .hero [class*="upd"]{color:rgba(255,255,255,.78)!important}
html.apple-light .hero-label,html.apple-light .hero .hero-split,html.apple-light .hero [class*="upd"]{color:rgba(28,28,30,.62)!important}

.ap-models{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 12px;padding-bottom:2px}.ap-models .chip{white-space:nowrap;flex:0 0 auto}
.rc-code{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:700;letter-spacing:.06em;text-align:center;padding:18px 10px;border-radius:16px;background:var(--gray-850);border:1px dashed var(--gray-700);user-select:all;word-break:break-all}
/* analytics summary */
.an-sum h3{margin:0 0 10px}.an-seg{margin-bottom:12px}
.an-per{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px}.an-per b{font-size:16px;letter-spacing:-.02em;text-align:center;flex:1}
.an-arrow{width:34px;height:34px;border-radius:50%;border:0;background:var(--gray-850);color:var(--text);font-size:20px;line-height:1;cursor:pointer}.an-arrow:disabled{opacity:.3}
.an-slider{width:100%;margin:2px 0 10px}
.an-per-day{font-size:12.5px;color:var(--gray-500);margin:-8px 0 12px}
.an-bars.nmany{gap:2px}.an-bars.nmany .an-b{width:80%;max-width:8px}.an-bars.nmany .an-pair{gap:1px}
.an-cats{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.an-cat{display:grid;grid-template-columns:22px minmax(70px,1fr) 2fr auto;align-items:center;gap:8px;cursor:pointer;font-size:13.5px}
.an-cs{text-align:center;font-size:15px}.an-cn{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}.an-cb{height:6px;border-radius:3px;background:var(--gray-800);overflow:hidden}.an-cb i{display:block;height:100%;border-radius:3px}
.an-cat b{font-variant-numeric:tabular-nums;font-size:13px}
.dev-ico{vertical-align:-3px;flex-shrink:0}
/* work schedule */
.sc-days{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.sc-day{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:12px;background:var(--gray-850)}
.sc-dh{flex:0 0 38px;display:flex;flex-direction:column;align-items:center;line-height:1.1}.sc-dh b{font-size:13px}.sc-dh span{font-size:11px;color:var(--gray-500)}
.sc-shifts{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px}
.sc-shift{border:0;border-radius:999px;padding:6px 11px;background:var(--green);color:var(--on-accent);font:inherit;font-size:12.5px;font-weight:650;cursor:pointer}.sc-shift small{opacity:.75;font-weight:500}
.sc-add{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--gray-600);background:none;color:var(--gray-400);font-size:16px;cursor:pointer}
.sc-tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sc-tot>div{background:var(--gray-850);border-radius:12px;padding:9px 11px}.sc-tot small{display:block;font-size:11px;color:var(--gray-500);font-weight:600}.sc-tot b{font-size:16px}
.ins-sec{border-top:1px solid var(--gray-800)}.ins-sec:first-of-type{border-top:0}
.ins-sec summary{list-style:none;cursor:pointer;padding:12px 2px;font-weight:650;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.ins-sec summary::-webkit-details-marker{display:none}.ins-sec summary::after{content:'›';color:var(--gray-500);transition:transform .2s;font-size:18px}.ins-sec[open] summary::after{transform:rotate(90deg)}
.ins-body{padding:0 2px 12px}
/* ═══ 4.2.1 ═══ */
.field-input.mer-auto{color:var(--green)}
.slash-pop{position:absolute;left:0;right:0;bottom:calc(100% + 8px);max-height:46vh;overflow-y:auto;background:var(--card);border:1px solid var(--gray-700);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:6px;z-index:50;-webkit-overflow-scrolling:touch}
form:has(#ai-input){position:relative}
.sl-row{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--text);font:inherit;font-size:14px;padding:9px 10px;border-radius:10px;cursor:pointer}
.sl-row b{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;color:var(--green);white-space:nowrap}

.sl-row.dev b{color:var(--orange,#ff9f0a)}

.sl-d{color:var(--gray-400);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-tag{font-size:10px;padding:1px 6px;border-radius:6px;background:rgba(255,159,10,.15);color:var(--orange,#ff9f0a)}
.sl-hint{font-size:11px;color:var(--gray-500);padding:6px 10px 2px}
.sl-row.static{cursor:default;padding:7px 2px;border-bottom:1px solid var(--gray-850);border-radius:0}
.sl-sheet{margin:6px 0 12px}
.sl-sheet kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--gray-700);border-bottom-width:2px;border-radius:6px;padding:1px 7px;min-width:40px;text-align:center}
.sa-card{border:1px solid rgba(255,159,10,.35);background:rgba(255,159,10,.07);border-radius:16px;padding:12px 14px;margin:10px 0 4px}
.sa-h{font-weight:700;font-size:15px}
.sa-why{font-size:13px;color:var(--gray-400);margin:4px 0 8px;line-height:1.45}
.sa-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--gray-850);font-size:14px}
.sa-row span{flex:1;min-width:0}
.sa-foot{font-size:12px;color:var(--gray-500);margin-top:8px;line-height:1.45}
.fx-tag.ap{background:rgba(10,132,255,.15);color:#64d2ff}
.fx-kinds{flex-wrap:nowrap!important;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fx-kinds::-webkit-scrollbar{display:none}
.fx-kinds .chip{flex:0 0 auto}
.gk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.gk-pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;border:1px solid color-mix(in srgb,var(--gk,#30d158) 35%,transparent);background:color-mix(in srgb,var(--gk,#30d158) 10%,var(--card));color:var(--text);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-align:center;line-height:1.2}
.gk-pick:active{transform:scale(.96)}
.gk-sym{font-size:22px;color:var(--gk,var(--green));width:32px;text-align:center}
.gk-list .friend-row{width:100%;font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
.goal-card.gk{border-color:color-mix(in srgb,var(--gk) 40%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--gk) 14%,var(--card)),var(--card) 65%);overflow:hidden}
.goal-card.gk .goal-fill{background:var(--gk)}
.goal-card.gk::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.22}
.gk-confetti::after{background:radial-gradient(circle at 12% 20%,var(--gk) 2px,transparent 3px),radial-gradient(circle at 80% 15%,#ffd60a 2px,transparent 3px),radial-gradient(circle at 92% 60%,#64d2ff 2px,transparent 3px),radial-gradient(circle at 70% 85%,var(--gk) 2px,transparent 3px),radial-gradient(circle at 30% 75%,#30d158 2px,transparent 3px)}
.gk-waves::after{background:repeating-radial-gradient(circle at 100% 120%,transparent 0 14px,var(--gk) 15px 16px)}
.gk-ticket::after{background:radial-gradient(circle at 0 50%,var(--bg,#000) 9px,transparent 10px),radial-gradient(circle at 100% 50%,var(--bg,#000) 9px,transparent 10px);opacity:1}
.gk-snow::after{background:radial-gradient(circle at 15% 25%,#fff 1.5px,transparent 2.5px),radial-gradient(circle at 60% 15%,#fff 1.5px,transparent 2.5px),radial-gradient(circle at 85% 45%,#fff 2px,transparent 3px),radial-gradient(circle at 40% 80%,#fff 1.5px,transparent 2.5px)}
.gk-hearts::after{background:radial-gradient(circle at 88% 22%,var(--gk) 4px,transparent 5px),radial-gradient(circle at 92% 26%,var(--gk) 4px,transparent 5px)}
.gk-paws::after{background:radial-gradient(circle at 88% 75%,var(--gk) 5px,transparent 6px),radial-gradient(circle at 84% 63%,var(--gk) 2.5px,transparent 3.5px),radial-gradient(circle at 92% 63%,var(--gk) 2.5px,transparent 3.5px)}
.gk-lines::after{background-image:linear-gradient(var(--gk) 1px,transparent 1px),linear-gradient(90deg,var(--gk) 1px,transparent 1px);background-size:18px 18px;opacity:.06}
.gk-pixels::after{background-image:linear-gradient(45deg,var(--gk) 25%,transparent 25%,transparent 75%,var(--gk) 75%);background-size:10px 10px;opacity:.06;mask-image:linear-gradient(90deg,transparent 60%,#000)}
.gk-tag{display:inline-block;font-size:11px;font-weight:600;color:var(--gk);background:color-mix(in srgb,var(--gk) 15%,transparent);border-radius:999px;padding:1px 8px;margin-right:6px}
.gk-tip{font-size:13px;color:var(--gray-300);background:var(--gray-850);border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.45}
.gf-more summary,.sb-more summary{cursor:pointer}
.ap-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ap-row::-webkit-scrollbar{display:none}
.ap-chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;border-radius:12px;border:1px solid var(--gray-700);background:var(--gray-850);color:var(--text);font:inherit;cursor:pointer;min-width:92px}
.ap-chip b{font-size:13.5px;font-weight:600;white-space:nowrap}
.ap-chip small{font-size:11.5px;color:var(--gray-500);font-variant-numeric:tabular-nums}
.ap-chip.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--gray-850))}
.rc-scan{display:inline-flex;margin:-4px 0 14px}
.sc-photo{font-weight:600}
/* iPhone glass: Safari can't blur inside a blurred parent, so the sheet looked see-through ("half swiped away") on some iPhones.
   Keep the sheet nearly solid and let only the sheet blur. */
.iphone.glass-on .sheet-overlay{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(0,0,0,.5)}
.iphone.glass-on .sheet{background:rgba(var(--glass-rgb),max(.93,calc(var(--g-a) + .24)))}
.sheet-overlay.on{opacity:1}
/* ── each built-in style has its own personality (4.2.1) ── */
/* Classic: clean cards with a thin accent edge on the balance */
html.th-classic .hero{position:relative}
html.th-classic .hero::after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--green),transparent 70%);opacity:.6}
/* Midnight: deep blue night sky, soft glow, lighter numbers */
html.th-midnight body{background:radial-gradient(120% 70% at 50% -10%,#14204a 0%,#070b1d 55%,#03040b 100%) fixed!important}
html.th-midnight :is(.goal-card,.chart-card,.insight,.activity-item,.quick-btn,.set-row,.cash-card,.fx-card){background:rgba(22,30,64,.55)!important;border-color:rgba(120,150,255,.14)!important;box-shadow:0 0 0 1px rgba(120,150,255,.05) inset,0 10px 30px rgba(0,0,30,.35)}
html.th-midnight .hero-amount{text-shadow:0 0 28px color-mix(in srgb,var(--green) 45%,transparent);font-weight:600}
html.th-midnight .t-large,html.th-midnight .sheet-title{letter-spacing:-.01em;font-weight:600}
html.th-midnight .bottom-nav{background:rgba(8,12,30,.85)!important;border-top-color:rgba(120,150,255,.12)!important}
/* Glass: thick frosted cards with a light edge and a sheen */
html.th-glass :is(.goal-card,.chart-card,.insight,.quick-btn,.cash-card,.fx-card){border:1px solid rgba(255,255,255,.16)!important;background-image:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 40%,transparent 60%)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 32px rgba(0,0,0,.35)}
html.th-glass .hero-amount{background:linear-gradient(180deg,#fff,rgba(255,255,255,.65));-webkit-background-clip:text;background-clip:text;color:transparent}
/* Minimal: no boxes, hairlines, small caps labels, light numbers */
html.th-minimal :is(.goal-card,.chart-card,.insight,.quick-btn,.fx-card){background:transparent!important;border:0!important;border-bottom:1px solid var(--gray-800)!important;border-radius:0!important;box-shadow:none!important}
html.th-minimal .activity-item{background:transparent!important;border-radius:0!important;border-bottom:1px solid var(--gray-850)!important}
html.th-minimal :is(.t-label,.section-h .t-label,.hero-label){text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:600}
html.th-minimal .hero-amount{font-weight:300;letter-spacing:-.05em}
html.th-minimal .quick-btn .ico{filter:grayscale(1)}
/* Dynamic: slowly shifting colour behind everything, gradient edges on cards */
@keyframes thdyn{0%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(40deg)}100%{filter:hue-rotate(0deg)}}
html.th-dynamic body::before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 20% 15%,color-mix(in srgb,var(--green) 35%,transparent),transparent 70%),radial-gradient(45% 40% at 85% 30%,rgba(191,90,242,.28),transparent 70%),radial-gradient(50% 40% at 50% 100%,rgba(10,132,255,.25),transparent 70%);animation:thdyn 18s ease-in-out infinite}
html.th-dynamic :is(.goal-card,.chart-card,.cash-card,.fx-card){border:1px solid transparent!important;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,color-mix(in srgb,var(--green) 70%,transparent),rgba(191,90,242,.5),rgba(10,132,255,.4)) border-box!important}
html.anim-off.th-dynamic body::before{animation:none}
/* Focus: high contrast, big numbers, colour only where it matters */
html.th-focus :is(.goal-card,.chart-card,.insight,.activity-item,.quick-btn,.set-row,.fx-card){background:#000!important;border:1px solid #333!important;box-shadow:none!important}
html.th-focus .hero-amount{font-size:clamp(48px,14vw,64px);font-weight:800}
html.th-focus :is(.activity-ico,.quick-btn .ico,.goal-emoji){filter:grayscale(1) contrast(1.2)}
html.th-focus :is(.fx-sub,.friend-status,.goal-stats){color:#bdbdbd!important}
.pt-grp{margin:10px 0 4px}
.pt-gl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);margin-bottom:6px}
.pt-chips{display:flex;gap:8px;flex-wrap:wrap}
.pt-cssbox{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.45;min-height:150px;white-space:pre}
