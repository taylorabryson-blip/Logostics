<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Logostics Finance</title>
  <style>
    /* ═══════════════════════════════════════════════════════════
       LOGOSTICS FINANCE — MINIMAL iOS
       Palette: black, white, gray, green ONLY
       ═══════════════════════════════════════════════════════════ */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --black: #000000;
      --white: #ffffff;
      --gray-950: #0a0a0a;
      --gray-900: #121212;
      --gray-850: #1a1a1a;
      --gray-800: #222222;
      --gray-700: #2e2e2e;
      --gray-600: #3a3a3a;
      --gray-500: #555555;
      --gray-400: #777777;
      --gray-300: #999999;
      --gray-200: #bbbbbb;
      --gray-100: #dddddd;
      --green: #30d158;
      --green-dim: #1f8a3a;
      --green-glow: rgba(48, 209, 88, 0.15);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      background: var(--black);
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: calc(80px + var(--safe-bottom));
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      overflow-x: hidden;
      user-select: none;
      letter-spacing: -0.01em;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 0; height: 0; }

    /* ── TYPOGRAPHY ── */
    .t-hero {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .t-large {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .t-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .t-headline {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }
    .t-body {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
    }
    .t-caption {
      font-size: 12px;
      font-weight: 500;
      color: var(--gray-400);
      letter-spacing: 0.01em;
    }
    .t-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── LIQUID GLASS LAYERS ── */
    .glass {
      background: rgba(18, 18, 18, 0.72);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .glass-light {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-deep {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* ── LAYOUT ── */
    .container {
      max-width: 430px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-h {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 2px;
    }

    /* ── TOP HEADER ── */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0 8px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--white);
    }

    .brand-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      margin-left: 6px;
      vertical-align: middle;
      box-shadow: 0 0 8px var(--green-glow);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      background: var(--gray-850);
      border: 1px solid var(--gray-700);
      color: var(--gray-300);
      transition: all 0.2s var(--ease);
      font-family: inherit;
    }

    .icon-btn:active {
      transform: scale(0.9);
      background: var(--gray-800);
    }

    /* ── BALANCE HERO ── */
    .hero {
      text-align: center;
      padding: 32px 0 24px;
    }

    .hero-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 14px;
    }

    .hero-amount {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--white);
      transition: color 0.3s;
    }

    .hero-status {
      font-size: 12px;
      color: var(--gray-500);
      margin-top: 10px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    /* ── CASH CARD ── */
    .cash-card {
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .cash-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    }

    .cash-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .cash-main {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .cash-main-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 6px;
    }

    .cash-badge {
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--green-glow);
      border: 1px solid rgba(48, 209, 88, 0.25);
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .cash-rows {
      border-top: 1px solid var(--gray-800);
      padding-top: 16px;
    }

    .cash-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      font-size: 14px;
    }

    .cash-row .lbl {
      color: var(--gray-400);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .cash-row .amt {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .cash-row .amt.pos { color: var(--green); }
    .cash-row .amt.neg { color: var(--gray-200); }

    .cash-proj {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--gray-800);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .cash-proj .lbl {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .cash-proj .amt {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }

    /* ── QUICK ACTIONS ── */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 28px;
    }

    .quick-btn {
      border-radius: 18px;
      padding: 16px 8px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
    }

    .quick-btn:active {
      transform: scale(0.92);
      background: var(--gray-850);
    }

    .quick-btn .ico {
      font-size: 22px;
      line-height: 1;
      filter: grayscale(1);
    }

    .quick-btn.primary .ico { filter: none; }

    .quick-btn .lbl {
      font-size: 10px;
      font-weight: 600;
      color: var(--gray-400);
      letter-spacing: 0.02em;
    }

    /* ── INSIGHT CARDS ── */
    .insight {
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
    }

    .insight .ico {
      font-size: 18px;
      flex-shrink: 0;
      margin-top: 1px;
      filter: grayscale(1);
    }

    .insight .txt {
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--gray-300);
      font-weight: 400;
    }

    .insight .txt strong {
      color: var(--white);
      font-weight: 600;
    }

    /* ── ACTIVITY ITEMS ── */
    .activity-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 18px;
      margin-bottom: 6px;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      transition: all 0.2s var(--ease);
      cursor: pointer;
    }

    .activity-item:active {
      transform: scale(0.98);
      background: var(--gray-850);
    }

    .activity-ico {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      background: var(--gray-850);
      border: 1px solid var(--gray-700);
      filter: grayscale(1);
    }

    .activity-ico.income {
      filter: none;
      border-color: rgba(48, 209, 88, 0.3);
      background: var(--green-glow);
    }

    .activity-body {
      flex: 1;
      min-width: 0;
    }

    .activity-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .activity-meta {
      font-size: 11.5px;
      color: var(--gray-500);
      margin-top: 2px;
      display: flex;
      gap: 8px;
      font-weight: 500;
    }

    .activity-amt {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      letter-spacing: -0.01em;
    }

    .activity-amt.pos { color: var(--green); }
    .activity-amt.neg { color: var(--gray-200); }

    /* ── GOAL CARDS ── */
    .goal-card {
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 12px;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      transition: all 0.2s var(--ease);
      cursor: pointer;
    }

    .goal-card:active {
      transform: scale(0.985);
    }

    .goal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .goal-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .goal-pct {
      font-size: 12px;
      color: var(--gray-500);
      font-weight: 600;
      margin-top: 3px;
    }

    .goal-emoji {
      font-size: 26px;
      filter: grayscale(1);
      opacity: 0.7;
    }

    .goal-card.active .goal-emoji {
      filter: none;
      opacity: 1;
    }

    .goal-bar {
      width: 100%;
      height: 6px;
      background: var(--gray-800);
      border-radius: 3px;
      overflow: hidden;
      margin: 14px 0 10px;
    }

    .goal-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--green);
      transition: width 0.7s var(--ease-out);
      position: relative;
      overflow: hidden;
    }

    .goal-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      animation: shimmer 2.5s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .goal-stats {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--gray-400);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .goal-stats .hl {
      color: var(--white);
      font-weight: 600;
    }

    .goal-eta {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--gray-800);
      font-size: 12px;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    /* ── DYNAMIC ISLAND PREVIEW ── */
    .di-wrap {
      margin: 8px 0 20px;
      display: flex;
      justify-content: center;
    }

    .di-pill {
      background: var(--black);
      border-radius: 40px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 240px;
      justify-content: space-between;
      border: 1px solid var(--gray-800);
      box-shadow: 0 8px 40px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.03);
      animation: di-breathe 4s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .di-pill::before {
      content: '';
      position: absolute;
      top: 0;
      left: 25%;
      right: 25%;
      height: 1px;
      background: rgba(255,255,255,0.08);
    }

    @keyframes di-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    .di-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .di-ico {
      font-size: 15px;
      filter: grayscale(1);
    }

    .di-lbl {
      font-size: 10px;
      font-weight: 700;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .di-val {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--green);
      letter-spacing: -0.01em;
    }

    .di-compact {
      background: var(--black);
      border-radius: 30px;
      padding: 8px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--gray-800);
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--green);
    }

    .di-compact .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 1.5s infinite;
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 calc(8px + var(--safe-bottom));
      z-index: 100;
      border-top: 1px solid var(--gray-800);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s var(--ease);
      background: none;
      border: none;
      color: var(--gray-500);
      font-family: inherit;
      min-width: 60px;
    }

    .nav-item.active {
      color: var(--white);
    }

    .nav-item.active .nav-ico {
      filter: none;
      transform: scale(1.05);
    }

    .nav-item:active {
      transform: scale(0.88);
    }

    .nav-ico {
      font-size: 21px;
      line-height: 1;
      filter: grayscale(1);
      transition: all 0.25s var(--ease);
    }

    .nav-lbl {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /* ── SHEETS ── */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
      animation: fade-in 0.25s ease;
    }

    .sheet-overlay.on { display: flex; }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .sheet {
      width: 100%;
      max-width: 430px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 32px 32px 0 0;
      padding: 12px 20px calc(24px + var(--safe-bottom));
      animation: slide-up 0.4s var(--ease-out);
      background: var(--gray-950);
      border-top: 1px solid var(--gray-800);
    }

    @keyframes slide-up {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-grip {
      width: 36px;
      height: 4px;
      background: var(--gray-600);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .sheet-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      text-align: center;
    }

    /* ── FORMS ── */
    .field { margin-bottom: 18px; }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      display: block;
    }

    .field-input {
      width: 100%;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      color: var(--white);
      font-family: inherit;
      transition: all 0.2s var(--ease);
      -webkit-appearance: none;
      appearance: none;
      letter-spacing: -0.01em;
    }

    .field-input:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-glow);
    }

    .field-input::placeholder { color: var(--gray-600); }

    /* ── CHIPS ── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 10px 16px;
      border-radius: 20px;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--gray-300);
      font-family: inherit;
    }

    .chip:active { transform: scale(0.92); }

    .chip.selected {
      background: var(--green);
      border-color: var(--green);
      color: var(--black);
    }

    .chip .emoji { filter: grayscale(1); }
    .chip.selected .emoji { filter: none; }

    /* ── BUTTONS ── */
    .btn {
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      font-family: inherit;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: -0.01em;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--white);
      color: var(--black);
    }

    .btn-primary:active { background: var(--gray-100); }

    .btn-green {
      background: var(--green);
      color: var(--black);
    }

    .btn-secondary {
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      color: var(--white);
    }

    .btn-danger {
      background: transparent;
      border: 1px solid var(--gray-700);
      color: var(--gray-300);
    }

    .btn-danger:active {
      background: var(--gray-900);
      border-color: var(--gray-600);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-row .btn { flex: 1; }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 56px 24px;
    }

    .empty-ico {
      font-size: 44px;
      margin-bottom: 18px;
      opacity: 0.3;
      filter: grayscale(1);
    }

    .empty-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .empty-sub {
      font-size: 14px;
      color: var(--gray-500);
      line-height: 1.5;
      max-width: 260px;
      margin: 0 auto;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      top: calc(20px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-140%);
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      z-index: 2000;
      transition: transform 0.45s var(--ease-out);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 90vw;
      background: var(--gray-900);
      border: 1px solid var(--gray-700);
      color: var(--white);
      letter-spacing: -0.01em;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    /* ── FACE ID LOCK ── */
    .faceid-overlay {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 5000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      animation: fade-in 0.4s ease;
    }

    .faceid-overlay.on { display: flex; }

    .faceid-ring {
      width: 120px;
      height: 120px;
      border-radius: 36px;
      border: 2px solid var(--gray-700);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      position: relative;
      transition: all 0.4s var(--ease);
      filter: grayscale(1);
    }

    .faceid-ring.scanning {
      border-color: var(--green);
      box-shadow: 0 0 0 8px var(--green-glow), 0 0 60px var(--green-glow);
      filter: none;
      animation: scan-pulse 1.5s ease-in-out infinite;
    }

    @keyframes scan-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .faceid-ring.success {
      border-color: var(--green);
      box-shadow: 0 0 0 8px var(--green-glow), 0 0 80px var(--green-glow);
      filter: none;
    }

    .faceid-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .faceid-sub {
      font-size: 14px;
      color: var(--gray-500);
      text-align: center;
      max-width: 260px;
      line-height: 1.5;
    }

    .faceid-btn {
      padding: 14px 32px;
      border-radius: 14px;
      background: var(--gray-900);
      border: 1px solid var(--gray-700);
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s var(--ease);
    }

    .faceid-btn:active { transform: scale(0.95); }

    .faceid-btn.primary {
      background: var(--white);
      color: var(--black);
      border-color: var(--white);
    }

    /* ── PRIVACY BLUR ── */
    .privacy-blur {
      filter: blur(14px);
      transition: filter 0.35s var(--ease);
      pointer-events: none;
      user-select: none;
    }

    .privacy-hidden {
      display: none !important;
    }

    /* ── ANIMATIONS ── */
    .fade-in {
      animation: fade-up 0.35s var(--ease-out);
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stagger > * {
      animation: fade-up 0.4s var(--ease-out) backwards;
    }

    .stagger > *:nth-child(1) { animation-delay: 0.02s; }
    .stagger > *:nth-child(2) { animation-delay: 0.06s; }
    .stagger > *:nth-child(3) { animation-delay: 0.10s; }
    .stagger > *:nth-child(4) { animation-delay: 0.14s; }
    .stagger > *:nth-child(5) { animation-delay: 0.18s; }
    .stagger > *:nth-child(6) { animation-delay: 0.22s; }

    /* ── SCROLL ROW ── */
    .scroll-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .scroll-row::-webkit-scrollbar { display: none; }

    .scroll-row > * { flex-shrink: 0; }

    /* ── SEGMENTED CONTROL ── */
    .segmented {
      display: flex;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      border-radius: 12px;
      padding: 3px;
    }

    .seg {
      flex: 1;
      padding: 10px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      background: none;
      border: none;
      color: var(--gray-500);
      font-family: inherit;
      letter-spacing: -0.01em;
    }

    .seg.active {
      background: var(--white);
      color: var(--black);
    }

    .seg:active { transform: scale(0.96); }

    /* ── STAT CARDS ── */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat {
      border-radius: 18px;
      padding: 18px 16px;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      text-align: center;
    }

    .stat-val {
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .stat-lbl {
      font-size: 10px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 6px;
    }

    /* ── CHART ── */
    .chart-card {
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 12px;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
    }

    .chart-card h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 18px;
      letter-spacing: -0.01em;
    }

    /* ── SETTINGS ROWS ── */
    .set-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 16px;
      border-radius: 14px;
      margin-bottom: 6px;
      background: var(--gray-900);
      border: 1px solid var(--gray-800);
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }

    .set-row:active {
      background: var(--gray-850);
      transform: scale(0.985);
    }

    .set-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 500;
    }

    .set-left .ico {
      font-size: 16px;
      width: 20px;
      text-align: center;
      filter: grayscale(1);
      opacity: 0.7;
    }

    .set-right {
      color: var(--gray-500);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    /* ── TOGGLE ── */
    .toggle {
      position: relative;
      width: 50px;
      height: 30px;
      background: var(--gray-700);
      border-radius: 15px;
      cursor: pointer;
      transition: background 0.3s var(--ease);
      flex-shrink: 0;
    }

    .toggle.on { background: var(--green); }

    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 26px;
      height: 26px;
      background: var(--white);
      border-radius: 50%;
      transition: transform 0.3s var(--ease);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .toggle.on::after { transform: translateX(20px); }

    /* ── PRIVACY TOGGLE OVERLAY ── */
    .privacy-overlay-btn {
      position: fixed;
      bottom: calc(90px + var(--safe-bottom));
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      z-index: 90;
      transition: all 0.25s var(--ease);
      background: var(--gray-900);
      border: 1px solid var(--gray-700);
      color: var(--gray-300);
      font-family: inherit;
    }

    .privacy-overlay-btn:active { transform: scale(0.88); }

    /* ── SIRI WAVE ── */
    .siri-wave {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 16px;
    }

    .siri-wave span {
      width: 3px;
      background: var(--green);
      border-radius: 2px;
      animation: siri 1.2s ease-in-out infinite;
    }

    .siri-wave span:nth-child(1) { height: 6px; animation-delay: 0s; }
    .siri-wave span:nth-child(2) { height: 12px; animation-delay: 0.15s; }
    .siri-wave span:nth-child(3) { height: 8px; animation-delay: 0.3s; }
    .siri-wave span:nth-child(4) { height: 14px; animation-delay: 0.45s; }
    .siri-wave span:nth-child(5) { height: 6px; animation-delay: 0.6s; }

    @keyframes siri {
      0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
      50% { transform: scaleY(1.2); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- FACE ID LOCK OVERLAY -->
  <div class="faceid-overlay" id="faceid-overlay">
    <div class="faceid-ring" id="faceid-ring">🔒</div>
    <div style="text-align:center;">
      <div class="faceid-title">Logostics is Locked</div>
      <div class="faceid-sub" id="faceid-sub">Authenticate to view your financial data</div>
    </div>
    <button class="faceid-btn primary" id="faceid-btn" onclick="authenticate()">🔓 Unlock</button>
    <button class="faceid-btn" onclick="skipAuth()">Use Passcode Instead</button>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"><span class="dot"></span><span id="toast-text"></span></div>

  <!-- MAIN APP -->
  <div id="app"></div>

  <!-- PRIVACY QUICK TOGGLE -->
  <button class="privacy-overlay-btn" id="privacy-btn" onclick="togglePrivacy()">👁</button>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav glass-deep" id="bottom-nav">
    <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
      <span class="nav-ico">🏠</span>
      <span class="nav-lbl">Home</span>
    </button>
    <button class="nav-item" data-tab="activity" onclick="switchTab('activity')">
      <span class="nav-ico">📋</span>
      <span class="nav-lbl">Activity</span>
    </button>
    <button class="nav-item" data-tab="goals" onclick="switchTab('goals')">
      <span class="nav-ico">🎯</span>
      <span class="nav-lbl">Goals</span>
    </button>
    <button class="nav-item" data-tab="analytics" onclick="switchTab('analytics')">
      <span class="nav-ico">📊</span>
      <span class="nav-lbl">Analytics</span>
    </button>
  </nav>

  <!-- SHEET -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet(event)">
    <div class="sheet" id="sheet" onclick="event.stopPropagation()">
      <div class="sheet-grip"></div>
      <div id="sheet-content"></div>
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════
       LOGOSTICS FINANCE — CORE ENGINE
       Independent financial data model. UI-agnostic.
       ═══════════════════════════════════════════════════════════ */

    const Store = (function() {
      'use strict';

      let state = {
        balance: 0,
        transactions: [],
        paychecks: [],
        goals: [],
        recurringExpenses: [],
        incomeSettings: {
          hourlyRate: 0,
          hoursPerWeek: 0,
          payFrequency: 'weekly',
          withholdingPct: 20,
          nextPayday: null
        },
        preferences: {
          currency: 'USD',
          faceIdEnabled: true,
          notificationsEnabled: false,
          hapticsEnabled: true,
          privacyMode: false
        },
        lastUpdated: Date.now(),
        _nextId: 1,
        _listeners: []
      };

      const KEY = 'logostics_finance_minimal_v1';

      function save() {
        try {
          const s = { ...state };
          delete s._listeners;
          localStorage.setItem(KEY, JSON.stringify(s));
        } catch (e) {}
      }

      function load() {
        try {
          const raw = localStorage.getItem(KEY);
          if (raw) {
            const p = JSON.parse(raw);
            state = { ...state, ...p, _listeners: state._listeners };
          }
        } catch (e) {}
      }

      function notify() {
        state.lastUpdated = Date.now();
        save();
        state._listeners.forEach(fn => {
          try { fn(snapshot()); } catch (e) {}
        });
      }

      function subscribe(fn) {
        state._listeners.push(fn);
        return () => {
          state._listeners = state._listeners.filter(f => f !== fn);
        };
      }

      function snapshot() {
        return {
          balance: state.balance,
          transactions: [...state.transactions],
          paychecks: [...state.paychecks],
          goals: [...state.goals],
          recurringExpenses: [...state.recurringExpenses],
          incomeSettings: { ...state.incomeSettings },
          preferences: { ...state.preferences },
          lastUpdated: state.lastUpdated
        };
      }

      /* ── TRANSACTIONS ── */
      function addTransaction(tx) {
        const t = {
          id: state._nextId++,
          type: tx.type,
          amount: Math.abs(tx.amount),
          category: tx.category || 'other',
          description: tx.description || '',
          date: tx.date || new Date().toISOString(),
          account: tx.account || 'cash',
          createdAt: new Date().toISOString()
        };
        state.transactions.unshift(t);
        if (t.type === 'income') state.balance += t.amount;
        else state.balance -= t.amount;
        notify();
        return t;
      }

      function updateTransaction(id, u) {
        const i = state.transactions.findIndex(t => t.id === id);
        if (i === -1) return null;
        const old = state.transactions[i];
        const upd = { ...old, ...u, amount: Math.abs(u.amount ?? old.amount) };
        if (old.type === 'income') state.balance -= old.amount;
        else state.balance += old.amount;
        if (upd.type === 'income') state.balance += upd.amount;
        else state.balance -= upd.amount;
        state.transactions[i] = upd;
        notify();
        return upd;
      }

      function deleteTransaction(id) {
        const i = state.transactions.findIndex(t => t.id === id);
        if (i === -1) return false;
        const t = state.transactions[i];
        if (t.type === 'income') state.balance -= t.amount;
        else state.balance += t.amount;
        state.transactions.splice(i, 1);
        notify();
        return true;
      }

      function getTransactions(f) {
        let list = [...state.transactions];
        if (f) {
          if (f.type) list = list.filter(t => t.type === f.type);
          if (f.category && f.category !== 'all') list = list.filter(t => t.category === f.category);
          if (f.search) {
            const q = f.search.toLowerCase();
            list = list.filter(t =>
              t.description.toLowerCase().includes(q) ||
              t.category.toLowerCase().includes(q)
            );
          }
        }
        return list.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      /* ── GOALS ── */
      function addGoal(g) {
        const goal = {
          id: state._nextId++,
          name: g.name,
          emoji: g.emoji || '◈',
          target: Math.abs(g.target),
          current: Math.abs(g.current || 0),
          targetDate: g.targetDate || null,
          weeklySavings: g.weeklySavings || 0,
          createdAt: new Date().toISOString()
        };
        state.goals.push(goal);
        notify();
        return goal;
      }

      function updateGoal(id, u) {
        const i = state.goals.findIndex(g => g.id === id);
        if (i === -1) return null;
        state.goals[i] = { ...state.goals[i], ...u };
        notify();
        return state.goals[i];
      }

      function deleteGoal(id) {
        const len = state.goals.length;
        state.goals = state.goals.filter(g => g.id !== id);
        if (state.goals.length !== len) { notify(); return true; }
        return false;
      }

      function getGoals() { return [...state.goals]; }

      /* ── PAYCHECKS ── */
      function addPaycheck(p) {
        const pc = {
          id: state._nextId++,
          date: p.date || new Date().toISOString(),
          gross: p.gross || 0,
          takeHome: p.takeHome || 0,
          expected: p.expected || 0,
          hours: p.hours || 0,
          createdAt: new Date().toISOString()
        };
        state.paychecks.unshift(pc);
        if (pc.takeHome > 0) {
          state.balance += pc.takeHome;
          state.transactions.unshift({
            id: state._nextId++,
            type: 'income',
            amount: pc.takeHome,
            category: 'paycheck',
            description: 'Paycheck',
            date: pc.date,
            account: 'cash',
            createdAt: new Date().toISOString()
          });
        }
        notify();
        return pc;
      }

      function getPaychecks() { return [...state.paychecks]; }

      /* ── INCOME SETTINGS ── */
      function updateIncomeSettings(s) {
        state.incomeSettings = { ...state.incomeSettings, ...s };
        notify();
        return { ...state.incomeSettings };
      }

      function getIncomeSettings() { return { ...state.incomeSettings }; }

      function updatePreferences(p) {
        state.preferences = { ...state.preferences, ...p };
        notify();
        return { ...state.preferences };
      }

      /* ── COMPUTED ── */
      function computePaycheckEstimate() {
        const { hourlyRate, hoursPerWeek, withholdingPct } = state.incomeSettings;
        const gross = hourlyRate * hoursPerWeek;
        const withholding = gross * (withholdingPct / 100);
        const takeHome = gross - withholding;
        return { gross, withholding, takeHome, hourlyRate, hoursPerWeek, withholdingPct };
      }

      function computeMonthlyIncome() {
        const { hourlyRate, hoursPerWeek, payFrequency } = state.incomeSettings;
        const weekly = hourlyRate * hoursPerWeek;
        const mult = payFrequency === 'weekly' ? 4.33 :
                     payFrequency === 'biweekly' ? 2.17 :
                     payFrequency === 'semimonthly' ? 2 :
                     payFrequency === 'monthly' ? 1 : 4.33;
        return weekly * mult;
      }

      function computeAnnualIncome() { return computeMonthlyIncome() * 12; }

      function computeGoalProgress(g) {
        const pct = g.target > 0 ? Math.min(100, Math.round((g.current / g.target) * 100)) : 0;
        const remaining = Math.max(0, g.target - g.current);
        let estimatedDate = null;
        if (g.weeklySavings > 0 && remaining > 0) {
          const weeks = remaining / g.weeklySavings;
          estimatedDate = new Date(Date.now() + weeks * 7 * 24 * 60 * 60 * 1000);
        } else if (g.targetDate) {
          estimatedDate = new Date(g.targetDate);
        }
        return { pct, remaining, estimatedDate };
      }

      function computeProjectedBalance() {
        const est = computePaycheckEstimate();
        const planned = state.recurringExpenses
          .filter(e => e.active !== false)
          .reduce((s, e) => s + (e.amount || 0), 0);
        return state.balance + est.takeHome - planned;
      }

      function computeSpendingByCategory(days) {
        days = days || 7;
        const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
        const recent = state.transactions.filter(t =>
          t.type === 'expense' && new Date(t.date).getTime() >= cutoff
        );
        const by = {};
        recent.forEach(t => { by[t.category] = (by[t.category] || 0) + t.amount; });
        return by;
      }

      function computeTotalSpending(days) {
        days = days || 7;
        const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
        return state.transactions
          .filter(t => t.type === 'expense' && new Date(t.date).getTime() >= cutoff)
          .reduce((s, t) => s + t.amount, 0);
      }

      function computeTotalIncome(days) {
        days = days || 7;
        const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
        return state.transactions
          .filter(t => t.type === 'income' && new Date(t.date).getTime() >= cutoff)
          .reduce((s, t) => s + t.amount, 0);
      }

      function computeSavingsRate() {
        const inc = computeTotalIncome(30);
        const sp = computeTotalSpending(30);
        if (inc === 0) return 0;
        return Math.max(0, Math.round(((inc - sp) / inc) * 100));
      }

      function computeAverageTransaction() {
        const ex = state.transactions.filter(t => t.type === 'expense');
        if (!ex.length) return 0;
        return ex.reduce((s, t) => s + t.amount, 0) / ex.length;
      }

      function computeLargestCategory() {
        const by = computeSpendingByCategory(30);
        let cat = '—', amt = 0;
        Object.entries(by).forEach(([k, v]) => { if (v > amt) { amt = v; cat = k; } });
        return { category: cat, amount: amt };
      }

      function generateInsights() {
        const out = [];
        const wk = computeTotalSpending(7);
        const now = Date.now();
        const wkAgo = now - 7 * 864e5;
        const wk2Ago = now - 14 * 864e5;
        const prev = state.transactions
          .filter(t => t.type === 'expense' && new Date(t.date).getTime() >= wk2Ago && new Date(t.date).getTime() < wkAgo)
          .reduce((s, t) => s + t.amount, 0);

        if (prev > 0) {
          const ch = ((wk - prev) / prev) * 100;
          if (Math.abs(ch) >= 5) {
            out.push({
              ico: ch < 0 ? '↓' : '↑',
              txt: `Spending is <strong>${ch < 0 ? 'down' : 'up'} ${Math.abs(Math.round(ch))}%</strong> this week.`
            });
          }
        }

        const lc = computeLargestCategory();
        if (lc.amount > 0) {
          out.push({
            ico: '◈',
            txt: `<strong>${lc.category}</strong> is your top category at <strong>${fmt(lc.amount)}</strong>.`
          });
        }

        if (state.goals.length) {
          const g = state.goals[0];
          const p = computeGoalProgress(g);
          if (p.remaining > 0) {
            out.push({
              ico: '→',
              txt: `<strong>${fmt(p.remaining)}</strong> away from "${g.name}".`
            });
          } else {
            out.push({ ico: '✓', txt: `"${g.name}" goal reached.` });
          }
        }

        const proj = computeProjectedBalance();
        if (proj > state.balance) {
          out.push({
            ico: '↑',
            txt: `Projected balance after next paycheck: <strong>${fmt(proj)}</strong>.`
          });
        }

        if (!out.length) {
          out.push({ ico: '·', txt: 'Add transactions to see insights.' });
        }
        return out;
      }

      load();

      return {
        subscribe, getSnapshot: snapshot,
        addTransaction, updateTransaction, deleteTransaction, getTransactions,
        addGoal, updateGoal, deleteGoal, getGoals,
        addPaycheck, getPaychecks,
        updateIncomeSettings, getIncomeSettings, updatePreferences,
        computePaycheckEstimate, computeMonthlyIncome, computeAnnualIncome,
        computeGoalProgress, computeProjectedBalance,
        computeSpendingByCategory, computeTotalSpending, computeTotalIncome,
        computeSavingsRate, computeAverageTransaction, computeLargestCategory,
        generateInsights,
        get balance() { return state.balance; },
        get transactions() { return [...state.transactions]; },
        get goals() { return [...state.goals]; },
        get paychecks() { return [...state.paychecks]; },
        get incomeSettings() { return { ...state.incomeSettings }; },
        get preferences() { return { ...state.preferences }; }
      };

    /* ═══════════════════════════════════════════════════════════
       UI LAYER

    let currentTab = 'home';

    let authenticated = false;

    /* ── HELPERS ── */
    function fmt(n) {
      if (n === undefined || n === null) return '$0.00';
      const abs = Math.abs(n);
      const str = abs.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return '$' + str;
    }

    function fmtSigned(n) {
      return (n >= 0 ? '+' : '−') + fmt(n);
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diff = Math.round((today - target) / 864e5);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Yesterday';
      if (diff < 7) return diff + 'd ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 5) return 'just now';
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      return Math.floor(s / 3600) + 'h ago';
    }

    /* ── HAPTICS ── */
    function haptic(style) {
      const prefs = Store.preferences;
      if (!prefs.hapticsEnabled) return;
      if (navigator.vibrate) {
        const patterns = {
          light: 8,
          medium: 14,
          heavy: 22,
          success: [10, 40, 10],
          error: [20, 30, 20, 30, 20]
        };
        navigator.vibrate(patterns[style] || 10);
      }
    }

    /* ── TOAST ── */
    function toast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2400);
      haptic('light');
    }

    /* ── SHEET ── */
    function openSheet(html) {
      document.getElementById('sheet-content').innerHTML = html;
      document.getElementById('sheet-overlay').classList.add('on');
      haptic('light');
    }

    function closeSheet(e) {
      if (e && e.target !== document.getElementById('sheet-overlay')) return;
      document.getElementById('sheet-overlay').classList.remove('on');
    }

    /* ── FACE ID AUTH ── */
    function showFaceID() {
      document.getElementById('faceid-overlay').classList.add('on');
      authenticated = false;
    }

    function authenticate() {
      const ring = document.getElementById('faceid-ring');
      const sub = document.getElementById('faceid-sub');
      const btn = document.getElementById('faceid-btn');

      ring.textContent = '👁';
      ring.classList.add('scanning');
      sub.textContent = 'Scanning...';
      btn.disabled = true;

      haptic('medium');

      setTimeout(() => {
        ring.classList.remove('scanning');
        ring.classList.add('success');
        ring.textContent = '✓';
        sub.textContent = 'Authenticated';
        haptic('success');

        setTimeout(() => {
          document.getElementById('faceid-overlay').classList.remove('on');
          authenticated = true;
          ring.classList.remove('success');
          ring.textContent = '🔒';
          sub.textContent = 'Authenticate to view your financial data';
          btn.disabled = false;
          render();
        }, 500);
      }, 1400);
    }

      const labels = { paycheck: 'PAYCHECK', goal: 'GOAL', spending: 'TODAY', balance: 'BALANCE' };
      const colors = { paycheck: 'var(--green)', goal: 'var(--green)', spending: 'var(--gray-200)', balance: 'var(--white)' };
      wrap.innerHTML = `

    /* ── RENDER: ANALYTICS ── */
    function renderAnalytics() {
      const snap = Store.getSnapshot();

      const sp = Store.computeTotalSpending(30);
      const rate = Store.computeSavingsRate();
      const avg = Store.computeAverageTransaction();
      const lc = Store.computeLargestCategory();

      const last7 = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const ds = d.toDateString();
        const val = snap.transactions
          .filter(t => t.type === 'expense' && new Date(t.date).toDateString() === ds)
          .reduce((s, t) => s + t.amount, 0);
        last7.push({ label: d.toLocaleDateString('en-US', { weekday: 'narrow' }), value: val });

      const maxV = Math.max(...last7.map(d => d.value), 1);

              ${last7.map(d => `
                <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;">
                  <div style="width:100%;height:${Math.max(4, (d.value / maxV) * 84)}px;background:${d.value > 0 ? 'var(--green)' : 'var(--gray-800)'};border-radius:6px 6px 0 0;transition:height 0.5s var(--ease-out);"></div>
                  <span style="font-size:10px;color:var(--gray-500);font-weight:700;">${d.label}</span>
                </div>
              `).join('')}
            </div>
          </div>

            <h3>Top Category</h3>
            ${lc.amount > 0 ? `

            <div class="chart-card">

                const p = Store.computeGoalProgress(g);

            <button class="chip" onclick="pickChip(this)" data-cat="bills"><span class="emoji">📄</span>Bills</button>
            <button class="chip" onclick="pickChip(this)" data-cat="other"><span class="emoji">◈</span>Other</button>
          </div>
        </div>
        <button class="btn btn-primary" onclick="submitExpense()">Add Expense</button>
        <button class="btn btn-secondary" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>
      `);
    }

    function submitExpense() {
      const amt = parseFloat(document.getElementById('ex-amount').value);
      const desc = document.getElementById('ex-desc').value;
      const cat = document.querySelector('#ex-cats .chip.selected')?.dataset.cat || 'other';
      if (!amt || amt <= 0) { toast('Enter a valid amount'); return; }
      const t = Store.addTransaction({ type: 'expense', amount: amt, description: desc || 'Expense', category: cat });
      closeSheet();
      haptic('success');
      toast('Expense added');
      render();
      flashDI('spending', -t.amount, 'Spent');
    }

    /* ── SHEET: ADD GOAL ── */
    function openAddGoal() {
      openSheet(`
        <div class="sheet-title">Create Goal</div>
        <div class="field">
          <label class="field-label">Goal Name</label>
          <input class="field-input" id="g-name" placeholder="iPhone, Vacation…" autofocus>
        </div>
        <div class="field">
          <label class="field-label">Target Amount</label>
          <input class="field-input" id="g-target" type="number" inputmode="decimal" placeholder="$0.00">
        </div>
        <div class="field">
          <label class="field-label">Current Amount</label>
          <input class="field-input" id="g-current" type="number" inputmode="decimal" placeholder="$0.00" value="0">
        </div>
        <div class="field">
          <label class="field-label">Weekly Savings (optional)</label>
          <input class="field-input" id="g-weekly" type="number" inputmode="decimal" placeholder="$0.00">
        </div>
        <div class="field">
          <label class="field-label">Icon</label>
          <div class="chips" id="g-emoji">
            <button class="chip selected" onclick="pickChip(this)" data-emoji="◈">◈</button>
            <button class="chip" onclick="pickChip(this)" data-emoji="▣">▣</button>
            <button class="chip" onclick="pickChip(this)" data-emoji="◆">◆</button>
            <button class="chip" onclick="pickChip(this)" data-emoji="●">●</button>
            <button class="chip" onclick="pickChip(this)" data-emoji="▲">▲</button>
          </div>
        </div>
        <button class="btn btn-primary" onclick="submitGoal()">Create Goal</button>
        <button class="btn btn-secondary" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>
      `);
    }

    function submitGoal() {
      const name = document.getElementById('g-name').value.trim();
      const target = parseFloat(document.getElementById('g-target').value);
      const current = parseFloat(document.getElementById('g-current').value) || 0;
      const weekly = parseFloat(document.getElementById('g-weekly').value) || 0;
      const emoji = document.querySelector('#g-emoji .chip.selected')?.dataset.emoji || '◈';
      if (!name) { toast('Enter a goal name'); return; }
      if (!target || target <= 0) { toast('Enter a valid target'); return; }
      Store.addGoal({ name, target, current, weeklySavings: weekly, emoji });
      closeSheet();
      haptic('success');
      toast('Goal created');
      render();
    }

    /* ── SHEET: TX DETAIL ── */
    function openTxDetail(id) {
      const t = Store.getSnapshot().transactions.find(x => x.id === id);
      if (!t) return;
      const isInc = t.type === 'income';
      openSheet(`
        <div style="text-align:center;margin-bottom:28px;">
          <div style="font-size:44px;font-weight:700;letter-spacing:-0.04em;color:${isInc ? 'var(--green)' : 'var(--white)'};font-variant-numeric:tabular-nums;">
            ${isInc ? '+' : '−'}${fmt(t.amount)}
          </div>
          <div style="font-size:14px;color:var(--gray-500);margin-top:6px;font-weight:500;">
            ${t.description || (isInc ? 'Income' : 'Expense')}
          </div>
          <div style="font-size:12px;color:var(--gray-600);margin-top:4px;">
            ${t.category} · ${fmtDate(t.date)}
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" onclick="closeSheet();openEditTx(${t.id})">Edit</button>
          <button class="btn btn-danger" onclick="confirmDeleteTx(${t.id})">Delete</button>
        </div>
        <button class="btn btn-secondary" style="margin-top:8px;" onclick="closeSheet()">Close</button>
      `);
    }

    function openEditTx(id) {
      const t = Store.getSnapshot().transactions.find(x => x.id === id);
      if (!t) return;
      openSheet(`
        <div class="sheet-title">Edit</div>
        <div class="field">
          <label class="field-label">Amount</label>
          <input class="field-input" id="e-amount" type="number" inputmode="decimal" value="${t.amount}">
        </div>
        <div class="field">
          <label class="field-label">Description</label>
          <input class="field-input" id="e-desc" value="${t.description}">
        </div>
        <div class="field">
          <label class="field-label">Type</label>
          <div class="segmented" id="e-type">
            <button class="seg ${t.type === 'expense' ? 'active' : ''}" onclick="pickSeg(this)" data-t="expense">Expense</button>
            <button class="seg ${t.type === 'income' ? 'active' : ''}" onclick="pickSeg(this)" data-t="income">Income</button>
          </div>
        </div>
        <button class="btn btn-primary" onclick="submitEditTx(${t.id})">Save</button>
        <button class="btn btn-secondary" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>
      `);
    }

    function submitEditTx(id) {
      const amt = parseFloat(document.getElementById('e-amount').value);
      const desc = document.getElementById('e-desc').value;
      const type = document.querySelector('#e-type .seg.active')?.dataset.t || 'expense';
      if (!amt || amt <= 0) { toast('Enter a valid amount'); return; }
      Store.updateTransaction(id, { amount: amt, description: desc, type });
      closeSheet();
      haptic('success');
      toast('Updated');
      render();
    }

    function confirmDeleteTx(id) {
      if (confirm('Delete this transaction?')) {
        Store.deleteTransaction(id);
        closeSheet();
        haptic('heavy');
        toast('Deleted');
        render();
      }
    }

    /* ── SHEET: GOAL DETAIL ── */
    function openGoalDetail(id) {
      const g = Store.getGoals().find(x => x.id === id);
      if (!g) return;
      const p = Store.computeGoalProgress(g);
      openSheet(`
        <div style="text-align:center;margin-bottom:28px;">
          <div style="font-size:52px;margin-bottom:10px;filter:grayscale(1);opacity:0.8;">${g.emoji}</div>
          <div style="font-size:22px;font-weight:700;letter-spacing:-0.02em;">${g.name}</div>
          <div style="font-size:14px;color:var(--gray-500);margin-top:4px;">${p.pct}% complete</div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:22px;font-weight:700;margin-bottom:14px;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;">
          <span>${fmt(g.current)}</span>
          <span style="color:var(--gray-500);">${fmt(g.target)}</span>
        </div>
        <div class="goal-bar" style="height:10px;margin-bottom:20px;">
          <div class="goal-fill" style="width:${p.pct}%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:14px;color:var(--gray-400);margin-bottom:24px;font-weight:500;">
          <span>${fmt(p.remaining)} remaining</span>
          <span>${p.pct}%</span>
        </div>
        ${p.estimatedDate ? `
          <div class="insight" style="margin-bottom:20px;">
            <span class="ico">◷</span>
            <span class="txt">Estimated completion: <strong>${p.estimatedDate.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}</strong></span>
          </div>
        ` : ''}
        <div class="field">
          <label class="field-label">Add to goal</label>
          <div style="display:flex;gap:8px;">
            <input class="field-input" id="g-add" type="number" inputmode="decimal" placeholder="$0.00" style="flex:1;">
            <button class="btn btn-green" style="width:auto;padding:14px 22px;" onclick="addToGoal(${g.id})">Add</button>
          </div>
        </div>
        <button class="btn btn-danger" onclick="confirmDeleteGoal(${g.id})">Delete Goal</button>
        <button class="btn btn-secondary" style="margin-top:8px;" onclick="closeSheet()">Close</button>
      `);
    }

    function addToGoal(id) {
      const amt = parseFloat(document.getElementById('g-add').value);
      if (!amt || amt <= 0) { toast('Enter a valid amount'); return; }
      const g = Store.getGoals().find(x => x.id === id);
      if (!g) return;
      Store.updateGoal(id, { current: g.current + amt });
      closeSheet();
      haptic('success');
      toast('Added to goal');
      render();
      const p = Store.computeGoalProgress({ ...g, current: g.current + amt });
      flashDI('goal', p.pct, 'Goal');
    }

    function confirmDeleteGoal(id) {
      if (confirm('Delete this goal?')) {
        Store.deleteGoal(id);
        closeSheet();
        haptic('heavy');
        toast('Goal deleted');
        render();
      }
    }

    /* ── SHEET: TRANSFER ── */
    function openTransfer() {
      const goals = Store.getGoals();
      if (!goals.length) { toast('Create a goal first'); return; }
      openSheet(`
        <div class="sheet-title">Transfer to Goal</div>
        <div class="field">
          <label class="field-label">Select Goal</label>
          <div class="chips" id="t-goal">
            ${goals.map((g, i) => `
              <button class="chip ${i === 0 ? 'selected' : ''}" onclick="pickChip(this)" data-goal="${g.id}">${g.emoji} ${g.name}</button>
            `).join('')}
          </div>
        </div>
        <div class="field">
          <label class="field-label">Amount</label>
          <input class="field-input" id="t-amount" type="number" inputmode="decimal" placeholder="$0.00">
        </div>
        <button class="btn btn-primary" onclick="submitTransfer()">Transfer</button>
        <button class="btn btn-secondary" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>
      `);
    }

    function submitTransfer() {
      const goalId = parseInt(document.querySelector('#t-goal .chip.selected')?.dataset.goal);
      const amt = parseFloat(document.getElementById('t-amount').value);
      if (!goalId || !amt || amt <= 0) { toast('Select a goal and enter an amount'); return; }
      const g = Store.getGoals().find(x => x.id === goalId);
      if (!g) return;
      Store.updateGoal(goalId, { current: g.current + amt });
      closeSheet();
      haptic('success');
      toast('Transferred');
      render();
      const p = Store.computeGoalProgress({ ...g, current: g.current + amt });
      flashDI('goal', p.pct, 'Goal');
    }

    /* ── SHEET: SETTINGS ── */
    function openSettings() {
      const snap = Store.getSnapshot();
      const inc = snap.incomeSettings;
      const est = Store.computePaycheckEstimate();
      const prefs = snap.preferences;

      openSheet(`
        <div class="sheet-title">Settings</div>

        <div class="t-label" style="margin-bottom:10px;padding-left:4px;">Income</div>
        <div class="field">
          <label class="field-label">Hourly Rate</label>
          <input class="field-input" id="s-hourly" type="number" inputmode="decimal" value="${inc.hourlyRate}" placeholder="$0.00">
        </div>
        <div class="field">
          <label class="field-label">Hours per Week</label>
          <input class="field-input" id="s-hours" type="number" inputmode="decimal" value="${inc.hoursPerWeek}" placeholder="0">
        </div>
        <div class="field">
          <label class="field-label">Withholding %</label>
          <input class="field-input" id="s-withhold" type="number" inputmode="decimal" value="${inc.withholdingPct}" placeholder="20">
        </div>
        <div class="insight" style="margin-bottom:24px;">
          <span class="ico">↑</span>
          <span class="txt">Estimated take-home: <strong>${fmt(est.takeHome)}</strong><br>
            <span style="font-size:11.5px;color:var(--gray-500);">${fmt(est.hourlyRate)}/hr × ${est.hoursPerWeek} hrs − ${est.withholdingPct}% withholding</span>
          </span>
        </div>

        <div class="t-label" style="margin-bottom:10px;padding-left:4px;">Preferences</div>
        <div class="set-row" onclick="togglePref('faceIdEnabled')">
          <div class="set-left"><span class="ico">🔒</span> Face ID Lock</div>
          <div class="toggle ${prefs.faceIdEnabled ? 'on' : ''}" onclick="event.stopPropagation();togglePref('faceIdEnabled')"></div>
        </div>
        <div class="set-row" onclick="togglePref('hapticsEnabled')">
          <div class="set-left"><span class="ico">◉</span> Haptic Feedback</div>
          <div class="toggle ${prefs.hapticsEnabled ? 'on' : ''}" onclick="event.stopPropagation();togglePref('hapticsEnabled')"></div>
        </div>
        <div class="set-row" onclick="togglePref('notificationsEnabled')">
          <div class="set-left"><span class="ico">◔</span> Notifications</div>
          <div class="toggle ${prefs.notificationsEnabled ? 'on' : ''}" onclick="event.stopPropagation();togglePref('notificationsEnabled')"></div>
        </div>
        <div class="set-row" onclick="togglePrivacy();closeSheet();">
          <div class="set-left"><span class="ico">👁</span> Privacy Mode</div>
          <div class="set-right">${privacyMode ? 'On' : 'Off'}</div>
        </div>

        <div class="t-label" style="margin:24px 0 10px;padding-left:4px;">Data</div>
        <div class="set-row" onclick="exportData()">
          <div class="set-left"><span class="ico">↑</span> Export Data</div>
          <div class="set-right">JSON ›</div>
        </div>
        <div class="set-row" onclick="if(confirm('Reset all data? This cannot be undone.')){localStorage.removeItem('logostics_finance_minimal_v1');location.reload();}">
          <div class="set-left"><span class="ico">×</span> Reset All Data</div>
          <div class="set-right">Delete ›</div>
        </div>

        <div class="t-label" style="margin:24px 0 10px;padding-left:4px;">About</div>
        <div class="set-row">
          <div class="set-left"><span class="ico">◈</span> Logostics Finance</div>
          <div class="set-right">v1.0</div>
        </div>

        <button class="btn btn-primary" style="margin-top:20px;" onclick="saveSettings()">Save Settings</button>
        <button class="btn btn-secondary" style="margin-top:8px;" onclick="closeSheet()">Close</button>
      `);
    }

    function saveSettings() {
      const h = parseFloat(document.getElementById('s-hourly').value) || 0;
      const hs = parseFloat(document.getElementById('s-hours').value) || 0;
      const w = parseFloat(document.getElementById('s-withhold').value) || 20;
      Store.updateIncomeSettings({ hourlyRate: h, hoursPerWeek: hs, withholdingPct: w });
      closeSheet();
      haptic('success');
      toast('Settings saved');
      render();
    }

    function togglePref(key) {
      const cur = Store.preferences[key];
      Store.updatePreferences({ [key]: !cur });
      haptic('light');
      openSettings();
      setTimeout(() => {
        const overlays = document.querySelectorAll('.sheet-overlay.on');
        if (overlays.length === 0) openSettings();
      }, 10);
      // Just re-render sheet content
      const sheetContent = document.getElementById('sheet-content');
      if (sheetContent && document.getElementById('sheet-overlay').classList.contains('on')) {
        // Re-open settings to reflect new state
        setTimeout(() => openSettings(), 0);
      }
    }

    /* ── SHEET: SIRI ── */
    function openSiri() {
      openSheet(`
        <div style="text-align:center;padding:20px 0 8px;">
          <div class="siri-wave" style="justify-content:center;height:28px;gap:5px;margin-bottom:20px;">
            <span style="width:4px;"></span>
            <span style="width:4px;"></span>
            <span style="width:4px;"></span>
            <span style="width:4px;"></span>
            <span style="width:4px;"></span>
          </div>
          <div class="t-title" style="margin-bottom:8px;">Ask Logostics</div>
          <div class="t-caption" style="max-width:260px;margin:0 auto 24px;">Siri and App Intents integration is architected and ready.</div>
        </div>

        <div class="t-label" style="margin-bottom:10px;padding-left:4px;">Try saying</div>
        <div class="insight"><span class="ico">◉</span><span class="txt">"How much cash do I have?"</span></div>
        <div class="insight"><span class="ico">◉</span><span class="txt">"Show my iPhone goal progress"</span></div>
        <div class="insight"><span class="ico">◉</span><span class="txt">"Add a $12 expense for coffee"</span></div>
        <div class="insight" style="margin-bottom:20px;"><span class="ico">◉</span><span class="txt">"What's my projected balance?"</span></div>

        <div class="insight" style="border-color:var(--green);background:var(--green-glow);">
          <span class="ico">✓</span>
          <span class="txt">Native App Intents and Siri Shortcuts will plug directly into the FinancialStore without changing the engine.</span>
        </div>

        <button class="btn btn-primary" style="margin-top:20px;" onclick="closeSheet()">Got it</button>
      `);
    }

    /* ── SHEET HELPERS ── */
    function pickChip(el) {
      el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      haptic('light');
    }

    function pickSeg(el) {
      el.parentElement.querySelectorAll('.seg').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      haptic('light');
    }

    /* ── EXPORT ── */
    function exportData() {
      const snap = Store.getSnapshot();
      const blob = new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `logostics-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Exported');
    }

    /* ═══════════════════════════════════════════════════════════
       INIT
       ═══════════════════════════════════════════════════════════ */
    function init() {
      // Subscribe to store changes for live re-render
      Store.subscribe(() => {
        if (authenticated) render();
      });

      // Face ID gate if enabled
      if (Store.preferences.faceIdEnabled) {
        showFaceID();
      } else {
        authenticated = true;
        render();
      }

      // Expose handlers
      window.switchTab = switchTab;
      window.openAddIncome = openAddIncome;
      window.openAddExpense = openAddExpense;
      window.openAddGoal = openAddGoal;
      window.openGoalDetail = openGoalDetail;
      window.openTxDetail = openTxDetail;
      window.openTransfer = openTransfer;
      window.openSettings = openSettings;
      window.openSiri = openSiri;
      window.submitIncome = submitIncome;
      window.submitExpense = submitExpense;
      window.submitGoal = submitGoal;
      window.submitTransfer = submitTransfer;
      window.submitEditTx = submitEditTx;
      window.openEditTx = openEditTx;
      window.confirmDeleteTx = confirmDeleteTx;
      window.confirmDeleteGoal = confirmDeleteGoal;
      window.addToGoal = addToGoal;
      window.pickChip = pickChip;
      window.pickSeg = pickSeg;
      window.closeSheet = closeSheet;
      window.saveSettings = saveSettings;
      window.togglePref = togglePref;
      window.exportData = exportData;
      window.togglePrivacy = togglePrivacy;
      window.authenticate = authenticate;
      window.skipAuth = skipAuth;
      window.onActivitySearch = onActivitySearch;
      window.setActivityCat = setActivityCat;
    }

    if (document.readyState !== 'loading') init();
    else document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
