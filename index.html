<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Logostics">
  <meta name="theme-color" content="#000000">
  <title>Logostics Finance</title>
  <style>
    /* ═══════════════════════════════════════════════════════════
       LOGOSTICS FINANCE — PATCHED
       Palette: black, white, gray, green ONLY
       ═══════════════════════════════════════════════════════════ */

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-font-smoothing: antialiased;
    }

    :root {
      --black: #000000;
      --white: #ffffff;
      --gray-950: #0a0a0a;
      --gray-900: #121212;
      --gray-850: #1a1a1a;
      --gray-800: #222222;
      --gray-700: #2e2e2e;
      --gray-600: #3a3a3a;
      --gray-500: #555555;
      --gray-400: #777777;
      --gray-300: #999999;
      --gray-200: #bbbbbb;
      --gray-100: #dddddd;
      --green: #30d158;
      --green-glow: rgba(48, 209, 88, 0.15);
      --red: #ff453a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --nav-h: 76px;
    }

    html {
      background: var(--black);
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      height: 100%;
    }

    body {
      font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
      user-select: none;
      letter-spacing: -0.01em;
      position: relative;
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 8px);
      -webkit-user-select: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
      touch-action: manipulation;
    }

    /* ── APP LOCK SCREEN (real redaction, not navigation) ── */
    .app-lock {
      position: fixed; inset: 0;
      background: var(--black);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      animation: fade-in 0.2s ease;
    }
    .app-lock.on { display: flex; }
    .app-lock-icon {
      width: 88px; height: 88px; border-radius: 28px;
      border: 2px solid var(--gray-700);
      display: flex; align-items: center; justify-content: center;
      font-size: 42px; filter: grayscale(1);
    }
    .app-lock-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; text-align: center; }
    .app-lock-sub { font-size: 14px; color: var(--gray-500); text-align: center; max-width: 300px; line-height: 1.5; }
    .app-lock-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }

    /* ── REDACTED CONTENT (financial numbers hidden when locked) ── */
    .redacted {
      background: var(--gray-800);
      color: transparent !important;
      user-select: none;
      pointer-events: none;
      border-radius: 4px;
      filter: blur(6px);
    }

    /* ── REDUCED MOTION ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    ::-webkit-scrollbar { width: 0; height: 0; }

    .t-large { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
    .t-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .t-caption { font-size: 12px; font-weight: 500; color: var(--gray-400); letter-spacing: 0.01em; }
    .t-label { font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.08em; }

    .glass-deep {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .glass {
      background: rgba(18, 18, 18, 0.72);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .container { max-width: 430px; margin: 0 auto; padding: 0 20px; width: 100%; }
    .section { margin-bottom: 28px; }
    .section-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 2px; }

    .top-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 8px; }
    .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; color: var(--white); }
    .brand-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); margin-left: 6px; vertical-align: middle;
      box-shadow: 0 0 8px var(--green-glow);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.85); } }

    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; cursor: pointer;
      background: var(--gray-850); border: 1px solid var(--gray-700);
      color: var(--gray-300); transition: all 0.2s var(--ease);
      font-family: inherit;
    }
    .icon-btn:active { transform: scale(0.9); background: var(--gray-800); }

    .hero { text-align: center; padding: 32px 0 24px; }
    .hero-label { font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 14px; }
    .hero-amount {
      font-size: 64px; font-weight: 700; letter-spacing: -0.045em; line-height: 1;
      font-variant-numeric: tabular-nums; color: var(--white); transition: color 0.3s;
      word-break: break-all;
    }
    .hero-status { font-size: 12px; color: var(--gray-500); margin-top: 10px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: pulse-dot 2s ease-in-out infinite; }

    .cash-card { border-radius: 28px; padding: 24px; margin-bottom: 20px; position: relative; overflow: hidden; }
    .cash-card::before {
      content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    }
    .cash-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .cash-main { font-size: 38px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; font-variant-numeric: tabular-nums; }
    .cash-main-label { font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }
    .cash-badge {
      padding: 6px 12px; border-radius: 20px;
      background: var(--green-glow); border: 1px solid rgba(48, 209, 88, 0.25);
      color: var(--green); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .cash-rows { border-top: 1px solid var(--gray-800); padding-top: 16px; }
    .cash-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 14px; }
    .cash-row .lbl { color: var(--gray-400); display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .cash-row .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
    .cash-row .amt.pos { color: var(--green); }
    .cash-row .amt.neg { color: var(--gray-200); }
    .cash-proj { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--gray-800); display: flex; justify-content: space-between; align-items: baseline; }
    .cash-proj .lbl { font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.08em; }
    .cash-proj .amt { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; color: var(--green); font-variant-numeric: tabular-nums; }

    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 28px; }
    .quick-btn {
      border-radius: 18px; padding: 16px 8px 12px; text-align: center; cursor: pointer;
      transition: all 0.2s var(--ease); display: flex; flex-direction: column; align-items: center; gap: 8px;
      background: var(--gray-900); border: 1px solid var(--gray-800); font-family: inherit;
    }
    .quick-btn:active { transform: scale(0.92); background: var(--gray-850); }
    .quick-btn .ico { font-size: 22px; line-height: 1; filter: grayscale(1); }
    .quick-btn.primary .ico { filter: none; }
    .quick-btn .lbl { font-size: 10px; font-weight: 600; color: var(--gray-400); letter-spacing: 0.02em; }

    .insight {
      border-radius: 18px; padding: 16px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start;
      background: var(--gray-900); border: 1px solid var(--gray-800);
    }
    .insight .ico { font-size: 18px; flex-shrink: 0; margin-top: 1px; filter: grayscale(1); }
    .insight .txt { font-size: 13.5px; line-height: 1.45; color: var(--gray-300); font-weight: 400; }
    .insight .txt strong { color: var(--white); font-weight: 600; }

    .activity-item {
      display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px;
      margin-bottom: 6px; background: var(--gray-900); border: 1px solid var(--gray-800);
      transition: all 0.2s var(--ease); cursor: pointer;
      position: relative;
      touch-action: pan-y;
    }
    .activity-item:active { transform: scale(0.98); background: var(--gray-850); }
    .activity-ico {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
      background: var(--gray-850); border: 1px solid var(--gray-700); filter: grayscale(1);
    }
    .activity-ico.income { filter: none; border-color: rgba(48, 209, 88, 0.3); background: var(--green-glow); }
    .activity-body { flex: 1; min-width: 0; }
    .activity-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
    .activity-meta { font-size: 11.5px; color: var(--gray-500); margin-top: 2px; display: flex; gap: 8px; font-weight: 500; }
    .activity-amt { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; letter-spacing: -0.01em; }
    .activity-amt.pos { color: var(--green); }
    .activity-amt.neg { color: var(--gray-200); }

    .goal-card {
      border-radius: 24px; padding: 22px; margin-bottom: 12px;
      background: var(--gray-900); border: 1px solid var(--gray-800);
      transition: all 0.2s var(--ease); cursor: pointer;
    }
    .goal-card:active { transform: scale(0.985); }
    .goal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .goal-name { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .goal-pct { font-size: 12px; color: var(--gray-500); font-weight: 600; margin-top: 3px; }
    .goal-emoji { font-size: 26px; filter: grayscale(1); opacity: 0.7; }
    .goal-card.active .goal-emoji { filter: none; opacity: 1; }
    .goal-bar { width: 100%; height: 6px; background: var(--gray-800); border-radius: 3px; overflow: hidden; margin: 14px 0 10px; }
    .goal-fill {
      height: 100%; border-radius: 3px; background: var(--green);
      transition: width 0.7s var(--ease-out); position: relative; overflow: hidden;
    }
    .goal-stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--gray-400); font-weight: 500; font-variant-numeric: tabular-nums; }
    .goal-stats .hl { color: var(--white); font-weight: 600; }
    .goal-eta { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-800); font-size: 12px; color: var(--gray-500); display: flex; align-items: center; gap: 6px; font-weight: 500; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: space-around; align-items: center;
      padding: 8px 0 calc(8px + var(--safe-bottom));
      z-index: 100; border-top: 1px solid var(--gray-800);
      transform: translateZ(0);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 14px; border-radius: 14px; cursor: pointer;
      transition: all 0.25s var(--ease); background: none; border: none;
      color: var(--gray-500); font-family: inherit; min-width: 60px;
      touch-action: manipulation;
    }
    .nav-item.active { color: var(--white); }
    .nav-item.active .nav-ico { filter: none; transform: scale(1.05); }
    .nav-item:active { transform: scale(0.88); }
    .nav-ico { font-size: 21px; line-height: 1; filter: grayscale(1); transition: all 0.25s var(--ease); }
    .nav-lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.01em; }

    /* ── SWIPE BACK INDICATOR ── */
    .swipe-back-indicator {
      position: fixed;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 60px;
      background: var(--green);
      border-radius: 0 4px 4px 0;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 200;
    }
    .swipe-back-indicator.on { opacity: 0.6; }

    /* ── SHEET ── */
    .sheet-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      z-index: 1000; display: none; align-items: flex-end; justify-content: center;
      animation: fade-in 0.25s ease;
    }
    .sheet-overlay.on { display: flex; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .sheet {
      width: 100%; max-width: 430px; max-height: 92vh; overflow-y: auto;
      border-radius: 32px 32px 0 0;
      padding: 12px 20px calc(24px + var(--safe-bottom));
      animation: slide-up 0.4s var(--ease-out);
      background: var(--gray-950);
      border-top: 1px solid var(--gray-800);
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      position: relative;
    }
    @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .sheet-grip { width: 36px; height: 4px; background: var(--gray-600); border-radius: 2px; margin: 0 auto 20px; }
    .sheet-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 24px; text-align: center; }

    .field { margin-bottom: 18px; }
    .field-label {
      font-size: 11px; font-weight: 600; color: var(--gray-500);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; display: block;
    }
    .field-input {
      width: 100%; background: var(--gray-900); border: 1px solid var(--gray-800);
      border-radius: 14px; padding: 16px; font-size: 17px; color: var(--white);
      font-family: inherit; transition: all 0.2s var(--ease);
      -webkit-appearance: none; appearance: none; letter-spacing: -0.01em;
    }
    .field-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-glow); }
    .field-input::placeholder { color: var(--gray-600); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 10px 16px; border-radius: 20px;
      background: var(--gray-900); border: 1px solid var(--gray-800);
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.2s var(--ease); display: flex; align-items: center; gap: 6px;
      color: var(--gray-300); font-family: inherit;
    }
    .chip:active { transform: scale(0.92); }
    .chip.selected { background: var(--green); border-color: var(--green); color: var(--black); }
    .chip .emoji { filter: grayscale(1); }
    .chip.selected .emoji { filter: none; }

    .btn {
      padding: 16px 24px; border-radius: 14px; font-size: 17px; font-weight: 600;
      border: none; cursor: pointer; transition: all 0.2s var(--ease);
      font-family: inherit; width: 100%; display: flex; align-items: center; justify-content: center;
      gap: 8px; letter-spacing: -0.01em;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--white); color: var(--black); }
    .btn-primary:active { background: var(--gray-100); }
    .btn-green { background: var(--green); color: var(--black); }
    .btn-secondary { background: var(--gray-900); border: 1px solid var(--gray-800); color: var(--white); }
    .btn-danger { background: transparent; border: 1px solid var(--gray-700); color: var(--gray-300); }
    .btn-row { display: flex; gap: 10px; margin-top: 8px; }
    .btn-row .btn { flex: 1; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty { text-align: center; padding: 56px 24px; }
    .empty-ico { font-size: 44px; margin-bottom: 18px; opacity: 0.3; filter: grayscale(1); }
    .empty-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.02em; }
    .empty-sub { font-size: 14px; color: var(--gray-500); line-height: 1.5; max-width: 260px; margin: 0 auto; }

    .toast {
      position: fixed; top: calc(20px + var(--safe-top)); left: 50%;
      transform: translateX(-50%) translateY(-140%);
      padding: 12px 20px; border-radius: 14px;
      font-size: 14px; font-weight: 600; z-index: 2000;
      transition: transform 0.45s var(--ease-out);
      display: flex; align-items: center; gap: 10px;
      max-width: 90vw; background: var(--gray-900);
      border: 1px solid var(--gray-700); color: var(--white);
      letter-spacing: -0.01em; box-shadow: 0 12px 40px rgba(0,0,0,0.7);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

    .privacy-btn {
      position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); right: 20px;
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; cursor: pointer; z-index: 90;
      transition: all 0.25s var(--ease);
      background: var(--gray-900); border: 1px solid var(--gray-700);
      color: var(--gray-300); font-family: inherit;
    }
    .privacy-btn.active { background: var(--green); color: var(--black); border-color: var(--green); }

    .ai-fab {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
      right: 74px;
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; cursor: pointer; z-index: 90;
      transition: all 0.25s var(--ease);
      background: linear-gradient(135deg, var(--gray-850), var(--gray-900));
      border: 1px solid var(--gray-700);
      color: var(--white); font-family: inherit;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .ai-fab:active { transform: scale(0.9); }

    .privacy-blur { filter: blur(14px); transition: filter 0.35s var(--ease); pointer-events: none; user-select: none; }

    .fade-in { animation: fade-up 0.35s var(--ease-out); }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stagger > * { animation: fade-up 0.4s var(--ease-out) backwards; }
    .stagger > *:nth-child(1) { animation-delay: 0.02s; }
    .stagger > *:nth-child(2) { animation-delay: 0.06s; }
    .stagger > *:nth-child(3) { animation-delay: 0.10s; }
    .stagger > *:nth-child(4) { animation-delay: 0.14s; }

    .scroll-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    .scroll-row::-webkit-scrollbar { display: none; }
    .scroll-row > * { flex-shrink: 0; }

    .segmented { display: flex; background: var(--gray-900); border: 1px solid var(--gray-800); border-radius: 12px; padding: 3px; }
    .seg {
      flex: 1; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 600;
      text-align: center; cursor: pointer; transition: all 0.2s var(--ease);
      background: none; border: none; color: var(--gray-500); font-family: inherit;
    }
    .seg.active { background: var(--white); color: var(--black); }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat { border-radius: 18px; padding: 18px 16px; background: var(--gray-900); border: 1px solid var(--gray-800); text-align: center; }
    .stat-val { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .stat-lbl { font-size: 10px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }

    .chart-card { border-radius: 22px; padding: 20px; margin-bottom: 12px; background: var(--gray-900); border: 1px solid var(--gray-800); }
    .chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 18px; }

    .set-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 16px; border-radius: 14px; margin-bottom: 6px;

    /* ── DASHBOARD EDIT MODE ── */

<body>

  <!-- REAL APP LOCK SCREEN (redacts content, doesn't navigate) -->
  <div class="app-lock" id="app-lock">
    <div class="app-lock-icon" id="lock-icon">🔒</div>
    <div class="app-lock-title" id="lock-title">Logostics is Locked</div>
    <div class="app-lock-sub" id="lock-sub">Authenticate to view your financial data</div>
    <div class="app-lock-actions" id="lock-actions"></div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"><span class="dot"></span><span id="toast-text"></span></div>

  <!-- SWIPE BACK INDICATOR -->

  <div id="app"></div>

  <!-- PRIVACY TOGGLE -->
  <button class="privacy-btn" id="privacy-btn" onclick="togglePrivacy()" title="Toggle privacy mode">👁</button>

  <!-- AI FAB -->
  <button class="ai-fab" id="ai-fab" onclick="openAI()" title="Ask Logostics AI">◈</button>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav glass-deep" id="bottom-nav">
    <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
      <span class="nav-ico">🏠</span><span class="nav-lbl">Home</span>
    </button>
    <button class="nav-item" data-tab="activity" onclick="switchTab('activity')">
      <span class="nav-ico">📋</span><span class="nav-lbl">Activity</span>
    </button>
    <button class="nav-item" data-tab="goals" onclick="switchTab('goals')">
      <span class="nav-ico">🎯</span><span class="nav-lbl">Goals</span>
    </button>
    <button class="nav-item" data-tab="analytics" onclick="switchTab('analytics')">
      <span class="nav-ico">📊</span><span class="nav-lbl">Analytics</span>
    </button>
  </nav>

  <!-- SHEET -->
  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet(event)">
    <div class="sheet" id="sheet" onclick="event.stopPropagation()">
      <div class="sheet-grip"></div>
      <div id="sheet-content"></div>
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════
       LOGOSTICS FINANCE — CRITICAL PATCH
       Addresses: real auto-lock, real gestures, real patch notes,
       real widgets + customization architecture.

       HONEST NOTES:
       - Web/PWA CANNOT access native iOS scene lifecycle.
       - Web/PWA CANNOT create real Home Screen widgets (those need WidgetKit).
       - Web/PWA CANNOT use LocalAuthentication (Face ID).
       - Web/PWA CAN use WebAuthn for passkeys/Face ID on supported browsers.
       - Web/PWA CAN use visibilitychange + Page Lifecycle API for what iOS Safari exposes.
       - Web/PWA CAN use touch events for gestures (limited but real).
       - WidgetKit / LocalAuthentication / scenePhase require the Swift files below.
       ═══════════════════════════════════════════════════════════ */

    'use strict';

    // ═══════════════════════════════════════════════════════════
    //  1. PLATFORM CAPABILITY ENGINE
    // ═══════════════════════════════════════════════════════════
    const PlatformCapabilities = (function() {
      function detectEnvironment() {
        const ua = navigator.userAgent || '';
        const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                             window.navigator.standalone === true;
        const isNativeWrapper = !!(window.webkit && window.webkit.messageHandlers &&
                                   window.webkit.messageHandlers.logostics);
        let type = 'web';
        if (isNativeWrapper) type = 'native-ios';
        else if (isIOS && isStandalone) type = 'pwa-ios';
        else if (isIOS) type = 'ios-safari';
        else if (isStandalone) type = 'pwa';
        return { type, isIOS, isStandalone, isNativeWrapper };
      }
      const env = detectEnvironment();

      async function checkWebAuthn() {
        if (!window.PublicKeyCredential) {
          return { available: false, reason: 'WebAuthn not supported in this browser' };
        }
        if (!window.isSecureContext) {
          return { available: false, reason: 'WebAuthn requires HTTPS (secure context)' };
        }
        try {
          const avail = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          return {
            available: avail,
            reason: avail ? 'Platform authenticator available'
                          : 'No platform authenticator enrolled on this device'
          };
        } catch (e) {
          return { available: false, reason: 'WebAuthn check failed: ' + e.message };
        }
      }

      function checkNotifications() {
        if (!('Notification' in window)) {
          return { supported: false, permission: 'unsupported', reason: 'Notification API not available' };
        }
        const perm = Notification.permission;
        const iosSafariNeedsPWA = env.isIOS && !env.isStandalone;
        if (iosSafariNeedsPWA && perm === 'default') {
          return {
            supported: false, permission: perm,
            reason: 'On iOS, web notifications require installing Logostics to the Home Screen (iOS 16.4+)',
            requiresInstall: true
          };
        }
        return {
          supported: true, permission: perm,
          reason: perm === 'granted' ? 'Notifications allowed'
                : perm === 'denied' ? 'Notifications blocked in browser settings'
                : 'Not yet decided'
        };
      }

      function checkHaptics() {
        const supported = typeof navigator.vibrate === 'function';
        return {
          supported,
          reason: supported ? 'Vibration API available'
                            : (env.isIOS ? 'iOS Safari does not expose vibration to web apps' : 'Not available')
        };
      }

      function checkShare() {
        return {
          supported: typeof navigator.share === 'function',
          canShareFiles: typeof navigator.canShare === 'function'
        };
      }

      function checkStorage() {
        return {
          indexedDB: !!window.indexedDB,
          localStorage: (() => { try { localStorage.setItem('__t__', '1'); localStorage.removeItem('__t__'); return true; } catch (e) { return false; } })(),
          cacheAPI: 'caches' in window
        };
      }

      // ── Page Lifecycle API (best available on web for app lifecycle) ──
      function checkPageLifecycle() {
        return {
          visibilityAPI: typeof document.visibilityState !== 'undefined',
          pageHide: 'onpagehide' in window,
          freezeResume: 'onfreeze' in document,
          // iOS Safari does NOT fire freeze/resume reliably
          iosLimitation: env.isIOS,
          reason: env.isIOS
            ? 'iOS Safari does not expose native scene lifecycle to web. Using visibilitychange + pagehide as best-effort. Native build uses scenePhase.'
            : 'Page Lifecycle API available for background detection'
        };
      }

      return {
        env,
        checkWebAuthn, checkNotifications, checkHaptics, checkShare,
        checkStorage, checkPageLifecycle
      };
    })();

    // ═══════════════════════════════════════════════════════════
    //  2. NATIVE BRIDGE (for when wrapped in a native iOS app)
    //  Real message-passing to Swift. Honest no-op on web.
    // ═══════════════════════════════════════════════════════════
    const NativeBridge = (function() {
      const available = !!(window.webkit && window.webkit.messageHandlers &&
                           window.webkit.messageHandlers.logostics);

      function postMessage(method, payload) {
        if (!available) return Promise.resolve({ supported: false, reason: 'Not running in native wrapper' });
        return new Promise((resolve) => {
          const id = 'req_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
          window._logosticsCallbacks = window._logosticsCallbacks || {};
          window._logosticsCallbacks[id] = resolve;
          try {
            window.webkit.messageHandlers.logostics.postMessage({
              id, method, payload: payload || {}
            });
          } catch (e) {
            resolve({ supported: false, reason: 'Bridge error: ' + e.message });
          }
          setTimeout(() => {
            if (window._logosticsCallbacks[id]) {
              delete window._logosticsCallbacks[id];
              resolve({ supported: false, reason: 'Native bridge timed out' });
            }
          }, 60000);
        });
      }

      // Called by Swift: window.LogosticsNative.handleResponse(id, result)
      window.LogosticsNative = {
        handleResponse(id, result) {
          if (window._logosticsCallbacks && window._logosticsCallbacks[id]) {
            window._logosticsCallbacks[id](result);
            delete window._logosticsCallbacks[id];
          }
        },
        // Called by Swift when scene phase changes (real native lifecycle)
        onScenePhase(phase) {
          LifecycleManager.onNativeScenePhase(phase);
        },
        // Called by Swift on biometric result
        onBiometricResult(success, reason) {
          AppLockManager.onNativeResult(success, reason);
        }
      };

      return {
        available,
        postMessage,
        // ── High-level native operations (no-op on web, real on native) ──
        authenticate: (reason) => postMessage('authenticate', { reason }),
        getScenePhase: () => postMessage('getScenePhase'),
        scheduleNotification: (title, body, delay) => postMessage('scheduleNotification', { title, body, delay }),
        updateWidgetData: (data) => postMessage('updateWidgetData', data),
        setHaptic: (style) => postMessage('haptic', { style })
      };
    })();

    // ═══════════════════════════════════════════════════════════
    //  3. LIFECYCLE MANAGER — Real auto-lock source of truth
    //  Uses native bridge if available; else visibilitychange + pagehide
    // ═══════════════════════════════════════════════════════════
    const LifecycleManager = (function() {
      let appState = 'active'; // 'active' | 'inactive' | 'background'
      let lastActive = Date.now();
      let lastBackground = null;
      let listeners = [];
      let webVisibilityHandler = null;

      function notify(event, data) {
        listeners.forEach(fn => { try { fn(event, data); } catch (e) {} });
      }

      function setState(newState, source) {
        if (appState === newState) return;
        const prev = appState;
        appState = newState;
        if (newState === 'active') {
          lastActive = Date.now();
        } else if (newState === 'background' || newState === 'inactive') {
          lastBackground = Date.now();
        }
        notify('stateChanged', { from: prev, to: newState, source });
        // Debug log
        if (DebugPanel.isEnabled()) DebugPanel.log(`Lifecycle: ${prev} → ${newState} (${source})`);
      }

      function subscribe(fn) {
        listeners.push(fn);
        return () => { listeners = listeners.filter(f => f !== fn); };
      }

      // Called from native Swift via NativeBridge
      function onNativeScenePhase(phase) {
        // phase: 'active' | 'inactive' | 'background'
        setState(phase, 'native');
      }

      // Web fallback: uses visibilitychange + pagehide + freeze
      function installWebFallback() {
        if (webVisibilityHandler) return;
        webVisibilityHandler = () => {
          if (document.visibilityState === 'hidden') {
            setState('background', 'web-visibility');
          } else {
            setState('active', 'web-visibility');
          }
        };
        document.addEventListener('visibilitychange', webVisibilityHandler);
        window.addEventListener('pagehide', () => setState('background', 'web-pagehide'));
        window.addEventListener('pageshow', () => setState('active', 'web-pageshow'));
        // focus/blur is a secondary signal
        window.addEventListener('blur', () => setState('inactive', 'web-blur'));
        window.addEventListener('focus', () => setState('active', 'web-focus'));
      }

      function init() {
        if (NativeBridge.available) {
          // Native build: scene lifecycle comes from Swift
          DebugPanel.log('Lifecycle: native mode (scenePhase)');
          NativeBridge.getScenePhase().then(r => {
            if (r && r.phase) setState(r.phase, 'native-init');
          });
        } else {
          DebugPanel.log('Lifecycle: web mode (visibilitychange + pagehide)');
          installWebFallback();
        }
      }

      return {
        init, subscribe, onNativeScenePhase,
        getState: () => appState,
        getLastActive: () => lastActive,
        getLastBackground: () => lastBackground,
        isNative: () => NativeBridge.available
      };
    })();

    // ═══════════════════════════════════════════════════════════
    //  4. APP LOCK MANAGER — Real content redaction + auth
    // ═══════════════════════════════════════════════════════════
    const AppLockManager = (function() {
      let locked = false;
      let pendingResolve = null;
      let autoLockTimer = null;

      function isAutoLockEnabled() {
        const prefs = Store.preferences;
        return prefs.appLockEnabled && prefs.autoLock !== 'off';
      }

      function getAutoLockTimeout() {
        return Store.preferences.autoLock || 'immediately';
      }

      // ── Lock the app (real redaction) ──
      function lock(reason) {
        if (locked) return;
        if (!Store.preferences.appLockEnabled) return;
        // Only lock if we actually have a credential
        if (!AuthManager.hasCredential()) return;
        locked = true;
        DebugPanel.log('AppLock: LOCKED (' + (reason || 'manual') + ')');
        showLockScreen(reason);
      }

      // ── Unlock (requires real auth) ──
      async function unlock() {
        const result = await AuthManager.authenticate();
        if (result.success) {
          locked = false;
          hideLockScreen();
          DebugPanel.log('AppLock: UNLOCKED');
          return true;
        }
        return false;
      }

      function isLocked() { return locked; }

      function showLockScreen(reason) {
        const lock = document.getElementById('app-lock');
        const icon = document.getElementById('lock-icon');
        const title = document.getElementById('lock-title');
        const sub = document.getElementById('lock-sub');
        const actions = document.getElementById('lock-actions');

        lock.classList.add('on');
        icon.textContent = '🔒';

        PlatformCapabilities.checkWebAuthn().then(cap => {
          if (cap.available) {
            title.textContent = 'Logostics is Locked';
            sub.textContent = reason === 'background'
              ? 'You left the app. Authenticate to continue.'
              : 'Authenticate to view your financial data';
            actions.innerHTML = `
              <button class="btn btn-primary" id="lock-auth-btn" onclick="AppLockManager.authenticateNow()">Unlock</button>
              <button class="btn btn-secondary" onclick="AppLockManager.continueWithoutLock()">Continue Without Lock</button>
            `;
            // Auto-trigger
            setTimeout(() => AppLockManager.authenticateNow(), 300);
          } else {
            title.textContent = 'App Lock Unavailable';
            sub.textContent = cap.reason;
            actions.innerHTML = `
              <button class="btn btn-primary" onclick="AppLockManager.continueWithoutLock()">Continue</button>
              <button class="btn btn-secondary" onclick="AppLockManager.disableLock()">Disable App Lock</button>
            `;
          }
        });
      }

      function hideLockScreen() {
        document.getElementById('app-lock').classList.remove('on');
      }

      async function authenticateNow() {
        const btn = document.getElementById('lock-auth-btn');
        if (btn) btn.disabled = true;
        const sub = document.getElementById('lock-sub');
        if (sub) sub.textContent = 'Waiting for authentication…';
        haptic('medium');

        // Prefer native biometric if available
        if (NativeBridge.available) {
          const result = await NativeBridge.authenticate('Unlock Logostics');
          if (result && result.success) {
            locked = false;
            hideLockScreen();
            haptic('success');
            return;
          }
          if (sub) sub.textContent = (result && result.reason) || 'Authentication failed';
          if (btn) btn.disabled = false;
          return;
        }

        // Web: WebAuthn
        const result = await AuthManager.authenticate();
        if (result.success) {
          locked = false;
          hideLockScreen();
          haptic('success');
        } else {
          if (sub) sub.textContent = result.reason;
          if (btn) btn.disabled = false;
        }
      }

      function continueWithoutLock() {
        locked = false;
        hideLockScreen();
      }

      async function disableLock() {
        await Store.updatePreferences({ appLockEnabled: false, webAuthnCredential: null });
        AuthManager.setCredential(null);
        locked = false;
        hideLockScreen();
        toast('App lock disabled');
      }

      // ── Called by native bridge on biometric result ──
      function onNativeResult(success, reason) {
        if (success) {
          locked = false;
          hideLockScreen();
        } else {
          const sub = document.getElementById('lock-sub');
          if (sub) sub.textContent = reason || 'Authentication failed';
        }
      }

      // ── Auto-lock on lifecycle transition ──
      function onLifecycleChange(from, to) {
        if (!Store.preferences.appLockEnabled) return;
        const mode = Store.preferences.autoLock || 'immediately';
        if (mode === 'off') return;

        if (to === 'background' || to === 'inactive') {
          // Cancel any pending unlock timer
          if (autoLockTimer) { clearTimeout(autoLockTimer); autoLockTimer = null; }
          const timeout = {
            'immediately': 0,
            'leaving': 0,
            '15s': 15000,
            '30s': 30000,
            '1m': 60000,
            '5m': 300000
          }[mode];
          if (timeout === 0) {
            lock('background');
          } else {
            // Schedule lock — but if we return before it fires, cancel
            autoLockTimer = setTimeout(() => {
              lock('timeout');
              autoLockTimer = null;
            }, timeout);
          }
        } else if (to === 'active') {
          // If we're back before the timer fired, cancel it
          if (autoLockTimer && !locked) {
            clearTimeout(autoLockTimer);
            autoLockTimer = null;
          }
          // If we're locked, the lock screen is already showing
        }
      }

      return {
        init() {
          LifecycleManager.subscribe((event, data) => {
            if (event === 'stateChanged') onLifecycleChange(data.from, data.to);
          });
        },
        lock, unlock, isLocked,
        authenticateNow, continueWithoutLock, disableLock,
        onNativeResult
      };
    })();

    // ═══════════════════════════════════════════════════════════
    //  5. AUTH MANAGER (real WebAuthn)
    // ═══════════════════════════════════════════════════════════
    const AuthManager = (function() {
      let credentialIdB64 = null;

      function bufToB64(buf) {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      function b64ToBuf(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s);
        const buf = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
        return buf.buffer;
      }

      async function authenticate() {
        const cap = await PlatformCapabilities.checkWebAuthn();
        if (!cap.available) return { success: false, supported: false, reason: cap.reason };
        if (!credentialIdB64) {
          return { success: false, supported: true, reason: 'No credential registered. Enable App Lock first.' };
        }
        try {
          const challenge = new Uint8Array(32);
          crypto.getRandomValues(challenge);
          const assertion = await navigator.credentials.get({
            publicKey: {
              challenge, timeout: 60000, userVerification: 'required',
              rpId: window.location.hostname || 'localhost',
              allowCredentials: [{
                id: b64ToBuf(credentialIdB64),
                type: 'public-key',
                transports: ['internal']
              }]
            }
          });
          if (assertion) return { success: true, supported: true, reason: 'Verified' };
          return { success: false, supported: true, reason: 'No credential returned' };
        } catch (e) {
          const reasons = {
            NotAllowedError: 'Cancelled or timed out',
            SecurityError: 'Security error — ensure HTTPS',
            InvalidStateError: 'Credential invalid — re-enable App Lock',
            AbortError: 'Aborted'
          };
          return { success: false, supported: true, reason: reasons[e.name] || ('Error: ' + e.name) };
        }
      }

      async function register() {
        const cap = await PlatformCapabilities.checkWebAuthn();
        if (!cap.available) return { success: false, supported: false, reason: cap.reason };
        try {
          const challenge = new Uint8Array(32);
          crypto.getRandomValues(challenge);
          const userId = new Uint8Array(16);
          crypto.getRandomValues(userId);
          const credential = await navigator.credentials.create({
            publicKey: {
              challenge,
              rp: { name: 'Logostics Finance', id: window.location.hostname || 'localhost' },
              user: { id: userId, name: 'logostics-user', displayName: 'Logostics User' },
              pubKeyCredParams: [
                { type: 'public-key', alg: -7 },
                { type: 'public-key', alg: -257 }
              ],
              authenticatorSelection: {
                authenticatorAttachment: 'platform',
                userVerification: 'required',
                residentKey: 'preferred'
              },
              timeout: 60000, attestation: 'none'
            }
          });
          if (credential && credential.rawId) {
            credentialIdB64 = bufToB64(credential.rawId);
            return { success: true, supported: true, reason: 'Registered' };
          }
          return { success: false, supported: true, reason: 'No credential returned' };
        } catch (e) {
          const reasons = {
            NotAllowedError: 'Cancelled or timed out',
            InvalidStateError: 'Credential already exists',
            SecurityError: 'Security error — ensure HTTPS'
          };
          return { success: false, supported: true, reason: reasons[e.name] || ('Error: ' + e.name) };
        }
      }

      return {
        authenticate, register,
        hasCredential: () => !!credentialIdB64,
        setCredential: (b64) => { credentialIdB64 = b64; },
        getCredential: () => credentialIdB64
      };
    })();

    // ═══════════════════════════════════════════════════════════
    //  6. GESTURE MANAGER — Swipe back, swipe actions, pull to refresh, long press
    // ═══════════════════════════════════════════════════════════
    const GestureManager = (function() {
      const EDGE_THRESHOLD = 30; // px from left edge to start back swipe
      let activeGesture = null;

      function init() {
        // ── Swipe-from-left-edge → back ──
        document.addEventListener('touchstart', (e) => {
          const t = e.touches[0];
          if (t.clientX < EDGE_THRESHOLD && !e.target.closest('.sheet')) {
            activeGesture = {
              type: 'edge-back',
              startX: t.clientX,
              startY: t.clientY,
              lastX: t.clientX
            };
          }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
          if (!activeGesture || activeGesture.type !== 'edge-back') return;
          const t = e.touches[0];
          activeGesture.lastX = t.clientX;
          const dx = t.clientX - activeGesture.startX;
          if (dx > 10) {
            document.getElementById('swipe-back-indicator').classList.add('on');
          }
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
          if (!activeGesture || activeGesture.type !== 'edge-back') return;
          const dx = activeGesture.lastX - activeGesture.startX;
          document.getElementById('swipe-back-indicator').classList.remove('on');
          if (dx > 60) {
            handleSwipeBack();
          }
          activeGesture = null;
        });

        // ── Long press on activity items → context menu ──
        document.addEventListener('touchstart', (e) => {
          const item = e.target.closest('.activity-item');
          if (!item) return;
          const id = item.getAttribute('data-tx-id');
          if (!id) return;
          const touch = e.touches[0];
          const startX = touch.clientX;
          const startY = touch.clientY;
          let cancelled = false;
          const cancel = () => { cancelled = true; };
          const timer = setTimeout(() => {
            if (cancelled) return;
            haptic('medium');
            openTxContextMenu(parseInt(id));
          }, 500);
          const onMove = (ev) => {
            const t = ev.touches[0];
            if (Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) {
              cancel();
              clearTimeout(timer);
              document.removeEventListener('touchmove', onMove);
              document.removeEventListener('touchend', onEnd);
            }
          };
          const onEnd = () => {
            clearTimeout(timer);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
          };
          document.addEventListener('touchmove', onMove);
          document.addEventListener('touchend', onEnd);
        }, { passive: true });
      }

      function handleSwipeBack() {
        haptic('light');
        // If a sheet is open, close it
        if (document.getElementById('sheet-overlay').classList.contains('on')) {
          closeSheet();
          return;
        }
        // If dashboard edit mode is on, exit it
        if (DashboardManager.isEditMode()) {
          DashboardManager.exitEditMode();
          return;
        }
        // Otherwise, navigate to home if not already
        if (currentTab !== 'home') {
          switchTab('home');
        }
      }

      return { init };
    })();

    // ═══════════════════════════════════════════════════════════
    //  7. STORE — IndexedDB with persistent prefs
    // ═══════════════════════════════════════════════════════════
    const Store = (function() {
      const DB_NAME = 'LogosticsFinanceDB';
      const DB_VERSION = 1;
      const PREFS_KEY = 'logostics_finance_prefs_v3';

      let db = null;
      let useIndexedDB = false;
      const memory = { transactions: [], goals: [], paychecks: [] };

      let state = {
        balance: 0,
        transactions: [],
        paychecks: [],
        goals: [],
        recurringExpenses: [],
        incomeSettings: { hourlyRate: 0, hoursPerWeek: 0, payFrequency: 'weekly', withholdingPct: 20, nextPayday: null },
        preferences: {
          currency: 'USD',
          appLockEnabled: false,
          notificationsEnabled: false,
          hapticsEnabled: true,
          privacyMode: false,
          webAuthnCredential: null,
          authTimeout: 'session',
          autoLock: 'immediately',
          protectedPages: { home: false, activity: false, goals: false, analytics: false },
          appearance: {
            theme: 'dark',
            accent: 'green',
            density: 'comfortable',
            cornerRadius: 22
          },
          aiEnabled: true,
          // ── Dashboard customization (real, persisted) ──
          dashboard: {
            order: ['hero', 'cashCard', 'quickActions', 'insights', 'recent'],
            hidden: [],
            pinned: []
          },
          // ── Widget preferences (for native WidgetKit) ──
          widgets: {
            balanceVisible: true,
            preferredGoalId: null,
            spendingCategory: 'all',
            privacyOnLockScreen: true
          },
          // ── Patch notes tracking ──
          lastSeenVersion: null
        },
        lastUpdated: Date.now(),
        _nextId: 1,
        _listeners: []
      };

      function openDB() {
        return new Promise((resolve) => {
          if (!window.indexedDB || !window.isSecureContext) { resolve(null); return; }
          let req;
          try { req = indexedDB.open(DB_NAME, DB_VERSION); }
          catch (e) { resolve(null); return; }
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains('transactions')) {
              const s = d.createObjectStore('transactions', { keyPath: 'id', autoIncrement: true });
              s.createIndex('date', 'date');
              s.createIndex('type', 'type');
            }
            if (!d.objectStoreNames.contains('goals')) {
              d.createObjectStore('goals', { keyPath: 'id', autoIncrement: true });
            }
            if (!d.objectStoreNames.contains('paychecks')) {
              const s = d.createObjectStore('paychecks', { keyPath: 'id', autoIncrement: true });
              s.createIndex('date', 'date');
            }
          };
          req.onsuccess = (e) => { db = e.target.result; useIndexedDB = true; resolve(db); };
          req.onerror = () => { db = null; resolve(null); };
          setTimeout(() => { if (!db) resolve(null); }, 2500);
        });
      }

      function txStore(store, mode) {
        if (!db) return null;
        try { return db.transaction(store, mode).objectStore(store); }
        catch (e) { return null; }
      }

      async function dbAdd(store, data) {
        const s = txStore(store, 'readwrite');
        if (!s) return null;
        return new Promise((resolve) => {
          try {
            const r = s.add(data);
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => resolve(null);
          } catch (e) { resolve(null); }
        });
      }
      async function dbPut(store, data) {
        const s = txStore(store, 'readwrite');
        if (!s) return null;
        return new Promise((resolve) => {
          try {
            const r = s.put(data);
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => resolve(null);
          } catch (e) { resolve(null); }
        });
      }
      async function dbDelete(store, id) {
        const s = txStore(store, 'readwrite');
        if (!s) return;
        return new Promise((resolve) => {
          try {
            const r = s.delete(id);
            r.onsuccess = () => resolve();
            r.onerror = () => resolve();
          } catch (e) { resolve(); }
        });
      }
      async function dbGetAll(store) {
        const s = txStore(store, 'readonly');
        if (!s) return [];
        return new Promise((resolve) => {
          try {
            const r = s.getAll();
            r.onsuccess = () => resolve(r.result || []);
            r.onerror = () => resolve([]);
          } catch (e) { resolve([]); }
        });
      }

      function loadPrefs() {
        try {
          const raw = localStorage.getItem(PREFS_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            state.preferences = { ...state.preferences, ...(p.preferences || {}) };
            state.incomeSettings = { ...state.incomeSettings, ...(p.incomeSettings || {}) };
            // Deep-merge nested
            if (p.preferences && p.preferences.dashboard) {
              state.preferences.dashboard = { ...state.preferences.dashboard, ...p.preferences.dashboard };
            }
            if (p.preferences && p.preferences.appearance) {
              state.preferences.appearance = { ...state.preferences.appearance, ...p.preferences.appearance };
            }
            if (p.preferences && p.preferences.widgets) {
              state.preferences.widgets = { ...state.preferences.widgets, ...p.preferences.widgets };
            }
          }
        } catch (e) {}
      }
      function savePrefs() {
        try {
          localStorage.setItem(PREFS_KEY, JSON.stringify({
            preferences: state.preferences,
            incomeSettings: state.incomeSettings
          }));
        } catch (e) {}
      }

      async function init() {
        loadPrefs();
        if (state.preferences.webAuthnCredential) {
          AuthManager.setCredential(state.preferences.webAuthnCredential);
        }
        await openDB();
        if (useIndexedDB) {
          const txs = await dbGetAll('transactions');
          const goals = await dbGetAll('goals');
          const pcs = await dbGetAll('paychecks');
          state.transactions = txs.sort((a, b) => new Date(b.date) - new Date(a.date));
          state.goals = goals;
          state.paychecks = pcs.sort((a, b) => new Date(b.date) - new Date(a.date));
        } else {
          state.transactions = [...memory.transactions];
          state.goals = [...memory.goals];
          state.paychecks = [...memory.paychecks];
        }
        state.balance = state.transactions.reduce((sum, t) => {
          return t.type === 'income' ? sum + t.amount : sum - t.amount;
        }, 0);
        const allIds = [...state.transactions, ...state.goals, ...state.paychecks].map(x => x.id || 0);
        state._nextId = (Math.max(0, ...allIds) || 0) + 1;
        state.lastUpdated = Date.now();
        // Push widget data to native
        pushWidgetData();
      }

      function notify() {
        state.lastUpdated = Date.now();
        savePrefs();
        // Push to native widget
        pushWidgetData();
        state._listeners.forEach(fn => { try { fn(snapshot()); } catch (e) {} });
      }

      function pushWidgetData() {
        if (!NativeBridge.available) return;
        const widgetData = {
          balance: state.balance,
          balanceVisible: state.preferences.widgets.balanceVisible,
          privacyOnLockScreen: state.preferences.widgets.privacyOnLockScreen,
          goals: state.goals.map(g => ({
            id: g.id, name: g.name, current: g.current, target: g.target
          })),
          preferredGoalId: state.preferences.widgets.preferredGoalId,
          nextPaycheck: computePaycheckEstimate().takeHome,
          recentSpending: computeTotalSpending(7),
          lastUpdated: state.lastUpdated
        };
        NativeBridge.updateWidgetData(widgetData);
      }

      function subscribe(fn) {
        state._listeners.push(fn);
        return () => { state._listeners = state._listeners.filter(f => f !== fn); };
      }
      function snapshot() {
        return {
          balance: state.balance,
          transactions: [...state.transactions],
          paychecks: [...state.paychecks],
          goals: [...state.goals],
          recurringExpenses: [...state.recurringExpenses],
          incomeSettings: { ...state.incomeSettings },
          preferences: JSON.parse(JSON.stringify(state.preferences)),
          lastUpdated: state.lastUpdated,
          storageMode: useIndexedDB ? 'indexeddb' : 'memory'
        };
      }

      async function addTransaction(tx) {
        const t = {
          id: state._nextId++,
          type: tx.type,
          amount: Math.abs(tx.amount),
          category: tx.category || 'other',
          description: tx.description || '',
          date: tx.date || new Date().toISOString(),
          account: tx.account || 'cash',
          createdAt: new Date().toISOString()
        };
        state.transactions.unshift(t);
        if (t.type === 'income') state.balance += t.amount;
        else state.balance -= t.amount;
        if (useIndexedDB) await dbAdd('transactions', t);
        else memory.transactions.unshift(t);
        notify();
        return t;
      }

      async function updateTransaction(id, u) {
        const i = state.transactions.findIndex(t => t.id === id);
        if (i === -1) return null;
        const old = state.transactions[i];
        const upd = { ...old, ...u, amount: Math.abs(u.amount ?? old.amount) };
        if (old.type === 'income') state.balance -= old.amount;
        else state.balance += old.amount;
        if (upd.type === 'income') state.balance += upd.amount;
        else state.balance -= upd.amount;
        state.transactions[i] = upd;
        if (useIndexedDB) await dbPut('transactions', upd);
        else memory.transactions = state.transactions;
        notify();
        return upd;
      }

      async function deleteTransaction(id) {
        const i = state.transactions.findIndex(t => t.id === id);
        if (i === -1) return false;
        const t = state.transactions[i];
        if (t.type === 'income') state.balance -= t.amount;
        else state.balance += t.amount;
        state.transactions.splice(i, 1);
        if (useIndexedDB) await dbDelete('transactions', id);
        else memory.transactions = state.transactions;
        notify();
        return true;
      }

      function getTransactions(f) {
        let list = [...state.transactions];
        if (f) {
          if (f.type) list = list.filter(t => t.type === f.type);
          if (f.category && f.category !== 'all') list = list.filter(t => t.category === f.category);
          if (f.search) {
            const q = f.search.toLowerCase();
            list = list.filter(t => t.description.toLowerCase().includes(q) || t.category.toLowerCase().includes(q));
          }
        }
        return list.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      async function addGoal(g) {
        const goal = {
          id: state._nextId++,
          name: g.name, emoji: g.emoji || '◈',
          target: Math.abs(g.target),
          current: Math.abs(g.current || 0),
          targetDate: g.targetDate || null,
          weeklySavings: g.weeklySavings || 0,
          createdAt: new Date().toISOString()
        };
        state.goals.push(goal);
        if (useIndexedDB) await dbAdd('goals', goal);
        else memory.goals.push(goal);
        notify();
        return goal;
      }
      async function updateGoal(id, u) {
        const i = state.goals.findIndex(g => g.id === id);
        if (i === -1) return null;
        state.goals[i] = { ...state.goals[i], ...u };
        if (useIndexedDB) await dbPut('goals', state.goals[i]);
        else memory.goals = state.goals;
        notify();
        return state.goals[i];
      }
      async function deleteGoal(id) {
        const len = state.goals.length;
        state.goals = state.goals.filter(g => g.id !== id);
        if (state.goals.length !== len) {
          if (useIndexedDB) await dbDelete('goals', id);
          else memory.goals = state.goals;
          notify();
          return true;
        }
        return false;
      }
      function getGoals() { return [...state.goals]; }

      function updateIncomeSettings(s) {
        state.incomeSettings = { ...state.incomeSettings, ...s };
        notify();
        return { ...state.incomeSettings };
      }
      function updatePreferences(p) {
        state.preferences = { ...state.preferences, ...p };
        notify();
        return { ...state.preferences };
      }

      function computePaycheckEstimate() {
        const { hourlyRate, hoursPerWeek, withholdingPct } = state.incomeSettings;
        const gross = hourlyRate * hoursPerWeek;
        const withholding = gross * (withholdingPct / 100);
        return { gross, withholding, takeHome: gross - withholding, hourlyRate, hoursPerWeek, withholdingPct };
      }
      function computeGoalProgress(g) {
        const pct = g.target > 0 ? Math.min(100, Math.round((g.current / g.target) * 100)) : 0;
        const remaining = Math.max(0, g.target - g.current);
        let estimatedDate = null;
        if (g.weeklySavings > 0 && remaining > 0) {
          const weeks = remaining / g.weeklySavings;
          estimatedDate = new Date(Date.now() + weeks * 7 * 24 * 60 * 60 * 1000);
        } else if (g.targetDate) {
          estimatedDate = new Date(g.targetDate);
        }
        return { pct, remaining, estimatedDate };
      }
      function computeProjectedBalance() {
        const est = computePaycheckEstimate();
        const planned = state.recurringExpenses.filter(e => e.active !== false).reduce((s, e) => s + (e.amount || 0), 0);
        return state.balance + est.takeHome - planned;
      }
      function computeSpendingByCategory(days) {
        days = days || 7;
        const cutoff = Date.now() - days * 864e5;
        const by = {};
        state.transactions
          .filter(t => t.type === 'expense' && new Date(t.date).getTime() >= cutoff)
          .forEach(t => { by[t.category] = (by[t.category] || 0) + t.amount; });
        return by;
      }
      function computeTotalSpending(days) {
        days = days || 7;
        const cutoff = Date.now() - days * 864e5;
        return state.transactions
          .filter(t => t.type === 'expense' && new Date(t.date).getTime() >= cutoff)
          .reduce((s, t) => s + t.amount, 0);
      }
      function computeTotalIncome(days) {
        days = days || 7;
        const cutoff = Date.now() - days * 864e5;
        return state.transactions
          .filter(t => t.type === 'income' && new Date(t.date).getTime() >= cutoff)
          .reduce((s, t) => s + t.amount, 0);
      }
      function computeSavingsRate() {
        const inc = computeTotalIncome(30);
        const sp = computeTotalSpending(30);
        if (inc === 0) return 0;
        return Math.max(0, Math.round(((inc - sp) / inc) * 100));
      }
      function computeAverageTransaction() {
        const ex = state.transactions.filter(t => t.type === 'expense');
        if (!ex.length) return 0;
        return ex.reduce((s, t) => s + t.amount, 0) / ex.length;
      }
      function computeLargestCategory() {
        const by = computeSpendingByCategory(30);
        let cat = '—', amt = 0;
        Object.entries(by).forEach(([k, v]) => { if (v > amt) { amt = v; cat = k; } });
        return { category: cat, amount: amt };
      }
      function generateInsights() {
        const out = [];
        const wk = computeTotalSpending(7);
        const now = Date.now();
        const wkAgo = now - 7 * 864e5;
        const wk2Ago = now - 14 * 864e5;
        const prev = state.transactions
          .filter(t => t.type === 'expense' && new Date(t.date).getTime() >= wk2Ago && new Date(t.date).getTime() < wkAgo)
          .reduce((s, t) => s + t.amount, 0);
        if (prev > 0) {
          const ch = ((wk - prev) / prev) * 100;
          if (Math.abs(ch) >= 5) {
            out.push({ ico: ch < 0 ? '↓' : '↑', txt: `Spending is <strong>${ch < 0 ? 'down' : 'up'} ${Math.abs(Math.round(ch))}%</strong> this week.` });
          }
        }
        const lc = computeLargestCategory();
        if (lc.amount > 0) {
          out.push({ ico: '◈', txt: `<strong>${lc.category}</strong> is your top category at <strong>${fmt(lc.amount)}</strong>.` });
        }
        if (state.goals.length) {
          const g = state.goals[0];
          const p = computeGoalProgress(g);
          if (p.remaining > 0) out.push({ ico: '→', txt: `<strong>${fmt(p.remaining)}</strong> away from "${g.name}".` });
          else out.push({ ico: '✓', txt: `"${g.name}" goal reached.` });
        }
        const proj = computeProjectedBalance();
        if (proj > state.balance) out.push({ ico: '↑', txt: `Projected balance after next paycheck: <strong>${fmt(proj)}</strong>.` });
        if (!out.length) out.push({ ico: '·', txt: 'Add transactions to see insights.' });
        return out;
      }

      return {
        init, subscribe, getSnapshot: snapshot,
        addTransaction, updateTransaction, deleteTransaction, getTransactions,
        addGoal, updateGoal, deleteGoal, getGoals,
        updateIncomeSettings, updatePreferences,
        computePaycheckEstimate, computeGoalProgress, computeProjectedBalance,
        computeSpendingByCategory, computeTotalSpending, computeTotalIncome,
        computeSavingsRate, computeAverageTransaction, computeLargestCategory,
        generateInsights,
        get balance() { return state.balance; },

    // ═══════════════════════════════════════════════════════════
    const DashboardManager = (function() {
      let editMode = false;
      let draggedCard = null;
      let dragStartY = 0;

      const CARD_LABELS = {
        hero: 'Balance Header',
        cashCard: 'Live Cash Card',
        quickActions: 'Quick Actions',
        insights: 'Insights',
        recent: 'Recent Activity'
      };

      function getConfig() {
        return Store.preferences.dashboard || {
          order: ['hero', 'cashCard', 'quickActions', 'insights', 'recent'],
          hidden: [], pinned: []
        };
      }

      async function saveConfig(cfg) {
        await Store.updatePreferences({ dashboard: cfg });
      }

      function isEditMode() { return editMode; }

      function enterEditMode() {
        editMode = true;
        render();
        toast('Edit mode — drag to reorder, tap ≡ to hide');
      }

      function exitEditMode() {
        editMode = false;
        render();
        toast('Layout saved');
      }

      async function toggleCardVisibility(cardId) {
        const cfg = getConfig();
        const hidden = new Set(cfg.hidden || []);
        if (hidden.has(cardId)) hidden.delete(cardId);
        else hidden.add(cardId);
        cfg.hidden = Array.from(hidden);
        await saveConfig(cfg);
        render();
      }

      async function reorder(newOrder) {
        const cfg = getConfig();
        cfg.order = newOrder;
        await saveConfig(cfg);
      }

      // ── Touch-based drag for reorder (web) ──
      function startDrag(e, cardId) {
        if (!editMode) return;
        draggedCard = cardId;
        dragStartY = e.touches ? e.touches[0].clientY : e.clientY;
        const el = document.querySelector(`[data-dash-card="${cardId}"]`);
        if (el) el.classList.add('dragging');
        haptic('medium');
      }

      function onDragMove(e) {
        if (!draggedCard) return;
        e.preventDefault();
        const y = e.touches ? e.touches[0].clientY : e.clientY;
        const el = document.elementFromPoint(
          e.touches ? e.touches[0].clientX : e.clientX,
          y
        );
        const target = el ? el.closest('[data-dash-card]') : null;
        if (target && target.dataset.dashCard !== draggedCard) {
          const targetId = target.dataset.dashCard;
          const cfg = getConfig();
          const order = [...cfg.order];
          const fromIdx = order.indexOf(draggedCard);
          const toIdx = order.indexOf(targetId);
          if (fromIdx >= 0 && toIdx >= 0) {
            order.splice(fromIdx, 1);
            order.splice(toIdx, 0, draggedCard);
            cfg.order = order;
            saveConfig(cfg);
            render();
            // Re-add dragging class after re-render
            const newEl = document.querySelector(`[data-dash-card="${draggedCard}"]`);
            if (newEl) newEl.classList.add('dragging');
          }
        }
      }

      function endDrag() {
        if (draggedCard) {
          const el = document.querySelector(`[data-dash-card="${draggedCard}"]`);
          if (el) el.classList.remove('dragging');
          draggedCard = null;
          haptic('success');
        }
      }

      return {
        getConfig, saveConfig, isEditMode,
        enterEditMode, exitEditMode, toggleCardVisibility, reorder,
        startDrag, onDragMove, endDrag,
        CARD_LABELS
      };
    })();

    //  11. AI AGENT
    // ═══════════════════════════════════════════════════════════
    const AIAgent = (function() {
      const tools = {
        getBalance() {
          const snap = Store.getSnapshot();
          return { balance: snap.balance, currency: snap.preferences.currency };
        },
        getRecentTransactions(limit) {
          const snap = Store.getSnapshot();
          return snap.transactions.slice(0, limit || 5).map(t => ({
            type: t.type, amount: t.amount, category: t.category,
            description: t.description, date: t.date
          }));
        },
        getSpendingByCategory(days) { return Store.computeSpendingByCategory(days || 7); },
        getTotalSpending(days) { return Store.computeTotalSpending(days || 7); },
        getTotalIncome(days) { return Store.computeTotalIncome(days || 7); },
        getSavingsRate() { return Store.computeSavingsRate(); },
        getGoals() {
          return Store.getGoals().map(g => {
            const p = Store.computeGoalProgress(g);
            return { name: g.name, current: g.current, target: g.target, pct: p.pct, remaining: p.remaining };
          });
        },
        getPaycheckEstimate() { return Store.computePaycheckEstimate(); },
        getProjectedBalance() { return Store.computeProjectedBalance(); },
        getLargestCategory() { return Store.computeLargestCategory(); },
        getAverageTransaction() { return Store.computeAverageTransaction(); },
        getInsights() { return Store.generateInsights(); }
      };

      function matchIntent(q) {
        const lower = q.toLowerCase().trim();

        if (/^(take me|go|open|show me|navigate to|jump to)/.test(lower)) {
          if (/savings|goal/.test(lower)) return { action: 'navigate', target: 'goals', reply: 'Opening Goals.' };
          if (/analytics|charts|graphs/.test(lower)) return { action: 'navigate', target: 'analytics', reply: 'Opening Analytics.' };
          if (/activity|transactions/.test(lower)) return { action: 'navigate', target: 'activity', reply: 'Opening Activity.' };
          if (/home|dashboard/.test(lower)) return { action: 'navigate', target: 'home', reply: 'Opening Home.' };
          if (/settings|preferences/.test(lower)) return { action: 'navigate', target: 'settings', reply: 'Opening Settings.' };
        }
        if (/^(add|log|record)\s+\$?\d/.test(lower)) {
          const amtMatch = lower.match(/\$?(\d+(\.\d+)?)/);
          if (amtMatch) {
            const amt = parseFloat(amtMatch[1]);
            const isIncome = /income|paycheck|received/.test(lower);
            return { action: 'confirm-add', amount: amt, type: isIncome ? 'income' : 'expense',
              reply: `Log a ${isIncome ? 'income' : 'expense'} of ${fmt(amt)}?` };
          }
        }
        if (/(how much|what'?s|what is).*(cash|balance|have|money)/.test(lower)) return { action: 'answer', tool: 'getBalance' };
        if (/(how much|what).*(spend|spent|spending)/.test(lower)) return { action: 'answer', tool: 'getTotalSpending', args: [7], template: 'spending7' };
        if (/(how much|what).*(income|earn)/.test(lower)) return { action: 'answer', tool: 'getTotalIncome', args: [30], template: 'income30' };
        if (/goal/.test(lower)) return { action: 'answer', tool: 'getGoals', template: 'goals' };
        if (/(projected|next paycheck)/.test(lower)) return { action: 'answer', tool: 'getProjectedBalance', template: 'projected' };
        if (/(top|largest|biggest).*(categor)/.test(lower)) return { action: 'answer', tool: 'getLargestCategory', template: 'largestCat' };
        if (/(average|avg).*(transaction)/.test(lower)) return { action: 'answer', tool: 'getAverageTransaction', template: 'avgTx' };
        if (/(insight|summary|overview)/.test(lower)) return { action: 'answer', tool: 'getInsights', template: 'insights' };
        if (/^(hi|hey|hello)/.test(lower)) return { action: 'greeting' };
        if (/help/.test(lower)) return { action: 'help' };
        return { action: 'unknown' };
      }

      function formatToolResult(template, result) {
        switch (template) {
          case 'spending7': return `You've spent ${fmt(result)} in the last 7 days.`;
          case 'income30': return `You've earned ${fmt(result)} in the last 30 days.`;
          case 'goals':
            if (!result.length) return "You don't have any savings goals set yet.";
            return result.map(g => `"${g.name}": ${fmt(g.current)} of ${fmt(g.target)} — ${g.pct}% complete.`).join('\n');
          case 'projected': return `Your projected balance is ${fmt(result)}.`;
          case 'largestCat': return result.amount === 0 ? 'No spending yet.' : `Largest category: "${result.category}" at ${fmt(result.amount)}.`;
          case 'avgTx': return `Average transaction: ${fmt(result)}.`;
          case 'insights': return result.map(i => i.txt.replace(/<[^>]*>/g, '')).join('\n');
          default: return typeof result === 'string' ? result : JSON.stringify(result);
        }
      }

      async function answer(question) {
        const intent = matchIntent(question);
        if (intent.action === 'greeting') {
          return { reply: "Hey. Ask me about your balance, spending, goals, or say 'take me to analytics'." };
        }
        if (intent.action === 'help') {
          return { reply: "I can answer questions about your balance, spending, income, goals, navigate between screens, and log transactions (with your confirmation)." };
        }
        if (intent.action === 'navigate') {
          setTimeout(() => {
            if (intent.target === 'settings') openSettings();
            else switchTab(intent.target);
          }, 200);
          return { reply: intent.reply };
        }
        if (intent.action === 'confirm-add') {
          return {
            reply: intent.reply,
            confirmAction: {
              label: `Log ${fmt(intent.amount)} ${intent.type}`,
              execute: async () => {
                await Store.addTransaction({
                  type: intent.type, amount: intent.amount,
                  description: 'Logged via AI',
                  category: intent.type === 'income' ? 'other' : 'other'
                });
                haptic('success');
                toast(`${intent.type === 'income' ? 'Income' : 'Expense'} logged`);
                render();
                return `Logged ${fmt(intent.amount)}.`;
              }
            }
          };
        }
        if (intent.action === 'answer') {
          try {
            const tool = tools[intent.tool];
            if (!tool) return { reply: "I don't have a tool for that yet." };
            const args = intent.args || [];
            const result = await tool(...args);
            const formatted = intent.template ? formatToolResult(intent.template, result) : JSON.stringify(result);
            return { reply: formatted };
          } catch (e) {
            return { reply: "I ran into an error reading that data." };
          }
        }
        return { reply: "I'm not sure I understood. Try asking about your balance, spending, or goals." };
      }

      return { answer };
    })();

    let currentTab = 'home';

    function fmt(n) {
      if (n === undefined || n === null) return '$0.00';
      const abs = Math.abs(n);
      const str = abs.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return '$' + str;
    }
    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diff = Math.round((today - target) / 864e5);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Yesterday';
      if (diff < 7) return diff + 'd ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    function timeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 5) return 'just now';
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      return Math.floor(s / 3600) + 'h ago';
    }
    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function haptic(style) {
      if (!Store.preferences.hapticsEnabled) return;
      if (typeof navigator.vibrate === 'function') {
        const patterns = { light: 8, medium: 14, heavy: 22, success: [10, 40, 10], error: [20, 30, 20, 30, 20] };
        try { navigator.vibrate(patterns[style] || 10); } catch (e) {}
      }
      if (NativeBridge.available) {
        NativeBridge.setHaptic(style);
      }
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2400);
      haptic('light');
    }
