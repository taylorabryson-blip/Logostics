    // ── RENDER: ANALYTICS ──
    function renderAnalytics() {
      const snap = Store.getSnapshot();
      const inc = Store.computeTotalIncome(30);
      const sp = Store.computeTotalSpending(30);
      const rate = Store.computeSavingsRate();
      const avg = Store.computeAverageTransaction();
      const lc = Store.computeLargestCategory();
      const last7 = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const ds = d.toDateString();
        const val = snap.transactions
          .filter(t => t.type === 'expense' && new Date(t.date).toDateString() === ds)
          .reduce((s, t) => s + t.amount, 0);
        last7.push({ label: d.toLocaleDateString('en-US', { weekday: 'narrow' }), value: val });
      }
      const maxV = Math.max(...last7.map(d => d.value), 1);
      return `
        <div class="container fade-in">
          <div class="top-header"><div class="t-large">Analytics</div></div>
          <div class="stat-grid stagger">
            <div class="stat"><div class="stat-val" style="color:var(--green);">${fmt(inc)}</div><div class="stat-lbl">Income · 30d</div></div>
            <div class="stat"><div class="stat-val" style="color:var(--gray-200);">${fmt(sp)}</div><div class="stat-lbl">Spending · 30d</div></div>
            <div class="stat"><div class="stat-val">${rate}%</div><div class="stat-lbl">Savings Rate</div></div>
            <div class="stat"><div class="stat-val">${fmt(avg)}</div><div class="stat-lbl">Avg Transaction</div></div>
          </div>
          <div class="chart-card">
            <h3>Weekly Spending</h3>
            <div style="display:flex;align-items:flex-end;justify-content:space-between;height:110px;gap:8px;">
              ${last7.map(d => `
                <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;">
                  <div style="width:100%;height:${Math.max(4, (d.value / maxV) * 84)}px;background:${d.value > 0 ? 'var(--green)' : 'var(--gray-800)'};border-radius:6px 6px 0 0;"></div>
                  <span style="font-size:10px;color:var(--gray-500);font-weight:700;">${d.label}</span>
                </div>
              `).join('')}
            </div>
          </div>
          <div class="chart-card">
            <h3>Top Category</h3>
            ${lc.amount > 0 ? `
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:15px;font-weight:600;">${escapeHtml(lc.category)}</span>
                <span style="font-size:22px;font-weight:700;">${fmt(lc.amount)}</span>
              </div>
            ` : `<p style="color:var(--gray-500);font-size:14px;">No spending yet.</p>`}
          </div>
        </div>
      `;
    }

    function openAI() {
      haptic('medium');
      aiChat = aiChat.slice(-40);
      openSheet(`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div class="sheet-title" style="margin:0;text-align:left;">Ask Logostics</div>
          <button onclick="clearAIChat()" style="background:var(--gray-850);border:1px solid var(--gray-700);color:var(--gray-400);padding:6px 10px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Clear</button>
        </div>
        <div id="ai-chat-log" style="max-height:55vh;overflow-y:auto;margin-bottom:12px;padding-right:4px;">
          ${aiChat.length === 0 ? `
            <div class="ai-chat-bubble ai-bubble-system">Ask about your money, goals, or say "take me to analytics".</div>
          ` : aiChat.map(m => renderAIBubble(m)).join('')}
        </div>
        <form onsubmit="submitAI(event)" style="display:flex;gap:8px;">
          <input class="field-input" id="ai-input" placeholder="Ask anything…" autocomplete="off" style="flex:1;">
          <button type="submit" class="btn btn-green" style="width:auto;padding:14px 22px;">↑</button>
        </form>
      `);
      setTimeout(() => {
        const log = document.getElementById('ai-chat-log');
        if (log) log.scrollTop = log.scrollHeight;
        document.getElementById('ai-input')?.focus();
      }, 100);
    }

    function renderAIBubble(m) {
      if (m.role === 'user') return `<div class="ai-chat-bubble ai-bubble-user">${escapeHtml(m.text)}</div>`;
      if (m.role === 'system') return `<div class="ai-chat-bubble ai-bubble-system">${escapeHtml(m.text)}</div>`;
      let confirmHtml = '';
      if (m.confirmAction) {
        confirmHtml = `
          <div class="ai-action-row">
            <button class="ai-action-btn primary" onclick="executeAIConfirm(${m.id})">${escapeHtml(m.confirmAction.label)}</button>
            <button class="ai-action-btn" onclick="dismissAIConfirm(${m.id})">Cancel</button>
          </div>
        `;
      }
      return `<div class="ai-chat-bubble ai-bubble-assistant">${escapeHtml(m.text).replace(/\n/g, '<br>')}${confirmHtml}</div>`;
    }

    async function submitAI(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('ai-input');
      const q = input.value.trim();
      if (!q || aiThinking) return;
      input.value = '';
      aiChat.push({ role: 'user', text: q });
      refreshAIChatLog();
      aiThinking = true;
      const log = document.getElementById('ai-chat-log');
      if (log) {
        const typing = document.createElement('div');
        typing.id = 'ai-typing';
        typing.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
        log.appendChild(typing);
        log.scrollTop = log.scrollHeight;
      }
      try {
        const response = await AIAgent.answer(q);
        aiChat.push({
          role: 'assistant', text: response.reply,
          id: Date.now() + Math.random(),
          confirmAction: response.confirmAction || null
        });
      } catch (err) {
        aiChat.push({ role: 'assistant', text: 'Sorry, something went wrong.' });
      } finally {
        aiThinking = false;
        document.getElementById('ai-typing')?.remove();
        refreshAIChatLog();
      }
    }
    function refreshAIChatLog() {
      const log = document.getElementById('ai-chat-log');
      if (!log) return;
      log.innerHTML = aiChat.map(m => renderAIBubble(m)).join('');
      log.scrollTop = log.scrollHeight;
    }
    async function executeAIConfirm(id) {
      const m = aiChat.find(x => x.id === id);
      if (!m || !m.confirmAction) return;
      const action = m.confirmAction;
      m.confirmAction = null;
      refreshAIChatLog();
      try {
        const result = await action.execute();
        aiChat.push({ role: 'assistant', text: result || 'Done.' });
      } catch (e) {
        aiChat.push({ role: 'assistant', text: 'Action failed.' });
      }
      refreshAIChatLog();
    }
    function dismissAIConfirm(id) {
      const m = aiChat.find(x => x.id === id);
      if (m) m.confirmAction = null;
      aiChat.push({ role: 'system', text: 'Action cancelled.' });
      refreshAIChatLog();
    }
    function clearAIChat() { aiChat = []; openAI(); }

    // ═══════════════════════════════════════════════════════════
    //  SERVICE WORKER
    // ═══════════════════════════════════════════════════════════
    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return null;
      if (!window.isSecureContext) return null;
      try {
        const swCode = `
          const CACHE = 'logostics-v4';
          const SHELL = ['./'];
          self.addEventListener('install', (e) => {
            e.waitUntil(caches.open(CACHE).then(c => c.addAll(SHELL)).catch(() => {}));
            self.skipWaiting();
          });
          self.addEventListener('activate', (e) => {
            e.waitUntil(caches.keys().then(keys =>
              Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
            ));
            self.clients.claim();
          });
          self.addEventListener('fetch', (e) => {
            const req = e.request;
            if (req.method !== 'GET') return;
            if (req.mode === 'navigate') {
              e.respondWith(
                fetch(req).then(res => {
                  const copy = res.clone();
                  caches.open(CACHE).then(c => c.put(req, copy)).catch(() => {});
                  return res;
                }).catch(() => caches.match(req).then(r => r || caches.match('./')))
              );
              return;
            }
            e.respondWith(
              caches.match(req).then(cached => {
                if (cached) return cached;
                return fetch(req).then(res => {
                  if (res && res.status === 200 && res.type === 'basic') {
                    const copy = res.clone();
                    caches.open(CACHE).then(c => c.put(req, copy)).catch(() => {});
                  }
                  return res;
                }).catch(() => cached);
              })
            );
          });
          self.addEventListener('notificationclick', (e) => {
            e.notification.close();
            e.waitUntil(
              self.clients.matchAll({ type: 'window', includeUncontrolled: true }).then(list => {
                for (const c of list) { if ('focus' in c) return c.focus(); }
                if (self.clients.openWindow) return self.clients.openWindow('./');
              })
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        return await navigator.serviceWorker.register(swUrl);
      } catch (e) {
        console.warn('SW registration failed:', e);
        return null;
      }
    }

    // ═══════════════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════════════
    async function init() {
      DebugPanel.log('Init start');
      await Store.init();
      await registerServiceWorker();
      LifecycleManager.init();
      AppLockManager.init();
      GestureManager.init();

      Store.subscribe(() => { if (authenticated && !AppLockManager.isLocked()) render(); });

      try {
        const savedTab = sessionStorage.getItem('logostics_tab');
        if (savedTab && ['home', 'activity', 'goals', 'analytics'].includes(savedTab)) {
          currentTab = savedTab;
          document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.tab === savedTab);
          });
        }
      } catch (e) {}

      // Initial lock check
      if (Store.preferences.appLockEnabled && AuthManager.hasCredential()) {
        AppLockManager.lock('startup');
      }
      authenticated = true;
      render();

      // Show "What's New" if new version
      if (PatchNotes.hasUnseenVersion() && Store.preferences.lastSeenVersion) {
        setTimeout(() => openPatchNotes(), 800);
      } else if (!Store.preferences.lastSeenVersion) {
        // First run, silently mark
        PatchNotes.markSeen();
      }

      Object.assign(window, {
        switchTab, openAddIncome, openAddExpense, openAddGoal, openGoalDetail,
        openTxDetail, openTransfer, openSettings, openAI, openPatchNotes,
        submitIncome, submitExpense, submitGoal, submitTransfer,
        submitEditTx, openEditTx, confirmDeleteTx, confirmDeleteGoal,
        addToGoal, pickChip, pickSeg, closeSheet,
        exportData, resetAllData, togglePrivacy, enableNotifications,
        toggleAppLock, toggleProtected, setAutoLock,
        askAIAbout, submitAI, executeAIConfirm, dismissAIConfirm, clearAIChat,
        openTxContextMenu, setActivityCat, onActivitySearch,
        DashboardManager, LifecycleManager, AppLockManager, PatchNotes, DebugPanel
      });
    }

    if (document.readyState !== 'loading') init();
    else document.addEventListener('DOMContentLoaded', init);

    window.addEventListener('online', () => toast('Back online'));
    window.addEventListener('offline', () => toast('Offline — data still saves locally'));
