<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logostics">
<meta name="theme-color" content="#000000">
<title>Logostics Finance · Social</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
:root{--black:#000;--white:#fff;--bg:#000;--card:#121212;--text:#fff;--primary:#fff;--btn:#fff;--btn-text:#000;--on-accent:#000;--sheet:#0a0a0a;
--gray-950:#0a0a0a;--gray-900:#121212;--gray-850:#1a1a1a;--gray-800:#222;--gray-700:#2e2e2e;--gray-600:#3a3a3a;--gray-500:#555;--gray-400:#777;--gray-300:#999;--gray-200:#bbb;--gray-100:#ddd;
--green:#30d158;--green-glow:rgba(48,209,88,.15);--red:#ff453a;--orange:#ff9f0a;--glass:rgba(18,18,18,.72);--glass-deep:rgba(10,10,10,.85);
--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);
--ease:cubic-bezier(.32,.72,0,1);--ease-out:cubic-bezier(.16,1,.3,1);--nav-h:76px}
html{background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;height:100%}
body{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;padding-top:var(--safe-top);padding-left:var(--safe-left);padding-right:var(--safe-right);overflow-x:hidden;width:100%;max-width:100vw;user-select:none;letter-spacing:-.01em;position:relative;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 8px);-webkit-user-select:none;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none;touch-action:manipulation}
body.noauth{padding-bottom:24px}
body.noauth .bottom-nav,body.noauth .privacy-btn,body.noauth .ai-fab{display:none}
input,textarea{user-select:text;-webkit-user-select:text}
.app-lock{position:fixed;inset:0;background:var(--bg);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;animation:fade-in .2s ease}
.app-lock.on{display:flex}
.app-lock-icon{width:88px;height:88px;border-radius:28px;border:2px solid var(--gray-700);display:flex;align-items:center;justify-content:center;font-size:42px;filter:grayscale(1)}
.app-lock-title{font-size:22px;font-weight:700;letter-spacing:-.02em;text-align:center}
.app-lock-sub{font-size:14px;color:var(--gray-500);text-align:center;max-width:300px;line-height:1.5}
.app-lock-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:0;height:0}
.t-large{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--primary)}
.t-title{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--primary)}
.t-caption{font-size:12px;font-weight:500;color:var(--gray-400);letter-spacing:.01em}
.t-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em}
.glass-deep{background:var(--glass-deep);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);border:1px solid rgba(128,128,128,.12)}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(128,128,128,.12)}
.container{max-width:430px;margin:0 auto;padding:0 20px;width:100%}
.section{margin-bottom:28px}
.section-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:0 2px}
.top-header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 8px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.03em;color:var(--primary)}
.brand-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:middle;box-shadow:0 0 8px var(--green-glow);animation:pulse-dot 2s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;background:var(--gray-850);border:1px solid var(--gray-700);color:var(--gray-300);transition:all .2s var(--ease);font-family:inherit;position:relative}
.icon-btn:active{transform:scale(.9);background:var(--gray-800)}
.icon-btn.solid{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.hero{text-align:center;padding:32px 0 24px}
.hero-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px}
.hero-amount{font-size:64px;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;color:var(--primary);word-break:break-all}
.hero-status{font-size:12px;color:var(--gray-500);margin-top:10px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.status-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse-dot 2s ease-in-out infinite}
.cash-card{border-radius:28px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.cash-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.cash-main{font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.cash-main-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.cash-badge{padding:6px 12px;border-radius:20px;background:var(--green-glow);border:1px solid var(--green);color:var(--green);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cash-rows{border-top:1px solid var(--gray-800);padding-top:16px}
.cash-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px}
.cash-row .lbl{color:var(--gray-400);display:flex;align-items:center;gap:8px;font-weight:500}
.cash-row .amt{font-weight:600;font-variant-numeric:tabular-nums}
.cash-row .amt.pos{color:var(--green)}.cash-row .amt.neg{color:var(--gray-200)}
.cash-proj{margin-top:14px;padding-top:14px;border-top:1px solid var(--gray-800);display:flex;justify-content:space-between;align-items:baseline}
.cash-proj .lbl{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em}
.cash-proj .amt{font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--green);font-variant-numeric:tabular-nums}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px}
.quick-btn{border-radius:18px;padding:16px 8px 12px;text-align:center;cursor:pointer;transition:all .2s var(--ease);display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid var(--gray-800);font-family:inherit;color:var(--text)}
.quick-btn:active{transform:scale(.92);background:var(--gray-850)}
.quick-btn .ico{font-size:22px;line-height:1;filter:grayscale(1)}
.quick-btn.primary .ico{filter:none}
.quick-btn .lbl{font-size:10px;font-weight:600;color:var(--gray-400);letter-spacing:.02em}
.insight{border-radius:18px;padding:16px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--gray-800)}
.insight .ico{font-size:18px;flex-shrink:0;margin-top:1px;filter:grayscale(1)}
.insight .txt{font-size:13.5px;line-height:1.45;color:var(--gray-300);font-weight:400}
.insight .txt strong{color:var(--text);font-weight:600}
.activity-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;margin-bottom:6px;background:var(--card);border:1px solid var(--gray-800);transition:all .2s var(--ease);cursor:pointer;position:relative;touch-action:pan-y}
.activity-item:active{transform:scale(.98);background:var(--gray-850)}
.activity-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--gray-850);border:1px solid var(--gray-700);filter:grayscale(1)}
.activity-ico.income{filter:none;border-color:var(--green);background:var(--green-glow)}
.activity-body{flex:1;min-width:0}
.activity-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.activity-meta{font-size:11.5px;color:var(--gray-500);margin-top:2px;display:flex;gap:8px;font-weight:500}
.activity-amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;letter-spacing:-.01em}
.activity-amt.pos{color:var(--green)}.activity-amt.neg{color:var(--gray-200)}
.goal-card{border-radius:24px;padding:22px;margin-bottom:12px;background:var(--card);border:1px solid var(--gray-800);transition:all .2s var(--ease);cursor:pointer;position:relative}
.goal-card:active{transform:scale(.985)}
.goal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px}
.goal-name{font-size:17px;font-weight:700;letter-spacing:-.02em}
.goal-pct{font-size:12px;color:var(--gray-500);font-weight:600;margin-top:3px}
.goal-emoji{font-size:26px;filter:grayscale(1);opacity:.7}
.goal-card.active .goal-emoji{filter:none;opacity:1}
.goal-img{width:100%;height:110px;object-fit:cover;border-radius:14px;margin-bottom:14px;border:1px solid var(--gray-800)}
.goal-bar{width:100%;height:6px;background:var(--gray-800);border-radius:3px;overflow:hidden;margin:14px 0 10px}
.goal-fill{height:100%;border-radius:3px;background:var(--green);transition:width .7s var(--ease-out)}
.goal-stats{display:flex;justify-content:space-between;font-size:13px;color:var(--gray-400);font-weight:500;font-variant-numeric:tabular-nums}
.goal-stats .hl{color:var(--text);font-weight:600}
.goal-eta{margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-800);font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:6px;font-weight:500}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + var(--safe-bottom));z-index:100;border-top:1px solid var(--gray-800);transform:translateZ(0)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;border-radius:14px;cursor:pointer;transition:all .25s var(--ease);background:none;border:none;color:var(--gray-500);font-family:inherit;min-width:50px;touch-action:manipulation;position:relative}
.nav-item.active{color:var(--text)}
.nav-item.active .nav-ico{filter:none;transform:scale(1.05)}
.nav-item:active{transform:scale(.88)}
.nav-ico{font-size:21px;line-height:1;filter:grayscale(1);transition:all .25s var(--ease)}
.nav-lbl{font-size:10px;font-weight:600;letter-spacing:.01em}
.swipe-back-indicator{position:fixed;left:0;top:50%;transform:translateY(-50%);width:4px;height:60px;background:var(--green);border-radius:0 4px 4px 0;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
.swipe-back-indicator.on{opacity:.6}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:1000;display:none;align-items:flex-end;justify-content:center;animation:fade-in .25s ease}
.sheet-overlay.on{display:flex}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:430px;max-height:92vh;overflow-y:auto;border-radius:32px 32px 0 0;padding:12px 20px calc(24px + var(--safe-bottom));animation:slide-up .4s var(--ease-out);background:var(--sheet);border-top:1px solid var(--gray-800);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;color:var(--text)}
@keyframes slide-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-grip{width:36px;height:4px;background:var(--gray-600);border-radius:2px;margin:0 auto 20px}
.sheet-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:24px;text-align:center;color:var(--primary)}
.field{margin-bottom:18px}
.field-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:block}
.field-input{width:100%;background:var(--card);border:1px solid var(--gray-800);border-radius:14px;padding:16px;font-size:17px;color:var(--text);font-family:inherit;transition:all .2s var(--ease);-webkit-appearance:none;appearance:none;letter-spacing:-.01em}
.field-input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-glow)}
.field-input::placeholder{color:var(--gray-600)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:20px;background:var(--card);border:1px solid var(--gray-800);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);display:flex;align-items:center;gap:6px;color:var(--gray-300);font-family:inherit}
.chip:active{transform:scale(.92)}
.chip.selected{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.chip .emoji{filter:grayscale(1)}.chip.selected .emoji{filter:none}
.btn{padding:16px 24px;border-radius:14px;font-size:17px;font-weight:600;border:none;cursor:pointer;transition:all .2s var(--ease);font-family:inherit;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--btn);color:var(--btn-text)}
.btn-green{background:var(--green);color:var(--on-accent)}
.btn-secondary{background:var(--card);border:1px solid var(--gray-800);color:var(--text)}
.btn-danger{background:transparent;border:1px solid var(--gray-700);color:var(--gray-300)}
.btn-row{display:flex;gap:10px;margin-top:8px}.btn-row .btn{flex:1}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:10px;width:auto}
.empty{text-align:center;padding:56px 24px}
.empty-ico{font-size:44px;margin-bottom:18px;opacity:.3;filter:grayscale(1)}
.empty-title{font-size:17px;font-weight:600;margin-bottom:8px;letter-spacing:-.02em}
.empty-sub{font-size:14px;color:var(--gray-500);line-height:1.5;max-width:260px;margin:0 auto}
.toast{position:fixed;top:calc(20px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-140%);padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:2000;transition:transform .45s var(--ease-out);display:flex;align-items:center;gap:10px;max-width:90vw;background:var(--card);border:1px solid var(--gray-700);color:var(--text);letter-spacing:-.01em;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.privacy-btn{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);right:20px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:90;transition:all .25s var(--ease);background:var(--card);border:1px solid var(--gray-700);color:var(--gray-300);font-family:inherit}
.privacy-btn.active{background:var(--green);color:var(--on-accent);border-color:var(--green)}
.ai-fab{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);right:74px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;z-index:90;transition:all .25s var(--ease);background:var(--card);border:1px solid var(--gray-700);color:var(--text);font-family:inherit;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.ai-fab:active{transform:scale(.9)}
.privacy-blur{filter:blur(14px);transition:filter .35s var(--ease);pointer-events:none;user-select:none}
.fade-in{animation:fade-up .35s var(--ease-out)}
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stagger>*{animation:fade-up .4s var(--ease-out) backwards}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.14s}
.scroll-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.scroll-row>*{flex-shrink:0}
.segmented{display:flex;background:var(--card);border:1px solid var(--gray-800);border-radius:12px;padding:3px}
.seg{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:all .2s var(--ease);background:none;border:none;color:var(--gray-500);font-family:inherit}
.seg.active{background:var(--btn);color:var(--btn-text)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{border-radius:18px;padding:18px 16px;background:var(--card);border:1px solid var(--gray-800);text-align:center}
.stat-val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat-lbl{font-size:10px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.chart-card{border-radius:22px;padding:20px;margin-bottom:12px;background:var(--card);border:1px solid var(--gray-800)}
.chart-card h3{font-size:14px;font-weight:600;margin-bottom:18px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-radius:14px;margin-bottom:6px;background:var(--card);border:1px solid var(--gray-800);cursor:pointer;transition:all .2s var(--ease)}
.set-row:active{background:var(--gray-850);transform:scale(.985)}
.set-row.static{cursor:default}.set-row.static:active{transform:none}
.set-left{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500}
.set-left .ico{font-size:16px;width:20px;text-align:center;filter:grayscale(1);opacity:.7}
.set-right{color:var(--gray-500);font-size:13px;display:flex;align-items:center;gap:6px;font-weight:500}
.toggle{position:relative;width:50px;height:30px;background:var(--gray-700);border-radius:15px;cursor:pointer;transition:background .3s var(--ease);flex-shrink:0}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;background:#fff;border-radius:50%;transition:transform .3s var(--ease);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.toggle.on::after{transform:translateX(20px)}
.cap-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.04em;text-transform:uppercase}
.cap-badge.ok{background:var(--green-glow);color:var(--green);border:1px solid var(--green)}
.cap-badge.no{background:var(--gray-850);color:var(--gray-500);border:1px solid var(--gray-700)}
.cap-badge.warn{background:rgba(255,159,10,.12);color:#ff9f0a;border:1px solid rgba(255,159,10,.25)}
.patch-version{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.patch-date{font-size:11px;color:var(--gray-500);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.patch-section{margin-bottom:12px}
.patch-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--green);margin-bottom:6px}
.patch-section ul{list-style:none}
.patch-section li{font-size:13.5px;color:var(--gray-300);line-height:1.5;padding:3px 0 3px 16px;position:relative}
.patch-section li::before{content:'·';position:absolute;left:4px;color:var(--gray-500)}
.debug-row{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;font-size:12px;font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid var(--gray-800)}
.debug-row .k{color:var(--gray-500)}.debug-row .v{color:var(--text);font-weight:600;text-align:right;word-break:break-all}
.ai-chat-bubble{max-width:85%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.45;margin-bottom:10px;word-break:break-word;animation:bubble-in .3s var(--ease-out)}
@keyframes bubble-in{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.ai-bubble-user{background:var(--btn);color:var(--btn-text);margin-left:auto;border-bottom-right-radius:6px;font-weight:500}
.ai-bubble-assistant{background:var(--card);border:1px solid var(--gray-800);color:var(--text);margin-right:auto;border-bottom-left-radius:6px}

/* ═══ iPHONE: glass, glass sliders, voice, Siri ═══ */
:root{--glass-rgb:0,0,0;--g-blur:28px;--g-a:.62;--g-shine:.55}
.iphone.glass-on .bottom-nav{background:rgba(var(--glass-rgb),var(--g-a));backdrop-filter:blur(var(--g-blur)) saturate(190%);-webkit-backdrop-filter:blur(var(--g-blur)) saturate(190%);border-top:1px solid rgba(255,255,255,calc(var(--g-shine)*.2));box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--g-shine)*.16)),0 -10px 34px rgba(0,0,0,.28)}
.iphone.glass-on .sheet{background:rgba(var(--glass-rgb),calc(var(--g-a) + .24));backdrop-filter:blur(var(--g-blur)) saturate(190%);-webkit-backdrop-filter:blur(var(--g-blur)) saturate(190%);border-top:1px solid rgba(255,255,255,calc(var(--g-shine)*.24));box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--g-shine)*.2))}
.iphone.glass-on .toast,.iphone.glass-on .ai-fab,.iphone.glass-on .privacy-btn,.iphone.glass-on .ptr,.iphone.glass-on .edit-toolbar{background:rgba(var(--glass-rgb),var(--g-a));backdrop-filter:blur(var(--g-blur)) saturate(190%);-webkit-backdrop-filter:blur(var(--g-blur)) saturate(190%);border:1px solid rgba(255,255,255,calc(var(--g-shine)*.24));box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--g-shine)*.2)),0 8px 28px rgba(0,0,0,.3)}
.glass-slider{--v:50%;-webkit-appearance:none;appearance:none;display:block;width:100%;height:40px;margin:0;background:transparent;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
.glass-slider::-webkit-slider-runnable-track{height:12px;border-radius:99px;background:linear-gradient(90deg,var(--green) 0,var(--green) var(--v),rgba(127,127,127,.28) var(--v));box-shadow:inset 0 1px 3px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.glass-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:46px;height:28px;margin-top:-9px;border-radius:99px;border:1px solid rgba(255,255,255,.6);background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.44));-webkit-backdrop-filter:blur(8px) saturate(160%);backdrop-filter:blur(8px) saturate(160%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.95),inset 0 -3px 6px rgba(0,0,0,.14),0 4px 14px rgba(0,0,0,.4);transition:transform .18s var(--ease)}
.glass-slider:active::-webkit-slider-thumb{transform:scale(1.14)}
.glass-slider:focus-visible::-webkit-slider-thumb{outline:2px solid var(--green);outline-offset:2px}
.glass-slider::-moz-range-track{height:12px;border-radius:99px;background:rgba(127,127,127,.28)}.glass-slider::-moz-range-progress{height:12px;border-radius:99px;background:var(--green)}
.glass-slider::-moz-range-thumb{width:46px;height:28px;border-radius:99px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.7)}
.gs{padding:12px 16px 4px;border-radius:14px;margin-bottom:6px;background:var(--card);border:1px solid var(--gray-800)}
.gs.dim{opacity:.45;pointer-events:none}
.gs-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600}
.gs-top b{color:var(--green);font-variant-numeric:tabular-nums;font-size:13px}
.gs-note{font-size:11.5px;color:var(--gray-500);margin:-2px 0 4px;line-height:1.4}
.gprev{position:relative;height:124px;border-radius:18px;overflow:hidden;margin-bottom:8px;background:linear-gradient(135deg,#ff7a59,#ff3d81 38%,#6a5cff 72%,#12c2e9);isolation:isolate}
.gprev i{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);z-index:-1}
.gprev .gp-glass{position:absolute;left:14px;right:14px;bottom:12px;height:56px;border-radius:20px;display:flex;align-items:center;justify-content:space-around;font-size:12px;font-weight:700;color:var(--text);background:rgba(var(--glass-rgb),var(--g-a));backdrop-filter:blur(var(--g-blur)) saturate(190%);-webkit-backdrop-filter:blur(var(--g-blur)) saturate(190%);border:1px solid rgba(255,255,255,calc(var(--g-shine)*.3));box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--g-shine)*.3)),0 8px 24px rgba(0,0,0,.3)}
.gprev.off .gp-glass{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none;border-color:var(--gray-800);box-shadow:none}
.mic-btn{width:50px;flex:none;border-radius:14px;border:1px solid var(--gray-800);background:var(--card);font-size:20px;color:var(--text);font-family:inherit}

@keyframes micpulse{50%{transform:scale(1.08)}}
.sr-code{font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;background:var(--gray-900);border:1px solid var(--gray-800);border-radius:10px;padding:10px;word-break:break-all;user-select:text;-webkit-user-select:text;margin:8px 0}

@media (prefers-reduced-motion:reduce){.mic-btn.rec{animation:none}.glass-slider::-webkit-slider-thumb{transition:none}}

const inc=pending(tid,me);
if(inc){inc.status='accepted';inc.updatedAt=nowISO();makeFriends(d,me,tid);pushNotif(d,{to:tid,type:'friend_accepted',actor:me,title:'Friend request accepted',message:`${nm(d.users[me])} is now your friend`,ref:{kind:'user',id:me}});d.notifs=d.notifs.filter(n=>!(n.to===me&&n.type==='friend_request'&&n.ref&&n.ref.id===inc.id));logAct(d,me,'friend',`became friends with ${nm(t)}`);res={ok:true,accepted:true,user:nm(t)};return}
const r={id:genId('r_'),from:me,to:tid,status:'pending',createdAt:nowISO(),updatedAt:nowISO()};d.requests.push(r);
pushNotif(d,{to:tid,type:'friend_request',actor:me,title:'New friend request',message:`${nm(d.users[me])} (@${d.users[me].username}) wants to be friends`,ref:{kind:'request',id:r.id}});
res={ok:true,user:nm(t)}},{kind:'friend'});return res}
function respond(rid,accept){let res={ok:false,error:'Request not found'};
commit(d=>{const r=d.requests.find(x=>x.id===rid&&x.to===me&&x.status==='pending');if(!r)return;

r.status=accept?'accepted':'declined';r.updatedAt=nowISO();if(accept)d.requests.forEach(x=>{if(x.status==='pending'&&x.from===me&&x.to===r.from){x.status='accepted';x.updatedAt=nowISO()}});d.notifs=d.notifs.filter(n=>!(n.to===me&&n.type==='friend_request'&&n.ref&&n.ref.id===rid));
if(accept){makeFriends(d,me,r.from);pushNotif(d,{to:r.from,type:'friend_accepted',actor:me,title:'Friend request accepted',message:`${nm(d.users[me])} accepted your friend request`,ref:{kind:'user',id:me}});logAct(d,me,'friend',`became friends with ${nm(d.users[r.from])}`)}

function cancelRequest(rid){commit(d=>{const r=d.requests.find(x=>x.id===rid&&x.from===me&&x.status==='pending');if(!r)return;r.status='cancelled';r.updatedAt=nowISO();d.notifs=d.notifs.filter(n=>!(n.type==='friend_request'&&n.ref&&n.ref.id===rid))},{kind:'friend'});return{ok:true}}
function removeFriend(o){commit(d=>{const[x,y]=sorted(me,o);const f=d.friendships.find(f=>f.a===x&&f.b===y&&f.status==='active');if(f){f.status='removed';f.updatedAt=nowISO()}},{kind:'friend'});return{ok:true}}
function block(o){if(o===me)return{ok:false,error:"You can't block yourself"};commit(d=>{if(!d.blocks.some(x=>x.by===me&&x.target===o))d.blocks.push({by:me,target:o,at:nowISO()});const[x,y]=sorted(me,o);const f=d.friendships.find(f=>f.a===x&&f.b===y&&f.status==='active');if(f){f.status='removed';f.updatedAt=nowISO()}

/* — lists — */
const rank={online:0,away:1,offline:2};
function friends(){return friendIds(me).map(id=>user(id)).filter(Boolean).sort((a,b)=>rank[a.presence]-rank[b.presence]||a.displayName.localeCompare(b.displayName))}
function incoming(){return db.requests.filter(r=>r.status==='pending'&&r.to===me&&db.users[r.from]&&!blockedEither(me,r.from)).map(r=>({id:r.id,at:r.createdAt,user:user(r.from)}))}
function sent(){return db.requests.filter(r=>r.status==='pending'&&r.from===me&&db.users[r.to]&&!blockedEither(me,r.to)).map(r=>({id:r.id,at:r.createdAt,user:user(r.to)}))}
function blockedList(){return db.blocks.filter(b=>b.by===me&&db.users[b.target]).map(b=>user(b.target))}
function mutualUsers(o){return mutualIds(o).map(id=>user(id))}
function suggestions(){if(!me)return[];const dis=new Set(db.dismissed[me]||[]),score={},why={};const mine=friendIds(me);
const add=(id,pts,reason)=>{if(id===me||dis.has(id)||!db.users[id]||blockedEither(me,id)||isFriend(me,id)||pending(me,id)||pending(id,me))return;score[id]=(score[id]||0)+pts;(why[id]=why[id]||[]).push(reason)};
mine.forEach(f=>friendIds(f).forEach(o=>add(o,2,'mutual')));
db.groups.forEach(g=>{if(g.members.some(m=>m.userId===me))g.members.forEach(m=>add(m.userId,1,'group:'+g.name))});
return Object.keys(score).sort((a,b)=>score[b]-score[a]).map(id=>({user:user(id),mutual:mutualIds(id).length,groups:(why[id]||[]).filter(w=>w.startsWith('group:')).map(w=>w.slice(6))}))}

function pendingCount(){return incoming().length}

/* — notifications — */
const myNotifs=()=>db.notifs.filter(n=>n.to===me&&(!n.expiresAt||n.expiresAt>nowISO()));

function markRead(id){commit(d=>{const n=d.notifs.find(x=>x.id===id&&x.to===me);if(n)n.read=true},{kind:'notif'})}
function markAllRead(){commit(d=>{d.notifs.forEach(n=>{if(n.to===me)n.read=true})},{kind:'notif'})}

/* — profile — */
function updateProfile(p){let res={ok:true};commit(d=>{const u=d.users[me];if(!u){res={ok:false,error:'Not signed in'};return}
if(p.username!==undefined){const n=String(p.username).trim().replace(/^@/,'').toLowerCase();if(n!==u.username){if(Cloud.on()){res={ok:false,error:'Usernames cannot be changed while cloud sync is on'};return}if(!/^[a-z0-9_]{3,20}$/.test(n)){res={ok:false,error:'Username: 3–20 letters, numbers or _ only (no spaces, @ or dots)'};return}if(Object.values(d.users).some(x=>x.id!==me&&x.username===n)){res={ok:false,error:'Username already taken'};return}u.username=n}}
if(p.displayName!==undefined)u.displayName=String(p.displayName).trim().slice(0,30)||u.username;

if(p.avatar!==undefined){const a=String(p.avatar);u.avatar=a.startsWith('data:')?(Avatar.valid(a)?a:u.avatar||'👤'):[...a].slice(0,6).join('')||'👤'}

if(p.privacy)u.privacy=Object.assign(u.privacy||{},{showCode:p.privacy.showCode!==false,showActivity:p.privacy.showActivity!==false})},{kind:'profile'});return res}
function saveUserSettings(prefs,income){if(Cloud.on()){Cloud.setPriv(me,{prefs,income});Bus.emit('db',{local:true,kind:'settings'});return}commit(d=>{const u=d.users[me];if(u){u.prefs=prefs;u.income=income}},{kind:'settings'})}

/* — shares — */
function viewersOf(d,s){const o=s.owner;let ids=[];if(s.visibility==='friends')ids=friendIds(o);else if(s.visibility==='users')ids=(s.userIds||[]).filter(x=>isFriend(o,x));else if(s.visibility==='group'){const g=d.groups.find(g=>g.id===s.groupId);ids=g?g.members.map(m=>m.userId):[]}return ids.filter(x=>x!==o&&d.users[x]&&!blockedEither(o,x))}

/* — group goals — */
const isMember=(g,id)=>g.members.some(m=>m.userId===id);
const gVisible=(g,id)=>isMember(g,id)||(g.visibility==='friends'&&isFriend(g.creatorId,id)&&!blockedEither(g.creatorId,id));

function createGroup(o){if(!me)return{ok:false,error:'Not signed in'};let res;
commit(d=>{const t=nowISO();const g={id:genId('gg_'),name:String(o.name||'').trim().slice(0,60),description:String(o.description||'').slice(0,240),image:o.image||'',target:Math.abs(Number(o.target)||0),deadline:o.deadline||null,visibility:o.visibility==='private'?'private':'friends',creatorId:me,archived:false,createdAt:t,updatedAt:t,members:[{userId:me,role:'owner',contribution:0,weeklyContribution:0,joinedAt:t}],log:[]};
if(!g.name||g.target<=0){res={ok:false,error:'Name and target are required'};return}
(o.members||[]).forEach(id=>{if(id!==me&&isFriend(me,id)&&!blockedEither(me,id)){g.members.push({userId:id,role:'member',contribution:0,weeklyContribution:0,joinedAt:t});pushNotif(d,{to:id,type:'goal_invite',actor:me,title:'Group goal invitation',message:`${nm(d.users[me])} added you to "${g.name}"`,ref:{kind:'group',id:g.id}})}});
glog(g,'created','created the goal');d.groups.push(g);logAct(d,me,'group',`created the group goal "${g.name}"`);res={ok:true,id:g.id}},{kind:'group'});return res}

function updateGroup(id,p){let res={ok:false,error:'Only the creator can edit this goal'};commit(d=>{const g=ownerGroup(d,id);if(!g)return;
if(p.name!==undefined){const n=String(p.name).trim().slice(0,60);if(!n){res={ok:false,error:'Name required'};return}g.name=n}
if(p.description!==undefined)g.description=String(p.description).slice(0,240);
if(p.image!==undefined)g.image=p.image;
if(p.target!==undefined){const t=Math.abs(Number(p.target)||0);if(t<=0){res={ok:false,error:'Target must be above zero'};return}g.target=t}

glog(g,'updated','updated goal details');g.members.forEach(m=>{if(m.userId!==me)pushNotif(d,{to:m.userId,type:'group_update',actor:me,title:'Group goal updated',message:`${nm(d.users[me])} updated "${g.name}"`,ref:{kind:'group',id:g.id}})});res={ok:true}},{kind:'group'});return res}
function addMember(id,uid){let res={ok:false,error:'Only the creator can add members'};commit(d=>{const g=ownerGroup(d,id);if(!g)return;if(isMember(g,uid)){res={ok:false,error:'Already a member'};return}if(!isFriend(me,uid)||blockedEither(me,uid)){res={ok:false,error:'You can only add friends'};return}
g.members.push({userId:uid,role:'member',contribution:0,weeklyContribution:0,joinedAt:nowISO()});glog(g,'added',`added ${nm(d.users[uid])}`);pushNotif(d,{to:uid,type:'goal_invite',actor:me,title:'Group goal invitation',message:`${nm(d.users[me])} added you to "${g.name}"`,ref:{kind:'group',id:g.id}});res={ok:true}},{kind:'group'});return res}
function removeMember(id,uid){let res={ok:false,error:'Only the creator can remove members'};commit(d=>{const g=ownerGroup(d,id);if(!g)return;if(uid===me){res={ok:false,error:'Creator cannot be removed'};return}const before=g.members.length;g.members=g.members.filter(m=>m.userId!==uid);if(g.members.length!==before){glog(g,'removed',`removed ${nm(d.users[uid])}`);pushNotif(d,{to:uid,type:'group_update',actor:me,title:'Removed from group goal',message:`You were removed from "${g.name}"`,ref:null})}d.shares=d.shares.filter(s=>!(s.groupId===id&&s.owner===uid));res={ok:true}},{kind:'group'});return res}
function leaveGroup(id){let res={ok:false,error:'Not a member'};commit(d=>{const g=d.groups.find(x=>x.id===id);if(!g||!isMember(g,me))return;if(g.creatorId===me){res={ok:false,error:'The creator can archive or delete the goal instead of leaving'};return}g.members=g.members.filter(m=>m.userId!==me);glog(g,'left','left the goal');d.shares=d.shares.filter(s=>!(s.groupId===id&&s.owner===me));pushNotif(d,{to:g.creatorId,type:'group_update',actor:me,title:'Member left',message:`${nm(d.users[me])} left "${g.name}"`,ref:{kind:'group',id:g.id}});res={ok:true}},{kind:'group'});return res}
function contribute(id,amt){amt=Number(amt);if(!(amt>0))return{ok:false,error:'Enter a valid amount'};let res={ok:false,error:'Not a member'};commit(d=>{const g=d.groups.find(x=>x.id===id);if(!g||!isMember(g,me))return;if(g.archived){res={ok:false,error:'This goal is archived'};return}const m=g.members.find(m=>m.userId===me);m.contribution=Math.round(((Number(m.contribution)||0)+amt)*100)/100;glog(g,'contribution',`added ${fmt(amt)}`,amt);
const tot=g.members.reduce((s,x)=>s+x.contribution,0);const done=tot>=g.target&&tot-amt<g.target;
g.members.forEach(x=>{if(x.userId!==me)pushNotif(d,{to:x.userId,type:'group_update',actor:me,title:done?'Group goal reached! 🎉':'Group goal progress',message:done?`"${g.name}" hit its target`:`${nm(d.users[me])} added ${fmt(amt)} to "${g.name}"`,ref:{kind:'group',id:g.id}})});res={ok:true,done}},{kind:'group'});return res}
function setWeekly(id,amt){amt=Math.max(0,Number(amt)||0);commit(d=>{const g=d.groups.find(x=>x.id===id);if(!g||!isMember(g,me))return;const m=g.members.find(m=>m.userId===me);m.weeklyContribution=amt;glog(g,'rate',`set weekly contribution to ${fmt(amt)}`)},{kind:'group'});return{ok:true}}
function archiveGroup(id,v){let res={ok:false,error:'Only the creator can archive'};commit(d=>{const g=ownerGroup(d,id);if(!g)return;g.archived=!!v;glog(g,'archive',v?'archived the goal':'restored the goal');res={ok:true}},{kind:'group'});return res}
function deleteGroup(id){let res={ok:false,error:'Only the creator can delete'};commit(d=>{const g=ownerGroup(d,id);if(!g)return;g.members.forEach(m=>{if(m.userId!==me)pushNotif(d,{to:m.userId,type:'group_update',actor:me,title:'Group goal deleted',message:`"${g.name}" was deleted by ${nm(d.users[me])}`,ref:null})});d.groups=d.groups.filter(x=>x.id!==id);d.shares=d.shares.filter(s=>s.groupId!==id);res={ok:true}},{kind:'group'});return res}

/* ═══ ADMIN / DEVELOPER (owner only; every call re-verifies) ═══ */
const Admin=(function(){

const allowed=()=>Accounts.isDev(db.users[me]);
