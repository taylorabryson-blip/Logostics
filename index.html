    /* ═══════════════════════════════════════════════════════════

       ═══════════════════════════════════════════════════════════ */
    *, *::before, *::after {

      overflow-x: hidden; width: 100%; max-width: 100vw;
      user-select: none; letter-spacing: -0.01em; position: relative;

    const NotificationScheduler = (function() {
      let scheduledTimeouts = [];
      function requestPermission() {
        if (!('Notification' in window)) return Promise.resolve({ granted: false, reason: 'Notification API not supported' });
        if (PlatformCapabilities.env.isIOS && !PlatformCapabilities.env.isStandalone) return Promise.resolve({ granted: false, reason: 'iOS requires Home Screen install (iOS 16.4+)', requiresInstall: true });
        return Notification.requestPermission().then(r => ({ granted: r === 'granted', permission: r })).catch(e => ({ granted: false, reason: e.message }));
      }
      async function send(title, body, tag) {
        if (!('Notification' in window)) return { sent: false, reason: 'Notification API not supported' };
        if (Notification.permission !== 'granted') return { sent: false, reason: 'Permission not granted' };
        try {
          const reg = await navigator.serviceWorker?.ready;
          if (reg && reg.showNotification) { await reg.showNotification(title, { body, tag: tag || 'logostics' }); SoundManager.notification(); return { sent: true }; }
          const n = new Notification(title, { body, tag: tag || 'logostics' }); setTimeout(() => { try { n.close(); } catch (e) {} }, 6000);
          SoundManager.notification(); return { sent: true };
        } catch (e) { return { sent: false, reason: e.message }; }
      }
      function scheduleInSession(title, body, delayMs, tag) { const id = setTimeout(() => { send(title, body, tag); }, delayMs); scheduledTimeouts.push(id); return id; }
      function clearScheduled() { scheduledTimeouts.forEach(clearTimeout); scheduledTimeouts = []; }
      async function checkAndFire() {
        if (!Store.preferences.notificationsEnabled) return;
        const cats = Store.preferences.notifCategories || {};
        const today = new Date(); today.setHours(0,0,0,0); const dayOfWeek = today.getDay();
        if (cats.payday && cats.payday.enabled) { const inc = Store.incomeSettings; if (inc.payFrequency === 'weekly' && dayOfWeek === 5) await send('💰 Payday today', 'Check your new paycheck.', 'payday'); }
        const movingGoals = Store.getMovingGoals();
        for (const g of movingGoals) { if (!g.targetDate) continue; const target = new Date(g.targetDate); const days = Math.ceil((target - today) / 864e5); const cat = cats.movingGoalDeadline || {}; if (cat.enabled && days <= (cat.leadDays || 7) && days > 0) await send('📍 Moving goal deadline approaching', `"${g.name}" is due in ${days} days.`, 'movingGoalDeadline'); }
        const debts = Store.getDebts();
        const debtCat = cats.moneyOwed || {};
        if (debtCat.enabled) {
          debts.forEach(d => {
            if (d.direction === 'owed') {
              const last = d.lastReminded ? new Date(d.lastReminded).getTime() : 0;
              if (Date.now() - last > 24 * 3600 * 1000) {
                send('💸 Payment reminder', `${d.person} owes you ${fmt(d.amount)}`, 'debt-reminder');
                d.lastReminded = new Date().toISOString(); d.reminderCount = (d.reminderCount || 0) + 1;
              }
            }
          });
          if (debts.some(d => d.direction === 'owed')) Store.updatePreferences({ debts });
        }
      }
      return { requestPermission, send, scheduleInSession, clearScheduled, checkAndFire };
    })();

      function matchIntent(q) {
        const lower = q.toLowerCase().trim();
        if (/(friend|code|social|add friend)/.test(lower)) return { action: 'social' };
        if (/(owe|owed|debt|borrow|remind)/.test(lower)) return { action: 'debt' };
        if (/(game|play|flip|dice|coin)/.test(lower)) return { action: 'game' };
        if (/(share.*goal|send.*goal)/.test(lower)) return { action: 'share' };
        if (/(next paycheck|expected paycheck)/.test(lower)) return { action: 'answer', tool: 'getIncomeEstimate', template: 'incomeNext' };
        if (/(how much|what).*(spend|spent|spending)/.test(lower)) return { action: 'answer', tool: 'getTotalSpending', args: [7], template: 'spending7' };
        if (/(how much|what).*(income|earn)/.test(lower)) return { action: 'answer', tool: 'getTotalIncome', args: [30], template: 'income30' };
        if (/balance|cash|money|have/.test(lower)) return { action: 'answer', tool: 'getBalance', template: 'balance' };
        if (/goal/.test(lower)) return { action: 'answer', tool: 'getGoals', template: 'goals' };
        if (/(hi|hey|hello)/.test(lower)) return { action: 'greeting' };
        if (/help/.test(lower)) return { action: 'help' };
        return { action: 'unknown' };
      }
      function formatToolResult(template, result) {
        switch (template) {
          case 'balance': return `Your balance is ${fmt(result.balance)}.`;
          case 'spending7': return `You've spent ${fmt(result)} in the last 7 days.`;
          case 'income30': return `You've earned ${fmt(result)} in the last 30 days.`;
          case 'incomeNext': return `Estimated next paycheck: about ${fmt(result.nextPaycheck)}.`;
          case 'goals': if (!result.length) return "No goals yet."; return result.map(g => `"${g.name}": ${fmt(g.current)} of ${fmt(g.target)} — ${g.pct}% complete.`).join('\n');
          default: return typeof result === 'string' ? result : JSON.stringify(result);
        }
      }
      async function answer(question) {
        const intent = matchIntent(question);
        if (intent.action === 'greeting') return { reply: "Hey! Ask me about your balance, spending, friends, debts, or say 'play a game'." };
        if (intent.action === 'help') return { reply: "I can answer questions, manage debts, share goals, and play games. Try: 'Who owes me?', 'Share my goal with Alex', or 'Flip a coin with Jordan'." };
        if (intent.action === 'social') return { reply: "Go to the Friends tab to find your friend code and add people!" };
        if (intent.action === 'debt') { const debts = Store.getDebts(); if (!debts.length) return { reply: "No debts tracked. Add one from the Friends tab." }; return { reply: debts.map(d => `${d.person} ${d.direction === 'owe' ? 'you owe' : 'owes you'} ${fmt(d.amount)}`).join('\n') }; }

        return { reply: "I'm not sure I understood. Try asking about balance, debts, friends, or games." };
      }

    function clearAllMaps() { activeMaps.forEach((entry) => { try { entry.map.remove(); } catch (e) {} }); activeMaps.clear(); }
    function fmt(n) { if (n === undefined || n === null || !isFinite(n)) return '$0.00'; const abs = Math.abs(n); const str = abs.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); return '$' + str; }
    function fmtDate(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d.getTime())) return ''; const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()); const target = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const diff = Math.round((today - target) / 864e5); if (diff === 0) return 'Today'; if (diff === 1) return 'Yesterday'; if (diff === -1) return 'Tomorrow'; if (diff > 0 && diff < 7) return diff + 'd ago'; if (diff < 0 && diff > -7) return 'in ' + Math.abs(diff) + 'd'; return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined }); }
    function fmtDateLong(iso) { if (!iso) return 'Not available'; const d = new Date(iso); if (isNaN(d.getTime())) return 'Not available'; return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); }
    function fmtMonthYear(date) { if (!date) return ''; const d = new Date(date); if (isNaN(d.getTime())) return ''; return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); }
    function timeAgo(ts) { const s = Math.floor((Date.now() - ts) / 1000); if (s < 5) return 'just now'; if (s < 60) return s + 's ago'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; }
    function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function haptic(style) { if (!Store.preferences.hapticsEnabled) return; if (typeof navigator.vibrate === 'function') { const patterns = { light: 8, medium: 14, heavy: 22, success: [10, 40, 10], error: [20, 30, 20, 30, 20] }; try { navigator.vibrate(patterns[style] || 10); } catch (e) {} } if (NativeBridge.available) NativeBridge.setHaptic(style); }
    function toast(msg) {

          </div>

          ${suggestions.length > 0 ? `
            <div class="friend-section">
              <div class="friend-section-header"><span class="friend-section-title">Suggested</span><span class="friend-section-count">${suggestions.length}</span></div>
              ${suggestions.map(s => `
                <div class="friend-row">
                  <div style="width:40px;height:40px;border-radius:50%;background:var(--gray-850);border:1px solid var(--gray-700);display:flex;align-items:center;justify-content:center;font-size:18px;">${s.avatar || '👤'}</div>
                  <div style="flex:1;min-width:0;">
                    <div class="friend-name">${escapeHtml(s.displayName)}</div>
                    <div class="friend-status">${escapeHtml(s.username || '')}${s.mutualCount > 0 ? ` · ${s.mutualCount} mutual` : ''}</div>
                  </div>
                  <button onclick="event.stopPropagation();SocialManager.sendRequestTo('${s.friendCode}')" style="background:var(--green);border:none;color:var(--black);padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;">Add</button>
                  <button onclick="event.stopPropagation();SocialManager.dismissSuggestion('${s.id}')" style="background:transparent;border:1px solid var(--gray-700);color:var(--gray-300);padding:8px 10px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">✕</button>

          ` : ''}

          <div class="friend-section">
            <div class="friend-section-header"><span class="friend-section-title">Debts</span></div>
            ${(Store.getDebts()).length === 0 ? `<div class="social-card" style="text-align:center;color:var(--gray-500);font-size:13px;">No debts tracked. Add one below.</div>` : (Store.getDebts()).map(d => `

                <div><div class="who">${escapeHtml(d.person)}</div><div style="font-size:11px;color:var(--gray-500);">${d.direction === 'owe' ? 'You owe' : 'Owes you'}${d.reminderCount ? ' · ' + d.reminderCount + ' reminders' : ''}</div></div>

              <button class="btn btn-secondary" style="padding:12px;font-size:14px;" onclick="SocialManager.openAddDebt('owed')">+ Owed to you</button>

            </div>
          </div>

          ${blocked.length > 0 ? `
            <div class="friend-section">
              <div class="friend-section-header"><span class="friend-section-title">Blocked</span><span class="friend-section-count">${blocked.length}</span></div>
              ${blocked.map(id => `<div class="friend-row"><div style="flex:1;"><div class="friend-name">User ${escapeHtml(id)}</div></div><button onclick="Store.unblockUser('${id}');render();" style="background:transparent;border:1px solid var(--gray-700);color:var(--gray-300);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Unblock</button></div>`).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderFriendRow(f) {
      return `
        <div class="friend-row" onclick="SocialManager.openFriendProfile('${f.id}')">
          <div style="width:40px;height:40px;border-radius:50%;background:var(--gray-850);border:1px solid var(--gray-700);display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;">
            ${f.avatar || '👤'}
            <span style="position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:${f.isOnline !== false ? 'var(--green)' : 'var(--gray-600)'};border:2px solid var(--gray-900);"></span>

            <div class="friend-name">${escapeHtml(f.name)}</div>

          </div>
          <button onclick="event.stopPropagation();SocialManager.openFriendProfile('${f.id}')" style="background:var(--gray-850);border:1px solid var(--gray-700);color:var(--gray-300);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Profile</button>
        </div>

    }

    SocialManager.sendRequestTo = function(code) {
      const result = Store.sendFriendRequest(code);
      if (!result.ok) { toast(result.error || 'Could not send request'); return; }
      toast('Friend request sent!');
      haptic('success'); SoundManager.success();
      render();
    };

    // ── NOTIFICATIONS ──
    function renderNotifications() {
      const notifs = Store.getNotifications();
      return `
        <div class="container fade-in">
          <div class="top-header">
            <div class="t-large">Notifications</div>
            ${notifs.length > 0 ? `<button class="icon-btn" onclick="Store.markAllNotifsRead();render();" title="Mark all read">✓</button>` : ''}
          </div>
          ${notifs.length === 0 ? `<div class="empty"><div class="empty-ico">🔔</div><div class="empty-title">No notifications</div><div class="empty-sub">You're all caught up.</div></div>` : notifs.map(n => `
            <div class="activity-item" style="background:${n.read ? 'var(--gray-900)' : 'var(--gray-850)'};" onclick="openNotifDetail('${n.id}')">
              <div class="activity-ico" style="filter:none;">${notifIcon(n.type)}</div>
              <div class="activity-body">
                <div class="activity-name">${escapeHtml(n.title)}</div>
                <div class="activity-meta"><span>${escapeHtml(n.message)}</span><span>·</span><span>${timeAgo(new Date(n.createdAt).getTime())}</span></div>
              </div>
              ${!n.read ? `<span style="width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;"></span>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }
    function notifIcon(type) {
      const map = { friend_request: '👋', friend_accepted: '✓', friend_request_sent: '↗', goal_shared: '🎯', group_invite: '👥', admin: '📢', system: '◈' };
      return map[type] || '🔔';
    }
    function openNotifDetail(id) {
      const n = Store.getNotifications().find(x => x.id === id);
      if (!n) { toast('Notification not found'); return; }
      Store.markNotifRead(id);
      openSheet(`
        <div class="sheet-title">${escapeHtml(n.title)}</div>
        <div style="text-align:center;margin-bottom:20px;">
          <div style="font-size:44px;margin-bottom:10px;">${notifIcon(n.type)}</div>
          <div style="font-size:15px;color:var(--gray-300);line-height:1.5;">${escapeHtml(n.message)}</div>
          <div style="font-size:11px;color:var(--gray-500);margin-top:10px;">${fmtDateLong(n.createdAt)} · ${timeAgo(new Date(n.createdAt).getTime())}</div>
        </div>
        <button class="btn btn-secondary" onclick="Store.deleteNotif('${n.id}');closeSheet();render();">Delete</button>
        <button class="btn btn-primary" style="margin-top:8px;" onclick="closeSheet();render();">Close</button>
      `);
      render();
    }

    // ── PROFILE (self) ──
    function renderProfile() {
      const p = Store.getProfile();
      const friends = Store.getFriends();
      const goals = Store.getAllGoals();
      const debts = Store.getDebts();
      return `
        <div class="container fade-in">
          <div class="top-header">
            <div class="t-large">Profile</div>
            <button class="icon-btn" onclick="openProfileEditor()">✎</button>
          </div>
          <div class="social-card" style="text-align:center;padding:28px 20px;background:linear-gradient(160deg, var(--gray-850), var(--gray-900));">
            <div style="width:88px;height:88px;border-radius:50%;background:var(--gray-800);border:2px solid var(--gray-700);display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto 14px;">${p.avatar || '👤'}</div>
            <div style="font-size:24px;font-weight:700;">${escapeHtml(p.displayName || 'You')}</div>
            <div style="font-size:13px;color:var(--gray-400);margin-top:4px;">${escapeHtml(p.username || '@you')}</div>
            ${p.bio ? `<div style="font-size:13px;color:var(--gray-400);margin-top:10px;line-height:1.5;">${escapeHtml(p.bio)}</div>` : ''}
            <div class="friend-code" style="display:inline-block;margin-top:14px;font-size:16px;cursor:pointer;" onclick="SocialManager.copyFriendCode()">${escapeHtml(p.friendCode)}</div>
            <div style="font-size:11px;color:var(--gray-500);margin-top:6px;">Joined ${fmtDateLong(p.createdAt)}</div>
          </div>

          <div class="stat-grid">
            <div class="stat"><div class="stat-val">${friends.length}</div><div class="stat-lbl">Friends</div></div>
            <div class="stat"><div class="stat-val">${goals.length}</div><div class="stat-lbl">Goals</div></div>
            <div class="stat"><div class="stat-val">${Store.getGroupGoals().length}</div><div class="stat-lbl">Group Goals</div></div>
            <div class="stat"><div class="stat-val">${debts.length}</div><div class="stat-lbl">Debts</div></div>
          </div>

          <div class="set-row" onclick="openProfileEditor()"><div class="set-left"><span class="ico">✎</span> Edit Profile</div><div class="set-right">›</div></div>
          <div class="set-row" onclick="openCustomization()"><div class="set-left"><span class="ico">🎨</span> App Customization</div><div class="set-right">›</div></div>
          <div class="set-row" onclick="openSettings()"><div class="set-left"><span class="ico">⚙</span> Settings</div><div class="set-right">›</div></div>
          <div class="set-row" onclick="openPatchNotes()"><div class="set-left"><span class="ico">✦</span> Patch Notes</div><div class="set-right">${PatchNotes.getCurrentVersion()} ›</div></div>
        </div>
      `;
    }

    function openProfileEditor() {
      const p = Store.getProfile();
      openSheet(`
        <div class="sheet-title">Edit Profile</div>
        <div class="field"><label class="field-label">Display Name</label><input class="field-input" id="p-display" value="${escapeHtml(p.displayName || '')}" autofocus></div>
        <div class="field"><label class="field-label">Username</label><input class="field-input" id="p-username" value="${escapeHtml(p.username || '')}"></div>
        <div class="field"><label class="field-label">Bio</label><input class="field-input" id="p-bio" value="${escapeHtml(p.bio || '')}" placeholder="A short bio"></div>
        <div class="field"><label class="field-label">Avatar (emoji)</label><input class="field-input" id="p-avatar" value="${escapeHtml(p.avatar || '👤')}" maxlength="4"></div>
        <div class="field"><label class="field-label">Status</label><div class="chips" id="p-status">
          ${['online','away','offline'].map(s => `<button class="chip ${p.status === s ? 'selected' : ''}" onclick="pickChip(this)" data-status="${s}">${s}</button>`).join('')}
        </div></div>
        <button class="btn btn-primary" onclick="submitProfile()">Save Profile</button>
        <button class="btn btn-secondary" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>
      `);
    }
    async function submitProfile() {
      const displayName = document.getElementById('p-display').value.trim() || 'You';
      const username = document.getElementById('p-username').value.trim() || '@you';
      const bio = document.getElementById('p-bio').value.trim();
      const avatar = document.getElementById('p-avatar').value.trim() || '👤';
      const status = document.querySelector('#p-status .chip.selected')?.dataset.status || 'online';
      await Store.updateProfile({ displayName, username, bio, avatar, status });
      toast('Profile saved'); haptic('success'); SoundManager.success();
      closeSheet(); render();
    }

    function openCustomization() {
      const a = Store.preferences.appearance || {};
      const presets = {
        default: { primaryColor: '#ffffff', accentColor: '#30d158', bg: '#000000' },
        midnight: { primaryColor: '#bbbbbb', accentColor: '#5e5ce6', bg: '#0a0a0a' },
        ocean: { primaryColor: '#ffffff', accentColor: '#0a84ff', bg: '#001018' },
        forest: { primaryColor: '#ffffff', accentColor: '#30d158', bg: '#07120a' },
        purple: { primaryColor: '#ffffff', accentColor: '#bf5af2', bg: '#12071a' },
        red: { primaryColor: '#ffffff', accentColor: '#ff453a', bg: '#1a0707' },
        minimal: { primaryColor: '#ffffff', accentColor: '#ffffff', bg: '#000000' },
      };
      openSheet(`
        <div class="sheet-title">Customization</div>
        <div class="field"><label class="field-label">Presets</label><div class="chips" id="c-presets">
          ${Object.keys(presets).map(k => `<button class="chip ${a.preset === k ? 'selected' : ''}" onclick="applyPreset('${k}')">${k}</button>`).join('')}
        </div></div>
        <div class="field"><label class="field-label">Accent Color</label><div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${['#30d158','#0a84ff','#bf5af2','#ff453a','#ff9f0a','#ffd60a','#5e5ce6','#ffffff'].map(c => `<div class="color-swatch ${a.accentColor === c ? 'selected' : ''}" style="background:${c};" onclick="setAccentColor('${c}')"></div>`).join('')}
        </div></div>
        <div class="field"><label class="field-label">Font</label><div class="chips" id="c-fonts">
          ${['system','rounded','serif','mono'].map(f => `<button class="chip ${a.font === f ? 'selected' : ''}" onclick="setFont('${f}')">${f}</button>`).join('')}
        </div></div>
        <button class="btn btn-primary" onclick="closeSheet()">Done</button>
        <button class="btn btn-danger" style="margin-top:8px;" onclick="resetCustomization()">Reset to Default</button>
      `);
    }
    function applyPreset(name) {
      const presets = {
        default: { primaryColor: '#ffffff', accentColor: '#30d158', bg: '#000000' },
        midnight: { primaryColor: '#bbbbbb', accentColor: '#5e5ce6', bg: '#0a0a0a' },
        ocean: { primaryColor: '#ffffff', accentColor: '#0a84ff', bg: '#001018' },
        forest: { primaryColor: '#ffffff', accentColor: '#30d158', bg: '#07120a' },
        purple: { primaryColor: '#ffffff', accentColor: '#bf5af2', bg: '#12071a' },
        red: { primaryColor: '#ffffff', accentColor: '#ff453a', bg: '#1a0707' },
        minimal: { primaryColor: '#ffffff', accentColor: '#ffffff', bg: '#000000' },
      };
      const p = presets[name];
      Store.updatePreferences({ appearance: { ...Store.preferences.appearance, ...p, preset: name } });
      applyAppearance();
      openCustomization();
    }
    function setAccentColor(c) { Store.updatePreferences({ appearance: { ...Store.preferences.appearance, accentColor: c, preset: 'custom' } }); applyAppearance(); openCustomization(); }
    function setFont(f) { Store.updatePreferences({ appearance: { ...Store.preferences.appearance, font: f } }); applyAppearance(); openCustomization(); }
    function resetCustomization() { Store.updatePreferences({ appearance: { theme: 'dark', accent: 'green', density: 'comfortable', cornerRadius: 22, font: 'system', primaryColor: '#ffffff', accentColor: '#30d158', preset: 'default' } }); applyAppearance(); openCustomization(); }
    function applyAppearance() {
      const a = Store.preferences.appearance || {};
      const root = document.documentElement;
      if (a.accentColor) { root.style.setProperty('--green', a.accentColor); root.style.setProperty('--green-glow', hexToRgba(a.accentColor, 0.15)); }
      const fontMap = { system: "-apple-system, 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif", rounded: "'SF Pro Rounded', -apple-system, system-ui, sans-serif", serif: "Georgia, 'Times New Roman', serif", mono: "ui-monospace, 'SF Mono', Menlo, monospace" };
      document.body.style.fontFamily = fontMap[a.font] || fontMap.system;
    }
    function hexToRgba(hex, alpha) {
      const h = hex.replace('#',''); const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // ── ACTIVITY ──
    let activityFilter = { category: 'all', search: '' };
    function renderActivity() {
      const txns = Store.getTransactions(activityFilter);
      const groups = {}; txns.forEach(t => { const d = fmtDate(t.date); if (!groups[d]) groups[d] = []; groups[d].push(t); });
      const cats = [{ id: 'all', label: 'All', emoji: '◌' }, { id: 'food', label: 'Food', emoji: '🍔' }, { id: 'shopping', label: 'Shopping', emoji: '🛍' }, { id: 'transport', label: 'Transport', emoji: '🚗' }, { id: 'bills', label: 'Bills', emoji: '📄' }, { id: 'paycheck', label: 'Paycheck', emoji: '💵' }, { id: 'other', label: 'Other', emoji: '◈' }];
      return `<div class="container fade-in"><div class="top-header"><div class="t-large">Activity</div><button class="icon-btn" onclick="openAddExpense()" style="background:var(--white);color:var(--black);border-color:var(--white);">+</button></div><div style="margin-bottom:16px;"><input class="field-input" id="activity-search" placeholder="Search transactions" oninput="onActivitySearch(this.value)" value="${escapeHtml(activityFilter.search)}"></div><div class="scroll-row" style="margin-bottom:20px;">${cats.map(c => `<button class="chip ${activityFilter.category === c.id ? 'selected' : ''}" onclick="setActivityCat('${c.id}')"><span class="emoji">${c.emoji}</span><span>${c.label}</span></button>`).join('')}</div>${txns.length === 0 ? `<div class="empty"><div class="empty-ico">◌</div><div class="empty-title">No activity yet</div><div class="empty-sub">Add your first transaction to start tracking.</div></div>` : Object.entries(groups).map(([date, items]) => `<div style="margin-bottom:20px;"><div class="t-label" style="margin-bottom:10px;padding-left:4px;">${date}</div><div class="stagger">${items.map(t => renderTxItem(t)).join('')}</div></div>`).join('')}</div>`;
    }
    function onActivitySearch(v) { activityFilter.search = v; const el = document.getElementById('activity-search'); const sel = el ? el.selectionStart : 0; render(); const newEl = document.getElementById('activity-search'); if (newEl) { newEl.focus(); try { newEl.setSelectionRange(sel, sel); } catch (e) {} } }
    function setActivityCat(c) { activityFilter.category = c; haptic('light'); render(); }

    /* ── GOALS (with share) ── */
    function renderGoals() {
      const standardGoals = Store.getGoals(); const movingGoals = Store.getMovingGoals();
      const shared = Store.getSharedGoals(); const sharedGoalIds = new Set(shared.map(s => s.goalId));
      const groupGoals = Store.getGroupGoals();
      return `
        <div class="container fade-in">
          <div class="top-header"><div class="t-large">Goals</div><div style="display:flex;gap:8px;"><button class="icon-btn" onclick="openCreateGroupGoal()" style="background:var(--gray-850);color:var(--white);border-color:var(--gray-700);">👥</button><button class="icon-btn" onclick="openAddMovingGoal()" style="background:var(--white);color:var(--black);border-color:var(--white);">📍</button><button class="icon-btn" onclick="openAddGoal()" style="background:var(--white);color:var(--black);border-color:var(--white);">+</button></div></div>
          ${groupGoals.length > 0 ? `<div class="section-h" style="margin-top:8px;"><span class="t-label">Group Goals</span></div>${groupGoals.map(g => renderGroupGoalCard(g)).join('')}` : ''}

    function renderAIBubble(m) { if (m.role === 'user') return `<div class="ai-chat-bubble ai-bubble-user">${escapeHtml(m.text)}</div>`; if (m.role === 'system') return `<div class="ai-chat-bubble ai-bubble-system">${escapeHtml(m.text)}</div>`; let confirmHtml = ''; if (m.confirmAction) confirmHtml = `<div class="ai-action-row"><button class="ai-action-btn primary" onclick="executeAIConfirm(${m.id})">${escapeHtml(m.confirmAction.label)}</button><button class="ai-action-btn" onclick="dismissAIConfirm(${m.id})">Cancel</button></div>`; return `<div class="ai-chat-bubble ai-bubble-assistant">${escapeHtml(m.text).replace(/\n/g, '<br>')}${confirmHtml}</div>`; }
    async function submitAI(e) {
      if (e) e.preventDefault(); const input = document.getElementById('ai-input'); const q = input.value.trim(); if (!q || aiThinking) return;
      input.value = ''; aiChat.push({ role: 'user', text: q }); refreshAIChatLog(); aiThinking = true;
      const log = document.getElementById('ai-chat-log'); if (log) { const typing = document.createElement('div'); typing.id = 'ai-typing'; typing.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`; log.appendChild(typing); log.scrollTop = log.scrollHeight; }

    async function executeAIConfirm(id) { const m = aiChat.find(x => x.id === id); if (!m || !m.confirmAction) return; const action = m.confirmAction; m.confirmAction = null; refreshAIChatLog(); try { const result = await action.execute(); aiChat.push({ role: 'assistant', text: result || 'Done.' }); } catch (e) { aiChat.push({ role: 'assistant', text: 'Action failed.' }); } refreshAIChatLog(); }
    function dismissAIConfirm(id) { const m = aiChat.find(x => x.id === id); if (m) m.confirmAction = null; aiChat.push({ role: 'system', text: 'Action cancelled.' }); refreshAIChatLog(); }

    function openMovingGoalEditor(title) {
      const d = mgDraft; const hasDest = d.destination && d.destination.lat !== null && d.destination.lng !== null; const mapId = 'mg-editor-map';
      const calc = MovingGoalCalculator.compute(d); const ctx = MovingGoalCalculator.withIncomeContext(d);

l">Current</label><input class="field-input" id="mg-current" type="number" inputmode="decimal" placeholder="$0.00" value="${d.current || ''}" oninput="mgUpdateCalc()"></div></div><div class="field-row"><div class="field"><label class="field-label">Weekly contribution</label><input class="field-input" id="mg-weekly" type="number" inputmode="decimal" placeholder="$0.00" value="${d.weeklyContribution || ''}" oninput="mgUpdateCalc()"></div><div class="field"><label class="field-label">Monthly contribution</label><input class="field-input" id="mg-monthly" type="number" inputmode="decimal" placeholder="$0.00" value="${d.monthlyContribution || ''}" oninput="mgUpdateCalc()"></div></div><div class="field-row"><div class="field"><label class="field-label">Target move date</label><input class="field-input" id="mg-target-date" type="date" value="${d.targetDate ? d.targetDate.split('T')[0] : ''}" onchange="mgUpdateCalc()"></div><div class="field"><label class="field-label">Reminder date</label><input class="field-input" id="mg-reminder-date" type="date" value="${d.reminderDate ? d.reminderDate.split('T')[0] : ''}"></div></div><div id="mg-calc-preview" style="background:var(--gray-900);border:1px solid var(--gray-800);border-radius:14px;padding:14px;margin-bottom:16px;font-size:13px;">${renderCalcPreview(calc, ctx)}</div><div class="field"><label class="field-label">Inspiration image (optional)</label><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"><label class="btn btn-secondary" style="cursor:pointer;width:auto;padding:12px 18px;">📷 Choose image<input type="file" accept="image/*" style="display:none;" onchange="mgHandleImage(event)"></label>${d.image ? `<button type="button" class="btn btn-danger" style="width:auto;padding:12px 18px;" onclick="mgRemoveImage()">Remove</button>` : ''}</div>${d.image ? `<img src="${d.image}" style="width:100%;border-radius:14px;margin-top:10px;border:1px solid var(--gray-800);" onerror="this.style.display='none';">` : ''}</di     async function mgApplyReverse(lat, lng) { mgDraft.destination.lat = lat; mgDraft.destination.lng = lng; haptic('light'); SoundManager.mapDestination(); if (!MapService.isOnline()) { toast('Location updated (offline)'); return; } const r = await MapService.reverseGeocode(lat, lng); if (r.ok) { mgDraft.destination.city = r.result.city; mgDraft.destination.state = r.result.state; mgDraft.destination.country = r.result.country; mgDraft.destination.name = r.result.city || r.result.name; const input = document.getElementById('mg-dest-name'); if (input) input.value = mgDraft.destination.name; } }
    function renderCalcPreview(calc, ctx) { const statusMap = { 'ahead': { label: 'Ahead of pace', color: 'var(--green)' }, 'on-track': { label: 'On track', color: 'var(--green)' }, 'behind': { label: 'Behind pace', color: '#ff9f0a' }, 'no-rate': { label: 'Set a rate', color: 'var(--gray-500)' }, 'no-date': { label: 'Set a date', color: 'var(--gray-500)' }, 'completed': { label: 'Completed', color: 'var(--green)' } }; const st = statusMap[calc.status] || { label: '', color: 'var(--gray-500)' }; return `<div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="color:var(--gray-400);">Progress</span><span style="font-weight:700;color:${st.color};">${calc.pct}% · ${st.label}</span></div><div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:var(--gray-400);">Remaining</span><span style="font-weight:700;">${fmt(calc.remaining)}</span></div>${calc.requiredWeekly > 0 ? `<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:var(--gray-400);">Weekly needed</span><span style="font-weight:700;">${fmt(calc.requiredWeekly)}</span></div><div style="display:flex;justify-content:space-between;"><span style="color:var(--gray-400);">Monthly needed</span><span style="font-weight:700;">${fmt(calc.requiredMonthly)}</span></div>` : `<div style="color:var(--gray-500);font-size:12px;">Set a target date to see required amounts.</div>`}${calc.estimatedDate ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--gray-800);display:flex;justify-content:space-between;"><span style="color:var(--gray-400);">Est. completion</span><span style="font-weight:700;">${fmtMonthYear(calc.estimatedDate)}</span></div>` : ''}`; }

        const blob = new Blob([swCode], { type: 'application/javascript' }); const swUrl = URL.createObjectURL(blob);
        return await navigator.serviceWorker.register(swUrl);
      } catch (e) { return null; }
    }
