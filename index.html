<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logostics">
<meta name="theme-color" content="#000000">
<title>Logostics Finance · Social</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
:root{--black:#000;--white:#fff;--bg:#000;--card:#121212;--text:#fff;--primary:#fff;--btn:#fff;--btn-text:#000;--on-accent:#000;--sheet:#0a0a0a;
--gray-950:#0a0a0a;--gray-900:#121212;--gray-850:#1a1a1a;--gray-800:#222;--gray-700:#2e2e2e;--gray-600:#3a3a3a;--gray-500:#555;--gray-400:#777;--gray-300:#999;--gray-200:#bbb;--gray-100:#ddd;
--green:#30d158;--green-glow:rgba(48,209,88,.15);--red:#ff453a;--orange:#ff9f0a;--glass:rgba(18,18,18,.72);--glass-deep:rgba(10,10,10,.85);
--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);
--ease:cubic-bezier(.32,.72,0,1);--ease-out:cubic-bezier(.16,1,.3,1);--nav-h:76px}
html{background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;height:100%}
body{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;padding-top:var(--safe-top);padding-left:var(--safe-left);padding-right:var(--safe-right);overflow-x:hidden;width:100%;max-width:100vw;user-select:none;letter-spacing:-.01em;position:relative;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 8px);-webkit-user-select:none;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none;touch-action:manipulation}
body.noauth{padding-bottom:24px}
body.noauth .bottom-nav,body.noauth .privacy-btn,body.noauth .ai-fab,body.noauth .social-fab{display:none}
input,textarea{user-select:text;-webkit-user-select:text}
.app-lock{position:fixed;inset:0;background:var(--bg);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;animation:fade-in .2s ease}
.app-lock.on{display:flex}
.app-lock-icon{width:88px;height:88px;border-radius:28px;border:2px solid var(--gray-700);display:flex;align-items:center;justify-content:center;font-size:42px;filter:grayscale(1)}
.app-lock-title{font-size:22px;font-weight:700;letter-spacing:-.02em;text-align:center}
.app-lock-sub{font-size:14px;color:var(--gray-500);text-align:center;max-width:300px;line-height:1.5}
.app-lock-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:0;height:0}
.t-large{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--primary)}
.t-title{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--primary)}
.t-caption{font-size:12px;font-weight:500;color:var(--gray-400);letter-spacing:.01em}
.t-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em}
.glass-deep{background:var(--glass-deep);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);border:1px solid rgba(128,128,128,.12)}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(128,128,128,.12)}
.container{max-width:430px;margin:0 auto;padding:0 20px;width:100%}
.section{margin-bottom:28px}
.section-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:0 2px}
.top-header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 8px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.03em;color:var(--primary)}
.brand-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:middle;box-shadow:0 0 8px var(--green-glow);animation:pulse-dot 2s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;background:var(--gray-850);border:1px solid var(--gray-700);color:var(--gray-300);transition:all .2s var(--ease);font-family:inherit;position:relative}
.icon-btn:active{transform:scale(.9);background:var(--gray-800)}
.icon-btn.solid{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.hero{text-align:center;padding:32px 0 24px}
.hero-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px}
.hero-amount{font-size:64px;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;color:var(--primary);word-break:break-all}
.hero-status{font-size:12px;color:var(--gray-500);margin-top:10px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.status-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse-dot 2s ease-in-out infinite}
.cash-card{border-radius:28px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.cash-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.cash-main{font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.cash-main-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.cash-badge{padding:6px 12px;border-radius:20px;background:var(--green-glow);border:1px solid var(--green);color:var(--green);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cash-rows{border-top:1px solid var(--gray-800);padding-top:16px}
.cash-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px}
.cash-row .lbl{color:var(--gray-400);display:flex;align-items:center;gap:8px;font-weight:500}
.cash-row .amt{font-weight:600;font-variant-numeric:tabular-nums}
.cash-row .amt.pos{color:var(--green)}.cash-row .amt.neg{color:var(--gray-200)}
.cash-proj{margin-top:14px;padding-top:14px;border-top:1px solid var(--gray-800);display:flex;justify-content:space-between;align-items:baseline}
.cash-proj .lbl{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em}
.cash-proj .amt{font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--green);font-variant-numeric:tabular-nums}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px}
.quick-btn{border-radius:18px;padding:16px 8px 12px;text-align:center;cursor:pointer;transition:all .2s var(--ease);display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid var(--gray-800);font-family:inherit;color:var(--text)}
.quick-btn:active{transform:scale(.92);background:var(--gray-850)}
.quick-btn .ico{font-size:22px;line-height:1;filter:grayscale(1)}
.quick-btn.primary .ico{filter:none}
.quick-btn .lbl{font-size:10px;font-weight:600;color:var(--gray-400);letter-spacing:.02em}
.insight{border-radius:18px;padding:16px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--gray-800)}
.insight .ico{font-size:18px;flex-shrink:0;margin-top:1px;filter:grayscale(1)}
.insight .txt{font-size:13.5px;line-height:1.45;color:var(--gray-300);font-weight:400}
.insight .txt strong{color:var(--text);font-weight:600}
.activity-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;margin-bottom:6px;background:var(--card);border:1px solid var(--gray-800);transition:all .2s var(--ease);cursor:pointer;position:relative;touch-action:pan-y}
.activity-item:active{transform:scale(.98);background:var(--gray-850)}
.activity-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--gray-850);border:1px solid var(--gray-700);filter:grayscale(1)}
.activity-ico.income{filter:none;border-color:var(--green);background:var(--green-glow)}
.activity-body{flex:1;min-width:0}
.activity-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.activity-meta{font-size:11.5px;color:var(--gray-500);margin-top:2px;display:flex;gap:8px;font-weight:500}
.activity-amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;letter-spacing:-.01em}
.activity-amt.pos{color:var(--green)}.activity-amt.neg{color:var(--gray-200)}
.goal-card{border-radius:24px;padding:22px;margin-bottom:12px;background:var(--card);border:1px solid var(--gray-800);transition:all .2s var(--ease);cursor:pointer;position:relative}
.goal-card:active{transform:scale(.985)}
.goal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px}
.goal-name{font-size:17px;font-weight:700;letter-spacing:-.02em}
.goal-pct{font-size:12px;color:var(--gray-500);font-weight:600;margin-top:3px}
.goal-emoji{font-size:26px;filter:grayscale(1);opacity:.7}
.goal-card.active .goal-emoji{filter:none;opacity:1}
.goal-img{width:100%;height:110px;object-fit:cover;border-radius:14px;margin-bottom:14px;border:1px solid var(--gray-800)}
.goal-bar{width:100%;height:6px;background:var(--gray-800);border-radius:3px;overflow:hidden;margin:14px 0 10px}
.goal-fill{height:100%;border-radius:3px;background:var(--green);transition:width .7s var(--ease-out)}
.goal-stats{display:flex;justify-content:space-between;font-size:13px;color:var(--gray-400);font-weight:500;font-variant-numeric:tabular-nums}
.goal-stats .hl{color:var(--text);font-weight:600}
.goal-eta{margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-800);font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:6px;font-weight:500}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + var(--safe-bottom));z-index:100;border-top:1px solid var(--gray-800);transform:translateZ(0)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;border-radius:14px;cursor:pointer;transition:all .25s var(--ease);background:none;border:none;color:var(--gray-500);font-family:inherit;min-width:50px;touch-action:manipulation;position:relative}
.nav-item.active{color:var(--text)}
.nav-item.active .nav-ico{filter:none;transform:scale(1.05)}
.nav-item:active{transform:scale(.88)}
.nav-ico{font-size:21px;line-height:1;filter:grayscale(1);transition:all .25s var(--ease)}
.nav-lbl{font-size:10px;font-weight:600;letter-spacing:.01em}
.swipe-back-indicator{position:fixed;left:0;top:50%;transform:translateY(-50%);width:4px;height:60px;background:var(--green);border-radius:0 4px 4px 0;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
.swipe-back-indicator.on{opacity:.6}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:1000;display:none;align-items:flex-end;justify-content:center;animation:fade-in .25s ease}
.sheet-overlay.on{display:flex}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:430px;max-height:92vh;overflow-y:auto;border-radius:32px 32px 0 0;padding:12px 20px calc(24px + var(--safe-bottom));animation:slide-up .4s var(--ease-out);background:var(--sheet);border-top:1px solid var(--gray-800);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;color:var(--text)}
@keyframes slide-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-grip{width:36px;height:4px;background:var(--gray-600);border-radius:2px;margin:0 auto 20px}
.sheet-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:24px;text-align:center;color:var(--primary)}
.field{margin-bottom:18px}
.field-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:block}
.field-input{width:100%;background:var(--card);border:1px solid var(--gray-800);border-radius:14px;padding:16px;font-size:17px;color:var(--text);font-family:inherit;transition:all .2s var(--ease);-webkit-appearance:none;appearance:none;letter-spacing:-.01em}
.field-input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-glow)}
.field-input::placeholder{color:var(--gray-600)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:20px;background:var(--card);border:1px solid var(--gray-800);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);display:flex;align-items:center;gap:6px;color:var(--gray-300);font-family:inherit}
.chip:active{transform:scale(.92)}
.chip.selected{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.chip .emoji{filter:grayscale(1)}.chip.selected .emoji{filter:none}
.btn{padding:16px 24px;border-radius:14px;font-size:17px;font-weight:600;border:none;cursor:pointer;transition:all .2s var(--ease);font-family:inherit;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--btn);color:var(--btn-text)}
.btn-green{background:var(--green);color:var(--on-accent)}
.btn-secondary{background:var(--card);border:1px solid var(--gray-800);color:var(--text)}
.btn-danger{background:transparent;border:1px solid var(--gray-700);color:var(--gray-300)}
.btn-row{display:flex;gap:10px;margin-top:8px}.btn-row .btn{flex:1}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:10px;width:auto}
.empty{text-align:center;padding:56px 24px}
.empty-ico{font-size:44px;margin-bottom:18px;opacity:.3;filter:grayscale(1)}
.empty-title{font-size:17px;font-weight:600;margin-bottom:8px;letter-spacing:-.02em}
.empty-sub{font-size:14px;color:var(--gray-500);line-height:1.5;max-width:260px;margin:0 auto}
.toast{position:fixed;top:calc(20px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-140%);padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:2000;transition:transform .45s var(--ease-out);display:flex;align-items:center;gap:10px;max-width:90vw;background:var(--card);border:1px solid var(--gray-700);color:var(--text);letter-spacing:-.01em;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.privacy-btn{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);right:20px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:90;transition:all .25s var(--ease);background:var(--card);border:1px solid var(--gray-700);color:var(--gray-300);font-family:inherit}
.privacy-btn.active{background:var(--green);color:var(--on-accent);border-color:var(--green)}
.ai-fab{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);right:74px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;z-index:90;transition:all .25s var(--ease);background:var(--card);border:1px solid var(--gray-700);color:var(--text);font-family:inherit;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.ai-fab:active{transform:scale(.9)}
.social-fab{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);left:20px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;z-index:90;transition:all .25s var(--ease);background:var(--card);border:1px solid var(--gray-700);color:var(--text);font-family:inherit;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.social-fab:active{transform:scale(.9)}
.privacy-blur{filter:blur(14px);transition:filter .35s var(--ease);pointer-events:none;user-select:none}
.fade-in{animation:fade-up .35s var(--ease-out)}
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stagger>*{animation:fade-up .4s var(--ease-out) backwards}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.14s}
.scroll-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.scroll-row>*{flex-shrink:0}
.segmented{display:flex;background:var(--card);border:1px solid var(--gray-800);border-radius:12px;padding:3px}
.seg{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:all .2s var(--ease);background:none;border:none;color:var(--gray-500);font-family:inherit}
.seg.active{background:var(--btn);color:var(--btn-text)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{border-radius:18px;padding:18px 16px;background:var(--card);border:1px solid var(--gray-800);text-align:center}
.stat-val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat-lbl{font-size:10px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.chart-card{border-radius:22px;padding:20px;margin-bottom:12px;background:var(--card);border:1px solid var(--gray-800)}
.chart-card h3{font-size:14px;font-weight:600;margin-bottom:18px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-radius:14px;margin-bottom:6px;background:var(--card);border:1px solid var(--gray-800);cursor:pointer;transition:all .2s var(--ease)}
.set-row:active{background:var(--gray-850);transform:scale(.985)}
.set-row.static{cursor:default}.set-row.static:active{transform:none}
.set-left{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500}
.set-left .ico{font-size:16px;width:20px;text-align:center;filter:grayscale(1);opacity:.7}
.set-right{color:var(--gray-500);font-size:13px;display:flex;align-items:center;gap:6px;font-weight:500}
.toggle{position:relative;width:50px;height:30px;background:var(--gray-700);border-radius:15px;cursor:pointer;transition:background .3s var(--ease);flex-shrink:0}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;background:#fff;border-radius:50%;transition:transform .3s var(--ease);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.toggle.on::after{transform:translateX(20px)}
.cap-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.04em;text-transform:uppercase}
.cap-badge.ok{background:var(--green-glow);color:var(--green);border:1px solid var(--green)}
.cap-badge.no{background:var(--gray-850);color:var(--gray-500);border:1px solid var(--gray-700)}
.cap-badge.warn{background:rgba(255,159,10,.12);color:#ff9f0a;border:1px solid rgba(255,159,10,.25)}
.patch-version{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.patch-date{font-size:11px;color:var(--gray-500);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.patch-section{margin-bottom:12px}
.patch-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--green);margin-bottom:6px}
.patch-section ul{list-style:none}
.patch-section li{font-size:13.5px;color:var(--gray-300);line-height:1.5;padding:3px 0 3px 16px;position:relative}
.patch-section li::before{content:'·';position:absolute;left:4px;color:var(--gray-500)}
.debug-row{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;font-size:12px;font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid var(--gray-800)}
.debug-row .k{color:var(--gray-500)}.debug-row .v{color:var(--text);font-weight:600;text-align:right;word-break:break-all}
.ai-chat-bubble{max-width:85%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.45;margin-bottom:10px;word-break:break-word;animation:bubble-in .3s var(--ease-out)}

migrateDB(db);

/* ═══ GOAL MATH (pure, real data only) ═══ */
const GoalMath={
rate(g){const a=Number(g.contribution)||0;if(a>0)return a*({daily:7,weekly:1,biweekly:.5,monthly:12/52}[g.frequency||'weekly']||1);if(g.weeklySavings>0)return g.weeklySavings;if(g.weeklyContribution>0)return g.weeklyContribution;if(g.monthlyContribution>0)return g.monthlyContribution*12/52;return 0},
est(cur,target,rate,deadline){cur=Number(cur)||0;target=Number(target)||0;rate=Number(rate)||0;const remaining=Math.max(0,target-cur),pct=target>0?Math.min(100,Math.round(cur/target*100)):0;let weeks=null,date=null;

/* ═══ ACCOUNTS ═══ */

const Accounts=(function(){
const normUser=s=>(s||'').trim().replace(/^@/,'').toLowerCase();
function legacy(){try{const raw=localStorage.getItem('logostics_finance_prefs_v4');if(!raw)return null;const p=JSON.parse(raw),pr=p.preferences||{};const prefs=Object.assign({},pr);['friends','sentRequests','incomingRequests','blocked','dismissedSuggestions','notifications','adminNotifications','auditLog','adminIds','groupGoals','userProfile','_seededNotifs'].forEach(k=>delete prefs[k]);return{prefs,income:p.incomeSettings||null,profile:pr.userProfile||null,groups:Array.isArray(pr.groupGoals)?pr.groupGoals:[]}}catch(e){return null}}
async function register(o){
reloadDB();const username=normUser(o.username);

const salt=genId('s_'),passHash=await hashPw(pw,salt);
const lg=Object.keys(db.users).length?null:legacy();let res={ok:false,error:'Failed'};
commit(d=>{
if(Object.values(d.users).some(x=>x.username===username)){res={ok:false,error:'Username already taken'};return}
const first=!Object.keys(d.users).length,id=genId('u_'),lp=first&&lg?lg.profile:null;
let code=lp&&normCode(lp.friendCode);if(!code||!/^[A-Z0-9]{3}-[A-Z0-9]{4,6}$/.test(code)||Object.values(d.users).some(x=>x.friendCode===code))code=genCode(d,displayName);
const t=nowISO();
d.users[id]={id,username,displayName,friendCode:code,avatar:(lp&&lp.avatar)||'👤',banner:'',bio:(lp&&lp.bio)||'',status:'online',statusMsg:'',createdAt:t,lastActive:t,online:true,salt,passHash,roles:{admin:first,developer:first},achievements:[],featured:[],privacy:{showCode:true,showActivity:true},stats:{goalCount:0},prefs:first&&lg?lg.prefs:null,income:first&&lg?lg.income:null};
if(first&&lg)lg.groups.forEach(g=>{if(!g||!g.id||!g.name)return;const mm=(g.members||[]).find(m=>m.userId==='u_me')||{};d.groups.push({id:g.id,name:g.name,description:g.description||'',image:g.image||'',target:Number(g.target)||0,deadline:g.deadline||null,visibility:g.visibility==='private'?'private':'friends',creatorId:id,archived:false,createdAt:g.createdAt||t,updatedAt:t,members:[{userId:id,role:'owner',contribution:Number(mm.contribution)||0,weeklyContribution:Number(mm.weeklyContribution)||0,joinedAt:t}],log:[]})});
res={ok:true,id}},{kind:'register'});
if(res.ok){Session.set(res.id);me=res.id}return res}

/* ═══ SOCIAL ═══ */
const Social=(function(){

const sorted=(a,b)=>a<b?[a,b]:[b,a];
const isBlocked=(a,b)=>db.blocks.some(x=>x.by===a&&x.target===b);

const friendIds=id=>{const o=[];db.friendships.forEach(f=>{if(f.status==='active'){if(f.a===id)o.push(f.b);else if(f.b===id)o.push(f.a)}});return o};

/* — friend lifecycle — */

if(isFriend(me,tid)){res={ok:false,error:'Already friends'};return}

const inc=pending(tid,me);
if(inc){inc.status='accepted';inc.updatedAt=nowISO();makeFriends(d,me,tid);pushNotif(d,{to:tid,type:'friend_accepted',actor:me,title:'Friend request accepted',message:`${nm(d.users[me])} is now your friend`,ref:{kind:'user',id:me}});d.notifs=d.notifs.filter(n=>!(n.to===me&&n.type==='friend_request'&&n.ref&&n.ref.id===inc.id));logAct(d,me,'friend',`became friends with ${nm(t)}`);res={ok:true,accepted:true,user:nm(t)};return}

res={ok:true,user:nm(t)}},{kind:'friend'});return res}
function respond(rid,accept){let res={ok:false,error:'Request not found'};
commit(d=>{const r=d.requests.find(x=>x.id===rid&&x.to===me&&x.status==='pending');if(!r)return;

function cancelRequest(rid){commit(d=>{const r=d.requests.find(x=>x.id===rid&&x.from===me&&x.status==='pending');if(!r)return;r.status='cancelled';r.updatedAt=nowISO();d.notifs=d.notifs.filter(n=>!(n.type==='friend_request'&&n.ref&&n.ref.id===rid))},{kind:'friend'});return{ok:true}}
function removeFriend(o){commit(d=>{const[x,y]=sorted(me,o);const f=d.friendships.find(f=>f.a===x&&f.b===y&&f.status==='active');if(f){f.status='removed';f.updatedAt=nowISO()}},{kind:'friend'});return{ok:true}}

/* — lists — */
const rank={online:0,away:1,offline:2};

function sent(){return db.requests.filter(r=>r.status==='pending'&&r.from===me&&db.users[r.to]&&!blockedEither(me,r.to)).map(r=>({id:r.id,at:r.createdAt,user:user(r.to)}))}
function blockedList(){return db.blocks.filter(b=>b.by===me&&db.users[b.target]).map(b=>user(b.target))}
function mutualUsers(o){return mutualIds(o).map(id=>user(id))}
function suggestions(){if(!me)return[];const dis=new Set(db.dismissed[me]||[]),score={},why={};const mine=friendIds(me);
const add=(id,pts,reason)=>{if(id===me||dis.has(id)||!db.users[id]||blockedEither(me,id)||isFriend(me,id)||pending(me,id)||pending(id,me))return;score[id]=(score[id]||0)+pts;(why[id]=why[id]||[]).push(reason)};
mine.forEach(f=>friendIds(f).forEach(o=>add(o,2,'mutual')));
db.groups.forEach(g=>{if(g.members.some(m=>m.userId===me))g.members.forEach(m=>add(m.userId,1,'group:'+g.name))});
return Object.keys(score).sort((a,b)=>score[b]-score[a]).map(id=>({user:user(id),mutual:mutualIds(id).length,groups:(why[id]||[]).filter(w=>w.startsWith('group:')).map(w=>w.slice(6))}))}
function dismiss(id){commit(d=>{d.dismissed[me]=d.dismissed[me]||[];if(!d.dismissed[me].includes(id))d.dismissed[me].push(id)},{kind:'friend'})}
function pendingCount(){return incoming().length}

/* — notifications — */
const myNotifs=()=>db.notifs.filter(n=>n.to===me&&(!n.expiresAt||n.expiresAt>nowISO()));
const unreadCount=()=>myNotifs().filter(n=>!n.read).length;
function markRead(id){commit(d=>{const n=d.notifs.find(x=>x.id===id&&x.to===me);if(n)n.read=true},{kind:'notif'})}
function markAllRead(){commit(d=>{d.notifs.forEach(n=>{if(n.to===me)n.read=true})},{kind:'notif'})}

/* — profile — */
function updateProfile(p){let res={ok:true};commit(d=>{const u=d.users[me];if(!u){res={ok:false,error:'Not signed in'};return}
if(p.username!==undefined){const n=String(p.username).trim().replace(/^@/,'').toLowerCase();if(n!==u.username){if(!/^[a-z0-9_]{3,20}$/.test(n)){res={ok:false,error:'Username must be 3–20 letters, numbers or _'};return}if(Object.values(d.users).some(x=>x.id!==me&&x.username===n)){res={ok:false,error:'Username already taken'};return}u.username=n}}
if(p.displayName!==undefined)u.displayName=String(p.displayName).trim().slice(0,30)||u.username;
if(p.bio!==undefined)u.bio=String(p.bio).slice(0,160);
if(p.avatar!==undefined)u.avatar=String(p.avatar).slice(0,300000)||'👤';

if(p.featured!==undefined){const have=new Set(u.achievements.map(a=>a.id));u.featured=p.featured.filter(x=>have.has(x)).slice(0,3)}
if(p.privacy)u.privacy=Object.assign(u.privacy||{},{showCode:p.privacy.showCode!==false,showActivity:p.privacy.showActivity!==false})},{kind:'profile'});return res}
function saveUserSettings(prefs,income){commit(d=>{const u=d.users[me];if(u){u.prefs=prefs;u.income=income}},{kind:'settings'})}
function setStats(n){const u=db.users[me];if(!u||(u.stats&&u.stats.goalCount===n))return;commit(d=>{if(d.users[me])d.users[me].stats={goalCount:n}},{kind:'stats'})}
function activityFor(id,limit){const u=db.users[id];if(!u)return[];if(id!==me&&(!isFriend(me,id)||(u.privacy&&u.privacy.showActivity===false)))return null;return db.activity.filter(a=>a.userId===id).slice(0,limit||8)}

/* — shares — */
function viewersOf(d,s){const o=s.owner;let ids=[];if(s.visibility==='friends')ids=friendIds(o);else if(s.visibility==='users')ids=(s.userIds||[]).filter(x=>isFriend(o,x));else if(s.visibility==='group'){const g=d.groups.find(g=>g.id===s.groupId);ids=g?g.members.map(m=>m.userId):[]}return ids.filter(x=>x!==o&&d.users[x]&&!blockedEither(o,x))}
const myShare=goalId=>db.shares.find(s=>s.owner===me&&s.goalId===goalId)||null;
function shareGoal(snap,opt){if(!me)return{ok:false,error:'Not signed in'};let res={ok:true};
commit(d=>{const old=d.shares.find(s=>s.owner===me&&s.goalId===snap.goalId);const prev=old?viewersOf(d,old):[];
if(opt.visibility==='private'){d.shares=d.shares.filter(s=>s!==old);return}
let userIds=[],groupId=null;
if(opt.visibility==='users'){userIds=(opt.userIds||[]).filter(id=>isFriend(me,id)&&!blockedEither(me,id));if(!userIds.length){res={ok:false,error:'Choose at least one friend'};return}}
else if(opt.visibility==='group'){const g=d.groups.find(g=>g.id===opt.groupId&&g.members.some(m=>m.userId===me));if(!g){res={ok:false,error:'Choose a group goal you belong to'};return}groupId=g.id}
else if(opt.visibility!=='friends'){res={ok:false,error:'Invalid visibility'};return}
const rec=Object.assign(old||{id:genId('sh_'),owner:me,goalId:snap.goalId,createdAt:nowISO()},{visibility:opt.visibility,userIds,groupId,snap,updatedAt:nowISO()});if(!old)d.shares.push(rec);
viewersOf(d,rec).filter(v=>!prev.includes(v)).forEach(v=>pushNotif(d,{to:v,type:'goal_shared',actor:me,title:'Goal shared with you',message:`${nm(d.users[me])} shared "${snap.name}"`,ref:{kind:'share',id:rec.id}}));
if(!old)logAct(d,me,'goal_shared',`shared the goal "${snap.name}"`)},{kind:'share'});return res}
function syncShare(snap){if(!db.shares.some(s=>s.owner===me&&s.goalId===snap.goalId))return;commit(d=>{const s=d.shares.find(s=>s.owner===me&&s.goalId===snap.goalId);if(s){s.snap=snap;s.updatedAt=nowISO()}},{kind:'share'})}
function removeShare(goalId){if(!db.shares.some(s=>s.owner===me&&s.goalId===goalId))return;commit(d=>{d.shares=d.shares.filter(s=>!(s.owner===me&&s.goalId===goalId))},{kind:'share'})}
function sharedWithMe(){return db.shares.filter(s=>s.owner!==me&&db.users[s.owner]&&viewersOf(db,s).includes(me)).map(s=>({id:s.id,owner:user(s.owner),visibility:s.visibility,snap:s.snap,groupName:s.groupId?((db.groups.find(g=>g.id===s.groupId)||{}).name||''):'',viewers:viewersOf(db,s).length+1,updatedAt:s.updatedAt}))}
function sharedBy(ownerId){return sharedWithMe().filter(s=>s.owner&&s.owner.id===ownerId)}

/* — group goals — */
const isMember=(g,id)=>g.members.some(m=>m.userId===id);
const gVisible=(g,id)=>isMember(g,id)||(g.visibility==='friends'&&isFriend(g.creatorId,id)&&!blockedEither(g.creatorId,id));
function glog(g,type,message,amount){g.log.unshift({id:genId('l_'),userId:me,type,message,amount:amount||0,at:nowISO()});if(g.log.length>100)g.log.length=100;g.updatedAt=nowISO()}
function groupView(g){const total=g.members.reduce((s,m)=>s+(Number(m.contribution)||0),0),rate=g.members.reduce((s,m)=>s+(Number(m.weeklyContribution)||0),0);return Object.assign({},g,{total,rate,est:GoalMath.est(total,g.target,rate,g.deadline),isOwner:g.creatorId===me,isMember:isMember(g,me),creator:user(g.creatorId),memberUsers:g.members.map(m=>Object.assign({},m,{user:user(m.userId)}))})}
function groups(){return db.groups.filter(g=>gVisible(g,me)).map(groupView).sort((a,b)=>(a.archived-b.archived)||(b.updatedAt>a.updatedAt?1:-1))}
function group(id){const g=db.groups.find(x=>x.id===id);return g&&gVisible(g,me)?groupView(g):null}
function createGroup(o){if(!me)return{ok:false,error:'Not signed in'};let res;
commit(d=>{const t=nowISO();const g={id:genId('gg_'),name:String(o.name||'').trim().slice(0,60),description:String(o.description||'').slice(0,240),image:o.image||'',target:Math.abs(Number(o.target)||0),deadline:o.deadline||null,visibility:o.visibility==='private'?'private':'friends',creatorId:me,archived:false,createdAt:t,updatedAt:t,members:[{userId:me,role:'owner',contribution:0,weeklyContribution:0,joinedAt:t}],log:[]};
if(!g.name||g.target<=0){res={ok:false,error:'Name and target are required'};return}
(o.members||[]).forEach(id=>{if(id!==me&&isFriend(me,id)&&!blockedEither(me,id)){g.members.push({userId:id,role:'member',contribution:0,weeklyContribution:0,joinedAt:t});pushNotif(d,{to:id,type:'goal_invite',actor:me,title:'Group goal invitation',message:`${nm(d.users[me])} added you to "${g.name}"`,ref:{kind:'group',id:g.id}})}});
glog(g,'created','created the goal');d.groups.push(g);logAct(d,me,'group',`created the group goal "${g.name}"`);res={ok:true,id:g.id}},{kind:'group'});return res}
function ownerGroup(d,id){const g=d.groups.find(x=>x.id===id);return g&&g.creatorId===me?g:null}
function updateGroup(id,p){let res={ok:false,error:'Only the creator can edit this goal'};commit(d=>{const g=ownerGroup(d,id);if(!g)return;
if(p.name!==undefined){const n=String(p.name).trim().slice(0,60);if(!n){res={ok:false,error:'Name required'};return}g.name=n}
if(p.description!==undefined)g.description=String(p.description).slice(0,240);
if(p.image!==undefined)g.image=p.image;
if(p.target!==undefined){const t=Math.abs(Number(p.target)||0);if(t<=0){res={ok:false,error:'Target must be above zero'};return}g.target=t}
if(p.deadline!==undefined)g.deadline=p.deadline||null;
if(p.visibility!==undefined)g.visibility=p.visibility==='private'?'private':'friends';
glog(g,'updated','updated goal details');g.members.forEach(m=>{if(m.userId!==me)pushNotif(d,{to:m.userId,type:'group_update',actor:me,title:'Group goal updated',message:`${nm(d.users[me])} updated "${g.name}"`,ref:{kind:'group',id:g.id}})});res={ok:true}},{kind:'group'});return res}
function addMember(id,uid){let res={ok:false,error:'Only the creator can add members'};commit(d=>{const g=ownerGroup(d,id);if(!g)return;if(isMember(g,uid)){res={ok:false,error:'Already a member'};return}if(!isFriend(me,uid)||blockedEither(me,uid)){res={ok:false,error:'You can only add friends'};return}
g.members.push({userId:uid,role:'member',contribution:0,weeklyContribution:0,joinedAt:nowISO()});glog(g,'added',`added ${nm(d.users[uid])}`);pushNotif(d,{to:uid,type:'goal_invite',actor:me,title:'Group goal invitation',message:`${nm(d.users[me])} added you to "${g.name}"`,ref:{kind:'group',id:g.id}});res={ok:true}},{kind:'group'});return res}
function removeMember(id,uid){let res={ok:false,error:'Only the creator can remove members'};commit(d=>{const g=ownerGroup(d,id);if(!g)return;if(uid===me){res={ok:false,error:'Creator cannot be removed'};return}const before=g.members.length;g.members=g.members.filter(m=>m.userId!==uid);if(g.members.length!==before){glog(g,'removed',`removed ${nm(d.users[uid])}`);pushNotif(d,{to:uid,type:'group_update',actor:me,title:'Removed from group goal',message:`You were removed from "${g.name}"`,ref:null})}d.shares=d.shares.filter(s=>!(s.groupId===id&&s.owner===uid));res={ok:true}},{kind:'group'});return res}
function leaveGroup(id){let res={ok:false,error:'Not a member'};commit(d=>{const g=d.groups.find(x=>x.id===id);if(!g||!isMember(g,me))return;if(g.creatorId===me){res={ok:false,error:'The creator can archive or delete the goal instead of leaving'};return}g.members=g.members.filter(m=>m.userId!==me);glog(g,'left','left the goal');d.shares=d.shares.filter(s=>!(s.groupId===id&&s.owner===me));pushNotif(d,{to:g.creatorId,type:'group_update',actor:me,title:'Member left',message:`${nm(d.users[me])} left "${g.name}"`,ref:{kind:'group',id:g.id}});res={ok:true}},{kind:'group'});return res}
function contribute(id,amt){amt=Number(amt);if(!(amt>0))return{ok:false,error:'Enter a valid amount'};let res={ok:false,error:'Not a member'};commit(d=>{const g=d.groups.find(x=>x.id===id);if(!g||!isMember(g,me))return;if(g.archived){res={ok:false,error:'This goal is archived'};return}const m=g.members.find(m=>m.userId===me);m.contribution=Math.round(((Number(m.contribution)||0)+amt)*100)/100;glog(g,'contribution',`added ${fmt(amt)}`,amt);
const tot=g.members.reduce((s,x)=>s+x.contribution,0);const done=tot>=g.target&&tot-amt<g.target;
g.members.forEach(x=>{if(x.userId!==me)pushNotif(d,{to:x.userId,type:'group_update',actor:me,title:done?'Group goal reached! 🎉':'Group goal progress',message:done?`"${g.name}" hit its target`:`${nm(d.users[me])} added ${fmt(amt)} to "${g.name}"`,ref:{kind:'group',id:g.id}})});res={ok:true,done}},{kind:'group'});return res}
function setWeekly(id,amt){amt=Math.max(0,Number(amt)||0);commit(d=>{const g=d.groups.find(x=>x.id===id);if(!g||!isMember(g,me))return;const m=g.members.find(m=>m.userId===me);m.weeklyContribution=amt;glog(g,'rate',`set weekly contribution to ${fmt(amt)}`)},{kind:'group'});return{ok:true}}
function archiveGroup(id,v){let res={ok:false,error:'Only the creator can archive'};commit(d=>{const g=ownerGroup(d,id);if(!g)return;g.archived=!!v;glog(g,'archive',v?'archived the goal':'restored the goal');res={ok:true}},{kind:'group'});return res}
function deleteGroup(id){let res={ok:false,error:'Only the creator can delete'};commit(d=>{const g=ownerGroup(d,id);if(!g)return;g.members.forEach(m=>{if(m.userId!==me)pushNotif(d,{to:m.userId,type:'group_update',actor:me,title:'Group goal deleted',message:`"${g.name}" was deleted by ${nm(d.users[me])}`,ref:null})});d.groups=d.groups.filter(x=>x.id!==id);d.shares=d.shares.filter(s=>s.groupId!==id);res={ok:true}},{kind:'group'});return res}

/* — achievements — */
const ACH=[{id:'joined',emoji:'👋',title:'Welcome',desc:'Created an account',test:()=>true},{id:'first_tx',emoji:'🧾',title:'First Step',desc:'Logged a transaction',test:c=>c.txCount>0},{id:'first_goal',emoji:'🎯',title:'Goal Setter',desc:'Created a goal',test:c=>c.goalCount>0},{id:'goal_done',emoji:'🏆',title:'Goal Crusher',desc:'Completed a goal',test:c=>c.goalsDone>0},{id:'first_friend',emoji:'🤝',title:'Better Together',desc:'Made a friend',test:c=>c.friends>=1},{id:'five_friends',emoji:'🌟',title:'Social Butterfly',desc:'Have 5 friends',test:c=>c.friends>=5},{id:'sharer',emoji:'📤',title:'Open Book',desc:'Shared a goal',test:c=>c.shares>0},{id:'group_creator',emoji:'👥',title:'Team Builder',desc:'Created a group goal',test:c=>c.groupsCreated>0},{id:'team_player',emoji:'💪',title:'Team Player',desc:'Contributed to a group goal',test:c=>c.contrib>0}];
function checkAchievements(ctx){const u=me&&db.users[me];if(!u)return;const have=new Set((u.achievements||[]).map(a=>a.id));
const c=Object.assign({},ctx,{friends:friendIds(me).length,shares:db.shares.filter(s=>s.owner===me).length,groupsCreated:db.groups.filter(g=>g.creatorId===me).length,contrib:db.groups.filter(g=>{const m=g.members.find(m=>m.userId===me);return m&&m.contribution>0}).length});
const nw=ACH.filter(a=>!have.has(a.id)&&a.test(c));if(!nw.length)return;
commit(d=>{const uu=d.users[me];nw.forEach(a=>{if(uu.achievements.some(x=>x.id===a.id))return;uu.achievements.push({id:a.id,at:nowISO()});if(a.id!=='joined'){pushNotif(d,{to:me,type:'achievement',title:'Achievement unlocked',message:`${a.emoji} ${a.title} — ${a.desc}`,ref:{kind:'achievement',id:a.id}});logAct(d,me,'achievement',`unlocked ${a.title}`)}})},{kind:'ach'})}

return{user,pub,findByCode,findByUsername,findAny,relation,sendRequest,respond,cancelRequest,removeFriend,block,unblock,friends,incoming,sent,blockedList,mutualUsers,suggestions,dismiss,pendingCount,
notifs:myNotifs,unreadCount,markRead,markAllRead,delNotif,clearNotifs,updateProfile,saveUserSettings,setStats,activityFor,
shareGoal,syncShare,removeShare,myShare,sharedWithMe,sharedBy,viewersOf:id=>{const s=db.shares.find(x=>x.id===id);return s?viewersOf(db,s):[]},
groups,group,createGroup,updateGroup,addMember,removeMember,leaveGroup,contribute,setWeekly,archiveGroup,deleteGroup,ACH,checkAchievements,
_pushNotif:pushNotif,_isFriend:isFriend,_friendIds:friendIds,_nm:nm}})();

/* ═══ ADMIN (every call re-verifies permission) ═══ */
const Admin=(function(){
const NO={ok:false,error:'Not authorized'};
const allowed=()=>Accounts.isAdmin(db.users[me]);
const devAllowed=()=>Accounts.isDev(db.users[me]);
function row(u){return{id:u.id,username:u.username,displayName:u.displayName||u.username,friendCode:u.friendCode||null,avatar:u.avatar,presence:presenceOf(u),lastActive:u.lastActive||null,createdAt:u.createdAt||null,friendCount:Social._friendIds(u.id).filter(x=>db.users[x]).length,goalCount:u.stats&&typeof u.stats.goalCount==='number'?u.stats.goalCount:null,roles:{admin:!!(u.roles&&u.roles.admin),developer:!!(u.roles&&u.roles.developer)},isMe:u.id===me}}
function users(){if(!allowed())return NO;return{ok:true,users:Object.values(db.users).map(row)}}
function stats(){if(!allowed())return NO;const us=Object.values(db.users);return{ok:true,total:us.length,active:us.filter(u=>presenceOf(u)!=='offline').length}}
function detail(id){if(!allowed())return NO;const u=db.users[id];if(!u)return{ok:false,error:'User not found'};
const sh=db.shares.filter(s=>s.owner===id);
return{ok:true,row:row(u),profile:{bio:u.bio||null,status:u.status||null,statusMsg:u.statusMsg||null,hasBanner:!!u.banner,privacy:u.privacy||null},
friends:Social._friendIds(id).filter(x=>db.users[x]).map(x=>({id:x,name:Social._nm(db.users[x]),username:db.users[x].username})),
goalCount:row(u).goalCount,sharedGoals:sh.map(s=>({name:s.snap&&s.snap.name,visibility:s.visibility,pct:s.snap&&s.snap.target>0?Math.min(100,Math.round(s.snap.current/s.snap.target*100)):null})),
groups:db.groups.filter(g=>g.members.some(m=>m.userId===id)).map(g=>({name:g.name,role:g.creatorId===id?'owner':'member'})),
activity:db.activity.filter(a=>a.userId===id).slice(0,15),achievements:(u.achievements||[]).slice(),
notifications:db.notifs.filter(n=>n.to===id).slice(0,20).map(n=>({title:n.title,message:n.message,type:n.type,at:n.at,read:n.read}))}}
function broadcast(o){if(!allowed())return NO;const title=(o.title||'').trim().slice(0,80),message=(o.message||'').trim().slice(0,400);if(!title||!message)return{ok:false,error:'Title and message are required'};
let exp=null;if(o.expiresAt){const t=new Date(o.expiresAt);if(isNaN(t.getTime()))return{ok:false,error:'Invalid expiration'};if(t.getTime()<=Date.now())return{ok:false,error:'Expiration must be in the future'};exp=t.toISOString()}
let count=0;commit(d=>{if(!Accounts.isAdmin(d.users[me])){count=-1;return}
let ids;if(o.target==='everyone')ids=Object.keys(d.users);else if(o.target==='active')ids=Object.values(d.users).filter(u=>presenceOf(u)!=='offline').map(u=>u.id);else if(o.target==='user')ids=d.users[o.userId]?[o.userId]:[];else ids=[];
ids.forEach(id=>Social._pushNotif(d,{to:id,type:'announcement',actor:me,title,message,expiresAt:exp}));count=ids.length;
d.audit.unshift({id:genId('au_'),adminId:me,action:'announcement',target:o.target+(o.userId?':'+o.userId:''),meta:{title,count},at:nowISO()});if(d.audit.length>300)d.audit.length=300},{kind:'announce'});
if(count<0)return NO;if(!count)return{ok:false,error:'No recipients matched'};return{ok:true,count}}
function setRole(id,role,val){if(!devAllowed())return{ok:false,error:'Only developers can change roles'};if(!['admin','developer'].includes(role))return{ok:false,error:'Invalid role'};let res={ok:true};
commit(d=>{if(!Accounts.isDev(d.users[me])){res=NO;return}const u=d.users[id];if(!u){res={ok:false,error:'User not found'};return}
if(role==='developer'&&!val&&Object.values(d.users).filter(x=>x.roles&&x.roles.developer).length<=1&&u.roles.developer){res={ok:false,error:'At least one developer is required'};return}
u.roles[role]=!!val;d.audit.unshift({id:genId('au_'),adminId:me,action:'role',target:id,meta:{role,value:!!val},at:nowISO()})},{kind:'role'});return res}
function audit(){if(!allowed())return NO;return{ok:true,log:db.audit.slice(0,50).map(a=>Object.assign({},a,{adminName:Social._nm(db.users[a.adminId])}))}}
return{users,stats,detail,broadcast,setRole,audit,allowed,devAllowed}})();
/* ═══ STORE: per-user finance data + settings (single source of truth for finance) ═══ */

/* ═══ INCOME ESTIMATOR ═══ */
const IncomeEstimator=(function(){
const r2=n=>Math.round((Number(n)||0)*100)/100;
function wAvg(v){if(!v.length)return 0;let num=0,den=0;for(let i=0;i<v.length;i++){const w=1/(i+1);num+=v[i]*w;den+=w}return num/den}
function trend(v){if(v.length<2)return 0;const h=Math.max(1,Math.floor(v.length/2));const a=v.slice(0,h),b=v.slice(h);return a.reduce((s,x)=>s+x,0)/a.length-b.reduce((s,x)=>s+x,0)/b.length}
const perMonth=f=>({weekly:4.33,biweekly:2.17,semimonthly:2,monthly:1})[f]||4.33;
function history(){return Store.transactions.filter(t=>t.type==='income'&&t.category==='paycheck'&&Number(t.amount)>0).map(t=>Number(t.amount))}
function estimate(){const inc=Store.incomeSettings,freq=inc.payFrequency||'weekly',h=history(),c=Store.computeIncome(inc);
if(h.length>=1){const avg=wAvg(h),tr=trend(h);const weekly=freq==='weekly'?avg:freq==='biweekly'?avg/2:freq==='semimonthly'?avg/2.165:avg/perMonth(freq);const best=c.netWeekly>0?Math.max(weekly,c.netWeekly):weekly;
return{source:'history',historyCount:h.length,avgPaycheck:r2(avg),nextPaycheck:r2(Math.max(0,avg+tr*.5)),avgWeeklyIncome:r2(best),avgMonthlyIncome:r2(best*52/12),annualIncome:r2(best*52),trend:r2(tr),trendDirection:tr>5?'up':tr<-5?'down':'flat',confidence:h.length>=6?'high':h.length>=3?'medium':'low',payFrequency:freq}}
if(c.netWeekly>0)return{source:'schedule',historyCount:0,avgPaycheck:r2(c.netPeriod),nextPaycheck:r2(c.netPeriod),avgWeeklyIncome:r2(c.netWeekly),avgMonthlyIncome:r2(c.monthlyNet),annualIncome:r2(c.annualNet),trend:0,trendDirection:'flat',confidence:'low',payFrequency:freq};
return{source:'none',historyCount:0,avgPaycheck:0,nextPaycheck:0,avgWeeklyIncome:0,avgMonthlyIncome:0,annualIncome:0,trend:0,trendDirection:'flat',confidence:'none',payFrequency:freq}}
return{estimate}})();

const MapService=(function(){
const CONFIG={tileUrl:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',geocodeEndpoint:'https://nominatim.openstreetmap.org/search',reverseEndpoint:'https://nominatim.openstreetmap.org/reverse'};

try{const res=await fetch(`${CONFIG.geocodeEndpoint}?q=${encodeURIComponent(q)}&format=json&limit=6&addressdetails=1`,{headers:{Accept:'application/json'}});if(!res.ok)return{ok:false,error:res.status===429?'Too many searches — please wait.':'Search failed.'};const data=await res.json();if(!Array.isArray(data)||!data.length)return{ok:false,error:`No results found for "${q}".`};

function hexRGB(h){h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return[isNaN(r)?0:r,isNaN(g)?0:g,isNaN(b)?0:b]}
const lum=h=>{const[r,g,b]=hexRGB(h);return(.299*r+.587*g+.114*b)/255};
const rgba=(h,a)=>{const[r,g,b]=hexRGB(h);return`rgba(${r},${g},${b},${a})`};
function applyAppearance(a){a=Object.assign({},PRESETS.default,a||Store.preferences.appearance||{});const s=document.documentElement.style,isLight=lum(a.bgColor)>.5;
s.setProperty('--green',a.accentColor);s.setProperty('--green-glow',rgba(a.accentColor,.15));s.setProperty('--on-accent',lum(a.accentColor)>.6?'#000000':'#ffffff');
s.setProperty('--primary',a.primaryColor);s.setProperty('--bg',a.bgColor);s.setProperty('--sheet',a.bgColor);s.setProperty('--card',a.cardColor);s.setProperty('--text',a.textColor);s.setProperty('--btn',a.btnColor);s.setProperty('--btn-text',lum(a.btnColor)>.6?'#000000':'#ffffff');
s.setProperty('--glass',rgba(a.cardColor,.78));s.setProperty('--glass-deep',rgba(a.bgColor,.88));
const g=isLight?LIGHT_G:DARK_G;Object.keys(g).forEach(k=>s.setProperty('--gray-'+k,g[k]));s.colorScheme=isLight?'light':'dark';
document.body.style.fontFamily=(FONTS[a.font]||FONTS.system)[1];const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',a.bgColor);
try{localStorage.setItem('lg_theme',JSON.stringify(a))}catch(e){}}

function openAI(){haptic('medium');aiChat=aiChat.slice(-40);openSheet(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div class="sheet-title" style="margin:0;text-align:left">Ask Logostics</div><button class="mini-btn" onclick="clearAIChat()">Clear</button></div><div id="ai-chat-log" style="max-height:55vh;overflow-y:auto;margin-bottom:12px;padding-right:4px">${aiChat.length===0?`<div class="ai-chat-bubble ai-bubble-system">Try: "What's my balance?", "How are my goals?" or "Who owes me?"</div>`:aiChat.map(renderAIBubble).join('')}</div><form onsubmit="submitAI(event)" style="display:flex;gap:8px"><input class="field-input" id="ai-input" placeholder="Ask anything…" autocomplete="off" style="flex:1"><button type="submit" class="btn btn-green" style="width:auto;padding:14px 22px">↑</button></form>`);setTimeout(()=>{const l=document.getElementById('ai-chat-log');if(l)l.scrollTop=l.scrollHeight;const i=document.getElementById('ai-input');if(i)i.focus()},100)}
function renderAIBubble(m){if(m.role==='user')return`<div class="ai-chat-bubble ai-bubble-user">${escapeHtml(m.text)}</div>`;if(m.role==='system')return`<div class="ai-chat-bubble ai-bubble-system">${escapeHtml(m.text)}</div>`;return`<div class="ai-chat-bubble ai-bubble-assistant">${escapeHtml(m.text).replace(/\n/g,'<br>')}</div>`}
async function submitAI(e){if(e)e.preventDefault();const input=document.getElementById('ai-input');const q=input.value.trim();if(!q||aiThinking)return;input.value='';aiChat.push({role:'user',text:q});refreshAIChatLog();aiThinking=true;
try{const r=await AIAgent.answer(q);aiChat.push({role:'assistant',text:r.reply});SoundManager.aiResponse()}catch(err){aiChat.push({role:'assistant',text:'Sorry, something went wrong.'})}finally{aiThinking=false;refreshAIChatLog()}}
function refreshAIChatLog(){const l=document.getElementById('ai-chat-log');if(!l)return;l.innerHTML=aiChat.map(renderAIBubble).join('');l.scrollTop=l.scrollHeight}
function clearAIChat(){aiChat=[];openAI()}

<div class="field"><label class="field-label">Pay frequency</label><div class="chips" id="inc-freq">${['weekly','biweekly','semimonthly','monthly'].map(f=>`<button class="chip ${i.payFrequency===f?'selected':''}" data-f="${f}" onclick="pickChip(this);incAuto()">${f}</button>`).join('')}</div></div>
<div class="field"><label class="field-label">Next payday</label><input class="field-input" id="inc-next" type="date" value="${i.nextPayday?String(i.nextPayday).split('T')[0]:''}" onchange="incAuto()"></div>
<div class="social-card" id="inc-results"></div><div class="progress-note" style="text-align:center;margin-bottom:12px">Saved automatically as you type.</div><button class="btn btn-secondary" onclick="closeSheet()">Done</button>`);refreshIncomeResults()}
function refreshIncomeResults(){const el=document.getElementById('inc-results');if(!el)return;const c=Store.computeIncome();const row=(k,x,b)=>`<div class="debug-row" ${b?'style="border:none"':''}><span class="k">${k}</span><span class="v">${fmt(x)}</span></div>`;
el.innerHTML=`<div class="t-label" style="margin-bottom:8px">Estimate</div>${row('Gross / paycheck',c.grossPeriod)}${row('Net / paycheck',c.netPeriod)}${row('Net / week',c.netWeekly)}${row('Net / month',c.monthlyNet)}${row('Gross / month',c.monthlyGross)}${row('Net / year',c.annualNet)}${row('Gross / year',c.annualGross,1)}`}
function incAuto(){const n=id=>parseFloat($v(id))||0;const f=(document.querySelector('#inc-freq .chip.selected')||{dataset:{}}).dataset.f||'weekly';Store.updateIncomeSettings({hourlyRate:n('inc-rate'),hoursPerWeek:n('inc-hours'),overtimeHours:n('inc-ot'),overtimeMultiplier:n('inc-mult')||1.5,withholdingPct:n('inc-tax'),deductions:n('inc-ded'),payFrequency:f,nextPayday:$v('inc-next')||null});refreshIncomeResults()}

/* ═══ STANDARD GOALS ═══ */
function goalStatusHTML(p){const L={completed:'<span style="color:var(--green)">✓ Completed</span>',ahead:'<span style="color:var(--green)">Ahead of schedule</span>','on-track':'<span style="color:var(--green)">On track</span>','at-risk':'<span style="color:#ff9f0a">At risk</span>',behind:'<span style="color:#ff453a">Behind</span>','no-rate':'Add a contribution to estimate'};return L[p.status]||''}
function estimateBox(p){if(p.status==='completed')return`<div style="background:var(--card);border:1px solid var(--green);border-radius:14px;padding:14px;margin-bottom:16px;font-size:13px"><div style="display:flex;justify-content:space-between"><span style="color:var(--gray-400)">Status</span><span style="font-weight:700;color:var(--green)">✓ Goal reached!</span></div></div>`;
if(p.status==='no-rate')return`<div style="background:var(--card);border:1px solid var(--gray-800);border-radius:14px;padding:14px;margin-bottom:16px;font-size:13px;color:var(--gray-500);text-align:center">Add a contribution amount and frequency, or set your income, to estimate completion.</div>`;
return`<div style="background:var(--card);border:1px solid var(--gray-800);border-radius:14px;padding:14px;margin-bottom:16px;font-size:13px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:var(--gray-400)">Progress</span><span style="font-weight:700">${p.pct}% · ${goalStatusHTML(p)}</span></div><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--gray-400)">Remaining</span><span style="font-weight:700">${fmt(p.remaining)}</span></div><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--gray-400)">~${fmt(p.weeklyRate)}/week${p.basis==='income'?' (from income & spending)':''}</span><span style="font-weight:700">~${p.weeksRemaining} wk</span></div>${p.requiredWeekly>0&&p.daysLeft!==null?`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--gray-400)">Needed for deadline</span><span style="font-weight:700">${fmt(p.requiredWeekly)}/week</span></div>`:''}<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--gray-800)"><span style="color:var(--gray-400)">Estimated completion</span><span style="font-weight:700">${fmtDateLong(p.estimatedDate.toISOString())}</span></div></div>`}
function openGoalForm(g){gDraft={image:g?g.image||null:null};const e=!!g;
openSheet(`<div class="sheet-title">${e?'Edit Goal':'Create Goal'}</div><div class="field"><label class="field-label">Goal Name</label><input class="field-input" id="gf-name" placeholder="iPhone, Vacation…" value="${e?escapeHtml(g.name):''}"></div><div class="field-row"><div class="field"><label class="field-label">Target</label><input class="field-input" id="gf-target" type="number" inputmode="decimal" placeholder="$0.00" value="${e?g.target:''}"></div><div class="field"><label class="field-label">Saved so far</label><input class="field-input" id="gf-current" type="number" inputmode="decimal" placeholder="$0.00" value="${e?g.current:0}"></div></div><div class="field-row"><div class="field"><label class="field-label">Contribution</label><input class="field-input" id="gf-contrib" type="number" inputmode="decimal" placeholder="$0.00" value="${e&&g.contribution?g.contribution:''}"></div><div class="field"><label class="field-label">Deadline</label><input class="field-input" id="gf-date" type="date" value="${e&&g.targetDate?g.targetDate.split('T')[0]:''}"></div></div><div class="field"><label class="field-label">Contribution frequency</label><div class="chips" id="gf-freq">${['daily','weekly','biweekly','monthly'].map(f=>`<button class="chip ${((e&&g.frequency)||'weekly')===f?'selected':''}" data-f="${f}" onclick="pickChip(this)">${f}</button>`).join('')}</div></div><div class="field"><label class="field-label">Icon</label><div class="chips" id="gf-emoji">${['◈','▣','◆','●','🎯','🏠','✈️','🚗','🎓'].map(x=>`<button class="chip ${((e&&g.emoji)||'◈')===x?'selected':''}" data-emoji="${x}" onclick="pickChip(this)">${x}</button>`).join('')}</div></div><div class="field"><label class="field-label">Image (optional)</label><label class="btn btn-secondary sm" style="cursor:pointer">📷 Choose image<input type="file" accept="image/*" style="display:none" onchange="gfImage(event)"></label><img id="gf-prev" src="${gDraft.image?escapeHtml(gDraft.image):''}" style="width:100%;border-radius:14px;margin-top:10px;${gDraft.image?'':'display:none'}"></div><button class="btn btn-primary" onclick="submitGoalForm(${e?g.id:'null'})">${e?'Save changes':'Create Goal'}</button><button class="btn btn-secondary" style="margin-top:8px" onclick="closeSheet()">Cancel</button>`)}
const openAddGoal=()=>openGoalForm(null);
function gfImage(ev){readImage(ev.target.files[0],480,u=>{gDraft.image=u;const p=document.getElementById('gf-prev');if(p){p.src=u;p.style.display='block'}})}
async function submitGoalForm(id){const name=$v('gf-name').trim(),target=parseFloat($v('gf-target')),current=parseFloat($v('gf-current'))||0,contribution=parseFloat($v('gf-contrib'))||0,date=$v('gf-date'),sel=q=>(document.querySelector(q)||{dataset:{}}).dataset;
if(!name){toast('Enter a goal name');return}if(!target||target<=0){toast('Enter a valid target');return}
const d={name,target,current,contribution,frequency:sel('#gf-freq .chip.selected').f||'weekly',emoji:sel('#gf-emoji .chip.selected').emoji||'◈',targetDate:date?new Date(date).toISOString():null,image:gDraft.image};
if(id){await Store.updateGoal(id,d);toast('Goal updated')}else{await Store.addGoal(d);toast('Goal created')}closeSheet();haptic('success');SoundManager.goalCreated();render()}
function openGoalDetail(id){const g=Store.getGoal(id);if(!g)return;if(g.type==='moving'){openMovingGoalDetail(id);return}const p=Store.computeGoalProgress(g),sh=Social.myShare(id);
openSheet(`<div style="text-align:center;margin-bottom:28px">${g.image?`<img src="${escapeHtml(g.image)}" class="goal-img" style="height:140px">`:`<div style="font-size:52px;margin-bottom:10px;opacity:.85">${escapeHtml(g.emoji)}</div>`}<div style="font-size:22px;font-weight:700">${escapeHtml(g.name)}</div><div style="font-size:14px;color:var(--gray-500);margin-top:4px">${p.pct}% complete${g.targetDate?' · due '+fmtDateLong(g.targetDate):''}</div></div><div style="display:flex;justify-content:space-between;font-size:22px;font-weight:700;margin-bottom:14px"><span>${fmt(g.current)}</span><span style="color:var(--gray-500)">${fmt(g.target)}</span></div><div class="goal-bar" style="height:10px;margin-bottom:20px"><div class="goal-fill" style="width:${p.pct}%"></div></div>${estimateBox(p)}<div class="field"><label class="field-label">Add to goal</label><div style="display:flex;gap:8px"><input class="field-input" id="g-add" type="number" inputmode="decimal" placeholder="$0.00" style="flex:1"><button class="btn btn-green" style="width:auto;padding:14px 22px" onclick="addToGoal(${g.id})">Add</button></div></div><div class="btn-row"><button class="btn btn-secondary" onclick="closeSheet();openShareGoal(${g.id})">👥 ${sh?'Sharing: '+escapeHtml(shareLabel(sh)):'Share'}</button><button class="btn btn-secondary" onclick="closeSheet();openGoalForm(Store.getGoal(${g.id}))">✎ Edit</button></div><button class="btn btn-danger" style="margin-top:12px" onclick="confirmDeleteGoal(${g.id})">Delete Goal</button><button class="btn btn-secondary" style="margin-top:8px" onclick="closeSheet()">Close</button>`)}
const shareLabel=s=>s.visibility==='friends'?'Friends':s.visibility==='users'?(s.userIds.length+' people'):s.visibility==='group'?'Group':'Private';
async function addToGoal(id){const amt=parseFloat($v('g-add'));if(!amt||amt<=0){toast('Enter a valid amount');return}const g=Store.getGoal(id);if(!g)return;const was=g.current>=g.target;await Store.updateGoal(id,{current:g.current+amt});closeSheet();haptic('success');if(!was&&g.current+amt>=g.target){SoundManager.goalCompleted();showCelebration();toast('🎉 Goal reached!')}else{SoundManager.success();toast('Added to goal')}render()}
async function confirmDeleteGoal(id){if(confirm('Delete this goal? Any sharing will be removed.')){await Store.deleteGoal(id);closeSheet();haptic('heavy');toast('Goal deleted');render()}}

/* ═══ MOVING GOALS ═══ */
function openAddMovingGoal(){mgDraft={id:null,name:'Move',destination:{lat:null,lng:null,name:'',city:'',state:'',country:'',postalCode:'',fullName:''},target:0,current:0,weeklyContribution:0,monthlyContribution:0,targetDate:null,reminderDate:null,image:null};openMovingGoalEditor('Create Moving Goal')}
function openEditMovingGoal(id){const g=Store.getGoal(id);if(!g||g.type!=='moving')return;mgDraft=JSON.parse(JSON.stringify(g));openMovingGoalEditor('Edit Moving Goal')}
function renderCalcPreview(c){const M={ahead:['Ahead of pace','var(--green)'],'on-track':['On track','var(--green)'],behind:['Behind pace','#ff9f0a'],'no-rate':['Set a rate','var(--gray-500)'],'no-date':['Set a date','var(--gray-500)'],completed:['Completed','var(--green)']};const st=M[c.status]||['','var(--gray-500)'];
return`<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:var(--gray-400)">Progress</span><span style="font-weight:700;color:${st[1]}">${c.pct}% · ${st[0]}</span></div><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--gray-400)">Remaining</span><span style="font-weight:700">${fmt(c.remaining)}</span></div>${c.requiredWeekly>0?`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--gray-400)">Weekly needed</span><span style="font-weight:700">${fmt(c.requiredWeekly)}</span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--gray-400)">Monthly needed</span><span style="font-weight:700">${fmt(c.requiredMonthly)}</span></div>`:`<div style="color:var(--gray-500);font-size:12px">Set a target date to see required amounts.</div>`}${c.estimatedDate?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--gray-800);display:flex;justify-content:space-between"><span style="color:var(--gray-400)">Est. completion</span><span style="font-weight:700">${fmtDateLong(new Date(c.estimatedDate).toISOString())}</span></div>`:''}`}
function openMovingGoalEditor(title){const d=mgDraft,has=d.destination&&d.destination.lat!==null&&d.destination.lng!==null,mapId='mg-editor-map',calc=MovingGoalCalculator.compute(d);
openSheet(`<div class="sheet-title">${escapeHtml(title)}</div><div class="field"><label class="field-label">Where are you moving?</label><div style="display:flex;gap:8px"><input class="field-input" id="mg-search-input" placeholder="City, ZIP, or address…" style="flex:1" autocomplete="off"><button type="button" class="btn btn-secondary" style="width:auto;padding:14px 18px" onclick="mgSearchDestination()">Search</button></div><div id="mg-search-results" style="margin-top:10px"></div></div>${has?`<div class="mg-detail-map" id="${mapId}" style="height:260px;margin-bottom:12px"><div class="map-inner" id="${mapId}-inner"></div><div class="mg-map-controls"><button type="button" class="mg-map-btn" onclick="mgResetMap()">◉</button></div></div><p style="font-size:11.5px;color:var(--gray-500);margin-bottom:16px">Drag the marker or tap the map to move your destination.</p>`:`<div class="mg-detail-map" style="height:200px;display:flex;align-items:center;justify-content:center;color:var(--gray-500);font-size:13px;text-align:center;padding:20px">${MapService.leafletReady()?'Search for a city or ZIP above to place your destination.':'Map library could not load.'}</div>`}${!MapService.isOnline()?`<div class="offline-notice">📴 Offline — search and map are unavailable.</div>`:''}<div class="field"><label class="field-label">Destination name</label><input class="field-input" id="mg-dest-name" value="${escapeHtml(d.destination&&(d.destination.name||d.destination.city)||'')}"></div><div class="field"><label class="field-label">Goal name</label><input class="field-input" id="mg-name" value="${escapeHtml(d.name||'')}"></div><div class="field-row"><div class="field"><label class="field-label">Target</label><input class="field-input" id="mg-target" type="number" inputmode="decimal" value="${d.target||''}" oninput="mgUpdateCalc()"></div><div class="field"><label class="field-label">Current</label><input class="field-input" id="mg-current" type="number" inputmode="decimal" value="${d.current||''}" oninput="mgUpdateCalc()"></div></div><div class="field-row"><div class="field"><label class="field-label">Weekly contribution</label><input class="field-input" id="mg-weekly" type="number" inputmode="decimal" value="${d.weeklyContribution||''}" oninput="mgUpdateCalc()"></div><div class="field"><label class="field-label">Monthly contribution</label><input class="field-input" id="mg-monthly" type="number" inputmode="decimal" value="${d.monthlyContribution||''}" oninput="mgUpdateCalc()"></div></div><div class="field-row"><div class="field"><label class="field-label">Target move date</label><input class="field-input" id="mg-target-date" type="date" value="${d.targetDate?d.targetDate.split('T')[0]:''}" onchange="mgUpdateCalc()"></div><div class="field"><label class="field-label">Reminder date</label><input class="field-input" id="mg-reminder-date" type="date" value="${d.reminderDate?d.reminderDate.split('T')[0]:''}"></div></div><div id="mg-calc-preview" style="background:var(--card);border:1px solid var(--gray-800);border-radius:14px;padding:14px;margin-bottom:16px;font-size:13px">${renderCalcPreview(calc)}</div><div class="field"><label class="field-label">Inspiration image (optional)</label><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="btn btn-secondary" style="cursor:pointer;width:auto;padding:12px 18px">📷 Choose image<input type="file" accept="image/*" style="display:none" onchange="mgHandleImage(event)"></label>${d.image?`<button type="button" class="btn btn-danger" style="width:auto;padding:12px 18px" onclick="mgRemoveImage()">Remove</button>`:''}</div>${d.image?`<img src="${escapeHtml(d.image)}" style="width:100%;border-radius:14px;margin-top:10px">`:''}</div><button class="btn btn-primary" style="margin-top:8px" onclick="mgSaveGoal()">${d.id?'Save changes':'Create moving goal'}</button><button class="btn btn-secondary" style="margin-top:8px" onclick="closeSheet()">Cancel</button>`);
if(has&&MapService.leafletReady())setTimeout(()=>{const inner=document.getElementById(mapId+'-inner');if(!inner)return;const map=MapService.createMap(inner,{center:[d.destination.lat,d.destination.lng],zoom:11});if(!map)return;const marker=MapService.createMarker(d.destination.lat,d.destination.lng,{draggable:true});if(!marker)return;marker.addTo(map);marker.on('dragend',async()=>{const p=marker.getLatLng();await mgApplyReverse(p.lat,p.lng)});map.on('click',async e=>{marker.setLatLng(e.latlng);await mgApplyReverse(e.latlng.lat,e.latlng.lng)});activeMaps.set(inner.id,{map,marker});setTimeout(()=>{try{map.invalidateSize()}catch(e){}},150)},200)}
async function mgApplyReverse(lat,lng){mgDraft.destination.lat=lat;mgDraft.destination.lng=lng;haptic('light');SoundManager.mapDestination();if(!MapService.isOnline()){toast('Location updated (offline)');return}const r=await MapService.reverseGeocode(lat,lng);if(r.ok){Object.assign(mgDraft.destination,{city:r.result.city,state:r.result.state,country:r.result.country,name:r.result.city||r.result.name});const i=document.getElementById('mg-dest-name');if(i)i.value=mgDraft.destination.name}}
function mgUpdateCalc(){const wd=$v('mg-target-date');const c=MovingGoalCalculator.compute({target:parseFloat($v('mg-target'))||0,current:parseFloat($v('mg-current'))||0,weeklyContribution:parseFloat($v('mg-weekly'))||0,monthlyContribution:parseFloat($v('mg-monthly'))||0,targetDate:wd?new Date(wd).toISOString():null});const p=document.getElementById('mg-calc-preview');if(p)p.innerHTML=renderCalcPreview(c)}
async function mgSearchDestination(){const input=document.getElementById('mg-search-input'),res=document.getElementById('mg-search-results');if(!input||!res)return;const q=input.value.trim();if(q.length<2){toast('Enter at least 2 characters');return}res.innerHTML='<div style="padding:12px;color:var(--gray-500);font-size:13px">Searching…</div>';const r=await MapService.searchLocation(q);if(!r.ok){res.innerHTML=`<div style="padding:12px;color:#ff9f0a;font-size:13px">${escapeHtml(r.error)}</div>`;return}mgDraft._searchResults=r.results;res.innerHTML=r.results.map((x,i)=>`<div class="mg-search-result" onclick="mgPickResult(${i})"><span class="pin">📍</span><div style="flex:1;min-width:0"><div class="name">${escapeHtml(x.name)}</div><div class="full">${escapeHtml(x.fullName)}</div></div></div>`).join('')}
function mgPickResult(i){const r=mgDraft._searchResults&&mgDraft._searchResults[i];if(!r)return;mgDraft.destination={lat:r.lat,lng:r.lng,name:r.city||r.name,fullName:r.fullName,city:r.city,state:r.state,country:r.country,postalCode:r.postalCode};SoundManager.mapDestination();openMovingGoalEditor('Edit Moving Goal')}
function mgResetMap(){const d=mgDraft;if(!d||!d.destination||d.destination.lat===null)return;const i=document.getElementById('mg-editor-map-inner');if(i&&activeMaps.has(i.id)){try{activeMaps.get(i.id).map.setView([d.destination.lat,d.destination.lng],11,{animate:true})}catch(e){}}}
function mgHandleImage(ev){readImage(ev.target.files[0],640,u=>{mgDraft.image=u;openMovingGoalEditor('Edit Moving Goal')})}
function mgRemoveImage(){mgDraft.image=null;openMovingGoalEditor('Edit Moving Goal')}
async function mgSaveGoal(){const name=$v('mg-name').trim()||'Move',dn=$v('mg-dest-name').trim(),target=parseFloat($v('mg-target'))||0,current=parseFloat($v('mg-current'))||0,w=parseFloat($v('mg-weekly'))||0,m=parseFloat($v('mg-monthly'))||0,td=$v('mg-target-date'),rd=$v('mg-reminder-date');
if(!target||target<=0){toast('Enter a target amount');return}if(!mgDraft.destination||mgDraft.destination.lat===null){toast('Please select a destination');return}
const g={name:name.startsWith('Move')?name:'Move to '+name,destination:Object.assign({},mgDraft.destination,{name:dn||mgDraft.destination.city||mgDraft.destination.name||'Destination'}),target,current,weeklyContribution:w,monthlyContribution:m,targetDate:td?new Date(td).toISOString():null,reminderDate:rd?new Date(rd).toISOString():null,image:mgDraft.image};delete g.destination._searchResults;
if(mgDraft.id){await Store.updateGoal(mgDraft.id,g);toast('Moving goal updated')}else{await Store.addMovingGoal(g);toast('Moving goal created')}haptic('success');SoundManager.goalCreated();closeSheet();switchTab('goals')}
function openMovingGoalDetail(id){const g=Store.getGoal(id);if(!g||g.type!=='moving')return;const c=MovingGoalCalculator.compute(g),ctx=MovingGoalCalculator.withIncomeContext(g),has=g.destination&&typeof g.destination.lat==='number'&&typeof g.destination.lng==='number',mapId='mg-detail-map-'+g.id;
const dn=g.destination&&g.destination.city?`${g.destination.city}${g.destination.state?', '+g.destination.state:''}${g.destination.country?', '+g.destination.country:''}`:(g.destination&&g.destination.name||'Destination not set');
