<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logostics">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Logostics Finance · Social</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" media="print" onload="this.media='all'">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
:root{--black:#000;--white:#fff;--bg:#000;--card:#121212;--text:#fff;--primary:#fff;--btn:#fff;--btn-text:#000;--on-accent:#000;--sheet:#0a0a0a;
--gray-950:#0a0a0a;--gray-900:#121212;--gray-850:#1a1a1a;--gray-800:#222;--gray-700:#2e2e2e;--gray-600:#3a3a3a;--gray-500:#555;--gray-400:#777;--gray-300:#999;--gray-200:#bbb;--gray-100:#ddd;
--green:#30d158;--green-glow:rgba(48,209,88,.15);--red:#ff453a;--orange:#ff9f0a;--glass:rgba(18,18,18,.72);--glass-deep:rgba(10,10,10,.85);
--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);
--ease:cubic-bezier(.32,.72,0,1);--ease-out:cubic-bezier(.16,1,.3,1);--nav-h:76px}
html{background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;height:100%}
body{font-family:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;padding-top:var(--safe-top);padding-left:var(--safe-left);padding-right:var(--safe-right);overflow-x:hidden;width:100%;max-width:100vw;user-select:none;letter-spacing:-.01em;position:relative;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 8px);-webkit-user-select:none;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none;touch-action:manipulation}
body.noauth{padding-bottom:24px}
body.noauth .bottom-nav,body.noauth .privacy-btn,body.noauth .ai-fab{display:none}
input,textarea{user-select:text;-webkit-user-select:text}
.app-lock{position:fixed;inset:0;background:var(--bg);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;animation:fade-in .2s ease}
.app-lock.on{display:flex}
.app-lock-icon{width:88px;height:88px;border-radius:28px;border:2px solid var(--gray-700);display:flex;align-items:center;justify-content:center;font-size:42px;filter:grayscale(1)}
.app-lock-title{font-size:22px;font-weight:700;letter-spacing:-.02em;text-align:center}
.app-lock-sub{font-size:14px;color:var(--gray-500);text-align:center;max-width:300px;line-height:1.5}
.app-lock-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
::-webkit-scrollbar{width:0;height:0}
.t-large{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--primary)}
.t-title{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--primary)}
.t-caption{font-size:12px;font-weight:500;color:var(--gray-400);letter-spacing:.01em}
.t-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em}
.glass-deep{background:var(--glass-deep);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);border:1px solid rgba(128,128,128,.12)}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(128,128,128,.12)}
.container{max-width:430px;margin:0 auto;padding:0 20px;width:100%}
.section{margin-bottom:28px}
.section-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:0 2px}
.top-header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 8px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.03em;color:var(--primary)}
.brand-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:middle;box-shadow:0 0 8px var(--green-glow);animation:pulse-dot 2s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;background:var(--gray-850);border:1px solid var(--gray-700);color:var(--gray-300);transition:all .2s var(--ease);font-family:inherit;position:relative}
.icon-btn:active{transform:scale(.9);background:var(--gray-800)}
.icon-btn.solid{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}
.hero{text-align:center;padding:32px 0 24px}
.hero-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px}
.hero-amount{font-size:64px;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;color:var(--primary);word-break:break-all}
.hero-status{font-size:12px;color:var(--gray-500);margin-top:10px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.status-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse-dot 2s ease-in-out infinite}
.cash-card{border-radius:28px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.cash-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.cash-main{font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.cash-main-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.cash-badge{padding:6px 12px;border-radius:20px;background:var(--green-glow);border:1px solid var(--green);color:var(--green);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cash-rows{border-top:1px solid var(--gray-800);padding-top:16px}
.cash-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px}
.cash-row .lbl{color:var(--gray-400);display:flex;align-items:center;gap:8px;font-weight:500}
.cash-row .amt{font-weight:600;font-variant-numeric:tabular-nums}
.cash-row .amt.pos{color:var(--green)}.cash-row .amt.neg{color:var(--gray-200)}
.cash-proj{margin-top:14px;padding-top:14px;border-top:1px solid var(--gray-800);display:flex;justify-content:space-between;align-items:baseline}
.cash-proj .lbl{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em}
.cash-proj .amt{font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--green);font-variant-numeric:tabular-nums}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px}
.quick-btn{border-radius:18px;padding:16px 8px 12px;text-align:center;cursor:pointer;transition:all .2s var(--ease);display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid var(--gray-800);font-family:inherit;color:var(--text)}
.quick-btn:active{transform:scale(.92);background:var(--gray-850)}
.quick-btn .ico{font-size:22px;line-height:1;filter:grayscale(1)}
.quick-btn.primary .ico{filter:none}
.quick-btn .lbl{font-size:10px;font-weight:600;color:var(--gray-400);letter-spacing:.02em}
.insight{border-radius:18px;padding:16px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--gray-800)}
.insight .ico{font-size:18px;flex-shrink:0;margin-top:1px;filter:grayscale(1)}
.insight .txt{font-size:13.5px;line-height:1.45;color:var(--gray-300);font-weight:400}
.insight .txt strong{color:var(--text);font-weight:600}
.activity-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;margin-bottom:6px;background:var(--card);border:1px solid var(--gray-800);transition:all .2s var(--ease);cursor:pointer;position:relative;touch-action:pan-y}
.activity-item:active{transform:scale(.98);background:var(--gray-850)}
.activity-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--gray-850);border:1px solid var(--gray-700);filter:grayscale(1)}
.activity-ico.income{filter:none;border-color:var(--green);background:var(--green-glow)}
.activity-body{flex:1;min-width:0}
.activity-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.activity-meta{font-size:11.5px;color:var(--gray-500);margin-top:2px;display:flex;gap:8px;font-weight:500}
.activity-amt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;letter-spacing:-.01em}
.activity-amt.pos{color:var(--green)}.activity-amt.neg{color:var(--gray-200)}
.goal-card{border-radius:24px;padding:22px;margin-bottom:12px;background:var(--card);border:1px solid var(--gray-800);transition:all .2s var(--ease);cursor:pointer;position:relative}
.goal-card:active{transform:scale(.985)}
.goal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px}
.goal-name{font-size:17px;font-weight:700;letter-spacing:-.02em}
.goal-pct{font-size:12px;color:var(--gray-500);font-weight:600;margin-top:3px}
.goal-emoji{font-size:26px;filter:grayscale(1);opacity:.7}
.goal-card.active .goal-emoji{filter:none;opacity:1}
.goal-img{width:100%;height:110px;object-fit:cover;border-radius:14px;margin-bottom:14px;border:1px solid var(--gray-800)}
.goal-bar{width:100%;height:6px;background:var(--gray-800);border-radius:3px;overflow:hidden;margin:14px 0 10px}
.goal-fill{height:100%;border-radius:3px;background:var(--green);transition:width .7s var(--ease-out)}
.goal-stats{display:flex;justify-content:space-between;font-size:13px;color:var(--gray-400);font-weight:500;font-variant-numeric:tabular-nums}
.goal-stats .hl{color:var(--text);font-weight:600}
.goal-eta{margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-800);font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:6px;font-weight:500}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + var(--safe-bottom));z-index:100;border-top:1px solid var(--gray-800);transform:translateZ(0)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;border-radius:14px;cursor:pointer;transition:all .25s var(--ease);background:none;border:none;color:var(--gray-500);font-family:inherit;min-width:50px;touch-action:manipulation;position:relative}
.nav-item.active{color:var(--text)}
.nav-item.active .nav-ico{filter:none;transform:scale(1.05)}
.nav-item:active{transform:scale(.88)}
.nav-ico{font-size:21px;line-height:1;filter:grayscale(1);transition:all .25s var(--ease)}
.nav-lbl{font-size:10px;font-weight:600;letter-spacing:.01em}
.swipe-back-indicator{position:fixed;left:0;top:50%;transform:translateY(-50%);width:4px;height:60px;background:var(--green);border-radius:0 4px 4px 0;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
.swipe-back-indicator.on{opacity:.6}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:1000;display:none;align-items:flex-end;justify-content:center;animation:fade-in .25s ease}
.sheet-overlay.on{display:flex}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:430px;max-height:92vh;overflow-y:auto;border-radius:32px 32px 0 0;padding:12px 20px calc(24px + var(--safe-bottom));animation:slide-up .4s var(--ease-out);background:var(--sheet);border-top:1px solid var(--gray-800);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;color:var(--text)}
@keyframes slide-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-grip{width:36px;height:4px;background:var(--gray-600);border-radius:2px;margin:0 auto 20px}
.sheet-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:24px;text-align:center;color:var(--primary)}
.field{margin-bottom:18px}
.field-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:block}
.field-input{width:100%;background:var(--card);border:1px solid var(--gray-800);border-radius:14px;padding:16px;font-size:17px;color:var(--text);font-family:inherit;transition:all .2s var(--ease);-webkit-appearance:none;appearance:none;letter-spacing:-.01em}
.field-input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-glow)}
.field-input::placeholder{color:var(--gray-600)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:20px;background:var(--card);border:1px solid var(--gray-800);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);display:flex;align-items:center;gap:6px;color:var(--gray-300);font-family:inherit}
.chip:active{transform:scale(.92)}
.chip.selected{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.chip .emoji{filter:grayscale(1)}.chip.selected .emoji{filter:none}
.btn{padding:16px 24px;border-radius:14px;font-size:17px;font-weight:600;border:none;cursor:pointer;transition:all .2s var(--ease);font-family:inherit;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--btn);color:var(--btn-text)}
.btn-green{background:var(--green);color:var(--on-accent)}
.btn-secondary{background:var(--card);border:1px solid var(--gray-800);color:var(--text)}
.btn-danger{background:transparent;border:1px solid var(--gray-700);color:var(--gray-300)}
.btn-row{display:flex;gap:10px;margin-top:8px}.btn-row .btn{flex:1}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:10px;width:auto}
.empty{text-align:center;padding:56px 24px}
.empty-ico{font-size:44px;margin-bottom:18px;opacity:.3;filter:grayscale(1)}
.empty-title{font-size:17px;font-weight:600;margin-bottom:8px;letter-spacing:-.02em}
.empty-sub{font-size:14px;color:var(--gray-500);line-height:1.5;max-width:260px;margin:0 auto}
.toast{position:fixed;top:calc(20px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-140%);padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:2000;transition:transform .45s var(--ease-out);display:flex;align-items:center;gap:10px;max-width:90vw;background:var(--card);border:1px solid var(--gray-700);color:var(--text);letter-spacing:-.01em;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.privacy-btn{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);right:20px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:90;transition:all .25s var(--ease);background:var(--card);border:1px solid var(--gray-700);color:var(--gray-300);font-family:inherit}
.privacy-btn.active{background:var(--green);color:var(--on-accent);border-color:var(--green)}
.ai-fab{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);right:74px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;z-index:90;transition:all .25s var(--ease);background:var(--card);border:1px solid var(--gray-700);color:var(--text);font-family:inherit;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.ai-fab:active{transform:scale(.9)}
.fade-in{animation:fade-up .35s var(--ease-out)}
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stagger>*{animation:fade-up .4s var(--ease-out) backwards}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.14s}
.scroll-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.scroll-row>*{flex-shrink:0}
.segmented{display:flex;background:var(--card);border:1px solid var(--gray-800);border-radius:12px;padding:3px}
.seg{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:all .2s var(--ease);background:none;border:none;color:var(--gray-500);font-family:inherit}
.seg.active{background:var(--btn);color:var(--btn-text)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{border-radius:18px;padding:18px 16px;background:var(--card);border:1px solid var(--gray-800);text-align:center}
.stat-val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat-lbl{font-size:10px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.chart-card{border-radius:22px;padding:20px;margin-bottom:12px;background:var(--card);border:1px solid var(--gray-800)}
.chart-card h3{font-size:14px;font-weight:600;margin-bottom:18px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-radius:14px;margin-bottom:6px;background:var(--card);border:1px solid var(--gray-800);cursor:pointer;transition:all .2s var(--ease)}
.set-row:active{background:var(--gray-850);transform:scale(.985)}
.set-row.static{cursor:default}.set-row.static:active{transform:none}
.set-left{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500}
.set-left .ico{font-size:16px;width:20px;text-align:center;filter:grayscale(1);opacity:.7}
.set-right{color:var(--gray-500);font-size:13px;display:flex;align-items:center;gap:6px;font-weight:500}
.toggle{position:relative;width:50px;height:30px;background:var(--gray-700);border-radius:15px;cursor:pointer;transition:background .3s var(--ease);flex-shrink:0}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;background:#fff;border-radius:50%;transition:transform .3s var(--ease);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.toggle.on::after{transform:translateX(20px)}
.cap-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.04em;text-transform:uppercase}
.cap-badge.ok{background:var(--green-glow);color:var(--green);border:1px solid var(--green)}
.cap-badge.no{background:var(--gray-850);color:var(--gray-500);border:1px solid var(--gray-700)}
.cap-badge.warn{background:rgba(255,159,10,.12);color:#ff9f0a;border:1px solid rgba(255,159,10,.25)}
.patch-version{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.patch-date{font-size:11px;color:var(--gray-500);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.patch-section{margin-bottom:12px}
.patch-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--green);margin-bottom:6px}
.patch-section ul{list-style:none}
.patch-section li{font-size:13.5px;color:var(--gray-300);line-height:1.5;padding:3px 0 3px 16px;position:relative}
.patch-section li::before{content:'·';position:absolute;left:4px;color:var(--gray-500)}
.debug-row{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;font-size:12px;font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid var(--gray-800)}
.debug-row .k{color:var(--gray-500)}.debug-row .v{color:var(--text);font-weight:600;text-align:right;word-break:break-all}
.ai-chat-bubble{max-width:85%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.45;margin-bottom:10px;word-break:break-word;animation:bubble-in .3s var(--ease-out)}
@keyframes bubble-in{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.ai-bubble-user{background:var(--btn);color:var(--btn-text);margin-left:auto;border-bottom-right-radius:6px;font-weight:500}

/* ═══ iPHONE: glass, glass sliders, voice, Siri ═══ */
:root{--glass-rgb:0,0,0;--g-blur:28px;--g-a:.62;--g-shine:.55}
.iphone.glass-on .bottom-nav{background:rgba(var(--glass-rgb),var(--g-a));backdrop-filter:blur(var(--g-blur)) saturate(190%);-webkit-backdrop-filter:blur(var(--g-blur)) saturate(190%);border-top:1px solid rgba(255,255,255,calc(var(--g-shine)*.2));box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--g-shine)*.16)),0 -10px 34px rgba(0,0,0,.28)}
.iphone.glass-on .sheet{background:rgba(var(--glass-rgb),calc(var(--g-a) + .24));backdrop-filter:blur(var(--g-blur)) saturate(190%);-webkit-backdrop-filter:blur(var(--g-blur)) saturate(190%);border-top:1px solid rgba(255,255,255,calc(var(--g-shine)*.24));box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--g-shine)*.2))}
.iphone.glass-on .toast,.iphone.glass-on .ai-fab,.iphone.glass-on .privacy-btn,.iphone.glass-on .ptr,.iphone.glass-on .edit-toolbar{background:rgba(var(--glass-rgb),var(--g-a));backdrop-filter:blur(var(--g-blur)) saturate(190%);-webkit-backdrop-filter:blur(var(--g-blur)) saturate(190%);border:1px solid rgba(255,255,255,calc(var(--g-shine)*.24));box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--g-shine)*.2)),0 8px 28px rgba(0,0,0,.3)}
.glass-slider{--v:50%;-webkit-appearance:none;appearance:none;display:block;width:100%;height:40px;margin:0;background:transparent;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
.glass-slider::-webkit-slider-runnable-track{height:12px;border-radius:99px;background:linear-gradient(90deg,var(--green) 0,var(--green) var(--v),rgba(127,127,127,.28) var(--v));box-shadow:inset 0 1px 3px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.glass-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:46px;height:28px;margin-top:-9px;border-radius:99px;border:1px solid rgba(255,255,255,.6);background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .18s var(--ease)}
.glass-slider:active::-webkit-slider-thumb{transform:scale(1.14)}
.glass-slider:focus-visible::-webkit-slider-thumb{outline:2px solid var(--green);outline-offset:2px}
.glass-slider::-moz-range-track{height:12px;border-radius:99px;background:rgba(127,127,127,.28)}.glass-slider::-moz-range-progress{height:12px;border-radius:99px;background:var(--green)}
.glass-slider::-moz-range-thumb{width:46px;height:28px;border-radius:99px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.7)}
.gs{padding:12px 16px 4px;border-radius:14px;margin-bottom:6px;background:var(--card);border:1px solid var(--gray-800)}
.gs.dim{opacity:.45;pointer-events:none}
.gs-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600}
.gs-top b{color:var(--green);font-variant-numeric:tabular-nums;font-size:13px}
.gs-note{font-size:11.5px;color:var(--gray-500);margin:-2px 0 4px;line-height:1.4}
.mic-btn{width:50px;flex:none;border-radius:14px;border:1px solid var(--gray-800);background:var(--card);font-size:20px;color:var(--text);font-family:inherit}
.mic-btn.rec{background:var(--red);border-color:var(--red);color:#fff;animation:micpulse 1s ease-in-out infinite}
@keyframes micpulse{50%{transform:scale(1.08)}}
.sr-code{font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.5;background:var(--gray-900);border:1px solid var(--gray-800);border-radius:10px;padding:10px;word-break:break-all;user-select:text;-webkit-user-select:text;margin:8px 0}

@media (prefers-reduced-motion:reduce){.mic-btn.rec{animation:none}.glass-slider::-webkit-slider-thumb{transition:none}}
/* ═══ VACATIONS ═══ */

.vac-hero .pill{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.25);padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.vac-big{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.vac-big b{font-size:30px;letter-spacing:-.03em;font-weight:700}.vac-big span{font-size:15px;color:var(--gray-400);font-weight:600}
.vac-bar{position:relative;height:12px;border-radius:99px;background:var(--gray-800);margin:14px 0 22px}
.vac-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--green);transition:width .8s var(--ease-out);min-width:0}
.vac-tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.18);border-radius:1px}

.vac-tick.hit span{color:var(--green)}
.vac-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.vac-stat{background:var(--gray-900);border:1px solid var(--gray-800);border-radius:14px;padding:11px 12px}
.vac-stat .l{font-size:10.5px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.vac-stat .v{font-size:17px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.vac-cta{display:flex;gap:8px;margin:2px 0 12px}
.vac-cta .btn{padding:14px 18px;font-size:16px}
.vac-lb{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;background:var(--card);border:1px solid var(--gray-800);margin-bottom:8px;position:relative;overflow:hidden}

.vac-lb .rk{width:26px;text-align:center;font-size:17px;font-weight:700;color:var(--gray-400);flex:none}
.vac-lb .rk.g1{color:#ffd60a}.vac-lb .rk.g2{color:#c7c7cc}.vac-lb .rk.g3{color:#d89b6a}
.vac-lb .nm{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vac-lb .sub{font-size:12px;color:var(--gray-500);margin-top:1px}
.vac-lb .amt{margin-left:auto;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;flex:none}
.vac-lb .amt small{display:block;font-size:11px;color:var(--gray-500);font-weight:600}
.vac-lb .sh{position:absolute;left:0;bottom:0;height:3px;background:var(--green);opacity:.7;border-radius:0 2px 0 0}
.vac-crown{font-size:11px;font-weight:700;color:#ffd60a;background:rgba(255,214,10,.12);border:1px solid rgba(255,214,10,.35);border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.vac-feed{display:flex;gap:11px;padding:11px 2px;border-bottom:1px solid var(--gray-800);align-items:flex-start}
.vac-feed:last-child{border-bottom:none}
.vac-feed .fi{font-size:19px;width:30px;text-align:center;flex:none;padding-top:1px}
.vac-feed .ft{font-size:14px;line-height:1.4}
.vac-feed .fw{font-size:11.5px;color:var(--gray-500);margin-top:2px}
.vac-card-g{border-radius:22px;overflow:hidden;margin-bottom:12px;background:var(--card);border:1px solid var(--gray-800);cursor:pointer;transition:transform .2s var(--ease);position:relative}
.vac-card-g:active{transform:scale(.985)}
.vac-card-g .cv{height:96px;background:var(--gray-800);background-size:cover;background-position:center;position:relative}
.vac-card-g .cv::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}
.vac-card-g .cv .badge{position:absolute;top:10px;right:10px;z-index:2}
.vac-card-g .cv .tt{position:absolute;left:14px;bottom:9px;z-index:2;color:#fff;font-weight:700;font-size:19px;letter-spacing:-.02em;text-shadow:0 1px 10px rgba(0,0,0,.5);right:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vac-card-g .bd{padding:14px 16px 16px}
.vac-card-g .st{display:flex;justify-content:space-between;font-size:12.5px;color:var(--gray-400);margin-top:2px}
.vac-card-g .st b{color:var(--text);font-variant-numeric:tabular-nums}
.vac-inv{border-color:rgba(255,159,10,.45)}
.vac-chip-row{display:flex;gap:8px;overflow-x:auto;margin:0 -2px 12px;padding:2px;scrollbar-width:none}
.vac-chip-row::-webkit-scrollbar{display:none}
.vac-chip-row .chip{flex:none}
.vac-seg{display:flex;background:var(--gray-900);border:1px solid var(--gray-800);border-radius:14px;padding:3px;gap:3px;margin-bottom:12px}
.vac-seg button{flex:1;padding:9px 6px;border-radius:11px;border:none;background:transparent;color:var(--gray-400);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.vac-seg button.on{background:var(--gray-700);color:var(--text)}
.vac-mode{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vac-mode button{padding:12px 6px;border-radius:14px;border:1px solid var(--gray-800);background:var(--card);color:var(--gray-300);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center}
.vac-mode button span{font-size:22px}
.vac-mode button.on{border-color:var(--green);background:var(--green-glow);color:var(--text)}
.vac-empty{text-align:center;padding:26px 16px;color:var(--gray-500);font-size:13.5px;line-height:1.55}
.vac-empty .ei{font-size:34px;opacity:.5;margin-bottom:8px}
.vac-err{border-radius:14px;border:1px solid rgba(255,69,58,.4);background:rgba(255,69,58,.08);padding:12px 14px;font-size:13px;line-height:1.5;color:var(--gray-200);margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.vac-err button{margin-left:auto;flex:none}
.vac-skel{border-radius:14px;height:64px;margin-bottom:8px;background:var(--gray-850);animation:vac-sk 1.3s ease-in-out infinite}
@keyframes vac-sk{0%,100%{opacity:1}50%{opacity:.5}}
.vac-linkbtn{background:none;border:none;color:var(--green);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px 2px}
.vac-sub{position:absolute;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;animation:vac-in .26s var(--ease-out);padding-top:var(--safe-top)}
.vac-sub .vs-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 14px calc(34px + var(--safe-bottom))}
.vac-a11y{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.vac-cover-pick{width:100%;height:120px;border-radius:18px;background:var(--card) center/cover no-repeat;border:1px dashed var(--gray-700);display:flex;align-items:center;justify-content:center;color:var(--gray-400);font-size:13px;font-weight:600;cursor:pointer;overflow:hidden}
.vac-sug{border-radius:14px;border:1px solid var(--gray-800);background:var(--card);overflow:hidden;margin-top:6px}
.vac-sug button{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--gray-800);padding:11px 14px;color:var(--text);font-family:inherit;font-size:14px;cursor:pointer}
.vac-sug button:last-child{border-bottom:none}.vac-sug button small{display:block;color:var(--gray-500);font-size:11.5px;margin-top:2px}
.vac-sug button:active{background:var(--gray-850)}

.vac-rt{font-size:13px;line-height:1;flex:none;color:var(--gray-600)}.vac-rt.live{color:var(--green)}.vac-rt.wait{color:var(--orange)}
.vac-route{width:100%;height:auto;display:block;border-radius:14px;background:var(--gray-900);border:1px solid var(--gray-800);margin-bottom:6px}
.vac-clock{font-size:46px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:10px 0 4px}
.vac-itimg{margin-top:4px}
@media (prefers-reduced-motion:reduce){.vac-screen,.vac-sub{animation:none}.vac-screen.out{animation:none}.vac-fill{transition:none}.vac-pages{scroll-behavior:auto}.vac-skel{animation:none}}
/* ═══ platform: lock screen, verification feedback, security center ═══ */
.app-lock{backdrop-filter:blur(28px) saturate(1.2);-webkit-backdrop-filter:blur(28px) saturate(1.2)}
.lk-ring{width:92px;height:92px;border-radius:30px;border:1.5px solid var(--gray-700);display:flex;align-items:center;justify-content:center;color:var(--text);position:relative;transition:border-color .3s,color .3s,transform .5s cubic-bezier(.2,1.3,.4,1);background:var(--card)}
.lk-ring svg{width:46px;height:46px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lk-ring.busy{animation:lk-breathe 1.6s ease-in-out infinite}
.lk-ring.ok{border-color:var(--green);color:var(--green);transform:scale(1.06)}
.lk-ring.bad{border-color:var(--red,#ff453a);color:var(--red,#ff453a);animation:shk .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes lk-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes shk{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.shake{animation:shk .42s cubic-bezier(.36,.07,.19,.97)}
.ok-mark{width:64px;height:64px;margin:6px auto 10px;display:block}
.ok-mark svg{width:100%;height:100%;fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ok-mark .ok-c{stroke-dasharray:146;stroke-dashoffset:146;animation:ok-draw .55s cubic-bezier(.3,.8,.2,1) .02s forwards}
.ok-mark .ok-p{stroke-dasharray:40;stroke-dashoffset:40;animation:ok-draw .38s cubic-bezier(.3,.8,.2,1) .34s forwards}
.ok-pop{animation:ok-pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes ok-draw{to{stroke-dashoffset:0}}
@keyframes ok-pop{0%{transform:scale(.88);opacity:.2}100%{transform:scale(1);opacity:1}}
.lk-form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
.lk-err{min-height:18px;font-size:13px;color:var(--red,#ff6b6b);text-align:center}
.lk-note{font-size:12px;color:var(--gray-500);text-align:center;line-height:1.5;max-width:300px}
.sec-pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--gray-800);color:var(--gray-300)}
.sec-pill.on{background:var(--green-glow);color:var(--green)}
.sec-pill.warn{background:rgba(255,159,10,.14);color:#ff9f0a}
.sec-row-sub{font-size:12px;color:var(--gray-500);margin-top:2px;line-height:1.4}
.sec-sel{background:var(--card);color:var(--text);border:1px solid var(--gray-800);border-radius:10px;padding:7px 10px;font-size:14px}
.cf-msg{font-size:14px;line-height:1.5;color:var(--gray-300);margin:0 0 16px}
.force-reset{position:fixed;inset:0;z-index:10000;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;overflow:auto}
.force-reset.on{display:flex}
.force-reset .box{width:100%;max-width:340px}
@media (prefers-reduced-motion:reduce){.lk-ring.busy,.lk-ring.bad,.shake{animation:none}.ok-mark .ok-c,.ok-mark .ok-p{animation:none;stroke-dashoffset:0}.ok-pop{animation:none}}
body.is-locked>*:not(#app-lock):not(.toast){visibility:hidden}
/* ═══ look & feel: appearance center, rings, dashboard cards, effects, android ═══ */
:root{--card-rgb:18,18,18;--card-a:1;--blur:0px;--rs:1;--am:1;--acc-rgb:48,209,88;--bg-rgb:0,0,0;--dim:.45;--spring:cubic-bezier(.34,1.4,.5,1)}
#look-bg,#fx-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:none}
#look-bg{z-index:-2}#fx-canvas{z-index:-1}
html.look-bg-gradient #look-bg,html.look-bg-image #look-bg{display:block}
html.fx-on #fx-canvas{display:block}
html.look-bg-gradient body,html.look-bg-image body,html.fx-on body{background:transparent}
html.look-bg-gradient #look-bg{background:radial-gradient(120% 70% at 18% -10%,rgba(var(--acc-rgb),.16),transparent 62%),var(--bg)}
html.look-bg-image #look-bg{background:linear-gradient(rgba(var(--bg-rgb),var(--dim)),rgba(var(--bg-rgb),var(--dim))),var(--bg-img,none) center/cover no-repeat,var(--bg)}
/* cards: opacity + blur */
html.look-glassy :is(.quick-btn,.insight,.activity-item,.goal-card,.chart-card,.set-row,.moving-goal-card,.social-card,.friend-row,.debt-row,.game-card,.prof-head,.sr-card,.stat,.vac-card,.dc){background:rgba(var(--card-rgb),var(--card-a));backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%)}
html.look-glassy .cash-card.glass{background:rgba(var(--card-rgb),calc(var(--card-a)*.8));backdrop-filter:blur(calc(var(--blur) + 14px)) saturate(170%);-webkit-backdrop-filter:blur(calc(var(--blur) + 14px)) saturate(170%)}
html.look-glassy .sheet :is(.set-row,.social-card,.insight){backdrop-filter:none;-webkit-backdrop-filter:none}
/* corner radius */
html.look-r .cash-card{border-radius:calc(28px*var(--rs))}
html.look-r :is(.prof-head,.social-card,.chart-card,.vac-card,.dc){border-radius:calc(22px*var(--rs))}
html.look-r :is(.goal-card,.moving-goal-card){border-radius:calc(24px*var(--rs))}
html.look-r .game-card{border-radius:calc(20px*var(--rs))}
html.look-r :is(.quick-btn,.insight,.activity-item,.stat,.sr-card){border-radius:calc(18px*var(--rs))}
html.look-r .friend-row{border-radius:calc(16px*var(--rs))}
html.look-r :is(.set-row,.debt-row,.btn,.field-input){border-radius:calc(14px*var(--rs))}
html.look-r .sheet{border-radius:calc(32px*var(--rs)) calc(32px*var(--rs)) 0 0}
/* density */
html.look-compact .activity-item{padding:10px 14px;margin-bottom:4px}
html.look-compact .set-row{padding:11px 14px;margin-bottom:4px}
html.look-compact :is(.insight,.sr-card,.vac-card){padding:12px}
html.look-compact :is(.social-card,.chart-card){padding:14px;margin-bottom:8px}
html.look-compact .goal-card{padding:16px}
html.look-compact .quick-btn{padding:12px 6px 9px}
html.look-compact .hero{padding:20px 0 14px}
html.look-compact .cash-card{padding:18px;margin-bottom:14px}
/* navigation bar */
html.nav-icons .nav-lbl{display:none}html.nav-icons{--nav-h:60px}
html.nav-icons .nav-item{padding:10px 12px}
html.nav-float{--nav-h:96px}
html.nav-float .bottom-nav{left:12px;right:12px;bottom:calc(10px + var(--safe-bottom));border-radius:30px;padding:8px 6px;border:1px solid rgba(128,128,128,.22);box-shadow:0 12px 40px rgba(0,0,0,.42)}
/* avatar shapes */
html.shape-squircle .av,html.shape-squircle .av img{border-radius:32%}
html.shape-rounded .av,html.shape-rounded .av img{border-radius:16%}
/* motion */
html.anim-off *,html.anim-off *::before,html.anim-off *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
html.anim-low :is(.fade-in,.stagger>*,.sheet,.sheet-overlay){animation-duration:.14s!important}
html.anim-lively{--ease:cubic-bezier(.3,1.25,.45,1)}
html.anim-lively .sheet{animation-timing-function:var(--spring)}
#app.enter .dashboard-card{animation:fade-up calc(.5s*var(--am)) var(--ease-out) backwards;animation-delay:calc(var(--i,0)*45ms*var(--am))}
#app.enter :is(.goal-card,.moving-goal-card,.friend-row,.activity-item,.social-card,.chart-card,.sr-card):nth-child(-n+9){animation:fade-up calc(.45s*var(--am)) var(--ease-out) backwards}
#app.enter :is(.goal-card,.moving-goal-card,.friend-row,.activity-item,.social-card,.chart-card,.sr-card):nth-child(2){animation-delay:calc(40ms*var(--am))}
#app.enter :is(.goal-card,.moving-goal-card,.friend-row,.activity-item,.social-card,.chart-card,.sr-card):nth-child(3){animation-delay:calc(80ms*var(--am))}
#app.enter :is(.goal-card,.moving-goal-card,.friend-row,.activity-item,.social-card,.chart-card,.sr-card):nth-child(4){animation-delay:calc(120ms*var(--am))}
#app.enter :is(.goal-card,.moving-goal-card,.friend-row,.activity-item,.social-card,.chart-card,.sr-card):nth-child(n+5){animation-delay:calc(160ms*var(--am))}
.roll-pop{animation:roll-pop .5s var(--spring)}
@keyframes roll-pop{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
/* rings + dashboard cards */
.ring{display:block;overflow:visible}
.ring-bg{stroke:var(--gray-800)}
.ring-fg{stroke:var(--green);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset calc(.9s*var(--am)) var(--spring)}
.dc{border-radius:22px;padding:18px;margin-bottom:12px;background:var(--card);border:1px solid var(--gray-800);cursor:pointer;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.dc.static{cursor:default}
.dc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dc-t{font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.1em}
.dc-chev{color:var(--gray-500);font-size:18px;transition:transform .35s var(--ease)}
.dc.open .dc-chev{transform:rotate(90deg)}
.dc-link{background:none;border:none;color:var(--gray-400);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.dc-big{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}

html.anim-off .dc-exp{transition:none}
.dc-list>div{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--gray-800);font-size:13px}
.dc-list>div span:first-child{color:var(--gray-400)}
.dc-bar{height:6px;border-radius:99px;background:var(--gray-800);margin-top:12px;overflow:hidden}
.dc-bar i{display:block;height:100%;border-radius:99px;transition:width calc(.8s*var(--am)) var(--ease-out)}
.dc-rings{display:flex;gap:10px;justify-content:space-around;margin-top:6px}
.dc-ring{background:none;border:none;color:var(--text);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;cursor:pointer;min-width:0;flex:1}
.dc-ring .ring{margin:0 auto}
.dc-pct{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.dc-nm{font-size:12px;color:var(--gray-400);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atm .chip.selected{background:var(--btn);color:var(--btn-text)}
/* appearance center */
.lk-prev{border-radius:22px;padding:16px;background:var(--card);border:1px solid var(--gray-800)}
.lk-prev-top{display:flex;justify-content:space-between;align-items:center}
.lk-bal{font-size:32px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
/* music */
.mu-track{height:5px;border-radius:99px;background:var(--gray-800);overflow:hidden}
.mu-track i{display:block;height:100%;width:0;background:var(--green);border-radius:99px}
.mu-ctl{display:flex;justify-content:center;align-items:center;gap:18px;margin:6px 0 12px}
.mu-b{background:var(--gray-850);border:1px solid var(--gray-700);color:var(--text);width:44px;height:44px;border-radius:50%;font-size:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mu-b.big{width:60px;height:60px;font-size:20px;background:var(--btn);color:var(--btn-text);border:none}
.mu-row.sel{border-color:var(--green)}
/* android ripple */
.rip-wrap{position:fixed;overflow:hidden;pointer-events:none;z-index:4000}
.rip-wrap i{position:absolute;border-radius:50%;background:rgba(var(--acc-rgb),.24);transform:scale(0);opacity:1;animation:rip .6s ease-out forwards}
html.rip-neutral .rip-wrap i{background:rgba(128,128,128,.3)}
@keyframes rip{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.rip-wrap,.roll-pop{animation:none}.ring-fg,.dc-exp,.dc-bar i{transition:none}#app.enter *{animation:none!important}}
.toast{width:max-content;max-width:min(90vw,420px)}
.toast span{min-width:0}
/* ═══ connection state: the brand dot + the quiet pill ═══ */
.brand-dot[data-conn=offline]{background:var(--orange);box-shadow:0 0 8px rgba(255,159,10,.35);animation:none}
.brand-dot[data-conn=connecting]{background:var(--gray-300);box-shadow:none;animation:pulse-dot 1s ease-in-out infinite}
.brand-dot[data-conn=syncing]{background:#0a84ff;box-shadow:0 0 8px rgba(10,132,255,.35);animation:pulse-dot .8s ease-in-out infinite}
.conn-bar{position:fixed;top:calc(var(--safe-top,0px) + 8px);left:50%;transform:translate(-50%,-140%);max-width:calc(100vw - 32px);padding:8px 16px;border-radius:999px;background:var(--glass-deep);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid var(--gray-700);color:var(--text);font-size:13px;font-weight:600;letter-spacing:-.01em;z-index:950;opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,1.1,.3,1),opacity .25s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.conn-bar.on{transform:translate(-50%,0);opacity:1;pointer-events:auto;cursor:pointer}
.conn-bar::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px;background:var(--orange)}
.conn-bar[data-k=syncing]::before{background:#0a84ff;animation:pulse-dot .8s ease-in-out infinite}
.conn-bar[data-k=connecting]::before{background:var(--gray-300);animation:pulse-dot 1s ease-in-out infinite}
.conn-bar[data-k=connected]::before{background:var(--green)}

.brand-mark{position:relative;display:inline-block;width:20px;height:20px;vertical-align:-4px;margin-right:8px}.brand-mark svg{display:block;width:100%;height:100%}
.brand-mark .brand-dot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;box-shadow:none}
.auth-logo .brand-mark{width:30px;height:30px;vertical-align:-4px;margin-right:10px}.auth-logo .brand-mark .brand-dot{width:8px;height:8px;margin:-4px 0 0 -4px}
/* ═══ settings tab, symbol navigation, flat surfaces ═══ */
.nav-ico{font-family:-apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;font-size:22px;font-weight:400;filter:none;line-height:1;height:24px;display:flex;align-items:center;justify-content:center}
.nav-item.active .nav-ico{transform:none}
.bell{position:relative}.bell-badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg);box-sizing:content-box}
.set-ico{font-family:-apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif}
.set-profile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--gray-800);margin-bottom:22px;cursor:pointer}
.set-profile:active{background:var(--gray-850)}
.set-profile .nm{font-size:18px;font-weight:700;letter-spacing:-.02em}
.set-profile .sub{font-size:13px;color:var(--gray-500);margin-top:2px}
.set-group{margin-bottom:22px}
.set-group>.set-row{border-radius:0;margin-bottom:0;border-width:0 0 1px 0;border-color:var(--gray-800);background:var(--card)}
.set-group>.set-row:first-child{border-radius:16px 16px 0 0}
.set-group>.set-row:last-child{border-radius:0 0 16px 16px;border-bottom-width:0}
.set-group>.set-row:only-child{border-radius:16px}
.set-row .set-right{color:var(--gray-500);font-size:14px;display:flex;align-items:center;gap:6px}
.set-row .set-right b{font-weight:500}
.set-sec{margin:22px 4px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500)}
.sheet-back{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:var(--green);font-family:inherit;font-size:15px;font-weight:600;padding:4px 0 10px;cursor:pointer}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
/* solid means solid: one flat colour, nothing drawn over it */
html.look-bg-solid body{background:var(--bg)}
html.look-bg-solid #look-bg,html.look-bg-solid #fx-canvas{display:none!important}
/* dynamic = the gradient backdrop plus slow moving light (only here) */
html.look-bg-dynamic #look-bg{display:block;background:radial-gradient(55% 38% at 14% 12%,rgba(var(--acc-rgb),.30),transparent 70%),radial-gradient(48% 36% at 92% 28%,rgba(100,150,255,.2),transparent 70%),radial-gradient(60% 46% at 38% 100%,rgba(190,90,242,.18),transparent 70%),var(--bg)}
html.look-bg-dynamic body{background:transparent}
/* efficient mode: no blur, no motion, no moving light */
html.perf-eff *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.perf-eff #fx-canvas{display:none!important}
.sheet-sub{font-size:13px;color:var(--gray-500);line-height:1.5;margin:-2px 2px 12px}
.pill-ok{color:var(--green)}.pill-warn{color:var(--orange)}.pill-bad{color:var(--red)}
/* ── vacation: ETA card, transportation chips, 3D route map (flat, no gradients) ── */
.sico{display:inline-block;width:1.15em;text-align:center;color:var(--gray-300);font-weight:600}
.eta-card .eta-date{font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.eta-sub{font-size:13px;color:var(--gray-400);margin-top:4px}
.eta-ring{position:relative;width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center}.eta-ring svg{position:absolute;inset:0}
.eta-pct{position:relative;font-size:13px;font-weight:700;letter-spacing:-.02em}
.eta-pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--gray-800);color:var(--gray-300)}
.eta-pill.ok{background:var(--green-glow);color:var(--green)}.eta-pill.warn{background:rgba(255,159,10,.14);color:var(--orange)}
.eta-verdict{margin:12px 0 4px;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.45;background:var(--gray-850);border:1px solid var(--gray-800)}
.eta-verdict.warn{color:var(--orange)}.eta-verdict.ok b{color:var(--text)}
.eta-rows{margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-800)}
.eta-prev{margin:2px 0 14px}
.tt-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);margin-bottom:8px}
.tt-chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.tt-chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:11px 2px 9px;border-radius:14px;background:var(--gray-850);border:1px solid var(--gray-800);color:var(--gray-200);font-weight:600;font-size:11.5px;line-height:1;font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.tt-chip span{font-size:19px;line-height:1;color:var(--text)}.tt-chip:active{transform:scale(.96)}
.tt-chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}.tt-chip.on span{color:var(--bg)}
.tt-check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--gray-200);margin:2px 0 14px;cursor:pointer}.tt-check input{width:20px;height:20px;accent-color:var(--text)}
.tr-ico{width:32px;font-size:20px;text-align:center;color:var(--text)}
.m3d-wrap{margin:2px -4px 0;touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none}
.m3d{width:100%;height:auto;display:block;overflow:visible}
.m3d .m3d-floor{fill:var(--gray-900);stroke:var(--gray-700);stroke-width:1}
.m3d .m3d-side{fill:var(--gray-850)}.m3d .m3d-side.a{fill:var(--gray-900)}.m3d .m3d-side.b{fill:var(--gray-800)}
.m3d .m3d-grid{stroke:var(--gray-800);stroke-width:.8}
.m3d .m3d-shadow{fill:none;stroke:var(--gray-600);stroke-width:1.4;stroke-dasharray:2 4;stroke-linecap:round;stroke-linejoin:round}
.m3d .m3d-route{fill:none;stroke:var(--gray-500);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round}
.m3d .m3d-done{fill:none;stroke:var(--text);stroke-width:2.6;stroke-linecap:round}
.m3d .m3d-stem{stroke:var(--gray-500);stroke-width:1.2}
.m3d .m3d-pin{fill:var(--bg);stroke:var(--text);stroke-width:1.6}.m3d .m3d-pin.start{fill:var(--text)}.m3d .m3d-pin.end{fill:var(--text);stroke:var(--bg);stroke-width:2}.m3d .m3d-pinc{fill:var(--bg)}
.m3d .m3d-pulse{fill:none;stroke:var(--gray-500);stroke-width:1;opacity:.6}
.m3d .m3d-lab{font-size:9.5px;font-weight:600;fill:var(--gray-400);letter-spacing:.01em}.m3d .m3d-lab.end{fill:var(--text)}
.m3d .m3d-leg{font-size:11px;fill:var(--gray-300)}
.m3d .m3d-tag rect{fill:var(--text)}.m3d .m3d-tag text{font-size:10.5px;font-weight:700;fill:var(--bg)}
.m3d .m3d-veh circle{fill:var(--text);stroke:var(--bg);stroke-width:2.4}.m3d .m3d-veh text{font-size:12px;font-weight:700;fill:var(--bg)}
.m3d-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--gray-500);padding:0 8px;margin-top:2px}
@media (prefers-reduced-motion:no-preference){html:not(.perf-eff):not(.look-still) .m3d .m3d-route{animation:m3d-flow 1.6s linear infinite}html:not(.perf-eff):not(.look-still) .m3d .m3d-pulse{transform-box:fill-box;transform-origin:center;animation:m3d-pulse 2.2s ease-out infinite}}
@keyframes m3d-flow{to{stroke-dashoffset:-12}}@keyframes m3d-pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
/* ETA banner (in-app notification) */
.eta-banner{position:fixed;left:50%;top:calc(10px + var(--safe-top));width:min(94vw,420px);transform:translate(-50%,-140%);z-index:2100;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--card);border:1px solid var(--gray-700);box-shadow:0 14px 40px rgba(0,0,0,.5);transition:transform .5s var(--ease-out),opacity .3s;cursor:pointer;opacity:0;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.eta-banner.on{transform:translate(-50%,0);opacity:1}
.eta-banner .eb-ring{position:relative;width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}.eta-banner .eb-ring svg{position:absolute;inset:0}.eta-banner .eb-sym{position:relative;font-size:17px}
.eta-banner .eb-t{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gray-400);text-transform:uppercase}.eta-banner .eb-h{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eta-banner .eb-s{font-size:12.5px;color:var(--gray-300);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eta-banner .eb-x{margin-left:auto;background:none;border:none;color:var(--gray-400);font-size:20px;padding:6px;cursor:pointer;font-family:inherit}
/* symbols are plain monochrome text, never colour emoji */
.ico,.set-ico,.sico,.tr-ico,.t-ico,.nav-item .ico{font-variant-emoji:text}
/* ═══ profile card, picker, editor ═══ */
.gl{display:inline-block;line-height:1}.gl-t{font-variant-emoji:text}.gl-e{font-variant-emoji:emoji}
.emo,.emo *{font-variant-emoji:emoji!important}
.pf{--pf:var(--green);position:relative}
.pf .prof-body .av{box-shadow:0 0 0 2px var(--pf)}
.pf .friend-code{color:var(--pf);border-color:color-mix(in srgb,var(--pf) 45%,var(--gray-700))}
.pf-name{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.pf-sym{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;border-radius:999px;border:1px solid color-mix(in srgb,var(--pf) 70%,transparent);color:var(--pf);font-size:15px;font-weight:600;letter-spacing:0;background:color-mix(in srgb,var(--pf) 10%,transparent)}
.pf-sym.sm{min-width:18px;height:18px;padding:0 5px;font-size:11px;margin-left:4px;vertical-align:1px}
.pf-bio{font-size:14px;color:var(--gray-300);margin-top:12px;line-height:1.5;word-break:break-word}
.pf-sticky{position:sticky;top:0;z-index:3;margin:-12px -20px 0;padding:12px 20px 6px;background:var(--sheet,#0a0a0a)}
.pf-compact .banner,.pf-compact .pf-st,.pf-compact .pf-cd{display:none}.pf-compact .prof-body{margin-top:0;padding:10px 14px;display:flex;align-items:center;gap:12px;text-align:left;flex-wrap:wrap}.pf-compact .prof-body .av{width:40px!important;height:40px!important;margin:0;flex:none}.pf-compact .prof-body .av span{font-size:20px!important}.pf-compact .pf-name{font-size:16px;justify-content:flex-start;flex:1;min-width:0}.pf-compact .pf-bio{width:100%;margin-top:0}
.pf-mini .banner{height:54px}.pf-mini .prof-body{margin-top:-30px;padding:0 16px 14px}.pf-mini .t-title{font-size:18px}.pf-mini .pf-bio{margin-top:6px;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pf-mini .prof-body .av{margin-bottom:6px}
/* themes */
.pf-th-dark{background:#0b0b0c!important;border-color:#2b2b2e!important}.pf-th-dark .t-title,.pf-th-dark .pf-bio{color:#f5f5f7}.pf-th-dark .prof-body .av{border-color:#0b0b0c}.pf-th-dark .friend-status{color:#9a9aa0}
.pf-th-light{background:#f4f4f6!important;border-color:#d6d6db!important}.pf-th-light .t-title{color:#111}.pf-th-light .pf-bio{color:#3a3a3f}.pf-th-light .friend-status{color:#6b6b72}.pf-th-light .prof-body .av{border-color:#f4f4f6;background:#e6e6ea}.pf-th-light .friend-code{background:#e9e9ed;border-color:#cfcfd5}
.pf-th-glass{background:rgba(255,255,255,.06)!important;-webkit-backdrop-filter:blur(24px) saturate(1.3);backdrop-filter:blur(24px) saturate(1.3);border-color:rgba(255,255,255,.16)!important}.pf-th-glass .prof-body .av{border-color:transparent}
.pf-th-mono{--pf:#fff!important;background:#000!important;border-color:#fff!important}.pf-th-mono .prof-body .av{border-color:#000}.pf-th-mono .pf-sym{border-color:#fff;color:#fff;background:transparent}
/* banner backgrounds — all flat or patterned; the gradient one is optional */
.pfb-none{background:var(--gray-800)}.pfb-graphite{background:#232326}.pfb-ink{background:#000;border-bottom:1px solid #2a2a2d}.pfb-paper{background:#e9e9ec}
.pfb-frost{background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.pfb-dots{background-color:#1a1a1c;background-image:radial-gradient(rgba(255,255,255,.28) 1.2px,transparent 1.4px);background-size:12px 12px}
.pfb-lines{background-color:#1a1a1c;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 1px,transparent 1px 9px)}
.pfb-accent{background:color-mix(in srgb,var(--pf) 55%,#000)}
.pfb-aurora{background:linear-gradient(120deg,#1d2b64,#7b4397 55%,#dc2430)}
.pfb-photo{background-color:var(--gray-800);background-size:cover;background-position:center}
/* editor */
.pe-sec{margin:20px 0 10px}
.pe-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;cursor:pointer}
.pe-symbox{width:52px;height:52px;border-radius:14px;border:1px solid var(--gray-700);background:var(--gray-850);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.pe-sw{display:flex;flex-wrap:wrap;gap:10px}
.pe-dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--gray-700);background:var(--gray-850);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;color:var(--gray-500);font-size:15px;position:relative;font-family:inherit}
.pe-dot.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--bg,#000),0 0 0 4px var(--primary)}
.pe-hid{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pe-bgs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pe-bg{border:1px solid var(--gray-700);border-radius:12px;background:var(--card);padding:5px 5px 6px;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:stretch;font-family:inherit;color:var(--gray-300);font-size:10px;font-weight:600;text-align:center}
.pe-bg i{display:block;height:30px;border-radius:7px;background-color:var(--gray-800)}
.pe-bg.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
@media(max-width:380px){.pe-bgs{grid-template-columns:repeat(4,1fr)}}
/* symbol picker */
.sp-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sp-cell{aspect-ratio:1;border-radius:12px;border:1px solid var(--gray-800);background:var(--card);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--primary);font-family:inherit;padding:0}
.sp-cell.on{border-color:var(--primary);background:var(--gray-850)}.sp-cell:active{transform:scale(.92)}
.sp-custom{display:flex;align-items:center;gap:12px;margin:0 0 12px}.sp-custom .sp-cell{width:48px}
/* ═══ ⬡ Logostics AI ═══ */
.ai-orb{position:relative;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;flex:none;color:var(--primary);font-variant-emoji:text;vertical-align:middle}
.ai-orb b{font-weight:500;font-size:16px;line-height:1;position:relative;z-index:1;font-variant-emoji:text}
.ai-orb::before{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid var(--gray-700)}
.ai-orb.lg{width:34px;height:34px}.ai-orb.lg b{font-size:23px}
.ai-orb.busy::before{border-color:var(--gray-600)}
.ai-orb.busy::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--primary);border-right-color:color-mix(in srgb,var(--primary) 40%,transparent);animation:ai-spin 1.15s linear infinite}
.ai-orb.busy b{animation:ai-pulse 1.5s ease-in-out infinite}
@keyframes ai-spin{to{transform:rotate(360deg)}}@keyframes ai-pulse{50%{opacity:.45;transform:scale(.86)}}
html.look-still .ai-orb.busy::after,html.look-still .ai-orb.busy b,html.perf-eff .ai-orb.busy::after,html.perf-eff .ai-orb.busy b{animation:none}
@media (prefers-reduced-motion:reduce){.ai-orb.busy::after,.ai-orb.busy b{animation:none}}
.ai-fab .ai-orb::before{border-color:transparent}
.ai-title{display:flex;align-items:center;gap:10px}
.ai-card{border:1px solid var(--gray-800);background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.ai-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ai-name{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gray-400)}
.ai-tag{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--gray-700);color:var(--gray-300);white-space:nowrap}
.ai-tag.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 55%,transparent)}.ai-tag.warn{color:var(--orange);border-color:color-mix(in srgb,var(--orange) 55%,transparent)}
.ai-line{font-size:15px;line-height:1.5;color:var(--text);margin:0}.ai-dim{color:var(--gray-500)}
.ai-sub{font-size:12.5px;line-height:1.5;color:var(--gray-500);margin-top:8px}
.ai-rows{display:flex;flex-direction:column}
.ai-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--gray-800);cursor:pointer}.ai-row:first-child{border-top:none;padding-top:2px}
.ai-row .txt{flex:1;font-size:13.5px;line-height:1.45;color:var(--gray-300)}.ai-row .txt strong{color:var(--text);font-weight:600}

/* ── destination & map picker ── */
.tp-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tp-b{padding:11px 8px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px}
.tp-pin{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--gray-850);border:1px solid var(--gray-800)}
.tp-pin b{display:block;font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tp-pin small{display:block;font-size:11.5px;color:var(--gray-500);margin-top:1px;font-variant-numeric:tabular-nums}
.mp-modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--gray-850);border:1px solid var(--gray-800);margin:2px 0 12px}
.mp-mode{padding:10px 6px;border-radius:10px;border:0;background:transparent;color:var(--gray-400);font:inherit;font-size:13px;font-weight:650;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.mp-mode.on{background:var(--text);color:var(--bg)}
.mp-hint{font-size:12.5px;color:var(--gray-400);margin:0 2px 8px;line-height:1.45}
.mp-wrap{position:relative;height:210px;border-radius:16px;overflow:hidden;background:var(--gray-850);border:1px solid var(--gray-800);margin:10px 0;transition:height .25s}
.mp-wrap.tall{height:min(46vh,340px)}
.mp-map{position:absolute;inset:0;touch-action:none}
.mp-map.mp-dark .leaflet-tile-pane{filter:grayscale(1) invert(.92) brightness(.82) contrast(1.05)}
.mp-map:not(.mp-dark) .leaflet-tile-pane{filter:grayscale(.85) contrast(1.02)}
.mp-ctl{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mp-ctl button{width:36px;height:36px;border-radius:11px;border:1px solid var(--gray-700);background:color-mix(in srgb,var(--sheet) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--text);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.mp-ctl button:active{transform:scale(.94)}.mp-ctl button.busy{opacity:.5}
.mp-attr{position:absolute;left:8px;bottom:6px;z-index:500;font-size:10px;color:var(--gray-400);background:color-mix(in srgb,var(--sheet) 70%,transparent);padding:1px 6px;border-radius:6px;pointer-events:none}
.mp-chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}.mp-chips .chip{padding:8px 13px;font-size:12.5px}
.mp-res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;padding:10px 12px;margin-top:6px;border-radius:13px;background:var(--gray-850);border:1px solid var(--gray-800);cursor:pointer}
.mp-res:active{transform:scale(.99)}.mp-res b{display:block;font-size:13.5px;font-weight:650}.mp-res small{display:block;font-size:11.5px;color:var(--gray-500);margin-top:1px}
.mp-flag{width:28px;text-align:center;font-size:20px;flex:none}
.mp-card{margin-top:10px;padding:12px;border-radius:16px;background:var(--gray-850);border:1px solid var(--gray-800)}
.mp-card-h{display:flex;align-items:center;gap:10px}.mp-name{font-size:15px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mp-ll{font-size:11.5px;color:var(--gray-500);margin-top:1px;font-variant-numeric:tabular-nums}
.mp-fallback{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;overflow:auto}
.mp-pin-wrap{background:none!important;border:0!important}
.mp-pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--text);border:2px solid var(--bg);box-shadow:0 3px 10px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;animation:mpdrop .28s cubic-bezier(.2,.9,.3,1.2)}
.mp-pin i{width:10px;height:10px;border-radius:50%;background:var(--bg);display:block}
@keyframes mpdrop{from{transform:rotate(-45deg) translate(10px,-10px) scale(.6);opacity:0}to{transform:rotate(-45deg);opacity:1}}
html.look-still .mp-pin,html.perf-eff .mp-pin{animation:none}
.di-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.di-cell{padding:10px 11px;border-radius:13px;background:var(--gray-900,var(--card));border:1px solid var(--gray-800);min-width:0}
.di-l{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500)}
.di-v{font-size:16px;font-weight:700;letter-spacing:-.02em;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.di-s{font-size:11px;color:var(--gray-500);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.di-sk{display:inline-block;width:64px;height:14px;border-radius:6px;background:var(--gray-800);vertical-align:middle}
.di-ask{cursor:pointer;border-style:dashed}.di-ask:active{transform:scale(.98)}
.dst-prev{position:relative;height:150px;border-radius:16px;overflow:hidden;background:var(--gray-850);border:1px solid var(--gray-800)}
.dst-map{position:absolute;inset:0;pointer-events:none}
.dst-map.mp-dark .leaflet-tile-pane{filter:grayscale(1) invert(.92) brightness(.78) contrast(1.05)}
.dst-map:not(.mp-dark) .leaflet-tile-pane{filter:grayscale(.85)}
.dst-hit{position:absolute;inset:0;z-index:450;background:transparent;border:0;cursor:pointer;padding:0}
.dst-cap{position:absolute;left:8px;right:8px;bottom:8px;z-index:460;pointer-events:none;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:13px;background:color-mix(in srgb,var(--sheet) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--gray-800)}
.dst-cap b{display:block;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dst-cap small{display:block;font-size:11px;color:var(--gray-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dst-edit{font-size:12px;font-weight:700;color:var(--gray-300);flex:none}
.dst-off{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--gray-400);font-size:13px;font-weight:600;text-align:center;padding:0 16px 40px}.dst-off small{font-size:11px;font-weight:500;color:var(--gray-500)}
.mp-wrap.nomap{height:auto;min-height:150px}.mp-wrap.nomap .mp-map{position:relative;inset:auto}.mp-wrap.nomap .mp-ctl,.mp-wrap.nomap .mp-attr{display:none}
.mp-ctl button#mp-loc,.mp-ctl button#mp-rt{font-size:19px}


/* two-up form rows: columns must be able to shrink (iOS date inputs have a wide intrinsic minimum that pushed the right field off-screen) */
.field-row>*{min-width:0}
.field-input[type=date],.field-input[type=time],.field-input[type=datetime-local],.field-input[type=month]{min-width:0;max-width:100%;display:block;-webkit-appearance:none;appearance:none}
.field-input[type=date]::-webkit-date-and-time-value,.field-input[type=datetime-local]::-webkit-date-and-time-value,.field-input[type=time]::-webkit-date-and-time-value{text-align:left;min-width:0}
.field-input[type=date]::-webkit-datetime-edit,.field-input[type=datetime-local]::-webkit-datetime-edit{padding:0;min-width:0}
.field-label{overflow:hidden;text-overflow:ellipsis}
/* sheets: dvh keeps the bottom buttons above Safari's toolbar */
.sheet{max-height:92vh;max-height:92dvh}
.mp-wrap.tall{height:min(46vh,340px);height:min(46dvh,340px)}
.mp-mode{white-space:nowrap;font-size:12.5px;padding:10px 4px}
.leg-r{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none;margin-left:8px}.leg-r b{font-variant-numeric:tabular-nums}

/* ── rating ── */
.rt-stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.rt-star{flex:0 0 auto;width:52px;height:52px;border-radius:14px;border:1px solid var(--gray-800);background:transparent;color:var(--gray-700);font-size:30px;line-height:1;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;font-variant-emoji:text;transition:color .12s,border-color .12s,transform .12s}
.rt-star.on{color:var(--orange);border-color:var(--orange)}
.rt-star:active{transform:scale(.92)}
.rt-stars.done .rt-star{width:40px;height:40px;font-size:24px;border-color:transparent;cursor:default}
.rt-word{text-align:center;font-size:13px;font-weight:600;color:var(--gray-400);min-height:20px;margin-bottom:14px}
.rt-card-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.rt-card-t{font-weight:700;font-size:15px}
.rt-x{background:none;border:none;color:var(--gray-500);font-size:15px;padding:4px 6px;cursor:pointer;font-family:inherit;font-variant-emoji:text}
.rt-avg{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.1}.rt-avg-s{font-size:15px;color:var(--gray-500);font-weight:600;margin-left:4px}
.rt-avg-st,.rt-list-st{color:var(--orange);letter-spacing:2px;font-variant-emoji:text}
.rt-dist{margin-top:12px;text-align:left}.rt-dist-r{display:grid;grid-template-columns:34px 1fr 28px;gap:8px;align-items:center;font-size:12px;color:var(--gray-400);margin-top:6px}
.rt-dist-r span:last-child{text-align:right}.rt-dist-b{height:6px;background:var(--gray-800);border-radius:3px;overflow:hidden}.rt-dist-b div{height:100%;background:var(--orange)}
.rt-card{margin:14px 0 0}

/* ── Fun ── */
.dr-wrap{background:#fff;border-radius:16px;border:1px solid var(--gray-700);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;margin-bottom:12px}
.dr-wrap canvas{display:block;width:100%;touch-action:none;cursor:crosshair;-webkit-touch-callout:none}
.dr-tools{display:flex;flex-direction:column;gap:12px}
.dr-colors{display:flex;gap:8px;justify-content:space-between}
.dr-sw{flex:0 0 30px;width:30px;height:30px;border-radius:50%;border:2px solid var(--gray-700);background:var(--c);cursor:pointer;padding:0}
.dr-sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg)}
.dr-size{display:flex;align-items:center;gap:12px}.dr-size-l{font-size:13px;color:var(--gray-400);font-weight:600}
.dr-size input{flex:1;min-width:0;accent-color:var(--green)}
.dr-dot-box{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.dr-dot{display:block;border-radius:50%;border:2px solid var(--gray-500);box-sizing:border-box}
.dr-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dr-actions .btn{padding:12px 4px;font-size:14px;margin:0}
.dr-actions .btn:disabled{opacity:.35}
.fg-stats{display:flex;gap:8px;margin:4px 0 14px}
.fg-stats>div{flex:1;min-width:0;background:var(--card);border:1px solid var(--gray-800);border-radius:14px;padding:10px 6px;text-align:center}
.fg-stats b{display:block;font-size:20px;letter-spacing:-.02em}.fg-stats span{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-500);margin-top:2px}
.fg-arena{display:flex;align-items:center;justify-content:center;width:100%;min-height:230px;border-radius:20px;border:1px solid var(--gray-700);font-family:inherit;font-size:22px;font-weight:700;text-align:center;white-space:pre-line;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;color:var(--text);background:var(--card);transition:background .08s}
.fg-arena.wait{background:#7f1d1d;border-color:#7f1d1d;color:#fff}
.fg-arena.go{background:#16a34a;border-color:#16a34a;color:#fff}
.fg-arena.tap{background:var(--green);border-color:var(--green);color:#000;font-size:34px;min-height:250px}
.fg-arena.tap:active{transform:scale(.985)}
.fg-arena small{font-size:14px;font-weight:600;opacity:.8}
.fg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:manipulation}
.fg-card{aspect-ratio:1;border-radius:14px;border:1px solid var(--gray-700);background:var(--gray-800);cursor:pointer;font-size:30px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--text);font-family:inherit;transition:background .12s}
.fg-card.up{background:var(--card);border-color:var(--gray-500)}.fg-card.ok{border-color:var(--green);background:var(--card)}
.fg-q{font-size:44px;font-weight:700;letter-spacing:-.03em;text-align:center;margin:18px 0 22px}
.fg-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg-opt{padding:20px 6px;border-radius:16px;border:1px solid var(--gray-700);background:var(--card);color:var(--text);font-family:inherit;font-size:24px;font-weight:700;cursor:pointer;touch-action:manipulation}
.fg-opt:active{background:var(--gray-800)}
.fg-result{text-align:center;margin:10px 0 18px}.fg-result b{display:block;font-size:18px}.fg-result span{display:block;color:var(--gray-400);font-size:14px;margin-top:4px}
.fg-result.big b{font-size:64px;letter-spacing:-.04em;line-height:1.1}
.fg-item{text-align:center;padding:26px 12px;border:1px solid var(--gray-800);border-radius:20px;background:var(--card);margin-bottom:14px}
.fg-item-n{font-size:20px;font-weight:700;line-height:1.3}.fg-item-p{font-size:30px;font-weight:700;margin-top:8px;color:var(--gray-300,var(--text))}
.fg-fb{font-size:14px;line-height:1.5;margin-top:14px;text-align:center;min-height:20px}
.btn.right{border-color:var(--green);color:var(--green)}.btn.wrong{border-color:var(--red);color:var(--red)}

/* ── desktop layout: Windows / computers, wide windows only (class set by Desk.apply) ── */
html.dsk{--nav-h:0px}

html.dsk .nav-item{flex-direction:row;justify-content:flex-start;gap:14px;padding:11px 14px;min-width:0;border-radius:12px;font-size:15px;text-align:left}

html.dsk .nav-ico{font-size:18px;width:22px;text-align:center}
html.dsk .nav-lbl{font-size:15px;font-weight:600}
html.dsk .nav-item .notif-badge{position:static;margin-left:auto}
html.dsk .container{max-width:720px;padding:0 32px}
html.dsk .container.home{max-width:1080px}

html.dsk .sheet-grip{display:none}
@keyframes dsk-in{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
html.dsk .toast{left:calc(50% + var(--side-w)/2)}
html.dsk :focus-visible{outline:2px solid var(--green);outline-offset:2px}
html.dsk .activity-item{cursor:default}
html.dsk .activity-item:hover{background:var(--gray-850)}
html.dsk-compact .container.home{max-width:1280px;padding:0 24px}
html.dsk-compact .home-cols{column-count:3;column-gap:16px}
html.dsk-compact .hero{padding:8px 0 10px}
html.dsk-compact .hero-amount{font-size:44px}

html.dsk-compact .cash-card{padding:18px;margin-bottom:12px;border-radius:22px}
html.dsk-compact .top-header{padding:12px 0 4px}
.dsk-res{position:fixed;top:0;bottom:0;width:10px;margin-left:-5px;cursor:col-resize;z-index:101;touch-action:none;outline:none}
#dsk-res{left:var(--side-w)}
#dsk-res2{position:absolute;left:auto;right:var(--drawer-w);margin:0 -5px 0 0;z-index:1001}
.dsk-res::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.dsk-res:hover::after,.dsk-res.drag::after,.dsk-res:focus-visible::after{background:var(--green)}
body.noauth #dsk-res{display:none}
#sheet-overlay:not(.on) #dsk-res2{display:none}
.dsk-menu{position:fixed;z-index:3000;min-width:190px;padding:6px;border-radius:14px;background:var(--card);border:1px solid var(--gray-700);box-shadow:0 12px 40px rgba(0,0,0,.5);animation:fade-in .1s ease}
.dsk-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;border-radius:9px;background:none;color:var(--text);font-family:inherit;font-size:14px;font-weight:500;text-align:left;cursor:pointer}
.dsk-menu button:hover,.dsk-menu button:focus-visible{background:var(--gray-800);outline:none}
.dsk-menu button.danger{color:var(--red)}
.dsk-menu .ico{width:18px;text-align:center;color:var(--gray-400);font-variant-emoji:text}
.kbd{display:inline-block;padding:3px 8px;border-radius:7px;border:1px solid var(--gray-700);background:var(--gray-850);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;font-weight:600}
html.dsk .ai-fab{right:auto;left:16px;bottom:20px;z-index:102}

.stk-pad{padding:10px 4px}

.stk-notice-t{font-size:15px;font-weight:700}
.stk-notice.soft{background:var(--gray-850)}

.fx-chg{font-size:11.5px;font-weight:700;white-space:nowrap}.fx-chg.up{color:var(--orange)}.fx-chg.dn{color:var(--green)}

/* colour wheel + logo picker */
.cw{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:14px 16px;align-items:center;margin:6px 0 10px}
.cw-disc{position:relative;width:100%;max-width:220px;aspect-ratio:1;border-radius:50%;touch-action:none;cursor:crosshair;box-shadow:0 0 0 1px var(--gray-800),0 6px 18px rgba(0,0,0,.3);-webkit-user-select:none;user-select:none}

.cw-dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.45);pointer-events:none}

.cw-sl input[type=range]{width:100%;accent-color:var(--green)}
@media (max-width:360px){.cw{grid-template-columns:1fr;justify-items:center}.cw-side{width:100%}}
.fx-dot{display:inline-block;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--gray-600);vertical-align:middle}

:root.lg-on.lg-on.lg-on :is(.bottom-nav,.sheet,.toast,.ai-fab,.privacy-btn,.edit-toolbar){background:linear-gradient(150deg,rgba(var(--lg-hi),calc(var(--lg-tint)*.95)) 0%,rgba(var(--lg-hi),calc(var(--lg-tint)*.26)) 46%,rgba(var(--lg-hi),calc(var(--lg-tint)*.6)) 100%),rgba(var(--card-rgb),max(.3,calc(var(--card-a)*.9)));-webkit-backdrop-filter:blur(var(--lg-blur)) saturate(var(--lg-sat));backdrop-filter:blur(var(--lg-blur)) saturate(var(--lg-sat));border-color:rgba(var(--lg-hi),calc(.08 + var(--lg-edge)*.2));box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--lg-edge)*.55)),0 10px 30px rgba(0,0,0,.2)}
