    function mgUpdateCalc() {
      const weekly = parseFloat(document.getElementById('mg-weekly')?.value) || 0;
      const monthly = parseFloat(document.getElementById('mg-monthly')?.value) || 0;
      const target = parseFloat(document.getElementById('mg-target')?.value) || 0;
      const current = parseFloat(document.getElementById('mg-current')?.value) || 0;
      const targetDateStr = document.getElementById('mg-target-date')?.value;
      const draft = { target, current, weeklyContribution: weekly, monthlyContribution: monthly, targetDate: targetDateStr ? new Date(targetDateStr).toISOString() : null };
      const calc = MovingGoalCalculator.compute(draft);
      const preview = document.getElementById('mg-calc-preview');
      if (preview) preview.innerHTML = renderCalcPreview(calc);
    }

    async function mgSearchDestination() {
      const input = document.getElementById('mg-search-input');
      const resultsEl = document.getElementById('mg-search-results');
      if (!input || !resultsEl) return;
      const q = input.value.trim();
      if (q.length < 2) { toast('Enter at least 2 characters'); return; }
      resultsEl.innerHTML = '<div style="padding:12px;color:var(--gray-500);font-size:13px;">Searching…</div>';
      haptic('light');
      const r = await MapService.searchLocation(q);
      if (!r.ok) {
        resultsEl.innerHTML = `<div style="padding:12px;color:#ff9f0a;font-size:13px;">${escapeHtml(r.error)}</div>`;
        return;
      }
      mgDraft._searchResults = r.results;
      resultsEl.innerHTML = r.results.map((res, i) => `
        <div class="mg-search-result" onclick="mgPickResult(${i})">
          <span class="pin">📍</span>
          <div style="flex:1;min-width:0;"><div class="name">${escapeHtml(res.name)}</div><div class="full">${escapeHtml(res.fullName)}</div></div>
        </div>
      `).join('');
    }

    function mgPickResult(index) {
      const results = mgDraft._searchResults;
      if (!results || !results[index]) return;
      const res = results[index];
      mgDraft.destination = {
        lat: res.lat, lng: res.lng,
        name: res.city || res.name,
        fullName: res.fullName,
        city: res.city, state: res.state, country: res.country, postalCode: res.postalCode
      };
      haptic('success');
      // Re-open editor to mount the map with the new destination
      openMovingGoalEditor('Edit Moving Goal');
    }

    function mgResetMap() {
      const d = mgDraft; if (!d || !d.destination || d.destination.lat === null) return;
      const inner = document.getElementById('mg-editor-map-inner');
      if (inner && activeMaps.has(inner.id)) {
        try { activeMaps.get(inner.id).map.setView([d.destination.lat, d.destination.lng], 11, { animate: true }); } catch (e) {}
      }
    }

    function mgHandleImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { toast('Please choose an image file'); return; }
      if (file.size > 5 * 1024 * 1024) { toast('Image must be under 5MB'); return; }
      const reader = new FileReader();
      reader.onload = (ev) => { mgDraft.image = ev.target.result; openMovingGoalEditor('Edit Moving Goal'); };
      reader.onerror = () => toast('Could not read image');
      reader.readAsDataURL(file);
    }
    function mgRemoveImage() { mgDraft.image = null; openMovingGoalEditor('Edit Moving Goal'); }

    async function mgSaveGoal() {
      const name = (document.getElementById('mg-name')?.value || '').trim() || 'Move';
      const destName = (document.getElementById('mg-dest-name')?.value || '').trim();
      const target = parseFloat(document.getElementById('mg-target')?.value) || 0;
      const current = parseFloat(document.getElementById('mg-current')?.value) || 0;
      const weekly = parseFloat(document.getElementById('mg-weekly')?.value) || 0;
      const monthly = parseFloat(document.getElementById('mg-monthly')?.value) || 0;
      const targetDateVal = document.getElementById('mg-target-date')?.value;
      const reminderDateVal = document.getElementById('mg-reminder-date')?.value;
      const targetDate = targetDateVal ? new Date(targetDateVal).toISOString() : null;
      const reminderDate = reminderDateVal ? new Date(reminderDateVal).toISOString() : null;

      if (!target || target <= 0) { toast('Enter a target amount'); return; }
      if (!mgDraft.destination || mgDraft.destination.lat === null || mgDraft.destination.lng === null) {
        toast('Please select a destination on the map');
        return;
      }
      const finalDestination = {
        ...mgDraft.destination,
        name: destName || mgDraft.destination.city || mgDraft.destination.name || 'Destination'
      };
      const finalGoal = {
        name: name.startsWith('Move') ? name : 'Move to ' + name,
        destination: finalDestination,
        target, current,
        weeklyContribution: weekly, monthlyContribution: monthly,
        targetDate, reminderDate,
        image: mgDraft.image
      };
      if (mgDraft.id) {
        await Store.updateGoal(mgDraft.id, finalGoal);
        toast('Moving goal updated');
      } else {
        const created = await Store.addMovingGoal(finalGoal);
        toast('Moving goal created');
        if (created && finalGoal.image) await Store.saveImage('goal_' + created.id, finalGoal.image);
      }
      haptic('success');
      closeSheet();
      switchTab('goals');
    }

    /* ═══════════════════════════════════════════════════════════
       NOTIFICATION MANAGER (real Notification API only — unchanged)
       ═══════════════════════════════════════════════════════════ */
    const NotificationManager = (function() {
      async function requestPermission() {
        if (!('Notification' in window)) return { granted: false, reason: 'Notification API not supported' };
        if (PlatformCapabilities.env.isIOS && !PlatformCapabilities.env.isStandalone) {
          return { granted: false, reason: 'On iOS, web notifications require installing to Home Screen (iOS 16.4+)', requiresInstall: true };
        }
        try {
          const result = await Notification.requestPermission();
          return { granted: result === 'granted', permission: result };
        } catch (e) { return { granted: false, reason: 'Permission request failed: ' + e.message }; }
      }
      async function send(title, body, options) {
        options = options || {};
        if (!('Notification' in window)) return { sent: false, reason: 'Notification API not supported' };
        if (Notification.permission !== 'granted') return { sent: false, reason: 'Permission not granted' };
        try {
          const reg = await navigator.serviceWorker?.ready;
          if (reg && reg.showNotification) {
            await reg.showNotification(title, { body, tag: options.tag || 'logostics' });
            return { sent: true };
          }
          const n = new Notification(title, { body, tag: options.tag || 'logostics' });
          setTimeout(() => { try { n.close(); } catch (e) {} }, 6000);
          return { sent: true };
        } catch (e) { return { sent: false, reason: e.message }; }
      }
      return { requestPermission, send };
    })();

    /* ═══════════════════════════════════════════════════════════
       SERVICE WORKER (unchanged)
       ═══════════════════════════════════════════════════════════ */
    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return null;
      if (!window.isSecureContext) return null;
      try {
        const swCode = `
          const CACHE = 'logostics-v5';
          const SHELL = ['./'];
          self.addEventListener('install', (e) => { e.waitUntil(caches.open(CACHE).then(c => c.addAll(SHELL)).catch(() => {})); self.skipWaiting(); });
          self.addEventListener('activate', (e) => { e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))); self.clients.claim(); });
          self.addEventListener('fetch', (e) => {
            const req = e.request;
            if (req.method !== 'GET') return;
            if (req.mode === 'navigate') {
              e.respondWith(fetch(req).then(res => { const copy = res.clone(); caches.open(CACHE).then(c => c.put(req, copy)).catch(() => {}); return res; }).catch(() => caches.match(req).then(r => r || caches.match('./'))));
              return;
            }
            e.respondWith(caches.match(req).then(cached => { if (cached) return cached; return fetch(req).then(res => { if (res && res.status === 200 && res.type === 'basic') { const copy = res.clone(); caches.open(CACHE).then(c => c.put(req, copy)).catch(() => {}); } return res; }).catch(() => cached); }));
          });
          self.addEventListener('notificationclick', (e) => { e.notification.close(); e.waitUntil(self.clients.matchAll({ type: 'window', includeUncontrolled: true }).then(list => { for (const c of list) { if ('focus' in c) return c.focus(); } if (self.clients.openWindow) return self.clients.openWindow('./'); })); });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        return await navigator.serviceWorker.register(swUrl);
      } catch (e) { return null; }
    }

    /* ═══════════════════════════════════════════════════════════
       INIT — unchanged + exposed new MG handlers
       ═══════════════════════════════════════════════════════════ */
    async function init() {
      DebugPanel.log('Init start');
      await Store.init();
      await registerServiceWorker();
      LifecycleManager.init();
      AppLockManager.init();
      GestureManager.init();

      Store.subscribe(() => { if (authenticated && !AppLockManager.isLocked()) render(); });

      try {
        const savedTab = sessionStorage.getItem('logostics_tab');
        if (savedTab && ['home', 'activity', 'goals', 'analytics'].includes(savedTab)) {
          currentTab = savedTab;
          document.querySelectorAll('.nav-item').forEach(el => { el.classList.toggle('active', el.dataset.tab === savedTab); });
        }
      } catch (e) {}

      if (Store.preferences.appLockEnabled && AuthManager.hasCredential()) AppLockManager.lock('startup');
      authenticated = true;
      render();

      if (PatchNotes.hasUnseenVersion() && Store.preferences.lastSeenVersion) setTimeout(() => openPatchNotes(), 800);
      else if (!Store.preferences.lastSeenVersion) PatchNotes.markSeen();

      // Existing handlers
      Object.assign(window, {
        switchTab, openAddIncome, openAddExpense, openAddGoal, openGoalDetail,
        openTxDetail, openTransfer, openSettings, openAI, openPatchNotes,
        submitIncome, submitExpense, submitGoal, submitTransfer,
        submitEditTx, openEditTx, confirmDeleteTx, confirmDeleteGoal,
        addToGoal, pickChip, pickSeg, closeSheet,
        exportData, resetAllData, togglePrivacy, enableNotifications,
        toggleAppLock, setAutoLock,
        askAIAbout, submitAI, executeAIConfirm, dismissAIConfirm, clearAIChat,
        openTxContextMenu, setActivityCat, onActivitySearch,
        DashboardManager, LifecycleManager, AppLockManager, PatchNotes, DebugPanel,
        // [MG] New moving goal handlers
        openAddMovingGoal, openEditMovingGoal, openMovingGoalDetail,
        openAddToMovingGoal, submitAddToMovingGoal, confirmDeleteMovingGoal,
        askAIAboutMovingGoal, mgSearchDestination, mgPickResult, mgResetMap,
        mgHandleImage, mgRemoveImage, mgSaveGoal, mgUpdateCalc,
        mgRecenterDetail, MapService, MovingGoalCalculator
      });
    }

    if (document.readyState !== 'loading') init();
    else document.addEventListener('DOMContentLoaded', init);

    window.addEventListener('online', () => toast('Back online'));
    window.addEventListener('offline', () => toast('Offline — data still saves locally'));
  </script>
</body>
