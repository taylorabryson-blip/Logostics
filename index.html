/* ═══ INCOME ESTIMATOR (autosaves on every change) ═══ */
function openIncomeEstimator(){const i=Store.incomeSettings;const v=x=>x?x:'';
openSheet(`<div class="sheet-title">Income Estimator</div>
<div class="field-row"><div class="field"><label class="field-label">Hourly wage</label><input class="field-input" id="inc-rate" type="number" inputmode="decimal" placeholder="$0.00" value="${v(i.hourlyRate)}" oninput="incAuto()"></div><div class="field"><label class="field-label">Hours / week</label><input class="field-input" id="inc-hours" type="number" inputmode="decimal" placeholder="0" value="${v(i.hoursPerWeek)}" oninput="incAuto()"></div></div>
<div class="field-row"><div class="field"><label class="field-label">Overtime hrs / week</label><input class="field-input" id="inc-ot" type="number" inputmode="decimal" placeholder="0" value="${v(i.overtimeHours)}" oninput="incAuto()"></div><div class="field"><label class="field-label">Overtime ×</label><input class="field-input" id="inc-mult" type="number" inputmode="decimal" step="0.25" placeholder="1.5" value="${i.overtimeMultiplier||1.5}" oninput="incAuto()"></div></div>
<div class="field-row"><div class="field"><label class="field-label">Taxes %</label><input class="field-input" id="inc-tax" type="number" inputmode="decimal" placeholder="20" value="${i.withholdingPct??20}" oninput="incAuto()"></div><div class="field"><label class="field-label">Deductions / paycheck</label><input class="field-input" id="inc-ded" type="number" inputmode="decimal" placeholder="$0.00" value="${v(i.deductions)}" oninput="incAuto()"></div></div>
<div class="field"><label class="field-label">Pay frequency</label><div class="chips" id="inc-freq">${['weekly','biweekly','semimonthly','monthly'].map(f=>`<button class="chip ${i.payFrequency===f?'selected':''}" data-f="${f}" onclick="pickChip(this);incAuto()">${f}</button>`).join('')}</div></div>
<div class="field"><label class="field-label">Next payday</label><input class="field-input" id="inc-next" type="date" value="${i.nextPayday?String(i.nextPayday).split('T')[0]:''}" onchange="incAuto()"></div>
<div class="social-card" id="inc-results"></div><div class="progress-note" style="text-align:center;margin-bottom:12px">Saved automatically as you type.</div><button class="btn btn-secondary" onclick="closeSheet()">Done</button>`);refreshIncomeResults()}
function refreshIncomeResults(){const el=document.getElementById('inc-results');if(!el)return;const c=Store.computeIncome();const row=(k,x,b)=>`<div class="debug-row" ${b?'style="border:none"':''}><span class="k">${k}</span><span class="v">${fmt(x)}</span></div>`;
el.innerHTML=`<div class="t-label" style="margin-bottom:8px">Estimate</div>${row('Gross / paycheck',c.grossPeriod)}${row('Net / paycheck',c.netPeriod)}${row('Net / week',c.netWeekly)}${row('Net / month',c.monthlyNet)}${row('Gross / month',c.monthlyGross)}${row('Net / year',c.annualNet)}${row('Gross / year',c.annualGross,1)}`+goalsEtaHTML()}
function goalsEtaHTML(){const e=IncomeEstimator.estimate(),pd=IncomeEstimator.paydays(4)||[],t=(k,v)=>`<div class="debug-row"><span class="k">${k}</span><span class="v" style="text-align:right">${v}</span></div>`;
let h=`<div class="t-label" style="margin:16px 0 8px">Paychecks</div>${t('Average paycheck',e.avgPaycheck>0?fmt(e.avgPaycheck):'—')}${t('Based on',e.source==='history'?e.historyCount+' logged paycheck'+(e.historyCount>1?'s':''):e.source==='schedule'?'Wage & hours':'No data yet')}${t('Next paydays',pd.length?pd.map(fds).join(', '):'Set your next payday')}`;
const gs=Store.getAllGoals();if(gs.length){h+=`<div class="t-label" style="margin:16px 0 8px">When your goals finish</div>`+gs.map(g=>{const p=Store.computeGoalProgress(g),f=g.type==='moving'?MovingGoalCalculator.forecast(g):null;return t(escapeHtml(g.name),p.remaining<=0?'✓ Done':p.estimatedDate?fd(p.estimatedDate)+(f&&f.checks?' · '+(f.exact?'':'~')+f.checks+' paychecks':''):'No estimate')}).join('')}return h}
function incAuto(){const n=id=>parseFloat($v(id))||0;const f=(document.querySelector('#inc-freq .chip.selected')||{dataset:{}}).dataset.f||'weekly';Store.updateIncomeSettings({hourlyRate:n('inc-rate'),hoursPerWeek:n('inc-hours'),overtimeHours:n('inc-ot'),overtimeMultiplier:n('inc-mult')||1.5,withholdingPct:n('inc-tax'),deductions:n('inc-ded'),payFrequency:f,nextPayday:$v('inc-next')||null});refreshIncomeResults()}

/* ═══ STANDARD GOALS ═══ */
function goalStatusHTML(p){const L={completed:'<span style="color:var(--green)">✓ Completed</span>',ahead:'<span style="color:var(--green)">Ahead of schedule</span>','on-track':'<span style="color:var(--green)">On track</span>','at-risk':'<span style="color:#ff9f0a">At risk</span>',behind:'<span style="color:#ff453a">Behind</span>','no-rate':'Add a contribution to estimate'};return L[p.status]||''}
function estimateBox(p){if(p.status==='completed')return`<div style="background:var(--card);border:1px solid var(--green);border-radius:14px;padding:14px;margin-bottom:16px;font-size:13px"><div style="display:flex;justify-content:space-between"><span style="color:var(--gray-400)">Status</span><span style="font-weight:700;color:var(--green)">✓ Goal reached!</span></div></div>`;
if(p.status==='no-rate')return`<div style="background:var(--card);border:1px solid var(--gray-800);border-radius:14px;padding:14px;margin-bottom:16px;font-size:13px;color:var(--gray-500);text-align:center">Add a contribution amount and frequency, or set your income, to estimate completion.</div>`;
return`<div style="background:var(--card);border:1px solid var(--gray-800);border-radius:14px;padding:14px;margin-bottom:16px;font-size:13px"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:var(--gray-400)">Progress</span><span style="font-weight:700">${p.pct}% · ${goalStatusHTML(p)}</span></div><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--gray-400)">Remaining</span><span style="font-weight:700">${fmt(p.remaining)}</span></div><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--gray-400)">~${fmt(p.weeklyRate)}/week${p.basis==='income'?' (from income & spending)':''}</span><span style="font-weight:700">~${p.weeksRemaining} wk</span></div>${p.requiredWeekly>0&&p.daysLeft!==null?`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--gray-400)">Needed for deadline</span><span style="font-weight:700">${fmt(p.requiredWeekly)}/week</span></div>`:''}<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--gray-800)"><span style="color:var(--gray-400)">Estimated completion</span><span style="font-weight:700">${fmtDateLong(p.estimatedDate.toISOString())}</span></div></div>`}
function openGoalForm(g){gDraft={image:g?g.image||null:null};const e=!!g;
openSheet(`<div class="sheet-title">${e?'Edit Goal':'Create Goal'}</div><div class="field"><label class="field-label">Goal Name</label><input class="field-input" id="gf-name" placeholder="iPhone, Vacation…" value="${e?escapeHtml(g.name):''}"></div><div class="field-row"><div class="field"><label class="field-label">Target</label><input class="field-input" id="gf-target" type="number" inputmode="decimal" placeholder="$0.00" value="${e?g.target:''}"></div><div class="field"><label class="field-label">Saved so far</label><input class="field-input" id="gf-current" type="number" inputmode="decimal" placeholder="$0.00" value="${e?g.current:0}"></div></div><div class="field-row"><div class="field"><label class="field-label">Contribution</label><input class="field-input" id="gf-contrib" type="number" inputmode="decimal" placeholder="$0.00" value="${e&&g.contribution?g.contribution:''}"></div><div class="field"><label class="field-label">Deadline</label><input class="field-input" id="gf-date" type="date" value="${e&&g.targetDate?g.targetDate.split('T')[0]:''}"></div></div><div class="field"><label class="field-label">Contribution frequency</label><div class="chips" id="gf-freq">${['daily','weekly','biweekly','monthly','paycheck'].map(f=>`<button class="chip ${((e&&g.frequency)||'weekly')===f?'selected':''}" data-f="${f}" onclick="pickChip(this)">${f==='paycheck'?'per paycheck':f}</button>`).join('')}</div></div><div class="field"><label class="field-label">Icon</label><div class="chips" id="gf-emoji">${['◈','▣','◆','●','🎯','🏠','✈️','🚗','🎓'].map(x=>`<button class="chip ${((e&&g.emoji)||'◈')===x?'selected':''}" data-emoji="${x}" onclick="pickChip(this)">${x}</button>`).join('')}</div></div><div class="field"><label class="field-label">Image (optional)</label><label class="btn btn-secondary sm" style="cursor:pointer">📷 Choose image<input type="file" accept="image/*" style="display:none" onchange="gfImage(event)"></label><img id="gf-prev" src="${gDraft.image?escapeHtml(gDraft.image):''}" style="width:100%;border-radius:14px;margin-top:10px;${gDraft.image?'':'display:none'}"></div><button class="btn btn-primary" onclick="submitGoalForm(${e?g.id:'null'})">${e?'Save changes':'Create Goal'}</button><button class="btn btn-secondary" style="margin-top:8px" onclick="closeSheet()">Cancel</button>`)}
const openAddGoal=()=>openGoalForm(null);
function gfImage(ev){readImage(ev.target.files[0],480,u=>{gDraft.image=u;const p=document.getElementById('gf-prev');if(p){p.src=u;p.style.display='block'}})}
async function submitGoalForm(id){const name=$v('gf-name').trim(),target=parseFloat($v('gf-target')),current=parseFloat($v('gf-current'))||0,contribution=parseFloat($v('gf-contrib'))||0,date=$v('gf-date'),sel=q=>(document.querySelector(q)||{dataset:{}}).dataset;
if(!name){toast('Enter a goal name');return}if(!target||target<=0){toast('Enter a valid target');return}
const d={name,target,current,contribution,frequency:sel('#gf-freq .chip.selected').f||'weekly',emoji:sel('#gf-emoji .chip.selected').emoji||'◈',targetDate:date?new Date(date).toISOString():null,image:gDraft.image};
if(id){await Store.updateGoal(id,d);toast('Goal updated')}else{await Store.addGoal(d);toast('Goal created')}closeSheet();haptic('success');SoundManager.goalCreated();render()}
function openGoalDetail(id){const g=Store.getGoal(id);if(!g)return;if(g.type==='moving'){openMovingGoalDetail(id);return}const p=Store.computeGoalProgress(g),sh=Social.myShare(id);
openSheet(`<div style="text-align:center;margin-bottom:28px">${g.image?`<img src="${escapeHtml(g.image)}" class="goal-img" style="height:140px">`:`<div style="font-size:52px;margin-bottom:10px;opacity:.85">${escapeHtml(g.emoji)}</div>`}<div style="font-size:22px;font-weight:700">${escapeHtml(g.name)}</div><div style="font-size:14px;color:var(--gray-500);margin-top:4px">${p.pct}% complete${g.targetDate?' · due '+fmtDateLong(g.targetDate):''}</div></div><div style="display:flex;justify-content:space-between;font-size:22px;font-weight:700;margin-bottom:14px"><span>${fmt(g.current)}</span><span style="color:var(--gray-500)">${fmt(g.target)}</span></div><div class="goal-bar" style="height:10px;margin-bottom:20px"><div class="goal-fill" style="width:${p.pct}%"></div></div>${estimateBox(p)}<div class="field"><label class="field-label">Add to goal</label><div style="display:flex;gap:8px"><input class="field-input" id="g-add" type="number" inputmode="decimal" placeholder="$0.00" style="flex:1"><button class="btn btn-green" style="width:auto;padding:14px 22px" onclick="addToGoal(${g.id})">Add</button></div></div><div class="btn-row"><button class="btn btn-secondary" onclick="closeSheet();openShareGoal(${g.id})">👥 ${sh?'Sharing: '+escapeHtml(shareLabel(sh)):'Share'}</button><button class="btn btn-secondary" onclick="closeSheet();openGoalForm(Store.getGoal(${g.id}))">✎ Edit</button></div><button class="btn btn-danger" style="margin-top:12px" onclick="confirmDeleteGoal(${g.id})">Delete Goal</button><button class="btn btn-secondary" style="margin-top:8px" onclick="closeSheet()">Close</button>`)}
const shareLabel=s=>s.visibility==='friends'?'Friends':s.visibility==='users'?(s.userIds.length+' people'):s.visibility==='group'?'Group':'Private';
async function addToGoal(id){const amt=parseFloat($v('g-add'));if(!amt||amt<=0){toast('Enter a valid amount');return}const g=Store.getGoal(id);if(!g)return;const was=g.current>=g.target;await Store.updateGoal(id,{current:g.current+amt});closeSheet();haptic('success');if(!was&&g.current+amt>=g.target){SoundManager.goalCompleted();showCelebration();toast('🎉 Goal reached!')}else{SoundManager.success();toast('Added to goal')}render()}
async function confirmDeleteGoal(id){if(confirm('Delete this goal? Any sharing will be removed.')){await Store.deleteGoal(id);closeSheet();haptic('heavy');toast('Goal deleted');render()}}

/* ═══ MOVING GOALS ═══ */
function openAddMovingGoal(){mgDraft={id:null,name:'Move',destination:{lat:null,lng:null,name:'',city:'',state:'',country:'',postalCode:'',fullName:''},target:0,current:0,weeklyContribution:0,monthlyContribution:0,targetDate:null,reminderDate:null,image:null,payPlan:{enabled:IncomeEstimator.estimate().avgPaycheck>0,mode:'percent',value:20}};openMovingGoalEditor('Create Moving Goal')}
function openEditMovingGoal(id){const g=Store.getGoal(id);if(!g||g.type!=='moving')return;mgDraft=JSON.parse(JSON.stringify(g));if(!mgDraft.payPlan)mgDraft.payPlan={enabled:false,mode:'percent',value:20};openMovingGoalEditor('Edit Moving Goal')}
const fd=d=>fmtDateLong(new Date(d).toISOString()),fds=d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function payForecastHTML(f){if(f.basis==='none')return f.hasIncome?'':`<div class="progress-note">Add your wage in the Income Estimator (or log a paycheck as income) to see when your paychecks will finish this goal.</div>`;
const row=(k,v,c)=>`<div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:6px"><span style="color:var(--gray-400)">${k}</span><span style="font-weight:700;text-align:right;${c?'color:'+c:''}">${v}</span></div>`;
let h=row('Funding',f.basis==='contribution'?fmt(f.perWeek)+'/week':fmt(f.perCheck)+'/paycheck'+(f.suggested?' (suggested 20%)':f.plan&&f.plan.mode==='percent'?' ('+f.plan.value+'%)':''));
if(f.hasIncome)h+=row('Avg paycheck',fmt(f.avgPaycheck)+' · '+f.payFrequency);
if(f.checks)h+=row('Paychecks to go',(f.exact?'':'~')+f.checks);
if(f.nextPaydays.length&&f.basis!=='contribution')h+=row('Next payday',fds(f.nextPaydays[0]));
if(f.finishDate&&f.checks!==0)h+=row('Finish date',fd(f.finishDate),f.onTime===false?'#ff9f0a':'var(--green)');
if(f.onTime===true)h+=row('Deadline','✓ Finishes in time');
else if(f.onTime===false){h+=row('Deadline','Late by '+(f.lateDays>=14?Math.round(f.lateDays/7)+' weeks':f.lateDays+' days'),'#ff9f0a');if(f.needPerCheck)h+=row('To hit your date',fmt(f.needPerCheck)+'/paycheck'+(f.needPct?' ('+f.needPct+'%)':''),'var(--text)')}
if(!f.exact&&f.hasIncome&&f.basis!=='contribution'&&f.checks)h+=`<div class="progress-note" style="margin-top:4px">Set your next payday in the Income Estimator for exact payday dates.</div>`;
return h}
function renderCalcPreview(c){const M={ahead:['Ahead of pace','var(--green)'],'on-track':['On track','var(--green)'],behind:['Behind pace','#ff9f0a'],'no-rate':['Set a rate','var(--gray-500)'],'no-date':['Set a date','var(--gray-500)'],completed:['Completed','var(--green)']};const st=M[c.status]||['','var(--gray-500)'],pf=payForecastHTML(c.forecast);
return`<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:var(--gray-400)">Progress</span><span style="font-weight:700;color:${st[1]}">${c.pct}% · ${st[0]}</span></div><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--gray-400)">Remaining</span><span style="font-weight:700">${fmt(c.remaining)}</span></div>${c.requiredWeekly>0?`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--gray-400)">Weekly needed</span><span style="font-weight:700">${fmt(c.requiredWeekly)}</span></div><div style="display:flex;justify-content:space-between"><span style="color:var(--gray-400)">Monthly needed</span><span style="font-weight:700">${fmt(c.requiredMonthly)}</span></div>`:`<div style="color:var(--gray-500);font-size:12px">Set a target date to see required amounts.</div>`}${pf?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-800)"><div class="t-label" style="margin-bottom:8px">Paycheck forecast</div>${pf}</div>`:c.estimatedDate?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--gray-800);display:flex;justify-content:space-between"><span style="color:var(--gray-400)">Est. completion</span><span style="font-weight:700">${fd(c.estimatedDate)}</span></div>`:''}`}
function mgPayHTML(){const pp=mgDraft.payPlan||(mgDraft.payPlan={enabled:false,mode:'percent',value:20}),inc=IncomeEstimator.estimate();

const mutualLine=u=>`<span onclick="event.stopPropagation();openMutual('${u.id}')" style="text-decoration:underline;cursor:pointer">${u.mutual.length} mutual</span>`;

function reqRow(r){const u=r.user;return`<div class="social-card" style="padding:14px"><div style="display:flex;align-items:center;gap:12px;cursor:pointer" onclick="openUserProfile('${u.id}')">${avHTML(u,44,true)}<div style="flex:1;min-width:0"><div class="friend-name">${nameOf(u)}</div><div class="friend-status">@${escapeHtml(u.username)} · ${timeAgo(new Date(r.at).getTime())}</div><div class="friend-status">${mutualLine(u)}</div></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="mini-btn go" style="flex:1" onclick="respondReq('${r.id}',true)">Accept</button><button class="mini-btn" style="flex:1" onclick="respondReq('${r.id}',false)">Decline</button></div></div>`}
function sentRow(r){const u=r.user;return`<div class="social-card" style="padding:14px"><div style="display:flex;align-items:center;gap:12px;cursor:pointer" onclick="openUserProfile('${u.id}')">${avHTML(u,44,true)}<div style="flex:1;min-width:0"><div class="friend-name">${nameOf(u)}</div><div class="friend-status">@${escapeHtml(u.username)} · sent ${timeAgo(new Date(r.at).getTime())}</div></div><button class="mini-btn" onclick="event.stopPropagation();cancelReq('${r.id}')">Cancel</button></div></div>`}
function sugRow(s){const u=s.user,why=[s.mutual?`${s.mutual} mutual friend${s.mutual>1?'s':''}`:'',s.groups.length?'Shared group: '+s.groups.map(escapeHtml).join(', '):''].filter(Boolean).join(' · ');return`<div class="social-card" style="padding:14px"><div style="display:flex;align-items:center;gap:12px;cursor:pointer" onclick="openUserProfile('${u.id}')">${avHTML(u,44,true)}<div style="flex:1;min-width:0"><div class="friend-name">${nameOf(u)}</div><div class="friend-status">@${escapeHtml(u.username)}</div><div class="friend-status">${why}</div></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="mini-btn go" style="flex:1" onclick="addFriendFast('${u.id}')">Add</button><button class="mini-btn" style="flex:1" onclick="dismissSug('${u.id}')">Dismiss</button></div></div>`}
const frEmpty=(ico,t,s)=>`<div class="empty"><div class="empty-ico">${ico}</div><div class="empty-title">${t}</div><div class="empty-sub">${s}</div></div>`;
function debtsHTML(){const ds=Store.getDebts();const row=d=>`<div class="debt-row"><div style="min-width:0"><div class="who">${escapeHtml(d.person)}</div>${d.note?`<div class="friend-status">${escapeHtml(d.note)}</div>`:''}</div><div style="display:flex;align-items:center;gap:8px"><span class="amt ${d.direction}">${fmt(d.amount)}</span>${d.direction==='owed'?`<button class="mini-btn" onclick="Store.remindDebt('${d.id}')">Remind</button>`:''}<button class="mini-btn" onclick="settleDebt('${d.id}')">✓</button></div></div>`;

function frListHTML(){const d=frData();let h='';
if(['friends','online','offline'].includes(frTab)){const l=d[frTab].filter(frMatch);h=l.length?l.map(frRow).join(''):frQuery.trim()?frEmpty('🔍','No matches','Nobody in this list matches your search.'):frTab==='friends'?frEmpty('👥','No friends yet','Share your friend code or add someone with theirs.'):frTab==='online'?frEmpty('◌','Nobody is online','Friends who are active will appear here.'):frEmpty('◌','Everyone is online','No friends are offline right now.')}
else if(frTab==='requests')h=d.requests.length?d.requests.map(reqRow).join(''):frEmpty('✉️','No friend requests','Incoming requests will appear here.');
else if(frTab==='sent')h=d.sent.length?d.sent.map(sentRow).join(''):frEmpty('📤','No pending requests','Requests you send will appear here.');

if(frTab==='friends'&&!frQuery.trim()){h+=debtsHTML();const b=Social.blockedList();if(b.length)h+=`<div class="set-row" style="margin-top:18px" onclick="openBlocked()"><div class="set-left"><span class="ico">⛔</span> Blocked users</div><div class="set-right">${b.length} ›</div></div>`}return h}
function renderFriends(){const d=frData(),cnt={friends:d.friends.length,online:d.online.length,offline:d.offline.length,requests:d.requests.length,sent:d.sent.length,suggestions:d.suggestions.length};
return`<div class="container fade-in"><div class="top-header"><div class="t-large">Friends</div><div style="display:flex;gap:8px"><button class="icon-btn" onclick="openAddFriend()" style="background:var(--btn);color:var(--btn-text);border-color:var(--btn)">+</button></div></div>

<div class="subtabs">${FR_TABS.map(([k,l])=>`<button class="subtab ${frTab===k?'active':''}" onclick="setFrTab('${k}')">${l}${cnt[k]?' ('+cnt[k]+')':''}</button>`).join('')}</div>
${['friends','online','offline'].includes(frTab)?`<div class="field"><input class="field-input" id="fr-search" placeholder="Search friends" value="${escapeHtml(frQuery)}" oninput="onFriendSearch(this.value)" autocomplete="off" style="padding:12px 16px;font-size:15px"></div>`:''}
<div id="fr-list">${frListHTML()}</div></div>`}

function searchFriend(e){if(e&&e.preventDefault)e.preventDefault();const q=$v('af-q').trim();afQuery=q;const u=Accounts.current();
if(!q)afState={err:'Enter a friend code or username'};else if(normCode(q)===u.friendCode||q.replace(/^@/,'').toLowerCase()===u.username)afState={err:"That's your own account"};else{const r=Social.findAny(q);afState=r?{user:r}:{err:'No user found. Check the code and try again.'}}afRender()}

const achDef=id=>Social.ACH.find(a=>a.id===id);
const achChip=(a,locked)=>`<span class="ach ${locked?'locked':''}" title="${escapeHtml(a.desc)}">${a.emoji} ${escapeHtml(a.title)}</span>`;

function profRelButtons(u){const id=u.id,r=u.relation,blk=`<button class="btn btn-secondary" style="margin-top:8px" onclick="confirmBlock('${id}')">Block</button>`;

function profAct(kind,rid,id){let r,m;if(kind==='add'){r=Social.sendRequest(id);m=r.accepted?'You are now friends':'Request sent'}else if(kind==='cancel'){r=Social.cancelRequest(rid);m='Request cancelled'}else if(kind==='accept'){r=Social.respond(rid,true);m='Friend added'}else{r=Social.respond(rid,false);m='Request declined'}if(act(r,m))openUserProfile(id)}

${fr?`<div class="t-label" style="margin:22px 0 10px">Games</div><div class="btn-row"><button class="btn btn-green" onclick="playGame('${id}','coin')">🪙 Coin Flip</button><button class="btn btn-secondary" onclick="playGame('${id}','dice')">🎲 Dice</button></div><div class="friend-status" style="text-align:center;margin-top:8px">Wins ${sc.wins} · Losses ${sc.losses}</div>`:''}
${fr?`<div class="t-label" style="margin:22px 0 10px">Shared goals</div>${shared.length?shared.map(sharedCardHTML).join(''):`<div class="progress-note" style="text-align:center">No shared goals.</div>`}`:''}
${!blocked?`<div class="t-label" style="margin:22px 0 10px">Recent activity</div>${acts===null?`<div class="progress-note" style="text-align:center">${fr?'This user keeps activity private.':'Activity is visible to friends.'}</div>`:acts.length?acts.map(a=>`<div class="friend-status" style="padding:6px 2px">• ${escapeHtml(a.text)} · ${timeAgo(new Date(a.at).getTime())}</div>`).join(''):`<div class="progress-note" style="text-align:center">No recent activity.</div>`}`:''}
<button class="btn btn-secondary" style="margin-top:18px" onclick="closeSheet()">Close</button>`);liveSheet=()=>openUserProfile(id)}

${list.length?list.map(notifRow).join(''):`<div class="empty"><div class="empty-ico">🔔</div><div class="empty-title">${notifFilter==='unread'?'All caught up':'No notifications'}</div><div class="empty-sub">Friend requests, goal updates and announcements will appear here.</div></div>`}</div>`}

function openNotif(id){const n=Social.notifs().find(x=>x.id===id);if(!n)return;if(!n.read)Social.markRead(id);const ref=n.ref||{};

<button class="btn btn-secondary" onclick="closeSheet()">Close</button>`);liveSheet=()=>{if(!openSharedGoal(sid))closeSheet()};return true}
function renderMovingGoalCard(g,sIds){const calc=MovingGoalCalculator.compute(g),ctx=MovingGoalCalculator.withIncomeContext(g),d=g.destination,hasDest=d&&typeof d.lat==='number'&&typeof d.lng==='number',mapId='mg-card-map-'+g.id;
const dest=d&&d.city?`${d.city}${d.state?', '+d.state:''}`:(d&&d.name)||'Destination not set';const SL={ahead:['Ahead','ok'],'on-track':['On track','ok'],behind:['Behind','warn'],'no-rate':['Set rate','dim'],'no-date':['No date','dim'],completed:['Complete','ok']}[calc.status]||['',''];

function mountCardMaps(){Store.getMovingGoals().forEach(g=>{const d=g.destination;if(!d||typeof d.lat!=='number'||typeof d.lng!=='number')return;const el=document.getElementById('mg-card-map-'+g.id);if(!el||activeMaps.has(el.id)||!MapService.leafletReady())return;const map=MapService.createMap(el,{center:[d.lat,d.lng],zoom:9});if(!map)return;['dragging','touchZoom','doubleClickZoom','scrollWheelZoom','boxZoom','keyboard'].forEach(k=>map[k]&&map[k].disable());const mk=MapService.createMarker(d.lat,d.lng);if(mk)mk.addTo(map);activeMaps.set(el.id,{map,marker:mk})})}

function ggEstHTML(g){const e=g.est,row=(a,b)=>`<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:var(--gray-400)">${a}</span><b>${b}</b></div>`;

return`<div class="social-card" style="font-size:13px;margin-bottom:16px">${row('Progress',e.pct+'%')}${row('Remaining',fmt(e.remaining))}${row('Group pace',e.rate>0?fmt(e.rate)+'/week':'No pace set')}${e.daysLeft!==null?row('Deadline',fmtDateLong(g.deadline)+(e.daysLeft<0?' (passed)':'')):''}${e.daysLeft!==null&&e.requiredWeekly>0?row('Needed per week',fmt(e.requiredWeekly)):''}<div style="padding-top:8px;border-top:1px solid var(--gray-800)">${row('Estimated completion',e.date?fmtDateLong(e.date.toISOString()):'Set a weekly contribution')}</div></div>`}
function openGroupDetail(id){const g=Social.group(id);if(!g){toast('This goal is no longer available');closeSheet();return}const mine=g.members.find(m=>m.userId===me);
openSheet(`<div style="text-align:center;margin-bottom:22px">${safeImg(g.image)?`<img src="${safeImg(g.image)}" class="goal-img" style="height:140px">`:`<div style="font-size:52px;margin-bottom:8px">👥</div>`}<div style="font-size:22px;font-weight:700">${escapeHtml(g.name)}${g.archived?' <span class="dev-badge idle">Archived</span>':''}</div>${g.description?`<div style="font-size:13px;color:var(--gray-400);margin-top:6px">${escapeHtml(g.description)}</div>`:''}<div class="friend-status" style="margin-top:6px">Created by ${nameOf(g.creator)} · ${g.visibility==='friends'?'Visible to friends':'Members only'}</div></div>
<div style="display:flex;justify-content:space-between;font-size:22px;font-weight:700;margin-bottom:14px"><span>${fmt(g.total)}</span><span style="color:var(--gray-500)">${fmt(g.target)}</span></div><div class="goal-bar" style="height:10px;margin-bottom:20px"><div class="goal-fill" style="width:${g.est.pct}%"></div></div><div id="gg-est">${ggEstHTML(g)}</div>
${mine&&!g.archived?`<div class="field"><label class="field-label">Add your contribution</label><div style="display:flex;gap:8px"><input class="field-input" id="gg-amt" type="number" inputmode="decimal" placeholder="$0.00" style="flex:1"><button class="btn btn-green" style="width:auto;padding:14px 22px" onclick="contribGroup('${id}')">Add</button></div></div><div class="field"><label class="field-label">Your weekly contribution (saved automatically)</label><input class="field-input" id="gg-wk" type="number" inputmode="decimal" placeholder="$0.00" value="${mine.weeklyContribution||''}" oninput="ggWeeklyAuto('${id}')"></div>`:''}
<div class="t-label" style="margin:18px 0 8px">Members (${g.members.length})</div>${g.memberUsers.map(m=>{const u=m.user,self=m.userId===me;return`<div class="friend-row" ${self||!u?'style="cursor:default"':`onclick="openUserProfile('${u.id}')"`}>${avHTML(u,38,true)}<div style="flex:1;min-width:0"><div class="friend-name">${u?nameOf(u):'Unknown'}${self?' (You)':''}${m.role==='owner'?' <span class="dev-badge role">Owner</span>':''}</div><div class="friend-status">${fmt(m.contribution)} contributed${m.weeklyContribution>0?' · '+fmt(m.weeklyContribution)+'/wk':''}</div></div>${g.isOwner&&!self?`<button class="mini-btn" onclick="event.stopPropagation();ggRemove('${id}','${m.userId}')">✕</button>`:''}</div>`}).join('')}
${g.isOwner?`<div class="btn-row" style="margin-top:14px"><button class="btn btn-secondary" onclick="openGroupForm('${id}')">✎ Edit</button><button class="btn btn-secondary" onclick="openAddMember('${id}')">+ Members</button></div><div class="btn-row"><button class="btn btn-secondary" onclick="ggArchive('${id}',${!g.archived})">${g.archived?'Restore':'Archive'}</button><button class="btn btn-danger" onclick="ggDelete('${id}')">Delete</button></div>`:g.isMember?`<button class="btn btn-danger" style="margin-top:14px" onclick="ggLeave('${id}')">Leave goal</button>`:''}
${g.log.length?`<div class="t-label" style="margin:22px 0 8px">Activity</div>${g.log.slice(0,8).map(l=>{const u=Social.user(l.userId);return`<div class="friend-status" style="padding:5px 2px">• ${u?nameOf(u):'Someone'} ${escapeHtml(l.message)} · ${timeAgo(new Date(l.at).getTime())}</div>`}).join('')}`:''}
<button class="btn btn-secondary" style="margin-top:18px" onclick="closeSheet()">Close</button>`);liveSheet=()=>openGroupDetail(id)}
function contribGroup(id){const r=Social.contribute(id,parseFloat($v('gg-amt')));if(!r.ok){toast(r.error);haptic('error');return}if(r.done){showCelebration();SoundManager.goalCompleted();toast('🎉 Goal reached!')}else{SoundManager.success();toast('Contribution added')}haptic('success');openGroupDetail(id);render()}
let _gw=null;function ggWeeklyAuto(id){clearTimeout(_gw);_gw=setTimeout(()=>{Social.setWeekly(id,parseFloat($v('gg-wk'))||0);const g=Social.group(id),el=document.getElementById('gg-est');if(g&&el)el.innerHTML=ggEstHTML(g)},400)}
function ggRemove(gid,uid){const u=Social.user(uid);if(confirm(`Remove ${u?u.displayName:'this member'} from the goal?`)&&act(Social.removeMember(gid,uid),'Member removed'))openGroupDetail(gid)}
function ggArchive(id,v){if(act(Social.archiveGroup(id,v),v?'Goal archived':'Goal restored'))openGroupDetail(id)}
function ggDelete(id){if(confirm('Delete this group goal for everyone? This cannot be undone.')&&act(Social.deleteGroup(id),'Goal deleted'))closeSheet()}
function ggLeave(id){if(confirm('Leave this group goal?')&&act(Social.leaveGroup(id),'You left the goal'))closeSheet()}
function openAddMember(id){const g=Social.group(id);if(!g||!g.isOwner)return;const ids=new Set(g.members.map(m=>m.userId)),fr=Social.friends().filter(f=>!ids.has(f.id));
openSheet(`<div class="sheet-title">Add members</div>${fr.length?fr.map(f=>`<div class="friend-row" onclick="ggAdd('${id}','${f.id}')">${avHTML(f,40,true)}<div style="flex:1;min-width:0"><div class="friend-name">${nameOf(f)}</div><div class="friend-status">@${escapeHtml(f.username)}</div></div><span class="mini-btn go">Add</span></div>`).join(''):`<div class="empty-sub" style="padding:20px;text-align:center">All your friends are already members, or you have no friends yet.</div>`}<button class="btn btn-secondary" style="margin-top:12px" onclick="openGroupDetail('${id}')">Back</button>`)}
function ggAdd(gid,uid){if(act(Social.addMember(gid,uid),'Member added'))openAddMember(gid)}

/* ═══ SHARE GOAL ═══ */
function openShareGoal(goalId){const g=Store.getGoal(goalId);if(!g)return;const s=Social.myShare(goalId);shDraft={goalId,vis:s?s.visibility:'private',users:new Set(s?s.userIds:[]),group:s?s.groupId:null};renderShareSheet()}
function renderShareSheet(){const d=shDraft,g=Store.getGoal(d.goalId);if(!g)return;const fr=Social.friends(),groups=Social.groups().filter(x=>x.isMember&&!x.archived);
const hint={private:'Only you can see this goal.',friends:'All your friends can see this goal’s name, target and progress.',users:'Only the friends you choose can see it.',group:'Members of the chosen group goal can see it.'}[d.vis];
openSheet(`<div class="sheet-title">Share “${escapeHtml(g.name)}”</div><div class="chips" style="margin-bottom:16px">${[['private','🔒 Private'],['friends','👥 Friends'],['users','🙋 Specific people'],['group','🎯 Group goal']].map(([k,l])=>`<button class="chip ${d.vis===k?'selected':''}" onclick="setShareVis('${k}')">${l}</button>`).join('')}</div>
${d.vis==='users'?(fr.length?fr.map(f=>`<div class="friend-row" onclick="toggleShareUser('${f.id}')">${avHTML(f,36)}<div style="flex:1;min-width:0"><div class="friend-name">${nameOf(f)}</div></div><div class="toggle ${d.users.has(f.id)?'on':''}"></div></div>`).join(''):`<div class="progress-note" style="text-align:center">Add friends first to share with specific people.</div>`):''}
${d.vis==='group'?(groups.length?groups.map(x=>`<div class="friend-row" onclick="pickShareGroup('${x.id}')"><div style="flex:1;min-width:0"><div class="friend-name">${escapeHtml(x.name)}</div><div class="friend-status">${x.members.length} members</div></div><div class="toggle ${d.group===x.id?'on':''}"></div></div>`).join(''):`<div class="progress-note" style="text-align:center">You are not in any active group goals yet.</div>`):''}
<p class="progress-note" style="margin:12px 0 16px">${hint} Your income, balance and transactions are never shared.</p><button class="btn btn-primary" onclick="submitShareGoal()">Save</button><button class="btn btn-secondary" style="margin-top:8px" onclick="closeSheet()">Cancel</button>`)}
function setShareVis(v){shDraft.vis=v;keepScroll(renderShareSheet)}
function toggleShareUser(id){shDraft.users.has(id)?shDraft.users.delete(id):shDraft.users.add(id);keepScroll(renderShareSheet)}
function pickShareGroup(id){shDraft.group=id;keepScroll(renderShareSheet)}
function submitShareGoal(){const d=shDraft,g=d&&Store.getGoal(d.goalId);if(!g)return;const r=Social.shareGoal(Store.goalSnapshot(g),{visibility:d.vis,userIds:[...d.users],groupId:d.group});if(act(r,d.vis==='private'?'Goal is now private':'Sharing updated')){SoundManager.success();closeSheet()}}

/* ═══ CUSTOMIZATION ═══ */
const ACCENTS=['#30d158','#0a84ff','#5e5ce6','#bf5af2','#ff375f','#ff453a','#ff9f0a','#ffd60a','#64d2ff','#ffffff'];
const COLOR_KEYS=[['accentColor','Accent'],['primaryColor','Primary'],['bgColor','Background'],['cardColor','Cards'],['btnColor','Buttons'],['textColor','Text']];
function apr(){if(!curA||curAU!==me){curA=Object.assign({},PRESETS.default,Store.preferences.appearance||{});curAU=me}return curA}
let _ap=null;function saveApr(now){clearTimeout(_ap);const f=()=>Store.updatePreferences({appearance:Object.assign({},apr())});if(now)f();else _ap=setTimeout(f,300)}
const hex6=h=>{h=String(h||'#000000');return/^#[0-9a-f]{6}$/i.test(h)?h:'#'+hexRGB(h).map(x=>x.toString(16).padStart(2,'0')).join('')};
function openCustomization(){const a=apr();openSheet(`<div class="sheet-title">Customize</div>
<div class="t-label" style="margin-bottom:10px">Presets</div><div class="chips" style="margin-bottom:20px">${Object.keys(PRESETS).map(k=>`<button class="chip" onclick="applyPreset('${k}')"><span style="width:12px;height:12px;border-radius:50%;background:${PRESETS[k].accentColor};border:1px solid ${PRESETS[k].bgColor};display:inline-block"></span>${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
<div class="t-label" style="margin-bottom:10px">Accent</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">${ACCENTS.map(c=>`<div class="color-swatch ${hex6(a.accentColor).toLowerCase()===c?'selected':''}" style="background:${c}" onclick="setColor('accentColor','${c}',true)"></div>`).join('')}</div>
<div class="t-label" style="margin-bottom:10px">Colors</div>${COLOR_KEYS.map(([k,l])=>`<div class="color-row"><span>${l}</span><input type="color" id="cc-${k}" value="${hex6(a[k])}" oninput="setColor('${k}',this.value)"></div>`).join('')}
<div class="t-label" style="margin:20px 0 10px">Font</div><div class="chips" style="margin-bottom:22px">${Object.keys(FONTS).map(k=>`<button class="chip ${(a.font||'system')===k?'selected':''}" style="font-family:${FONTS[k][1].replace(/"/g,"'")}" onclick="setFont('${k}')">${FONTS[k][0]}</button>`).join('')}</div>
<button class="btn btn-secondary" onclick="resetAppearance()">Reset to Default</button><button class="btn btn-primary" style="margin-top:8px" onclick="closeSheet()">Done</button>`)}
function setColor(k,v,refresh){const a=apr();a[k]=v;applyAppearance(a);saveApr(!!refresh);if(refresh)keepScroll(openCustomization)}
function setFont(k){const a=apr();a.font=k;applyAppearance(a);saveApr(true);keepScroll(openCustomization)}
function applyPreset(k){curA=Object.assign({},PRESETS[k],{font:apr().font||'system'});applyAppearance(curA);saveApr(true);keepScroll(openCustomization);toast('Theme applied')}
function resetAppearance(){curA=Object.assign({},PRESETS.default,{font:'system'});applyAppearance(curA);saveApr(true);keepScroll(openCustomization);toast('Reset to default')}
/* ═══ VACATION SCREENS — shell, Goals-tab section, create/edit form ═══
   The trip screen is a full-screen layer (#vac-screen) above the app with 8 swipeable pages. Every page is drawn from the data the
   server returned (Vac.get) — nothing is invented here. Page renderers live in VacUI.R (filled by the p5c*_vac files). */
const VacUI=(function(){
const E=escapeHtml,I=id=>document.getElementById(id),M=(n,c)=>Trip.money(n,c);
const PAGES=[['overview','🏠','Overview'],['budget','🧾','Budget'],['money','💰','Money'],['transport','🚆','Transport'],['tickets','🎟️','Tickets'],['plan','🗓️','Itinerary'],['feed','🔔','Activity'],['live','📍','Live Trip']];
const R={},X={};   /* R: page renderers · X: shared helpers for the other vacation files */
let cur=null,pg=0,sub=null,dirty=false,drawT=0,pushed=false,fd=null,searchT={},booted=false,pending=null;
const mine=()=>(typeof me!=='undefined'&&me)||null;
const D=()=>cur?Vac.get(cur):null;
const V=()=>{const d=D();return d?d.vacation:cur?Vac.vac(cur):null};
const CURS=['USD','EUR','GBP','CAD','AUD','NZD','JPY','CNY','INR','MXN','BRL','CHF','SEK','NOK','DKK','PLN','CZK','HUF','TRY','ZAR','AED','SGD','HKD','KRW','THB','PHP','IDR','VND','NGN','GHS','KES','EGP','ILS','COP','ARS','CLP','PEN','MAD','RON','ISK'];
const homeCur=()=>{const l=(navigator.language||'en-US').toUpperCase(),m={'EN-GB':'GBP','EN-CA':'CAD','EN-AU':'AUD','EN-NZ':'NZD','EN-IN':'INR','JA-JP':'JPY','DE-DE':'EUR','FR-FR':'EUR','ES-ES':'EUR','IT-IT':'EUR','ES-MX':'MXN','PT-BR':'BRL'};return m[l]||'USD'};
/* ———— small helpers ———— */
const day=(s,o)=>{if(!s)return'';const d=new Date(String(s).slice(0,10)+'T00:00:00');return isNaN(d)?'':d.toLocaleDateString('en-US',o||{weekday:'short',month:'short',day:'numeric'})};
const when=(iso,tz,o)=>{if(!iso)return'';const d=new Date(iso);if(isNaN(d))return'';return Trip.Tz.fmt(d,tz,o||{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})};
function countdown(v){const n=Vac.daysUntil(v);if(n===null)return'';if(v.end_date){const e=Trip.daysFrom(Trip.ymd(new Date()),v.end_date);if(n<=0&&e>=0)return'Happening now';if(e<0)return'Trip ended'}return n>1?'In '+n+' days':n===1?'Tomorrow':n===0?'Today':'Trip ended'}
function av(uid,d,sz){sz=sz||36;const u=Vac.user(uid);if(u)return avHTML(u,sz);const n=Vac.name(uid,d)||'?';return`<div class="av" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px;font-weight:700">${E([...n][0]||'?')}</div>`}
const nm=(uid,d)=>E(Vac.name(uid,d));
const pctText=p=>(p>=10||p===0?Math.round(p):Math.round(p*10)/10)+'%';
async function run(fn,okMsg){try{const r=await fn();if(okMsg)toast(okMsg);return{ok:true,r}}catch(e){if(Vault.isAuth(e)){const ok=await Vault.ensure('Your Vacations sign-in expired. Enter your password to continue.');if(ok){try{const r=await fn();if(okMsg)toast(okMsg);return{ok:true,r}}catch(e2){toast(Vault.explain(e2));haptic('error');return{ok:false,e:e2}}}return{ok:false,e}}toast(Vault.explain(e));haptic('error');return{ok:false,e}}}
const num=id=>{const s=String($v(id)).replace(/[, ]/g,'');return s===''?null:Number(s)};
function errBox(msg,retry){return`<div class="vac-err"><span>⚠️</span><div style="flex:1">${E(msg)}</div>${retry?`<button class="mini-btn" onclick="${retry}">Retry</button>`:''}</div>`}
const skel=n=>Array.from({length:n||3},()=>'<div class="vac-skel"></div>').join('');
const bar=(p,ticks)=>`<div class="vac-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p)}"><div class="vac-fill" style="width:${Math.max(0,Math.min(100,p))}%"></div>${ticks?[25,50,75].map(t=>`<div class="vac-tick ${p>=t?'hit':''}" style="left:${t}%"><span>${t}%</span></div>`).join(''):''}</div>`;
/* ———— Goals-tab section ———— */
const has=()=>{const s=Vac.S;return!!(typeof Cloud!=='undefined'&&Cloud.on()&&(s.list.length||s.status==='locked'||s.status==='nosetup'))};
function coverStyle(v){const s=Vac.coverSrc(v);return s?`style="background-image:url('${s}')"`:''}
function card(v){const left=v.target>0?Math.min(100,v.total/v.target*100):0,cd=countdown(v),role=v.role==='owner'?'':'<span class="goal-shared-badge">Shared</span>';
return`<div class="vac-card-g" onclick="VacUI.open('${v.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')VacUI.open('${v.id}')"><div class="cv" ${coverStyle(v)}><div class="badge">${role}</div><div class="tt">${E(v.name)}</div></div><div class="bd"><div class="st"><span>📍 ${E(v.destination||'Destination not set')}</span><span>${E(Vac.dateRange(v))}</span></div>
<div class="vac-big" style="margin-top:12px"><b style="font-size:21px">${M(v.total,v.currency)}</b><span>${v.target>0?'of '+M(v.target,v.currency):'No target yet'}</span></div><div class="goal-bar" style="margin:10px 0 8px"><div class="goal-fill" style="width:${left}%"></div></div>
<div class="st"><span>${v.members_n} traveler${v.members_n!==1?'s':''} · ${(Vac.MODE[v.transport]||Vac.MODE.other)[0]} ${(Vac.MODE[v.transport]||Vac.MODE.other)[1]}</span><b>${cd||pctText(left)+' funded'}</b></div></div></div>`}
function inviteCard(v){return`<div class="vac-card-g vac-inv" onclick="VacUI.open('${v.id}')"><div class="bd"><div style="font-size:15px;font-weight:700">✉️ ${E(v.name)}</div><div class="st" style="margin-top:6px"><span>${nm(v.owner_uid)} invited you${v.destination?' · '+E(v.destination):''}</span></div><div class="btn-row" style="margin-top:12px"><button class="btn btn-secondary" style="padding:11px" onclick="event.stopPropagation();VacUI.answer('${v.id}',false)">Decline</button><button class="btn btn-green" style="padding:11px" onclick="event.stopPropagation();VacUI.answer('${v.id}',true)">Join trip</button></div></div></div>`}
function section(){if(typeof Cloud==='undefined'||!Cloud.on())return'';try{Vac.touch()}catch(e){}
const s=Vac.S,hd=`<div class="section-h" style="margin-top:8px"><span class="t-label">✈️ Vacations</span><button class="vac-linkbtn" onclick="VacUI.openCreate()">+ New</button></div>`;
const inv=s.list.filter(v=>v.role==='invited'),mineL=s.list.filter(v=>v.role!=='invited');
if(s.status==='locked')return hd+`<div class="vac-card"><div style="font-size:15px;font-weight:700;margin-bottom:6px">🔒 Unlock Vacations</div><div class="vac-note" style="margin:0 0 12px">Confirm your password once on this device so your trips stay private to you and the people you invite.</div><button class="btn btn-primary" style="padding:12px" onclick="VacUI.unlock()">Unlock</button></div>`;
if(s.status==='nosetup'){const own=typeof Accounts!=='undefined'&&typeof db!=='undefined'&&Accounts.isDev(db.users[mine()]);return hd+`<div class="vac-card warn"><div style="font-size:15px;font-weight:700;margin-bottom:6px">🛠 Vacations need a one-time setup</div><div class="vac-note" style="margin:0">${own?'Open Settings → Developer menu → Vacation data keys &amp; setup, copy the SQL and run it once in the Supabase SQL editor.':'The app owner needs to finish a one-time database update. Check back soon.'}</div>${own?`<button class="btn btn-secondary" style="padding:12px;margin-top:12px" onclick="VacUI.setupHelp()">Show setup steps</button>`:''}</div>`}
if(s.status==='loading'&&!s.list.length)return hd+skel(1);
if(s.status==='error'&&!s.list.length)return hd+errBox(s.err||'Could not load your trips.','Vac.refresh().catch(()=>{})');
if(!s.list.length){const other=Store.getGoals().length||Store.getMovingGoals().length||Social.groups().length||Social.sharedWithMe().length;if(!other)return''}
if(!s.list.length)return hd+`<div class="vac-card" style="text-align:center"><div style="font-size:34px;margin-bottom:6px">🏝️</div><div style="font-size:15px;font-weight:700;margin-bottom:4px">Plan a trip together</div><div class="vac-note" style="margin:0 0 12px">Save toward a vacation with friends, track flights and road trips, and keep tickets, budget and itinerary in one place.</div><button class="btn btn-primary" style="padding:12px" onclick="VacUI.openCreate()">Create a vacation goal</button></div>`;
return hd+inv.map(inviteCard).join('')+mineL.map(card).join('')+(s.err&&s.status!=='ready'?errBox(s.err):'')}
async function unlock(){const ok=await Vault.ensure();if(ok){Vac.touch();render()}}
function notReady(){const own=typeof Accounts!=='undefined'&&typeof db!=='undefined'&&Accounts.isDev(db.users[mine()]);if(own){setupHelp();return}openSheet(`<div style="text-align:center;font-size:44px;margin-bottom:10px">🛠</div><div class="sheet-title">Vacations aren’t switched on yet</div><div style="font-size:14px;line-height:1.6;color:var(--gray-400);text-align:center;margin-bottom:16px">The app owner needs to finish a one-time database update first. Nothing you have is affected — check back soon.</div><button class="btn btn-secondary" onclick="closeSheet()">OK</button>`)}
function setupHelp(){openSheet(`<div style="text-align:center;font-size:44px;margin-bottom:10px">🛠</div><div class="sheet-title">Vacations setup</div><div style="font-size:14px;line-height:1.6;color:var(--gray-300)"><ol style="margin:0 0 14px 18px;padding:0"><li>Open your Supabase project → SQL Editor.</li><li>Tap <b>Copy setup SQL</b> below and paste it in.</li><li>Press Run. It is safe to run more than once and does not change your existing data.</li><li>Come back here and pull to refresh.</li></ol></div><button class="btn btn-primary" onclick="VacUI.copySQL()">Copy setup SQL</button><button class="btn btn-secondary" style="margin-top:8px" onclick="closeSheet()">Close</button>`)}

/* ═══ VACATION AI — answers trip questions from the real data on this device and the live lookups, never from guesses ═══
   route(t, raw) is called by AIAgent.answer before its money handlers. It returns null when the message isn't about a trip.
   Every number comes from the trip's stored rows (savings, budget, flights, segments, itinerary) or from Trip.* lookups (weather,
   holidays, exchange rates, places, events). When a lookup fails or a field is empty the reply says exactly that. */
const VacAI=(function(){
const DAY=864e5;let last=null;const FRESH=15*60*1000;
const m$=(n,c)=>Trip.money(n,c||'USD'),plural=(n,w)=>n+' '+w+(n===1?'':'s'),r2=n=>Math.round((Number(n)||0)*100)/100;
const rep=(reply,chips)=>({reply,chips:chips||[]});
const TRIP=/\b(vacations?|trips?|travell?ing|flights?|fly|flying|itinerary|hotels?|destination|leaderboard|layover|cruise|road ?trip|passport|luggage|time zone|timezone|jet ?lag)\b/;
const GEO_STRONG=/\b(weather|temperature|umbrella|exchange rate|currency|time difference|jet ?lag|time zone|timezone)\b/;
const GEO=/\b(holidays?|events?|concerts?|restaurants?|places? to eat|where (to|should we|can we) eat|things to do|attractions?|museums?|gas stations?)\b/;
const NOISE=new Set('trip vacation vacations week weekend goal fund savings save the and for with going holiday getaway travel'.split(' '));
const lbl=(v)=>v.name||v.destination||'your trip';
function tokens(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').split(' ').filter(w=>w.length>=4&&!NOISE.has(w))}
function findNamed(t,list){let best=null,bs=0;list.forEach(v=>{const toks=tokens(v.name).concat(tokens(String(v.destination||'').split(',')[0]));const hit=toks.filter((w,i,a)=>a.indexOf(w)===i&&t.indexOf(' '+w)>=0).length;const full=v.name&&t.indexOf(' '+String(v.name).toLowerCase()+' ')>=0?5:0;const sc=hit+full;if(sc>bs){bs=sc;best=v}});return best}
function sortKey(v){const a=v.start_date?new Date(v.start_date+'T00:00:00').getTime():null,e=v.end_date?new Date(v.end_date+'T23:59:59').getTime():a,n=Date.now();if(a===null){return 5e15}if(e>=n){return Math.max(0,a-n)}return 1e15+(n-e)}
function pick(t,list){const named=findNamed(t,list);if(named){return{v:named,assumed:false}}const cur=last&&Date.now()-last.at<FRESH&&list.find(v=>v.id===last.id);if(cur){return{v:cur,assumed:false}}
const l=list.filter(v=>v.status!=='done').sort((a,b)=>sortKey(a)-sortKey(b));return{v:l[0]||list.slice().sort((a,b)=>sortKey(a)-sortKey(b))[0],assumed:list.length>1}}
const when=(iso,tz)=>iso?Trip.Tz.fmt(new Date(iso),tz,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+(tz?' '+Trip.Tz.abbr(tz,new Date(iso)):''):'';
const day=s=>new Date(String(s).slice(0,10)+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const wordsOf=n=>n===1?'1 day':n+' days';
function dayOf(t,v){const T=Trip.ymd(new Date());let m;if(/\btoday\b/.test(t)){return{d:T,l:'today'}}if(/\btomorrow\b/.test(t)){return{d:Trip.addDays(T,1),l:'tomorrow'}}
if((m=t.match(/\bday (\d{1,2})\b/))&&v.start_date){return{d:Trip.addDays(String(v.start_date).slice(0,10),+m[1]-1),l:'day '+m[1]}}
const MO=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];if((m=t.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]* (\d{1,2})\b/))){const mo=MO.indexOf(m[1]),yr=v.start_date?+String(v.start_date).slice(0,4):new Date().getFullYear();let y=yr;if(v.end_date&&+String(v.end_date).slice(0,4)>yr&&mo<5){y=+String(v.end_date).slice(0,4)}return{d:y+'-'+String(mo+1).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0'),l:m[1]+' '+m[2]}}return null}
const chipSet=(id,...q)=>q.map(x=>({label:x,q:x})).concat(id?[{label:'Open the trip',vac:id}]:[]);
/* ———— topics ———— */
function money(d,v){const st=Vac.stats(d),c=v.currency;if(st.target<=0){return rep(`**${lbl(v)}** has ${m$(st.total,c)} saved, but no savings target is set yet. The trip owner can set one in Edit trip.`,chipSet(v.id))}
const each=st.members>0?r2(st.remaining/st.members):null;
return rep(`**${lbl(v)}**: ${m$(st.total,c)} saved of ${m$(st.target,c)} (${Math.round(st.pct)}%).\n`+(st.remaining>0?`${m$(st.remaining,c)} to go${each!==null&&st.members>1?` — about ${m$(each,c)} each across ${plural(st.members,'person').replace('persons','people')}`:''}.`:`You've hit the target${st.over>0?`, ${m$(st.over,c)} over it`:''}! 🎉`)+(st.mine>0?`\nYou've added ${m$(st.mine,c)} yourself.`:'\nYou haven\'t added anything yet.'),chipSet(v.id,'Who contributed the most?','When will we reach the goal?'))}
function board(d,v){const st=Vac.stats(d),c=v.currency;if(!st.board.length){return rep(`Nobody has contributed to **${lbl(v)}** yet, so there's no leaderboard.`,chipSet(v.id))}
const lines=st.board.slice(0,6).map((b,i)=>`${i===0?'👑':(i+1)+'.'} ${Vac.name(b.uid,d)} — ${m$(b.total,c)} (${Math.round(b.pct)}%)`);
return rep(`Leaderboard for **${lbl(v)}**:\n${lines.join('\n')}`+(st.top?`\n${Vac.name(st.top.uid,d)} is in the lead.`:st.board.length>1?'\nIt\'s a tie at the top.':''),chipSet(v.id,'How much is left to save?'))}
function members(d,v){const act=(d.members||[]).filter(m=>m.status==='active'),inv=(d.members||[]).filter(m=>m.status==='invited'),none=act.filter(m=>!(+m.total>0));
return rep(`**${lbl(v)}** has ${plural(act.length,'active member')}: ${act.map(m=>Vac.name(m.uid,d)).join(', ')||'—'}.`+(inv.length?`\nStill invited (haven't joined): ${inv.map(m=>Vac.name(m.uid,d)).join(', ')}.`:'')+(none.length&&act.length>1?`\nNot contributed yet: ${none.map(m=>Vac.name(m.uid,d)).join(', ')}.`:''),chipSet(v.id))}

async function route(t,raw){if(typeof Vac==='undefined'||typeof VacUI==='undefined'||typeof Accounts==='undefined'||!Accounts.current()){return null}

const spend=/\b(spent|spend|spending|paid|bought|cost me|did i spend)\b/.test(t)&&/\b(last|this|past|in|on)\b/.test(t)&&!/\b(trip|vacation)\b/.test(t);
if(!named&&!trip&&!geoS&&!(geo&&trip)){if(last&&Date.now()-last.at<FRESH&&list.length&&/^\s*(and|what about|how about|also|then)\b/.test(t)){/* follow-up about the same trip */}else{return null}}
if(spend&&!named){return null}
if(!list.length){if(/\b(vacation|trip)\b/.test(t)){return rep('You don\'t have a vacation goal yet. Open the Goals tab and tap ✈️ Vacation to plan one — you can invite friends, pool money, and I\'ll answer questions about it.')}return null}
if(named&&!trip&&!geoS&&!geo&&typeof Store!=='undefined'){const goals=(Store.goals||[]);const gm=goals.some(g=>g&&g.name&&tokens(g.name).some(w=>t.indexOf(' '+w)>=0)&&tokens(g.name).some(w=>tokens(named.name).indexOf(w)>=0));if(gm){return null}}
const pk=pick(t,list),v=pk.v;if(!v){return null}last={id:v.id,at:Date.now()};
let d=Vac.get(v.id);if(!d||!d.members){try{await Vac.load(v.id,{quiet:true});d=Vac.get(v.id)}catch(e){return rep('I couldn\'t open that trip right now: '+Vault.explain(e)+'.')}}if(!d){return rep('I couldn\'t open that trip right now.')}
let topic=TOPICS.find(x=>x[1].test(t));
if(topic&&topic[0]==='add'){const m=t.match(/\$?\s?(\d[\d,]*(?:\.\d+)?)/),amt=m?parseFloat(m[1].replace(/,/g,'')):null;if(!(amt>0)&&!/\b(trip|vacation)\b|\bto\b/.test(t)){topic=TOPICS.find(x=>x[0]!=='add'&&x[1].test(t))}else{const r=addMoney(d,v,t,amt);if(pk.assumed){r.reply+=`\n(I used **${lbl(v)}** — say "for <trip name>" to pick another.)`}return r}}
let r;try{r=topic&&topic[2]?await topic[2](d,v,t):summary(d,v)}catch(e){console.error(e);return rep('I hit a snag reading that trip: '+(e&&e.message||e))}
if(pk.assumed&&r&&r.reply){r.reply+=`\n(That's for **${lbl(v)}** — you have more than one trip. Say "for <trip name>" to ask about another.)`}return r}
return{route,exec,reset(){last=null}}})();

function send(){const e=$v('an-exp'),r=Admin.broadcast({target:$v('an-target'),userId:$v('an-user'),title:$v('an-title'),message:$v('an-msg'),expiresAt:e?new Date(e).toISOString():null}),er=document.getElementById('an-err');if(!r.ok){if(er)er.textContent=r.error;haptic('error');return}haptic('success');toast(`Sent to ${r.count} user${r.count!==1?'s':''}`);back()}
function audit(){view='audit';draw()}
function drawAudit(){const r=Admin.audit();openSheet(`${MK}<div class="sheet-title">Audit Log</div>${r.ok&&r.log.length?r.log.map(a=>kv(escapeHtml(a.adminName)+' · '+escapeHtml(a.action),escapeHtml(a.target||'')+' · '+timeAgo(new Date(a.at).getTime()))).join(''):none(r.ok?'No admin actions yet':escapeHtml(r.error))}<button class="btn btn-secondary" style="margin-top:16px" onclick="DevMenu.back()">‹ Back</button>`)}
return{open,onClose,isOpen:()=>isOpenF,handleTap,refresh,setQ,setFlt,setSort,show,tab,back,announce,annTarget,send,audit}})();

/* ═══ SERVICE WORKER + INIT ═══ */
async function registerServiceWorker(){if(!('serviceWorker' in navigator)||!window.isSecureContext)return null;try{const code=`const C='logostics-v10';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./'])).catch(()=>{}));self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))));self.clients.claim()});self.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET')return;e.respondWith(caches.match(r).then(c=>c||fetch(r).then(s=>{if(s&&s.status===200&&s.type==='basic'){const y=s.clone();caches.open(C).then(c=>c.put(r,y)).catch(()=>{})}return s}).catch(()=>c)))});`;return await navigator.serviceWorker.register(URL.createObjectURL(new Blob([code],{type:'application/javascript'})))}catch(e){return null}}
function presenceTick(){if(!me)return;const s=dbSig();if(s!==lastSig){lastSig=s;scheduleRender();refreshLive()}if(DevMenu.isOpen())DevMenu.refresh()}
let _errT=0;
function showFatal(m){m=String(m||'Unexpected error');const e=document.getElementById('auth-err');if(e&&!me)e.textContent='Error: '+m;if(Date.now()-_errT>3000){_errT=Date.now();toast('⚠ '+m.slice(0,90))}}
window.addEventListener('error',ev=>showFatal(ev.message));window.addEventListener('unhandledrejection',ev=>showFatal(ev.reason&&ev.reason.message||ev.reason));
async function init(){
try{const t=JSON.parse(localStorage.getItem('lg_theme')||'null');if(t)applyAppearance(t)}catch(e){}
try{await Promise.race([Store.init(),new Promise(r=>setTimeout(r,4000))])}catch(e){console.error('Store init failed',e)}
try{registerServiceWorker();LifecycleManager.init();AppLockManager.init();GestureManager.init();IP.init()}catch(e){console.error(e)}
try{await Promise.race([Cloud.boot(),new Promise(r=>setTimeout(r,9000))])}catch(e){console.error('Cloud boot failed',e)}
try{Accounts.restore();if(me){Store.loadUser();applyAppearance();seedSeen()}}catch(e){console.error(e);me=null}
Backend.subscribe(()=>{if(Cloud.on())return;reloadDB();migrateDB(db);Bus.emit('db',{local:false})});Bus.on('db',onDb);Bus.on('cloud',updateCloudStat);Store.subscribe(scheduleRender);
try{const t=sessionStorage.getItem('logostics_tab');if(t&&['home','friends','goals','activity','notifications','profile','analytics'].includes(t))currentTab=t}catch(e){}
document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.tab===currentTab));
if(me&&Store.preferences.appLockEnabled&&AuthManager.hasCredential())AppLockManager.lock('startup');
render();try{IP.pump()}catch(e){}try{VacUI.boot();if(me)Vac.touch()}catch(e){console.error(e)}if(me){beat();if(PatchNotes.hasUnseenVersion()&&Store.preferences.lastSeenVersion)setTimeout(openPatchNotes,800);else if(!Store.preferences.lastSeenVersion)PatchNotes.markSeen()}
setInterval(beat,30000);setInterval(presenceTick,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me){beat();scheduleRender()}});
window.addEventListener('pagehide',()=>{Cloud.bye();if(me&&db.users[me]&&!Cloud.on()){try{commit(d=>{if(d.users[me])d.users[me].online=false},{kind:'presence'})}catch(e){}}});
setTimeout(()=>NotificationScheduler.checkAndFire().catch(()=>{}),2000);setInterval(()=>NotificationScheduler.checkAndFire().catch(()=>{}),9e5);
window.addEventListener('online',()=>toast('Back online'));window.addEventListener('offline',()=>toast('Offline — data still saves locally'))}
if(document.readyState!=='loading')init();else document.addEventListener('DOMContentLoaded',init);

</script>
