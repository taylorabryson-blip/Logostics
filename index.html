      const snap = Store.getSnapshot();
      const blob = new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `logostics-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Exported');
    }

      const snap = Store.getSnapshot();
      const income = Store.computeTotalIncome(30);

      const rate = Store.computeSavingsRate();
      const text = `Logostics Finance Summary\n` +
                   `Available: ${fmt(snap.balance)}\n` +

                   `Spending (30d): ${fmt(spending)}\n` +

      if (!confirm('Reset all data? This cannot be undone.')) return;
      try { localStorage.removeItem('logostics_finance_prefs_v1'); } catch (e) {}
      try { indexedDB.deleteDatabase('LogosticsFinanceDB'); } catch (e) {}
      location.reload();

    /* ═══════════════════════════════════════════════════════════
       SERVICE WORKER REGISTRATION
       Real offline-first via Cache API + Service Worker
       ═══════════════════════════════════════════════════════════ */
    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return null;
      if (!window.isSecureContext) return null;
      try {
        // Inline service worker via Blob — kept self-contained, no external file required.
        // For production deployment, serve /sw.js from your origin instead.
        const swCode = `
          const CACHE = 'logostics-v2';
          const SHELL = ['./'];

          self.addEventListener('install', (e) => {
            e.waitUntil(caches.open(CACHE).then(c => c.addAll(SHELL)).catch(() => {}));
            self.skipWaiting();
          });

          self.addEventListener('activate', (e) => {
            e.waitUntil(
              caches.keys().then(keys =>
                Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
              )
            );
            self.clients.claim();
          });

          self.addEventListener('fetch', (e) => {
            const req = e.request;
            if (req.method !== 'GET') return;
            // Navigation: network-first, fall back to cached shell (offline support)
            if (req.mode === 'navigate') {
              e.respondWith(
                fetch(req).then(res => {
                  const copy = res.clone();
                  caches.open(CACHE).then(c => c.put(req, copy)).catch(() => {});
                  return res;
                }).catch(() => caches.match(req).then(r => r || caches.match('./')))
              );
              return;
            }
            // Other GET: cache-first
            e.respondWith(
              caches.match(req).then(cached => {
                if (cached) return cached;
                return fetch(req).then(res => {
                  if (res && res.status === 200 && res.type === 'basic') {
                    const copy = res.clone();
                    caches.open(CACHE).then(c => c.put(req, copy)).catch(() => {});
                  }
                  return res;
                }).catch(() => cached);
              })
            );
          });

          self.addEventListener('notificationclick', (e) => {
            e.notification.close();
            e.waitUntil(
              self.clients.matchAll({ type: 'window', includeUncontrolled: true }).then(list => {
                for (const c of list) { if ('focus' in c) return c.focus(); }
                if (self.clients.openWindow) return self.clients.openWindow('./');
              })
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        const reg = await navigator.serviceWorker.register(swUrl);
        return reg;
      } catch (e) {
        console.warn('SW registration failed:', e);
        return null;
      }
    }

    /* ═══════════════════════════════════════════════════════════
       INIT
       ═══════════════════════════════════════════════════════════ */
    async function init() {
      await Store.init();
      await registerServiceWorker();

      Store.subscribe(() => { if (authenticated) render(); });

      // Restore last tab from session (soft deep-link)
      try {
        const savedTab = sessionStorage.getItem('logostics_tab');
        if (savedTab && ['home', 'activity', 'goals', 'analytics'].includes(savedTab)) {
          currentTab = savedTab;
          document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.tab === savedTab);
          });
        }
      } catch (e) {}

      if (Store.preferences.appLockEnabled && AuthManager.hasCredential()) {
        await showAuthGate();
      } else {
        authenticated = true;
        render();
      }

      // Expose handlers
      Object.assign(window, {
        switchTab, openAddIncome, openAddExpense, openAddGoal, openGoalDetail,
        openTxDetail, openTransfer, openSettings, openSiri,
        submitIncome, submitExpense, submitGoal, submitTransfer,
        submitEditTx, openEditTx, confirmDeleteTx, confirmDeleteGoal,
        addToGoal, shareGoal, shareTx, pickChip, pickSeg, closeSheet, saveSettings,
        exportData, shareSummary, resetAllData, togglePrivacy, enableNotifications,
        doAuthenticate, skipLock, disableLockAndContinue, toggleAppLock,
        sendTestNotification, onActivitySearch, setActivityCat
      });
    }

    if (document.readyState !== 'loading') init();
    else document.addEventListener('DOMContentLoaded', init);

    // ── Online/offline — honest connectivity indicator ──
    window.addEventListener('online', () => toast('Back online'));
    window.addEventListener('offline', () => toast('Offline — data still saves locally'));

    // ── Deep-link support: /#/analytics, /#/goals, /#/paycheck, /#/add ──
    function handleHashRoute() {
      const hash = (location.hash || '').replace(/^#\/?/, '').toLowerCase();
      if (!hash) return;
      const routeMap = {
        'home': 'home',
        'activity': 'activity',
        'goals': 'goals',
        'savings': 'goals',
        'analytics': 'analytics',
        'paycheck': 'analytics',
        'finance': 'analytics'
      };
      if (routeMap[hash]) {
        switchTab(routeMap[hash]);
      } else if (hash === 'add' || hash === 'add-expense') {
        openAddExpense();
      } else if (hash === 'add-income') {
        openAddIncome();
      }
    }
    window.addEventListener('hashchange', handleHashRoute);
    // Apply on first load once authenticated
    const origRender = render;
    render = function() {
      origRender();
      handleHashRoute();
    };
  </script>
