                <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;">
                  <div style="width:100%;height:${Math.max(4, (d.value / maxV) * 84)}px;background:${d.value > 0 ? 'var(--green)' : 'var(--gray-800)'};border-radius:6px 6px 0 0;transition:height 0.5s var(--ease-out);"></div>

      `);
    }

    async function toggleAppLock() {
      const enabled = Store.preferences.appLockEnabled;
      if (!enabled) {
        const cap = await PlatformCapabilities.checkWebAuthn();
        if (!cap.available) { toast('Cannot enable lock: ' + cap.reason); return; }
        const reg = await AuthManager.register();
        if (!reg.success) { toast('Registration failed: ' + reg.reason); return; }
        const cred = AuthManager.getCredential();
        await Store.updatePreferences({ appLockEnabled: true, webAuthnCredential: cred });
        toast('App lock enabled');
      } else {
        await Store.updatePreferences({ appLockEnabled: false, webAuthnCredential: null });
        clearUnlockedPages();
        toast('App lock disabled');
      }
      openSettings();
    }

    async function toggleProtected(page) {
      const prefs = Store.preferences.protectedPages || {};
      const newVal = !prefs[page];
      await Store.updatePreferences({
        protectedPages: { ...prefs, [page]: newVal }
      });
      openSettings();
    }

    async function setAuthTimeout(t) {
      await Store.updatePreferences({ authTimeout: t });
      clearUnlockedPages();
      openSettings();
    }

    async function togglePreference(key) {
      const cur = Store.preferences[key];
      await Store.updatePreferences({ [key]: !cur });
      haptic('light');
      openSettings();
    }

    async function saveSettings() {
      const h = parseFloat(document.getElementById('s-hourly').value) || 0;
      const hs = parseFloat(document.getElementById('s-hours').value) || 0;
      const w = parseFloat(document.getElementById('s-withhold').value) || 20;
      await Store.updateIncomeSettings({ hourlyRate: h, hoursPerWeek: hs, withholdingPct: w });
      closeSheet(); haptic('success'); toast('Settings saved'); render();
    }

    function openSiri() {
      openSheet(`
        <div style="text-align:center;padding:12px 0 8px;">
          <div class="t-title" style="margin-bottom:8px;">App Intents & Siri</div>
          <div class="t-caption" style="max-width:300px;margin:0 auto 24px;line-height:1.5;">
            The financial engine is structured to be driven by Apple's App Intents framework in a native build.
          </div>
        </div>
        <div class="insight" style="border-color:var(--green);background:var(--green-glow);margin-bottom:16px;">
          <span class="ico">✓</span>
          <span class="txt"><strong>In a native iOS build</strong>, these actions will be exposed via App Intents and work with Siri, Shortcuts, and Spotlight:</span>
        </div>
        <div class="insight"><span class="ico">◉</span><span class="txt">"How much cash do I have?"</span></div>
        <div class="insight"><span class="ico">◉</span><span class="txt">"Show my savings goal progress"</span></div>
        <div class="insight"><span class="ico">◉</span><span class="txt">"Add a $12 expense"</span></div>
        <div class="insight" style="margin-bottom:20px;"><span class="ico">◉</span><span class="txt">"What's my projected balance?"</span></div>
        <div class="insight" style="border-color:var(--gray-700);">
          <span class="ico">◔</span>
          <span class="txt"><strong>On the web</strong>, Siri and App Intents are not available. Use the in-app AI assistant instead.</span>
        </div>
        <button class="btn btn-primary" style="margin-top:20px;" onclick="closeSheet();openAI();">Open AI Assistant</button>
        <button class="btn btn-secondary" style="margin-top:8px;" onclick="closeSheet()">Close</button>
      `);
    }

    function pickChip(el) {
      el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      haptic('light');
    }
    function pickSeg(el) {
      el.parentElement.querySelectorAll('.seg').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      haptic('light');
    }

    async function enableNotifications() {
      const result = await NotificationManager.requestPermission();
      if (result.granted) {
        await Store.updatePreferences({ notificationsEnabled: true });
        toast('Notifications enabled');
        const sent = await NotificationManager.send('Logostics', 'Notifications are now enabled.');
        if (!sent.sent) toast('Granted but failed: ' + sent.reason);
      } else {
        toast(result.reason || 'Not enabled');
      }
      render();
    }
    async function sendTestNotification() {
      const sent = await NotificationManager.send('Logostics', 'Test notification — this is a real browser notification.');
      toast(sent.sent ? 'Notification sent' : 'Not sent: ' + sent.reason);
    }

    function exportData() {
      const snap = Store.getSnapshot();
      const blob = new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `logostics-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Exported');
    }

    async function resetAllData() {
      if (!confirm('Reset all data? This cannot be undone.')) return;
      try { localStorage.removeItem('logostics_finance_prefs_v2'); } catch (e) {}
      try { indexedDB.deleteDatabase('LogosticsFinanceDB'); } catch (e) {}
      location.reload();
    }

    /* ═══════════════════════════════════════════════════════════
       SERVICE WORKER
       ═══════════════════════════════════════════════════════════ */
    async function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return null;
      if (!window.isSecureContext) return null;
      try {
        const swCode = `
          const CACHE = 'logostics-v3';
          const SHELL = ['./'];
          self.addEventListener('install', (e) => {
            e.waitUntil(caches.open(CACHE).then(c => c.addAll(SHELL)).catch(() => {}));
            self.skipWaiting();
          });
          self.addEventListener('activate', (e) => {
            e.waitUntil(caches.keys().then(keys =>
              Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
            ));
            self.clients.claim();
          });
          self.addEventListener('fetch', (e) => {
            const req = e.request;
            if (req.method !== 'GET') return;
            if (req.mode === 'navigate') {
              e.respondWith(
                fetch(req).then(res => {
                  const copy = res.clone();
                  caches.open(CACHE).then(c => c.put(req, copy)).catch(() => {});
                  return res;
                }).catch(() => caches.match(req).then(r => r || caches.match('./')))
              );
              return;
            }
            e.respondWith(
              caches.match(req).then(cached => {
                if (cached) return cached;
                return fetch(req).then(res => {
                  if (res && res.status === 200 && res.type === 'basic') {
                    const copy = res.clone();
                    caches.open(CACHE).then(c => c.put(req, copy)).catch(() => {});
                  }
                  return res;
                }).catch(() => cached);
              })
            );
          });
          self.addEventListener('notificationclick', (e) => {
            e.notification.close();
            e.waitUntil(
              self.clients.matchAll({ type: 'window', includeUncontrolled: true }).then(list => {
                for (const c of list) { if ('focus' in c) return c.focus(); }
                if (self.clients.openWindow) return self.clients.openWindow('./');
              })
            );
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        return await navigator.serviceWorker.register(swUrl);
      } catch (e) {
        console.warn('SW registration failed:', e);
        return null;
      }
    }

    /* ═══════════════════════════════════════════════════════════
       INIT
       ═══════════════════════════════════════════════════════════ */
    async function init() {
      await Store.init();
      await registerServiceWorker();
      Store.subscribe(() => { if (authenticated) render(); });

      try {
        const savedTab = sessionStorage.getItem('logostics_tab');
        if (savedTab && ['home', 'activity', 'goals', 'analytics'].includes(savedTab)) {
          currentTab = savedTab;
          document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.toggle('active', el.dataset.tab === savedTab);
          });
        }
      } catch (e) {}

      if (Store.preferences.appLockEnabled && AuthManager.hasCredential()) {
        await showAuthGate('Logostics is Locked', 'Authenticating…');
      } else {
        authenticated = true;
        render();
      }

      Object.assign(window, {
        switchTab, openAddIncome, openAddExpense, openAddGoal, openGoalDetail,
        openTxDetail, openTransfer, openSettings, openSiri, openAI,
        submitIncome, submitExpense, submitGoal, submitTransfer,
        submitEditTx, openEditTx, confirmDeleteTx, confirmDeleteGoal,
        addToGoal, pickChip, pickSeg, closeSheet, saveSettings,
        exportData, resetAllData, togglePrivacy, enableNotifications,
        doAuthenticate, skipLock, disableLockAndContinue, toggleAppLock,
        sendTestNotification, onActivitySearch, setActivityCat,
        askAIAbout, submitAI, executeAIConfirm, dismissAIConfirm, clearAIChat,
        longPressTx, toggleProtected, setAuthTimeout, togglePreference
      });
    }

    if (document.readyState !== 'loading') init();
    else document.addEventListener('DOMContentLoaded', init);

    window.addEventListener('online', () => toast('Back online'));
    window.addEventListener('offline', () => toast('Offline — data still saves locally'));
  </script>
</body>
