    /* ═══════════════════════════════════════════════════════════
       LOGOSTICS FINANCE — EXISTING STYLES (UNCHANGED)
       Palette: black, white, gray, green ONLY
       ═══════════════════════════════════════════════════════════ */
    *, *::before, *::after {

      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;

    :root {

      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);

    html { background: var(--black); overscroll-behavior: none; -webkit-text-size-adjust: 100%; height: 100%; }

      padding-top: var(--safe-top);
      padding-left: var(--safe-left); padding-right: var(--safe-right);
      overflow-x: hidden; width: 100%; max-width: 100vw;
      user-select: none; letter-spacing: -0.01em; position: relative;
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 8px);

      overscroll-behavior-y: none; touch-action: manipulation;

<body>

  <!-- APP LOCK (unchanged) -->
  <div class="app-lock" id="app-lock">
    <div class="app-lock-icon" id="lock-icon">🔒</div>
    <div class="app-lock-title" id="lock-title">Logostics is Locked</div>
    <div class="app-lock-sub" id="lock-sub">Authenticate to view your financial data</div>
    <div class="app-lock-actions" id="lock-actions"></div>
  </div>

  <div class="toast" id="toast"><span class="dot"></span><span id="toast-text"></span></div>
  <div class="swipe-back-indicator" id="swipe-back-indicator"></div>
  <div id="app"></div>

  <button class="privacy-btn" id="privacy-btn" onclick="togglePrivacy()" title="Toggle privacy mode">👁</button>
  <button class="ai-fab" id="ai-fab" onclick="openAI()" title="Ask Logostics AI">◈</button>

  <nav class="bottom-nav glass-deep" id="bottom-nav">
    <button class="nav-item active" data-tab="home" onclick="switchTab('home')"><span class="nav-ico">🏠</span><span class="nav-lbl">Home</span></button>
    <button class="nav-item" data-tab="activity" onclick="switchTab('activity')"><span class="nav-ico">📋</span><span class="nav-lbl">Activity</span></button>
    <button class="nav-item" data-tab="goals" onclick="switchTab('goals')"><span class="nav-ico">🎯</span><span class="nav-lbl">Goals</span></button>
    <button class="nav-item" data-tab="analytics" onclick="switchTab('analytics')"><span class="nav-ico">📊</span><span class="nav-lbl">Analytics</span></button>
  </nav>

  <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet(event)">
    <div class="sheet" id="sheet" onclick="event.stopPropagation()">
      <div class="sheet-grip"></div>
      <div id="sheet-content"></div>
    </div>
  </div>

  <!-- Leaflet (loaded only for moving goals; no-op if it fails) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    'use strict';

    /* ═══════════════════════════════════════════════════════════
       LOGOSTICS FINANCE — MOVING GOAL INTEGRATION
       All existing modules below are preserved verbatim from the
       source file. Moving Goal additions are marked with [MG].
       ═══════════════════════════════════════════════════════════ */

    // ═══════════════════════════════════════════════════════════
    //  1. PLATFORM CAPABILITY ENGINE (unchanged)
    // ═══════════════════════════════════════════════════════════
    const PlatformCapabilities = (function() {
      function detectEnvironment() {
        const ua = navigator.userAgent || '';
        const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                             window.navigator.standalone === true;
        const isNativeWrapper = !!(window.webkit && window.webkit.messageHandlers &&
                                   window.webkit.messageHandlers.logostics);
        let type = 'web';
        if (isNativeWrapper) type = 'native-ios';
        else if (isIOS && isStandalone) type = 'pwa-ios';
        else if (isIOS) type = 'ios-safari';
        else if (isStandalone) type = 'pwa';
        return { type, isIOS, isStandalone, isNativeWrapper };
      }
      const env = detectEnvironment();

      async function checkWebAuthn() {
        if (!window.PublicKeyCredential) return { available: false, reason: 'WebAuthn not supported in this browser' };
        if (!window.isSecureContext) return { available: false, reason: 'WebAuthn requires HTTPS (secure context)' };
        try {
          const avail = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          return { available: avail, reason: avail ? 'Platform authenticator available' : 'No platform authenticator enrolled' };
        } catch (e) { return { available: false, reason: 'WebAuthn check failed: ' + e.message }; }
      }

      function checkNotifications() {
        if (!('Notification' in window)) return { supported: false, permission: 'unsupported', reason: 'Notification API not available' };
        const perm = Notification.permission;
        const iosSafariNeedsPWA = env.isIOS && !env.isStandalone;
        if (iosSafariNeedsPWA && perm === 'default') {
          return { supported: false, permission: perm, reason: 'On iOS, web notifications require installing to Home Screen (iOS 16.4+)', requiresInstall: true };
        }
        return { supported: true, permission: perm, reason: perm === 'granted' ? 'Notifications allowed' : perm === 'denied' ? 'Blocked in browser settings' : 'Not yet decided' };
      }

      function checkHaptics() {
        const supported = typeof navigator.vibrate === 'function';
        return { supported, reason: supported ? 'Vibration API available' : (env.isIOS ? 'iOS Safari does not expose vibration to web apps' : 'Not available') };
      }
      function checkShare() { return { supported: typeof navigator.share === 'function', canShareFiles: typeof navigator.canShare === 'function' }; }
      function checkStorage() {
        return {
          indexedDB: !!window.indexedDB,
          localStorage: (() => { try { localStorage.setItem('__t__', '1'); localStorage.removeItem('__t__'); return true; } catch (e) { return false; } })(),
          cacheAPI: 'caches' in window
        };
      }
      function checkPageLifecycle() {
        return {
          visibilityAPI: typeof document.visibilityState !== 'undefined',
          pageHide: 'onpagehide' in window,
          freezeResume: 'onfreeze' in document,
          iosLimitation: env.isIOS,
          reason: env.isIOS
            ? 'iOS Safari does not expose native scene lifecycle to web. Using visibilitychange + pagehide as best-effort. Native build uses scenePhase.'
            : 'Page Lifecycle API available for background detection'
        };
      }
      return { env, checkWebAuthn, checkNotifications, checkHaptics, checkShare, checkStorage, checkPageLifecycle };
    })();

    // ═══════════════════════════════════════════════════════════
    //  2. NATIVE BRIDGE (unchanged)
    // ═══════════════════════════════════════════════════════════
    const NativeBridge = (function() {
      const available = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.logostics);
      function postMessage(method, payload) {
        if (!available) return Promise.resolve({ supported: false, reason: 'Not running in native wrapper' });
        return new Promise((resolve) => {
          const id = 'req_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
          window._logosticsCallbacks = window._logosticsCallbacks || {};
          window._logosticsCallbacks[id] = resolve;
          try { window.webkit.messageHandlers.logostics.postMessage({ id, method, payload: payload || {} }); }
          catch (e) { resolve({ supported: false, reason: 'Bridge error: ' + e.message }); }
          setTimeout(() => { if (window._logosticsCallbacks[id]) { delete window._logosticsCallbacks[id]; resolve({ supported: false, reason: 'Native bridge timed out' }); } }, 60000);
        });
      }
      window.LogosticsNative = {
        handleResponse(id, result) { if (window._logosticsCallbacks && window._logosticsCallbacks[id]) { window._logosticsCallbacks[id](result); delete window._logosticsCallbacks[id]; } },
        onScenePhase(phase) { LifecycleManager.onNativeScenePhase(phase); },
        onBiometricResult(success, reason) { AppLockManager.onNativeResult(success, reason); }
      };
      return {
        available, postMessage,
        authenticate: (reason) => postMessage('authenticate', { reason }),
        getScenePhase: () => postMessage('getScenePhase'),
        scheduleNotification: (title, body, delay) => postMessage('scheduleNotification', { title, body, delay }),
        updateWidgetData: (data) => postMessage('updateWidgetData', data),
        setHaptic: (style) => postMessage('haptic', { style })
      };
    })();

    // ═══════════════════════════════════════════════════════════
    //  3. LIFECYCLE MANAGER (unchanged)
    // ═══════════════════════════════════════════════════════════
    const LifecycleManager = (function() {
      let appState = 'active';
      let lastActive = Date.now();
      let lastBackground = null;
      let listeners = [];
      let webVisibilityHandler = null;
      function notify(event, data) { listeners.forEach(fn => { try { fn(event, data); } catch (e) {} }); }
      function setState(newState, source) {
        if (appState === newState) return;
        const prev = appState;
        appState = newState;
        if (newState === 'active') lastActive = Date.now();
        else if (newState === 'background' || newState === 'inactive') lastBackground = Date.now();
        notify('stateChanged', { from: prev, to: newState, source });
        if (DebugPanel.isEnabled()) DebugPanel.log(`Lifecycle: ${prev} → ${newState} (${source})`);
      }
      function subscribe(fn) { listeners.push(fn); return () => { listeners = listeners.filter(f => f !== fn); }; }
      function onNativeScenePhase(phase) { setState(phase, 'native'); }
      function installWebFallback() {
        if (webVisibilityHandler) return;
        webVisibilityHandler = () => { if (document.visibilityState === 'hidden') setState('background', 'web-visibility'); else setState('active', 'web-visibility'); };
        document.addEventListener('visibilitychange', webVisibilityHandler);
        window.addEventListener('pagehide', () => setState('background', 'web-pagehide'));
        window.addEventListener('pageshow', () => setState('active', 'web-pageshow'));
        window.addEventListener('blur', () => setState('inactive', 'web-blur'));
        window.addEventListener('focus', () => setState('active', 'web-focus'));
      }
      function init() {
        if (NativeBridge.available) { DebugPanel.log('Lifecycle: native mode (scenePhase)'); NativeBridge.getScenePhase().then(r => { if (r && r.phase) setState(r.phase, 'native-init'); }); }
        else { DebugPanel.log('Lifecycle: web mode (visibilitychange + pagehide)'); installWebFallback(); }
      }
      return { init, subscribe, onNativeScenePhase, getState: () => appState, getLastActive: () => lastActive, getLastBackground: () => lastBackground, isNative: () => NativeBridge.available };
    })();

    // ═══════════════════════════════════════════════════════════
    //  4. APP LOCK MANAGER (unchanged)
    // ═══════════════════════════════════════════════════════════
    const AppLockManager = (function() {
      let locked = false;
      let autoLockTimer = null;
      function lock(reason) {
        if (locked) return;
        if (!Store.preferences.appLockEnabled) return;
        if (!AuthManager.hasCredential()) return;
        locked = true;
        DebugPanel.log('AppLock: LOCKED (' + (reason || 'manual') + ')');
        showLockScreen(reason);
      }
      async function unlock() {
        const result = await AuthManager.authenticate();
        if (result.success) { locked = false; hideLockScreen(); DebugPanel.log('AppLock: UNLOCKED'); return true; }
        return false;
      }
      function isLocked() { return locked; }
      function showLockScreen(reason) {
        const lock = document.getElementById('app-lock');
        const icon = document.getElementById('lock-icon');
        const title = document.getElementById('lock-title');
        const sub = document.getElementById('lock-sub');
        const actions = document.getElementById('lock-actions');
        lock.classList.add('on');
        icon.textContent = '🔒';
        PlatformCapabilities.checkWebAuthn().then(cap => {
          if (cap.available) {
            title.textContent = 'Logostics is Locked';
            sub.textContent = reason === 'background' ? 'You left the app. Authenticate to continue.' : 'Authenticate to view your financial data';
            actions.innerHTML = `
              <button class="btn btn-primary" id="lock-auth-btn" onclick="AppLockManager.authenticateNow()">Unlock</button>
              <button class="btn btn-secondary" onclick="AppLockManager.continueWithoutLock()">Continue Without Lock</button>
            `;
            setTimeout(() => AppLockManager.authenticateNow(), 300);
          } else {
            title.textContent = 'App Lock Unavailable';
            sub.textContent = cap.reason;
            actions.innerHTML = `
              <button class="btn btn-primary" onclick="AppLockManager.continueWithoutLock()">Continue</button>
              <button class="btn btn-secondary" onclick="AppLockManager.disableLock()">Disable App Lock</button>
            `;
          }
        });
      }
      function hideLockScreen() { document.getElementById('app-lock').classList.remove('on'); }
      async function authenticateNow() {
        const btn = document.getElementById('lock-auth-btn');
        if (btn) btn.disabled = true;
        const sub = document.getElementById('lock-sub');
        if (sub) sub.textContent = 'Waiting for authentication…';
        haptic('medium');
        if (NativeBridge.available) {
          const result = await NativeBridge.authenticate('Unlock Logostics');
          if (result && result.success) { locked = false; hideLockScreen(); haptic('success'); return; }
          if (sub) sub.textContent = (result && result.reason) || 'Authentication failed';
          if (btn) btn.disabled = false;
          return;
        }
        const result = await AuthManager.authenticate();
        if (result.success) { locked = false; hideLockScreen(); haptic('success'); }
        else { if (sub) sub.textContent = result.reason; if (btn) btn.disabled = false; }
      }
      function continueWithoutLock() { locked = false; hideLockScreen(); }
      async function disableLock() {
        await Store.updatePreferences({ appLockEnabled: false, webAuthnCredential: null });
        AuthManager.setCredential(null);
        locked = false; hideLockScreen(); toast('App lock disabled');
      }
      function onNativeResult(success, reason) {
        if (success) { locked = false; hideLockScreen(); }
        else { const sub = document.getElementById('lock-sub'); if (sub) sub.textContent = reason || 'Authentication failed'; }
      }
      function onLifecycleChange(from, to) {
        if (!Store.preferences.appLockEnabled) return;
        const mode = Store.preferences.autoLock || 'immediately';
        if (mode === 'off') return;
        if (to === 'background' || to === 'inactive') {
          if (autoLockTimer) { clearTimeout(autoLockTimer); autoLockTimer = null; }
          const timeout = { 'immediately': 0, 'leaving': 0, '15s': 15000, '30s': 30000, '1m': 60000, '5m': 300000 }[mode];
          if (timeout === 0) lock('background');
          else autoLockTimer = setTimeout(() => { lock('timeout'); autoLockTimer = null; }, timeout);
        } else if (to === 'active') {
          if (autoLockTimer && !locked) { clearTimeout(autoLockTimer); autoLockTimer = null; }
        }
      }
      return {
        init() { LifecycleManager.subscribe((event, data) => { if (event === 'stateChanged') onLifecycleChange(data.from, data.to); }); },
        lock, unlock, isLocked, authenticateNow, continueWithoutLock, disableLock, onNativeResult
      };
    })();

    // ═══════════════════════════════════════════════════════════
    //  5. AUTH MANAGER (unchanged)
    // ═══════════════════════════════════════════════════════════
    const AuthManager = (function() {
      let credentialIdB64 = null;
      function bufToB64(buf) { const bytes = new Uint8Array(buf); let bin = ''; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
      function b64ToBuf(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); const buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i); return buf.buffer; }
      async function authenticate() {
        const cap = await PlatformCapabilities.checkWebAuthn();
        if (!cap.available) return { success: false, supported: false, reason: cap.reason };
        if (!credentialIdB64) return { success: false, supported: true, reason: 'No credential registered. Enable App Lock first.' };
        try {
          const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
          const assertion = await navigator.credentials.get({ publicKey: { challenge, timeout: 60000, userVerification: 'required', rpId: window.location.hostname || 'localhost', allowCredentials: [{ id: b64ToBuf(credentialIdB64), type: 'public-key', transports: ['internal'] }] } });
          if (assertion) return { success: true, supported: true, reason: 'Verified' };
          return { success: false, supported: true, reason: 'No credential returned' };
        } catch (e) {
          const reasons = { NotAllowedError: 'Cancelled or timed out', SecurityError: 'Security error — ensure HTTPS', InvalidStateError: 'Credential invalid — re-enable App Lock', AbortError: 'Aborted' };
          return { success: false, supported: true, reason: reasons[e.name] || ('Error: ' + e.name) };
        }
      }
      async function register() {
        const cap = await PlatformCapabilities.checkWebAuthn();
        if (!cap.available) return { success: false, supported: false, reason: cap.reason };
        try {
          const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
          const userId = new Uint8Array(16); crypto.getRandomValues(userId);
          const credential = await navigator.credentials.create({ publicKey: {
            challenge,
            rp: { name: 'Logostics Finance', id: window.location.hostname || 'localhost' },
            user: { id: userId, name: 'logostics-user', displayName: 'Logostics User' },
            pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
            timeout: 60000, attestation: 'none'
          }});
          if (credential && credential.rawId) { credentialIdB64 = bufToB64(credential.rawId); return { success: true, supported: true, reason: 'Registered' }; }
          return { success: false, supported: true, reason: 'No credential returned' };
        } catch (e) {
          const reasons = { NotAllowedError: 'Cancelled or timed out', InvalidStateError: 'Credential already exists', SecurityError: 'Security error — ensure HTTPS' };
          return { success: false, supported: true, reason: reasons[e.name] || ('Error: ' + e.name) };
        }
      }
      return { authenticate, register, hasCredential: () => !!credentialIdB64, setCredential: (b64) => { credentialIdB64 = b64; }, getCredential: () => credentialIdB64 };
    })();

    // ═══════════════════════════════════════════════════════════
    //  6. GESTURE MANAGER (unchanged)
    // ═══════════════════════════════════════════════════════════
    const GestureManager = (function() {
      const EDGE_THRESHOLD = 30;
      let activeGesture = null;
      function init() {
        document.addEventListener('touchstart', (e) => {
          const t = e.touches[0];
          if (t.clientX < EDGE_THRESHOLD && !e.target.closest('.sheet')) {
            activeGesture = { type: 'edge-back', startX: t.clientX, startY: t.clientY, lastX: t.clientX };
          }
        }, { passive: true });
        document.addEventListener('touchmove', (e) => {
          if (!activeGesture || activeGesture.type !== 'edge-back') return;
          const t = e.touches[0];
          activeGesture.lastX = t.clientX;
          const dx = t.clientX - activeGesture.startX;
          if (dx > 10) document.getElementById('swipe-back-indicator').classList.add('on');
        }, { passive: true });
        document.addEventListener('touchend', () => {
          if (!activeGesture || activeGesture.type !== 'edge-back') return;
          const dx = activeGesture.lastX - activeGesture.startX;
          document.getElementById('swipe-back-indicator').classList.remove('on');
          if (dx > 60) handleSwipeBack();
          activeGesture = null;
        });
        document.addEventListener('touchstart', (e) => {
          const item = e.target.closest('.activity-item');
          if (!item) return;
          const id = item.getAttribute('data-tx-id');
          if (!id) return;
          const touch = e.touches[0];
          const startX = touch.clientX, startY = touch.clientY;
          let cancelled = false;
          const timer = setTimeout(() => { if (cancelled) return; haptic('medium'); openTxContextMenu(parseInt(id)); }, 500);
          const onMove = (ev) => { const t = ev.touches[0]; if (Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) { cancelled = true; clearTimeout(timer); document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onEnd); } };
          const onEnd = () => { clearTimeout(timer); document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onEnd); };
          document.addEventListener('touchmove', onMove); document.addEventListener('touchend', onEnd);
        }, { passive: true });
      }
      function handleSwipeBack() {
        haptic('light');
        if (document.getElementById('sheet-overlay').classList.contains('on')) { closeSheet(); return; }
        if (DashboardManager.isEditMode()) { DashboardManager.exitEditMode(); return; }
        if (currentTab !== 'home') switchTab('home');
      }
      return { init };
    })();

    // ═══════════════════════════════════════════════════════════
    //  7. STORE — extended for Moving Goals (single source of truth)
    //  Existing DB_NAME / DB_VERSION kept; goals store gained
    //  optional moving-goal fields without breaking existing records.
    // ═══════════════════════════════════════════════════════════
    const Store = (function() {
      const DB_NAME = 'LogosticsFinanceDB';
      const DB_VERSION = 2; // [MG] bumped for image store; onupgradeneeded is additive
      const PREFS_KEY = 'logostics_finance_prefs_v3'; // unchanged

      let db = null;
      let useIndexedDB = false;
      const memory = { transactions: [], goals: [], paychecks: [], images: [] };

      let state = {
        balance: 0,
        transactions: [],
        paychecks: [],
        goals: [], // holds BOTH standard and moving goals (see `type`)
        recurringExpenses: [],
        incomeSettings: { hourlyRate: 0, hoursPerWeek: 0, payFrequency: 'weekly', withholdingPct: 20, nextPayday: null },
        preferences: {
          currency: 'USD',
          appLockEnabled: false,
          notificationsEnabled: false,
          hapticsEnabled: true,
          privacyMode: false,
          webAuthnCredential: null,
          authTimeout: 'session',
          autoLock: 'immediately',
          protectedPages: { home: false, activity: false, goals: false, analytics: false },
          appearance: { theme: 'dark', accent: 'green', density: 'comfortable', cornerRadius: 22 },
          aiEnabled: true,
          dashboard: { order: ['hero', 'cashCard', 'quickActions', 'insights', 'recent'], hidden: [], pinned: [] },
          widgets: { balanceVisible: true, preferredGoalId: null, spendingCategory: 'all', privacyOnLockScreen: true },
          // [MG] Moving Goal notification categories (extend existing notif system)
          notifCategories: {
            movingGoalDeadline: { enabled: true, leadDays: 7 },
            movingGoalWeekly: { enabled: true, day: 0 },
            movingGoalProgress: { enabled: true, frequency: 'weekly' },
            movingGoalBehind: { enabled: true }
          },
          lastSeenVersion: null
        },
        lastUpdated: Date.now(),
        _nextId: 1,
        _listeners: []
      };

      function openDB() {
        return new Promise((resolve) => {
          if (!window.indexedDB || !window.isSecureContext) { resolve(null); return; }
          let req;
          try { req = indexedDB.open(DB_NAME, DB_VERSION); }
          catch (e) { resolve(null); return; }
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            // Existing stores (create only if missing — preserves existing data)
            if (!d.objectStoreNames.contains('transactions')) {
              const s = d.createObjectStore('transactions', { keyPath: 'id', autoIncrement: true });
              s.createIndex('date', 'date'); s.createIndex('type', 'type');
            }
            if (!d.objectStoreNames.contains('goals')) {
              d.createObjectStore('goals', { keyPath: 'id', autoIncrement: true });
            }
            if (!d.objectStoreNames.contains('paychecks')) {
              const s = d.createObjectStore('paychecks', { keyPath: 'id', autoIncrement: true });
              s.createIndex('date', 'date');
            }
            // [MG] New image store for moving-goal inspiration images
            if (!d.objectStoreNames.contains('images')) {
              d.createObjectStore('images', { keyPath: 'id' });
            }
          };
          req.onsuccess = (e) => { db = e.target.result; useIndexedDB = true; resolve(db); };
          req.onerror = () => { db = null; resolve(null); };
          setTimeout(() => { if (!db) resolve(null); }, 2500);
        });
      }

      function txStore(store, mode) { if (!db) return null; try { return db.transaction(store, mode).objectStore(store); } catch (e) { return null; } }
      async function dbAdd(store, data) { const s = txStore(store, 'readwrite'); if (!s) return null; return new Promise((resolve) => { try { const r = s.add(data); r.onsuccess = () => resolve(r.result); r.onerror = () => resolve(null); } catch (e) { resolve(null); } }); }
      async function dbPut(store, data) { const s = txStore(store, 'readwrite'); if (!s) return null; return new Promise((resolve) => { try { const r = s.put(data); r.onsuccess = () => resolve(r.result); r.onerror = () => resolve(null); } catch (e) { resolve(null); } }); }
      async function dbDelete(store, id) { const s = txStore(store, 'readwrite'); if (!s) return; return new Promise((resolve) => { try { const r = s.delete(id); r.onsuccess = () => resolve(); r.onerror = () => resolve(); } catch (e) { resolve(); } }); }
      async function dbGetAll(store) { const s = txStore(store, 'readonly'); if (!s) return []; return new Promise((resolve) => { try { const r = s.getAll(); r.onsuccess = () => resolve(r.result || []); r.onerror = () => resolve([]); } catch (e) { resolve([]); } }); }
      async function dbGet(store, id) { const s = txStore(store, 'readonly'); if (!s) return null; return new Promise((resolve) => { try { const r = s.get(id); r.onsuccess = () => resolve(r.result || null); r.onerror = () => resolve(null); } catch (e) { resolve(null); } }); }

      function loadPrefs() {
        try {
          const raw = localStorage.getItem(PREFS_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            state.preferences = { ...state.preferences, ...(p.preferences || {}) };
            state.incomeSettings = { ...state.incomeSettings, ...(p.incomeSettings || {}) };
            if (p.preferences && p.preferences.dashboard) state.preferences.dashboard = { ...state.preferences.dashboard, ...p.preferences.dashboard };
            if (p.preferences && p.preferences.appearance) state.preferences.appearance = { ...state.preferences.appearance, ...p.preferences.appearance };
            if (p.preferences && p.preferences.widgets) state.preferences.widgets = { ...state.preferences.widgets, ...p.preferences.widgets };
            if (p.preferences && p.preferences.notifCategories) state.preferences.notifCategories = { ...state.preferences.notifCategories, ...p.preferences.notifCategories };
          }
        } catch (e) {}
      }
      function savePrefs() {
        try { localStorage.setItem(PREFS_KEY, JSON.stringify({ preferences: state.preferences, incomeSettings: state.incomeSettings })); } catch (e) {}
      }

      async function init() {
        loadPrefs();
        if (state.preferences.webAuthnCredential) AuthManager.setCredential(state.preferences.webAuthnCredential);
        await openDB();
        if (useIndexedDB) {
          const txs = await dbGetAll('transactions');
          const goals = await dbGetAll('goals');
          const pcs = await dbGetAll('paychecks');
          state.transactions = txs.sort((a, b) => new Date(b.date) - new Date(a.date));
          // [MG] Migrate any legacy goals: default type='standard'
          state.goals = goals.map(g => ({ type: g.type || 'standard', ...g }));
          state.paychecks = pcs.sort((a, b) => new Date(b.date) - new Date(a.date));
        } else {
          state.transactions = [...memory.transactions];
          state.goals = [...memory.goals].map(g => ({ type: g.type || 'standard', ...g }));
          state.paychecks = [...memory.paychecks];
        }
        state.balance = state.transactions.reduce((sum, t) => t.type === 'income' ? sum + t.amount : sum - t.amount, 0);
        const allIds = [...state.transactions, ...state.goals, ...state.paychecks].map(x => x.id || 0);
        state._nextId = (Math.max(0, ...allIds) || 0) + 1;
        state.lastUpdated = Date.now();
        pushWidgetData();
      }

      function notify() {
        state.lastUpdated = Date.now();
        savePrefs();
        pushWidgetData();
        state._listeners.forEach(fn => { try { fn(snapshot()); } catch (e) {} });
      }
      function pushWidgetData() {
        if (!NativeBridge.available) return;
        // [MG] Moving goals included in widget feed (they're goals too)
        const widgetData = {
          balance: state.balance,
          balanceVisible: state.preferences.widgets.balanceVisible,
          privacyOnLockScreen: state.preferences.widgets.privacyOnLockScreen,
          goals: state.goals.map(g => ({ id: g.id, name: g.name, current: g.current, target: g.target, type: g.type || 'standard' })),
          preferredGoalId: state.preferences.widgets.preferredGoalId,
          nextPaycheck: computePaycheckEstimate().takeHome,
          recentSpending: computeTotalSpending(7),
          lastUpdated: state.lastUpdated
        };
        NativeBridge.updateWidgetData(widgetData);
      }
      function subscribe(fn) { state._listeners.push(fn); return () => { state._listeners = state._listeners.filter(f => f !== fn); }; }
      function snapshot() {
        return {
          balance: state.balance,
          transactions: [...state.transactions],
          paychecks: [...state.paychecks],
          goals: [...state.goals], // [MG] includes both types
          recurringExpenses: [...state.recurringExpenses],
          incomeSettings: { ...state.incomeSettings },
          preferences: JSON.parse(JSON.stringify(state.preferences)),
          lastUpdated: state.lastUpdated,
          storageMode: useIndexedDB ? 'indexeddb' : 'memory'
        };
      }

      async function addTransaction(tx) {
        const t = { id: state._nextId++, type: tx.type, amount: Math.abs(tx.amount), category: tx.category || 'other', description: tx.description || '', date: tx.date || new Date().toISOString(), account: tx.account || 'cash', createdAt: new Date().toISOString() };
        state.transactions.unshift(t);
        if (t.type === 'income') state.balance += t.amount; else state.balance -= t.amount;
        if (useIndexedDB) await dbAdd('transactions', t); else memory.transactions.unshift(t);
        notify(); return t;
      }
      async function updateTransaction(id, u) {
        const i = state.transactions.findIndex(t => t.id === id); if (i === -1) return null;
        const old = state.transactions[i];
        const upd = { ...old, ...u, amount: Math.abs(u.amount ?? old.amount) };
        if (old.type === 'income') state.balance -= old.amount; else state.balance += old.amount;
        if (upd.type === 'income') state.balance += upd.amount; else state.balance -= upd.amount;
        state.transactions[i] = upd;
        if (useIndexedDB) await dbPut('transactions', upd); else memory.transactions = state.transactions;
        notify(); return upd;
      }
      async function deleteTransaction(id) {
        const i = state.transactions.findIndex(t => t.id === id); if (i === -1) return false;
        const t = state.transactions[i];
        if (t.type === 'income') state.balance -= t.amount; else state.balance += t.amount;
        state.transactions.splice(i, 1);
        if (useIndexedDB) await dbDelete('transactions', id); else memory.transactions = state.transactions;
        notify(); return true;
      }
      function getTransactions(f) {
        let list = [...state.transactions];
        if (f) {
          if (f.type) list = list.filter(t => t.type === f.type);
          if (f.category && f.category !== 'all') list = list.filter(t => t.category === f.category);
          if (f.search) { const q = f.search.toLowerCase(); list = list.filter(t => t.description.toLowerCase().includes(q) || t.category.toLowerCase().includes(q)); }
        }
        return list.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      // ─── Standard goals (existing) ───
      async function addGoal(g) {
        const goal = {
          id: state._nextId++,
          type: 'standard', // [MG] default type for backwards compat
          name: g.name, emoji: g.emoji || '◈',
          target: Math.abs(g.target), current: Math.abs(g.current || 0),
          targetDate: g.targetDate || null, weeklySavings: g.weeklySavings || 0,
          createdAt: new Date().toISOString()
        };
        state.goals.push(goal);
        if (useIndexedDB) await dbAdd('goals', goal); else memory.goals.push(goal);
        notify(); return goal;
      }

      // ─── [MG] Moving goals — same store, extended schema ───
      async function addMovingGoal(g) {
        const goal = {
          id: state._nextId++,
          type: 'moving',
          name: g.name || 'Move',
          emoji: g.emoji || '📍',
          destination: {
            name: g.destination?.name || '',
            fullName: g.destination?.fullName || '',
            city: g.destination?.city || '',
            state: g.destination?.state || '',
            country: g.destination?.country || '',
            postalCode: g.destination?.postalCode || '',
            lat: typeof g.destination?.lat === 'number' ? g.destination.lat : null,
            lng: typeof g.destination?.lng === 'number' ? g.destination.lng : null
          },
          target: Math.abs(g.target || 0),
          current: Math.abs(g.current || 0),
          weeklyContribution: Math.abs(g.weeklyContribution || 0),
          monthlyContribution: Math.abs(g.monthlyContribution || 0),
          targetDate: g.targetDate || null,
          reminderDate: g.reminderDate || null,
          image: g.image || null,
          // Reuse weeklySavings so existing progress math works untouched
          weeklySavings: Math.abs(g.weeklyContribution || 0),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        state.goals.push(goal);
        if (useIndexedDB) await dbAdd('goals', goal); else memory.goals.push(goal);
        notify(); return goal;
      }
      async function updateGoal(id, u) {
        const i = state.goals.findIndex(g => g.id === id); if (i === -1) return null;
        const merged = { ...state.goals[i], ...u };
        // [MG] If destination is being updated, deep-merge so we don't drop fields
        if (u.destination) merged.destination = { ...(state.goals[i].destination || {}), ...u.destination };
        // [MG] Keep weeklySavings in sync with weeklyContribution for the existing math
        if (typeof u.weeklyContribution === 'number') merged.weeklySavings = Math.abs(u.weeklyContribution);
        merged.updatedAt = new Date().toISOString();
        state.goals[i] = merged;
        if (useIndexedDB) await dbPut('goals', state.goals[i]); else memory.goals = state.goals;
        notify(); return state.goals[i];
      }
      async function deleteGoal(id) {
        const len = state.goals.length;
        state.goals = state.goals.filter(g => g.id !== id);
        if (state.goals.length !== len) {
          if (useIndexedDB) await dbDelete('goals', id); else memory.goals = state.goals;
          notify(); return true;
        }
        return false;
      }
      function getGoals() { return [...state.goals].filter(g => (g.type || 'standard') === 'standard'); }
      function getMovingGoals() { return [...state.goals].filter(g => g.type === 'moving'); }
      function getAllGoals() { return [...state.goals]; }
      function getGoal(id) { return state.goals.find(g => g.id === id) || null; }

      // [MG] Images for moving-goal inspiration (local-only)
      async function saveImage(id, dataUrl) {
        const rec = { id, dataUrl, createdAt: new Date().toISOString() };
        if (useIndexedDB) await dbPut('images', rec); else memory.images = memory.images.filter(x => x.id !== id).concat(rec);
      }
      async function getImage(id) {
        if (useIndexedDB) { const rec = await dbGet('images', id); return rec ? rec.dataUrl : null; }
        const rec = memory.images.find(x => x.id === id); return rec ? rec.dataUrl : null;
      }

      function updateIncomeSettings(s) { state.incomeSettings = { ...state.incomeSettings, ...s }; notify(); return { ...state.incomeSettings }; }
      function updatePreferences(p) { state.preferences = { ...state.preferences, ...p }; notify(); return JSON.parse(JSON.stringify(state.preferences)); }

      function computePaycheckEstimate() {
        const { hourlyRate, hoursPerWeek, withholdingPct } = state.incomeSettings;
        const gross = hourlyRate * hoursPerWeek;
        const withholding = gross * (withholdingPct / 100);
        return { gross, withholding, takeHome: gross - withholding, hourlyRate, hoursPerWeek, withholdingPct };
      }
      // Reused by both standard AND moving goals
      function computeGoalProgress(g) {
        const pct = g.target > 0 ? Math.min(100, Math.round((g.current / g.target) * 100)) : 0;
        const remaining = Math.max(0, g.target - g.current);
        let estimatedDate = null;
        if (g.weeklySavings > 0 && remaining > 0) {
          const weeks = remaining / g.weeklySavings;
          estimatedDate = new Date(Date.now() + weeks * 7 * 24 * 60 * 60 * 1000);
        } else if (g.targetDate) {
          estimatedDate = new Date(g.targetDate);
        }
        return { pct, remaining, estimatedDate };
      }
      function computeProjectedBalance() {
        const est = computePaycheckEstimate();
        const planned = state.recurringExpenses.filter(e => e.active !== false).reduce((s, e) => s + (e.amount || 0), 0);
        return state.balance + est.takeHome - planned;
      }
      function computeSpendingByCategory(days) {
        days = days || 7;
        const cutoff = Date.now() - days * 864e5;
        const by = {};
        state.transactions.filter(t => t.type === 'expense' && new Date(t.date).getTime() >= cutoff).forEach(t => { by[t.category] = (by[t.category] || 0) + t.amount; });
        return by;
      }
      function computeTotalSpending(days) { days = days || 7; const cutoff = Date.now() - days * 864e5; return state.transactions.filter(t => t.type === 'expense' && new Date(t.date).getTime() >= cutoff).reduce((s, t) => s + t.amount, 0); }
      function computeTotalIncome(days) { days = days || 7; const cutoff = Date.now() - days * 864e5; return state.transactions.filter(t => t.type === 'income' && new Date(t.date).getTime() >= cutoff).reduce((s, t) => s + t.amount, 0); }
      function computeSavingsRate() { const inc = computeTotalIncome(30); const sp = computeTotalSpending(30); if (inc === 0) return 0; return Math.max(0, Math.round(((inc - sp) / inc) * 100)); }
      function computeAverageTransaction() { const ex = state.transactions.filter(t => t.type === 'expense'); if (!ex.length) return 0; return ex.reduce((s, t) => s + t.amount, 0) / ex.length; }
      function computeLargestCategory() { const by = computeSpendingByCategory(30); let cat = '—', amt = 0; Object.entries(by).forEach(([k, v]) => { if (v > amt) { amt = v; cat = k; } }); return { category: cat, amount: amt }; }

      function generateInsights() {
        const out = [];
        const wk = computeTotalSpending(7);
        const now = Date.now();
        const wkAgo = now - 7 * 864e5;
        const wk2Ago = now - 14 * 864e5;
        const prev = state.transactions.filter(t => t.type === 'expense' && new Date(t.date).getTime() >= wk2Ago && new Date(t.date).getTime() < wkAgo).reduce((s, t) => s + t.amount, 0);
        if (prev > 0) {
          const ch = ((wk - prev) / prev) * 100;
          if (Math.abs(ch) >= 5) out.push({ ico: ch < 0 ? '↓' : '↑', txt: `Spending is <strong>${ch < 0 ? 'down' : 'up'} ${Math.abs(Math.round(ch))}%</strong> this week.` });
        }
        const lc = computeLargestCategory();
        if (lc.amount > 0) out.push({ ico: '◈', txt: `<strong>${lc.category}</strong> is your top category at <strong>${fmt(lc.amount)}</strong>.` });

        // [MG] Moving goal insight (uses same generator, not a duplicate)
        const moving = state.goals.find(g => g.type === 'moving');
        if (moving) {
          const p = computeGoalProgress(moving);
          if (p.remaining > 0) {
            const dest = moving.destination?.city || 'your destination';
            out.push({ ico: '📍', txt: `<strong>${fmt(p.remaining)}</strong> left to move to <strong>${escapeHtml(dest)}</strong>.` });
          } else {
            out.push({ ico: '📍', txt: `You reached your moving goal for <strong>${escapeHtml(moving.destination?.city || 'your destination')}</strong>!` });
          }
        } else if (state.goals.length) {
          const g = state.goals[0];
          const p = computeGoalProgress(g);
          if (p.remaining > 0) out.push({ ico: '→', txt: `<strong>${fmt(p.remaining)}</strong> away from "${g.name}".` });
          else out.push({ ico: '✓', txt: `"${g.name}" goal reached.` });
        }
        const proj = computeProjectedBalance();
        if (proj > state.balance) out.push({ ico: '↑', txt: `Projected balance after next paycheck: <strong>${fmt(proj)}</strong>.` });
        if (!out.length) out.push({ ico: '·', txt: 'Add transactions to see insights.' });
        return out;
      }

      return {
        init, subscribe, getSnapshot: snapshot,
        addTransaction, updateTransaction, deleteTransaction, getTransactions,
        addGoal, updateGoal, deleteGoal, getGoals,
        // [MG] Moving goal extras (same underlying store)

        get paychecks() { return [...state.paychecks]; },

    // ═══════════════════════════════════════════════════════════
    //  7b. [MG] MAP SERVICE — swappable provider abstraction
    //  Uses Leaflet + OpenStreetMap/Nominatim (no API key needed).
    //  Everything else in the app talks only to MapService.
    // ═══════════════════════════════════════════════════════════
    const MapService = (function() {
      const CONFIG = {
        provider: 'osm',
        tileUrl: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        geocodeEndpoint: 'https://nominatim.openstreetmap.org/search',
        reverseEndpoint: 'https://nominatim.openstreetmap.org/reverse'
      };
      const geocodeCache = new Map();
      const reverseCache = new Map();
      function isOnline() { return navigator.onLine !== false; }
      function leafletReady() { return typeof window.L !== 'undefined'; }

      async function searchLocation(query) {
        if (!query || query.trim().length < 2) return { ok: false, error: 'Please enter at least 2 characters.' };
        const q = query.trim();
        if (geocodeCache.has(q)) return { ok: true, results: geocodeCache.get(q), cached: true };
        if (!isOnline()) return { ok: false, error: 'Offline — search requires a network connection.' };
        try {
          const url = `${CONFIG.geocodeEndpoint}?q=${encodeURIComponent(q)}&format=json&limit=6&addressdetails=1`;
          const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
          if (!res.ok) {
            if (res.status === 429) return { ok: false, error: 'Too many searches — please wait a moment.' };
            return { ok: false, error: 'Search failed. Please try again.' };
          }
          const data = await res.json();
          if (!Array.isArray(data) || data.length === 0) return { ok: false, error: `No results found for "${q}".` };
          const results = data.map(r => ({
            name: r.display_name?.split(',')[0] || 'Unknown',
            fullName: r.display_name || '',
            lat: parseFloat(r.lat), lng: parseFloat(r.lon),
            city: r.address?.city || r.address?.town || r.address?.village || r.address?.hamlet || '',
            state: r.address?.state || '', country: r.address?.country || '',
            postalCode: r.address?.postcode || ''
          }));
          geocodeCache.set(q, results);
          return { ok: true, results };
        } catch (e) { return { ok: false, error: 'Network error during search.' }; }
      }

      async function reverseGeocode(lat, lng) {
        const key = `${lat.toFixed(4)},${lng.toFixed(4)}`;
        if (reverseCache.has(key)) return { ok: true, result: reverseCache.get(key), cached: true };
        if (!isOnline()) return { ok: false, error: 'Offline — reverse geocoding unavailable.' };
        try {
          const url = `${CONFIG.reverseEndpoint}?lat=${lat}&lon=${lng}&format=json&zoom=10&addressdetails=1`;
          const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
          if (!res.ok) return { ok: false, error: 'Reverse geocode failed.' };
          const data = await res.json();
          if (!data || data.error) return { ok: false, error: 'No location data found.' };
          const result = {
            name: data.display_name?.split(',')[0] || 'Unknown',
            fullName: data.display_name || '',
            city: data.address?.city || data.address?.town || data.address?.village || '',
            state: data.address?.state || '', country: data.address?.country || '',
            postalCode: data.address?.postcode || ''
          };
          reverseCache.set(key, result);
          return { ok: true, result };
        } catch (e) { return { ok: false, error: 'Network error during reverse geocoding.' }; }
      }

      function createMap(el, options) {
        options = options || {};
        if (!leafletReady()) return null;
        const map = L.map(el, {
          center: options.center || [39.8283, -98.5795], zoom: options.zoom || 4,
          zoomControl: false, attributionControl: false, dragging: true,
          touchZoom: true, scrollWheelZoom: false, doubleClickZoom: true,
          tap: true, inertia: true, worldCopyJump: true
        });
        L.tileLayer(CONFIG.tileUrl, { maxZoom: 19, minZoom: 2 }).addTo(map);
        return map;
      }
      function createMarker(lat, lng, options) {
        options = options || {};
        if (!leafletReady()) return null;
        const icon = L.divIcon({
          className: 'mg-custom-marker',
          html: '<div class="mg-marker"><span>📍</span></div>',
          iconSize: [32, 32], iconAnchor: [16, 32]
        });
        return L.marker([lat, lng], { icon, draggable: !!options.draggable, keyboard: false });
      }

      return { isOnline, leafletReady, searchLocation, reverseGeocode, createMap, createMarker, config: CONFIG };
    })();

    // ═══════════════════════════════════════════════════════════
    //  7c. [MG] MOVING GOAL CALCULATOR — deterministic math only
    // ═══════════════════════════════════════════════════════════
    const MovingGoalCalculator = (function() {
      function compute(goal) {
        const target = Number(goal.target) || 0;
        const current = Number(goal.current) || 0;
        const weeklyContribution = Number(goal.weeklyContribution) || 0;
        const monthlyContribution = Number(goal.monthlyContribution) || 0;
        const remaining = Math.max(0, target - current);
        const pct = target > 0 ? Math.min(100, Math.round((current / target) * 100)) : 0;
        const now = new Date();
        const targetDate = goal.targetDate ? new Date(goal.targetDate) : null;
        const validTargetDate = targetDate && !isNaN(targetDate.getTime());
        const daysRemaining = validTargetDate ? Math.max(0, Math.ceil((targetDate - now) / 864e5)) : 0;
        const weeksRemaining = daysRemaining / 7;
        const monthsRemaining = daysRemaining / 30.4375;
        const requiredWeekly = validTargetDate && weeksRemaining > 0 ? remaining / weeksRemaining : 0;
        const requiredMonthly = validTargetDate && monthsRemaining > 0 ? remaining / monthsRemaining : 0;
        let effectiveWeekly = weeklyContribution;
        if (effectiveWeekly <= 0 && monthlyContribution > 0) effectiveWeekly = monthlyContribution / 4.33;
        let estimatedWeeks = null, estimatedDate = null;
        if (remaining <= 0) { estimatedWeeks = 0; estimatedDate = now; }
        else if (effectiveWeekly > 0) { estimatedWeeks = remaining / effectiveWeekly; estimatedDate = new Date(now.getTime() + estimatedWeeks * 7 * 864e5); }
        let status = 'on-track';
        if (remaining <= 0) status = 'completed';
        else if (validTargetDate && requiredWeekly > 0) {
          if (effectiveWeekly >= requiredWeekly * 1.05) status = 'ahead';
          else if (effectiveWeekly >= requiredWeekly * 0.95) status = 'on-track';
          else status = 'behind';
        } else if (validTargetDate && effectiveWeekly <= 0) status = 'no-rate';
        else if (!validTargetDate && effectiveWeekly <= 0) status = 'no-date';
        function safe(n) { return isFinite(n) ? n : 0; }
        return {
          target: safe(target), current: safe(current), remaining: safe(remaining), pct: safe(pct),
          daysRemaining, weeksRemaining: safe(weeksRemaining), monthsRemaining: safe(monthsRemaining),
          requiredWeekly: safe(requiredWeekly), requiredMonthly: safe(requiredMonthly),
          effectiveWeekly: safe(effectiveWeekly),
          estimatedWeeks: estimatedWeeks !== null ? safe(estimatedWeeks) : null,
          estimatedDate, status, hasTargetDate: validTargetDate
        };
      }
      return { compute };
    })();

    // ═══════════════════════════════════════════════════════════
    //  11. AI AGENT — extended with Moving Goal tools (same agent)
    // ═══════════════════════════════════════════════════════════
    const AIAgent = (function() {
      const tools = {
        getBalance() { const snap = Store.getSnapshot(); return { balance: snap.balance, currency: snap.preferences.currency }; },
        getRecentTransactions(limit) { const snap = Store.getSnapshot(); return snap.transactions.slice(0, limit || 5).map(t => ({ type: t.type, amount: t.amount, category: t.category, description: t.description, date: t.date })); },
        getSpendingByCategory(days) { return Store.computeSpendingByCategory(days || 7); },
        getTotalSpending(days) { return Store.computeTotalSpending(days || 7); },
        getTotalIncome(days) { return Store.computeTotalIncome(days || 7); },
        getSavingsRate() { return Store.computeSavingsRate(); },
        getGoals() {
          return Store.getAllGoals().map(g => {
            const p = Store.computeGoalProgress(g);
            const base = { name: g.name, current: g.current, target: g.target, pct: p.pct, remaining: p.remaining, type: g.type || 'standard' };
            // [MG] Enrich moving goals with destination info
            if (g.type === 'moving') {
              base.destination = g.destination?.city ? `${g.destination.city}${g.destination.state ? ', ' + g.destination.state : ''}` : 'not set';
              base.weeklyContribution = g.weeklyContribution || 0;
              base.monthlyContribution = g.monthlyContribution || 0;
              base.requiredWeekly = MovingGoalCalculator.compute(g).requiredWeekly;
              base.estimatedDate = MovingGoalCalculator.compute(g).estimatedDate;
            }
            return base;
          });
        },
        // [MG] Explicit moving-goal tool for the AI
        getMovingGoals() {
          return Store.getMovingGoals().map(g => {
            const calc = MovingGoalCalculator.compute(g);
            return {
              name: g.name,
              destination: g.destination?.city ? `${g.destination.city}${g.destination.state ? ', ' + g.destination.state : ''}` : 'not set',
              target: g.target, current: g.current, remaining: calc.remaining,
              pct: calc.pct, targetDate: g.targetDate,
              weeklyContribution: g.weeklyContribution,
              monthlyContribution: g.monthlyContribution,
              requiredWeekly: calc.requiredWeekly, requiredMonthly: calc.requiredMonthly,
              estimatedDate: calc.estimatedDate, status: calc.status
            };
          });
        },
        getPaycheckEstimate() { return Store.computePaycheckEstimate(); },
        getProjectedBalance() { return Store.computeProjectedBalance(); },
        getLargestCategory() { return Store.computeLargestCategory(); },
        getAverageTransaction() { return Store.computeAverageTransaction(); },
        getInsights() { return Store.generateInsights(); }
      };

      function matchIntent(q) {
        const lower = q.toLowerCase().trim();

        // [MG] Moving goal specific intents — checked before general goal
        if (/moving|move to|destination/.test(lower)) {
          if (/how much|save.*week|weekly/.test(lower)) return { action: 'answer', tool: 'getMovingGoals', template: 'movingWeekly' };
          if (/when.*(afford|move|reach)|eta|complete/.test(lower)) return { action: 'answer', tool: 'getMovingGoals', template: 'movingETA' };
          if (/on track|am i|progress/.test(lower)) return { action: 'answer', tool: 'getMovingGoals', template: 'movingStatus' };
          if (/how much.*(need|left|remaining)/.test(lower)) return { action: 'answer', tool: 'getMovingGoals', template: 'movingRemaining' };
          return { action: 'answer', tool: 'getMovingGoals', template: 'movingFull' };
        }
        if (/^(take me|go|open|show me|navigate to|jump to)/.test(lower)) {
          if (/savings|goal/.test(lower)) return { action: 'navigate', target: 'goals', reply: 'Opening Goals.' };
          if (/analytics|charts|graphs/.test(lower)) return { action: 'navigate', target: 'analytics', reply: 'Opening Analytics.' };
          if (/activity|transactions/.test(lower)) return { action: 'navigate', target: 'activity', reply: 'Opening Activity.' };
          if (/home|dashboard/.test(lower)) return { action: 'navigate', target: 'home', reply: 'Opening Home.' };
          if (/settings|preferences/.test(lower)) return { action: 'navigate', target: 'settings', reply: 'Opening Settings.' };
        }
        if (/^(add|log|record)\s+\$?\d/.test(lower)) {
          const amtMatch = lower.match(/\$?(\d+(\.\d+)?)/);
          if (amtMatch) {
            const amt = parseFloat(amtMatch[1]);
            const isIncome = /income|paycheck|received/.test(lower);
            return { action: 'confirm-add', amount: amt, type: isIncome ? 'income' : 'expense', reply: `Log a ${isIncome ? 'income' : 'expense'} of ${fmt(amt)}?` };
          }
        }
        if (/(how much|what'?s|what is).*(cash|balance|have|money)/.test(lower)) return { action: 'answer', tool: 'getBalance' };
        if (/(how much|what).*(spend|spent|spending)/.test(lower)) return { action: 'answer', tool: 'getTotalSpending', args: [7], template: 'spending7' };
        if (/(how much|what).*(income|earn)/.test(lower)) return { action: 'answer', tool: 'getTotalIncome', args: [30], template: 'income30' };
        if (/goal/.test(lower)) return { action: 'answer', tool: 'getGoals', template: 'goals' };
        if (/(projected|next paycheck)/.test(lower)) return { action: 'answer', tool: 'getProjectedBalance', template: 'projected' };
        if (/(top|largest|biggest).*(categor)/.test(lower)) return { action: 'answer', tool: 'getLargestCategory', template: 'largestCat' };
        if (/(average|avg).*(transaction)/.test(lower)) return { action: 'answer', tool: 'getAverageTransaction', template: 'avgTx' };
        if (/(insight|summary|overview)/.test(lower)) return { action: 'answer', tool: 'getInsights', template: 'insights' };
        if (/^(hi|hey|hello)/.test(lower)) return { action: 'greeting' };
        if (/help/.test(lower)) return { action: 'help' };
        return { action: 'unknown' };
      }

      function formatToolResult(template, result) {
        switch (template) {
          case 'spending7': return `You've spent ${fmt(result)} in the last 7 days.`;
          case 'income30': return `You've earned ${fmt(result)} in the last 30 days.`;
          case 'goals':
            if (!result.length) return "You don't have any goals set yet.";
            return result.map(g => {
              if (g.type === 'moving') return `📍 ${g.name} (${g.destination}): ${fmt(g.current)} of ${fmt(g.target)} — ${g.pct}% complete.`;
              return `"${g.name}": ${fmt(g.current)} of ${fmt(g.target)} — ${g.pct}% complete.`;
            }).join('\n');
          case 'projected': return `Your projected balance is ${fmt(result)}.`;
          case 'largestCat': return result.amount === 0 ? 'No spending yet.' : `Largest category: "${result.category}" at ${fmt(result.amount)}.`;
          case 'avgTx': return `Average transaction: ${fmt(result)}.`;
          case 'insights': return result.map(i => i.txt.replace(/<[^>]*>/g, '')).join('\n');
          // [MG] Moving goal templates
          case 'movingFull':
            if (!result.length) return "You don't have any moving goals yet.";
            return result.map(g => {
              const lines = [`📍 ${g.name} — ${g.destination}`];
              lines.push(`  Progress: ${g.pct}% (${fmt(g.current)} of ${fmt(g.target)})`);
              lines.push(`  Remaining: ${fmt(g.remaining)}`);
              if (g.requiredWeekly > 0) lines.push(`  Weekly needed: ${fmt(g.requiredWeekly)}`);
              if (g.estimatedDate) lines.push(`  Estimated: ${g.estimatedDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}`);
              return lines.join('\n');
            }).join('\n\n');
          case 'movingWeekly':
            if (!result.length) return "You don't have any moving goals yet.";
            const g1 = result[0];
            if (g1.requiredWeekly > 0) return `You need to save about ${fmt(g1.requiredWeekly)} per week to reach "${g1.name}" by your target date.`;
            return `Set a target date for "${g1.name}" to calculate the required weekly savings.`;
          case 'movingETA':
            if (!result.length) return "You don't have any moving goals yet.";
            const g2 = result[0];
            if (g2.estimatedDate) return `At your current rate, you'll reach "${g2.name}" around ${g2.estimatedDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}.`;
            return `Set a weekly contribution for "${g2.name}" to see an estimated completion date.`;
          case 'movingStatus':
            if (!result.length) return "You don't have any moving goals yet.";
            const g3 = result[0];
            const statusMap = { 'ahead': 'You are ahead of pace.', 'on-track': 'You are on track.', 'behind': 'You are behind pace — consider increasing your weekly contribution.', 'completed': 'Goal is complete.', 'no-rate': 'Set a weekly contribution to see your status.', 'no-date': 'Set a target date to see your status.' };
            return `${g3.name} — ${g3.pct}% complete. ${statusMap[g3.status] || ''}`;
          case 'movingRemaining':
            if (!result.length) return "You don't have any moving goals yet.";
            return `${fmt(result[0].remaining)} left to reach "${result[0].name}".`;
          default: return typeof result === 'string' ? result : JSON.stringify(result);
        }
      }

      async function answer(question) {
        const intent = matchIntent(question);
        if (intent.action === 'greeting') return { reply: "Hey. Ask me about your balance, spending, goals, or say 'take me to analytics'." };
        if (intent.action === 'help') return { reply: "I can answer questions about your balance, spending, income, goals (including moving goals), navigate between screens, and log transactions (with your confirmation)." };
        if (intent.action === 'navigate') {
          setTimeout(() => { if (intent.target === 'settings') openSettings(); else switchTab(intent.target); }, 200);
          return { reply: intent.reply };
        }
        if (intent.action === 'confirm-add') {
          return {
            reply: intent.reply,
            confirmAction: {
              label: `Log ${fmt(intent.amount)} ${intent.type}`,
              execute: async () => {
                await Store.addTransaction({ type: intent.type, amount: intent.amount, description: 'Logged via AI', category: 'other' });
                haptic('success'); toast(`${intent.type === 'income' ? 'Income' : 'Expense'} logged`); render();
                return `Logged ${fmt(intent.amount)}.`;
              }
            }
          };
        }
        if (intent.action === 'answer') {
          try {
            const tool = tools[intent.tool];
            if (!tool) return { reply: "I don't have a tool for that yet." };
            const args = intent.args || [];
            const result = await tool(...args);
            const formatted = intent.template ? formatToolResult(intent.template, result) : JSON.stringify(result);
            return { reply: formatted };
          } catch (e) { return { reply: "I ran into an error reading that data." }; }
        }
        return { reply: "I'm not sure I understood. Try asking about your balance, spending, or goals." };
      }

      return { answer };
    })();

    // ═══════════════════════════════════════════════════════════

    function fmt(n) {
      if (n === undefined || n === null || !isFinite(n)) return '$0.00';
      const abs = Math.abs(n);
      const str = abs.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return '$' + str;
    }
    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diff = Math.round((today - target) / 864e5);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Yesterday';
      if (diff === -1) return 'Tomorrow';
      if (diff > 0 && diff < 7) return diff + 'd ago';
      if (diff < 0 && diff > -7) return 'in ' + Math.abs(diff) + 'd';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
    }
    function fmtDateLong(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }
    function fmtMonthYear(date) {
      if (!date) return '';
      const d = new Date(date);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }
    function timeAgo(ts) { const s = Math.floor((Date.now() - ts) / 1000); if (s < 5) return 'just now'; if (s < 60) return s + 's ago'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; return Math.floor(s / 3600) + 'h ago'; }
    function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function haptic(style) {
      if (!Store.preferences.hapticsEnabled) return;
      if (typeof navigator.vibrate === 'function') {
        const patterns = { light: 8, medium: 14, heavy: 22, success: [10, 40, 10], error: [20, 30, 20, 30, 20] };
        try { navigator.vibrate(patterns[style] || 10); } catch (e) {}
      }
      if (NativeBridge.available) NativeBridge.setHaptic(style);
    }
    function toast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-text').textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2400);
      haptic('light');
    }
    function openSheet(html) {
      document.getElementById('sheet-content').innerHTML = html;
      document.getElementById('sheet-overlay').classList.add('on');
      sheetReturnFocus = document.activeElement;
      haptic('light');
    }
    function closeSheet(e) {
      if (e && e.target !== document.getElementById('sheet-overlay')) return;
      document.getElementById('sheet-overlay').classList.remove('on');
      // [MG] Clean up any maps inside the sheet
      activeMaps.forEach((entry, id) => {
        if (document.getElementById(id) === null || !document.body.contains(document.getElementById(id))) {
          try { entry.map.remove(); } catch (err) {}

    }

    // [MG] Render a Moving Goal card. Called from renderGoals.
    function renderMovingGoalCard(g) {
      const calc = MovingGoalCalculator.compute(g);
      const hasDest = g.destination && typeof g.destination.lat === 'number' && typeof g.destination.lng === 'number';
      const mapId = 'mg-card-map-' + g.id;
      const destName = g.destination?.city
        ? `${g.destination.city}${g.destination.state ? ', ' + g.destination.state : ''}`
        : (g.destination?.name || 'Destination not set');
      let etaText = '—';
      if (calc.status === 'completed') etaText = 'Completed';
      else if (calc.estimatedDate) etaText = fmtMonthYear(calc.estimatedDate);
      let statusLabel = '', statusClass = '';
      if (calc.status === 'ahead') { statusLabel = 'Ahead'; statusClass = 'ok'; }
      else if (calc.status === 'on-track') { statusLabel = 'On track'; statusClass = 'ok'; }
      else if (calc.status === 'behind') { statusLabel = 'Behind'; statusClass = 'warn'; }
      else if (calc.status === 'no-rate') { statusLabel = 'Set rate'; statusClass = 'dim'; }
      else if (calc.status === 'no-date') { statusLabel = 'No date'; statusClass = 'dim'; }
      else if (calc.status === 'completed') { statusLabel = 'Complete'; statusClass = 'ok'; }

      return `
        <div class="moving-goal-card" onclick="openMovingGoalDetail(${g.id})">
          ${hasDest ? `<div class="mg-map-preview"><div class="map-inner" id="${mapId}"></div></div>` : `<div class="mg-map-preview" style="display:flex;align-items:center;justify-content:center;color:var(--gray-500);font-size:13px;">📍 Tap to set destination</div>`}
          <div class="mg-card-body">
            <div class="mg-destination"><span class="pin">📍</span><span>${escapeHtml(destName)}</span></div>
            <div class="mg-title">Move to ${escapeHtml((g.name || '').replace(/^Move to /i, ''))}</div>
            <div class="mg-amounts"><span class="current">${fmt(calc.current)}</span><span class="target">/ ${fmt(calc.target)}</span></div>
            <div class="mg-bar"><div class="mg-bar-fill" style="width:${calc.pct}%"></div></div>
            <div class="mg-stats">
              <div class="mg-stat"><div class="lbl">Remaining</div><div class="val">${fmt(calc.remaining)}</div></div>
              <div class="mg-stat"><div class="lbl">Progress</div><div class="val ${statusClass}">${calc.pct}% · ${statusLabel}</div></div>
              ${calc.requiredWeekly > 0 ? `<div class="mg-stat"><div class="lbl">Weekly needed</div><div class="val">${fmt(calc.requiredWeekly)}</div></div>` : `<div class="mg-stat"><div class="lbl">Target date</div><div class="val dim">${g.targetDate ? fmtDate(g.targetDate) : 'Not set'}</div></div>`}
              <div class="mg-stat"><div class="lbl">Estimated</div><div class="val ${statusClass}">${etaText}</div></div>
            </div>
          </div>
        </div>
      `;
    }

    // [MG] Mount card maps after render
    function mountCardMaps() {
      const movingGoals = Store.getMovingGoals();
      movingGoals.forEach(g => {
        if (g.destination && typeof g.destination.lat === 'number' && typeof g.destination.lng === 'number') {
          const el = document.getElementById('mg-card-map-' + g.id);
          if (el && !activeMaps.has(el.id) && MapService.leafletReady()) {
            const map = MapService.createMap(el, { center: [g.destination.lat, g.destination.lng], zoom: 9 });
            if (!map) return;
            map.dragging.disable(); map.touchZoom.disable(); map.doubleClickZoom.disable();
            map.scrollWheelZoom.disable(); map.boxZoom.disable(); map.keyboard.disable();
            const marker = MapService.createMarker(g.destination.lat, g.destination.lng);
            if (marker) marker.addTo(map);
            activeMaps.set(el.id, { map, marker });
          }
        }
      });
    }

          ${aiChat.length === 0 ? `<div class="ai-chat-bubble ai-bubble-system">Ask about your money, goals, or say "take me to analytics".</div>` : aiChat.map(m => renderAIBubble(m)).join('')}

    function renderAIBubble(m) {
      if (m.role === 'user') return `<div class="ai-chat-bubble ai-bubble-user">${escapeHtml(m.text)}</div>`;
      if (m.role === 'system') return `<div class="ai-chat-bubble ai-bubble-system">${escapeHtml(m.text)}</div>`;
      let confirmHtml = '';
      if (m.confirmAction) confirmHtml = `<div class="ai-action-row"><button class="ai-action-btn primary" onclick="executeAIConfirm(${m.id})">${escapeHtml(m.confirmAction.label)}</button><button class="ai-action-btn" onclick="dismissAIConfirm(${m.id})">Cancel</button></div>`;
      return `<div class="ai-chat-bubble ai-bubble-assistant">${escapeHtml(m.text).replace(/\n/g, '<br>')}${confirmHtml}</div>`;
    }
    async function submitAI(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('ai-input');
      const q = input.value.trim();
      if (!q || aiThinking) return;
      input.value = '';
      aiChat.push({ role: 'user', text: q });
      refreshAIChatLog();
      aiThinking = true;
      const log = document.getElementById('ai-chat-log');
      if (log) { const typing = document.createElement('div'); typing.id = 'ai-typing'; typing.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`; log.appendChild(typing); log.scrollTop = log.scrollHeight; }
      try {
        const response = await AIAgent.answer(q);
        aiChat.push({ role: 'assistant', text: response.reply, id: Date.now() + Math.random(), confirmAction: response.confirmAction || null });
      } catch (err) { aiChat.push({ role: 'assistant', text: 'Sorry, something went wrong.' }); }
      finally { aiThinking = false; document.getElementById('ai-typing')?.remove(); refreshAIChatLog(); }
    }
    function refreshAIChatLog() { const log = document.getElementById('ai-chat-log'); if (!log) return; log.innerHTML = aiChat.map(m => renderAIBubble(m)).join(''); log.scrollTop = log.scrollHeight; }
    async function executeAIConfirm(id) {
      const m = aiChat.find(x => x.id === id); if (!m || !m.confirmAction) return;
      const action = m.confirmAction; m.confirmAction = null; refreshAIChatLog();
      try { const result = await action.execute(); aiChat.push({ role: 'assistant', text: result || 'Done.' }); }
      catch (e) { aiChat.push({ role: 'assistant', text: 'Action failed.' }); }
      refreshAIChatLog();
    }
    function dismissAIConfirm(id) { const m = aiChat.find(x => x.id === id); if (m) m.confirmAction = null; aiChat.push({ role: 'system', text: 'Action cancelled.' }); refreshAIChatLog(); }
    function clearAIChat() { aiChat = []; openAI(); }

    async function mgApplyReverse(lat, lng) {
      mgDraft.destination.lat = lat;
      mgDraft.destination.lng = lng;
      haptic('light');
      if (!MapService.isOnline()) { toast('Location updated (offline — no name lookup)'); return; }
      toast('Updating location name…');
      const r = await MapService.reverseGeocode(lat, lng);
      if (r.ok) {
        mgDraft.destination.city = r.result.city;
        mgDraft.destination.state = r.result.state;
        mgDraft.destination.country = r.result.country;
        mgDraft.destination.postalCode = r.result.postalCode;
        mgDraft.destination.name = r.result.city || r.result.name;
        mgDraft.destination.fullName = r.result.fullName;
        const input = document.getElementById('mg-dest-name');
        if (input) input.value = mgDraft.destination.name;
        toast('Updated: ' + (r.result.city || r.result.name || 'Unknown'));
      } else {
        toast('Location updated (name lookup failed)');
      }
    }

        'no-date': { label: 'Set a target date', color: 'var(--gray-500)' },
        'completed': { label: 'Completed', color: 'var(--green)' }
      };
      const st = statusMap[calc.status] || { label: '', color: 'var(--gray-500)' };
      return `
