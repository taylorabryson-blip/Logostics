async function togglePref(k){await Store.updatePreferences({[k]:!Store.preferences[k]});haptic('light');openSettings()}
async function toggleNotifCat(k){const c=Object.assign({},Store.preferences.notifCategories||{}),cur=c[k]||{enabled:false};c[k]=Object.assign({},cur,{enabled:!cur.enabled});await Store.updatePreferences({notifCategories:c});haptic('light');openSettings()}
async function toggleAppLock(){if(!Store.preferences.appLockEnabled){const cap=await PlatformCapabilities.checkWebAuthn();if(!cap.available){toast('Cannot enable: '+cap.reason);return}const reg=await AuthManager.register();if(!reg.success){toast('Registration failed: '+(reg.reason||'cancelled'));return}await Store.updatePreferences({appLockEnabled:true,webAuthnCredential:AuthManager.getCredential()});toast('App lock enabled')}else{await Store.updatePreferences({appLockEnabled:false,webAuthnCredential:null});AuthManager.setCredential(null);toast('App lock disabled')}openSettings()}
async function enableNotifications(){const r=await NotificationScheduler.requestPermission();if(r.granted){await Store.updatePreferences({notificationsEnabled:true});SoundManager.success();toast('Notifications enabled')}else toast(r.reason||'Not enabled');openSettings()}
function exportData(){const s=Store.getSnapshot(),u=Accounts.current(),p=Object.assign({},s.preferences);delete p.webAuthnCredential;const out=Object.assign({},s,{preferences:p,account:{username:u.username,displayName:u.displayName,friendCode:u.friendCode,createdAt:u.createdAt}});delete out._listeners;const url=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`logostics-${new Date().toISOString().split('T')[0]}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Exported')}
async function resetMyData(){if(!confirm('Delete your transactions, goals and settings on this account? Your account and friends are kept. This cannot be undone.'))return;await Store.resetMyData();applyAppearance();closeSheet();toast('Your finance data was reset');render()}
function openPatchNotes(){const notes=PatchNotes.getAll(),cur=PatchNotes.getCurrentVersion();PatchNotes.markSeen();openSheet(`<div class="sheet-title">Patch Notes</div>${notes.map(n=>`<div style="margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--gray-800)"><div class="patch-version">${escapeHtml(n.version)} ${n.version===cur?'<span style="color:var(--green);font-size:11px">• current</span>':''}</div><div class="patch-date">${escapeHtml(n.date)}</div><div style="font-size:14px;margin-bottom:12px">${escapeHtml(n.title)}</div>${n.new?`<div class="patch-section"><div class="patch-section-title">New</div><ul>${n.new.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>`:''}${n.improved?`<div class="patch-section"><div class="patch-section-title">Improved</div><ul>${n.improved.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>`:''}</div>`).join('')}<button class="btn btn-primary" onclick="closeSheet()">Done</button>`)}

/* ═══ DEVELOPER MENU ═══ */
function handleDevTap(){DevMenu.handleTap()}
const DevMenu=(function(){
let isOpenF=false,view='list',flt='all',srt='active',q='',did=null,dtab='overview',timer=null,taps=0,tapT=null;
const FILTERS=[['all','All'],['active','Active'],['offline','Offline'],['new','New'],['admins','Admins']],TABS=[['overview','Overview'],['profile','Profile'],['friends','Friends'],['goals','Goals'],['activity','Activity'],['achievements','Achievements'],['notifications','Notifications']];
const MK='<div id="dev-marker" hidden></div>',rank={online:0,away:1,offline:2};
const isDevMe=()=>Accounts.isDev(Accounts.current());
function open(){if(!Admin.allowed()){toast('Not authorized');return}isOpenF=true;view='list';q='';draw();if(!timer)timer=setInterval(()=>{if(isOpenF)refresh()},15000)}
function onClose(){isOpenF=false;if(timer){clearInterval(timer);timer=null}}
function handleTap(){taps++;clearTimeout(tapT);tapT=setTimeout(()=>{taps=0},1500);if(taps>=5){taps=0;if(Admin.allowed()){haptic('medium');open()}}}
function draw(){if(!Admin.allowed()){closeSheet();toast('Not authorized');return}({list:drawList,detail:drawDetail,announce:drawAnnounce,audit:drawAudit})[view]()}
function line(){const s=Admin.stats();return s.ok?`ACTIVE USERS: ${s.active} / TOTAL USERS: ${s.total}`:'Not authorized'}
function userRow(u){const on=u.presence!=='offline';return`<div class="dev-user-row" onclick="DevMenu.show('${u.id}')">${avHTML(u,38,true)}<div style="flex:1;min-width:0"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><b>${escapeHtml(u.displayName)}</b><span class="dev-badge ${on?'active':'idle'}">${on?'Active':'Offline'}</span>${u.roles.developer?'<span class="dev-badge role">Developer</span>':u.roles.admin?'<span class="dev-badge role">Admin</span>':''}${u.isMe?'<span class="dev-badge idle">You</span>':''}</div><div class="meta">@${escapeHtml(u.username)} · ID ${escapeHtml(u.id)} · ${escapeHtml(u.friendCode||'No code')}</div><div class="meta">${lastSeen(u)} · ${u.friendCount} friend${u.friendCount!==1?'s':''} · ${u.goalCount===null?'Goals n/a':u.goalCount+' goal'+(u.goalCount!==1?'s':'')} · Joined ${fmtDate(u.createdAt)||'n/a'}</div></div></div>`}
function listHTML(){const r=Admin.users();if(!r.ok)return`<div class="err">${escapeHtml(r.error)}</div>`;let us=r.users;if(!us.length)return`<div class="empty-sub" style="padding:24px;text-align:center">No registered users.</div>`;const wk=Date.now()-7*864e5;
us=us.filter(u=>flt==='all'||(flt==='active'&&u.presence!=='offline')||(flt==='offline'&&u.presence==='offline')||(flt==='new'&&u.createdAt&&new Date(u.createdAt).getTime()>wk)||(flt==='admins'&&(u.roles.admin||u.roles.developer)));
const s=q.trim().toLowerCase().replace(/^@/,'');if(s)us=us.filter(u=>[u.displayName,u.username,u.id,u.friendCode||''].some(x=>String(x).toLowerCase().includes(s)));
const t=x=>x?new Date(x).getTime():0,cmp={active:(a,b)=>rank[a.presence]-rank[b.presence]||t(b.lastActive)-t(a.lastActive),name:(a,b)=>a.displayName.localeCompare(b.displayName),newest:(a,b)=>t(b.createdAt)-t(a.createdAt),friends:(a,b)=>b.friendCount-a.friendCount,goals:(a,b)=>(b.goalCount||0)-(a.goalCount||0)}[srt];us.sort(cmp);
return us.length?us.map(userRow).join(''):`<div class="empty-sub" style="padding:24px;text-align:center">No users match.</div>`}
function drawList(){openSheet(`${MK}<div class="sheet-title">Developer Menu</div><div class="social-card t-label" id="dev-line" style="text-align:center;font-size:13px;color:var(--text);letter-spacing:.06em">${line()}</div>
<div class="btn-row" style="margin-bottom:14px"><button class="btn btn-secondary" onclick="DevMenu.announce()">📣 Announce</button><button class="btn btn-secondary" onclick="DevMenu.audit()">📜 Audit log</button></div>
<div class="field"><input class="field-input" id="dev-q" placeholder="Search name, username, ID or code" value="${escapeHtml(q)}" oninput="DevMenu.setQ(this.value)" autocomplete="off" style="padding:12px 16px;font-size:15px"></div>
<div class="subtabs">${FILTERS.map(([k,l])=>`<button class="subtab ${flt===k?'active':''}" onclick="DevMenu.setFlt('${k}')">${l}</button>`).join('')}</div>
<div class="field"><select class="field-input" onchange="DevMenu.setSort(this.value)" style="padding:12px 16px;font-size:14px">${[['active','Sort: Most active'],['name','Sort: Name'],['newest','Sort: Newest'],['friends','Sort: Most friends'],['goals','Sort: Most goals']].map(([k,l])=>`<option value="${k}" ${srt===k?'selected':''}>${l}</option>`).join('')}</select></div>
<div id="dev-list" style="border:1px solid var(--gray-800);border-radius:14px;overflow:hidden">${listHTML()}</div><button class="btn btn-secondary" style="margin-top:16px" onclick="closeSheet()">Close</button>`)}
function refresh(){if(!isOpenF)return;if(!document.getElementById('dev-marker')){isOpenF=false;return}if(!Admin.allowed()){closeSheet();return}
if(view==='list'){const l=document.getElementById('dev-line'),d=document.getElementById('dev-list');if(l)l.textContent=line();if(d)d.innerHTML=listHTML()}
else if(view==='detail'&&!inField('#sheet')){const sh=document.getElementById('sheet'),st=sh.scrollTop;drawDetail();sh.scrollTop=st}}
const setQ=v=>{q=v;const d=document.getElementById('dev-list');if(d)d.innerHTML=listHTML()};
const setFlt=k=>{flt=k;drawList()};
const setSort=v=>{srt=v;const d=document.getElementById('dev-list');if(d)d.innerHTML=listHTML()};
const back=()=>{view='list';draw()};
function show(id){did=id;dtab='overview';view='detail';draw()}
const tab=t=>{dtab=t;draw()};
const kv=(k,v)=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray-800);font-size:13px"><span style="color:var(--gray-500)">${k}</span><span style="font-weight:600;text-align:right;word-break:break-all">${v}</span></div>`;
const none=t=>`<div class="progress-note" style="text-align:center;padding:16px">${t}</div>`;
function drawDetail(){const r=Admin.detail(did);if(!r.ok){toast(r.error);view='list';drawList();return}const w=r.row,p=r.profile;let b='';
if(dtab==='overview')b=kv('Display name',na(w.displayName))+kv('Username','@'+escapeHtml(w.username))+kv('User ID',escapeHtml(w.id))+kv('Friend code',na(w.friendCode))+kv('Status',w.presence==='offline'?'Offline':w.presence==='away'?'Away':'Active')+kv('Last active',w.lastActive?fmtDateLong(w.lastActive)+' · '+timeAgo(new Date(w.lastActive).getTime()):'Not available')+kv('Created',fmtDateLong(w.createdAt))+kv('Friends',w.friendCount)+kv('Goals',w.goalCount===null?'Not available':w.goalCount)+kv('Roles',(w.roles.developer?'Developer ':'')+(w.roles.admin?'Admin':'')||'User')
+(isDevMe()?`<div class="t-label" style="margin:18px 0 8px">Permissions</div>${['admin','developer'].map(k=>`<div class="set-row static"><div class="set-left">${k[0].toUpperCase()+k.slice(1)}</div><div class="toggle ${w.roles[k]?'on':''}" onclick="DevMenu.role('${w.id}','${k}',${!w.roles[k]})"></div></div>`).join('')}`:'');
else if(dtab==='profile')b=kv('Bio',na(p.bio))+kv('Status',na(p.status))+kv('Status message',na(p.statusMsg))+kv('Banner',p.hasBanner?'Set':'Not set')+kv('Friend code visible',p.privacy?(p.privacy.showCode!==false?'Yes':'No'):'Not available')+kv('Activity visible',p.privacy?(p.privacy.showActivity!==false?'Yes':'No'):'Not available');
else if(dtab==='friends')b=r.friends.length?r.friends.map(f=>kv(escapeHtml(f.name),'@'+escapeHtml(f.username))).join(''):none('No friends');
else if(dtab==='goals')b=kv('Goal count',w.goalCount===null?'Not available':w.goalCount)+`<div class="t-label" style="margin:16px 0 6px">Shared goals</div>${r.sharedGoals.length?r.sharedGoals.map(g=>kv(escapeHtml(g.name||'Goal'),escapeHtml(g.visibility)+(g.pct===null?'':' · '+g.pct+'%'))).join(''):none('No shared goals')}<div class="t-label" style="margin:16px 0 6px">Group goals</div>${r.groups.length?r.groups.map(g=>kv(escapeHtml(g.name),g.role)).join(''):none('No group goals')}<p class="progress-note" style="margin-top:12px">Private financial data is never shown here.</p>`;
else if(dtab==='activity')b=r.activity.length?r.activity.map(a=>kv(escapeHtml(a.text),timeAgo(new Date(a.at).getTime()))).join(''):none('No activity');
else if(dtab==='achievements')b=r.achievements.length?r.achievements.map(a=>{const d=achDef(a.id);return kv(d?d.emoji+' '+escapeHtml(d.title):escapeHtml(a.id),fmtDateLong(a.at))}).join(''):none('No achievements');
else b=r.notifications.length?r.notifications.map(n=>kv(escapeHtml(n.title)+(n.read?'':' •'),escapeHtml(n.type)+' · '+timeAgo(new Date(n.at).getTime()))).join(''):none('No notifications');
openSheet(`${MK}<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">${avHTML(w,52,true)}<div style="flex:1;min-width:0"><div class="t-title" style="font-size:18px">${escapeHtml(w.displayName)}</div><div class="friend-status">@${escapeHtml(w.username)} · ${lastSeen(w)}</div></div></div><div class="detail-tabs">${TABS.map(([k,l])=>`<button class="detail-tab ${dtab===k?'active':''}" onclick="DevMenu.tab('${k}')">${l}</button>`).join('')}</div>${b}<button class="btn btn-secondary" style="margin-top:16px" onclick="DevMenu.back()">‹ Back to users</button>`)}
function role(id,k,v){const r=Admin.setRole(id,k,v);if(!r.ok){toast(r.error);haptic('error');return}haptic('success');toast('Permissions updated');draw()}
function announce(){view='announce';draw()}
function drawAnnounce(){const r=Admin.users();openSheet(`${MK}<div class="sheet-title">Send Announcement</div><div class="field"><label class="field-label">Send to</label><select class="field-input" id="an-target" onchange="DevMenu.annTarget()"><option value="everyone">Everyone</option><option value="active">Active users</option><option value="user">Specific user</option></select></div><div class="field" id="an-user-wrap" style="display:none"><label class="field-label">User</label><select class="field-input" id="an-user">${r.ok?r.users.map(u=>`<option value="${escapeHtml(u.id)}">${escapeHtml(u.displayName)} (@${escapeHtml(u.username)})</option>`).join(''):''}</select></div><div class="field"><label class="field-label">Title</label><input class="field-input" id="an-title" maxlength="80" placeholder="Title"></div><div class="field"><label class="field-label">Message</label><textarea class="field-input" id="an-msg" rows="4" maxlength="400" placeholder="Message" style="resize:none"></textarea></div><div class="field"><label class="field-label">Expires (optional)</label><input class="field-input" id="an-exp" type="datetime-local"></div><div class="err" id="an-err"></div><button class="btn btn-primary" onclick="DevMenu.send()">Send</button><button class="btn btn-secondary" style="margin-top:8px" onclick="DevMenu.back()">Cancel</button>`)}
function annTarget(){const w=document.getElementById('an-user-wrap');if(w)w.style.display=$v('an-target')==='user'?'block':'none'}
function send(){const e=$v('an-exp'),r=Admin.broadcast({target:$v('an-target'),userId:$v('an-user'),title:$v('an-title'),message:$v('an-msg'),expiresAt:e?new Date(e).toISOString():null}),er=document.getElementById('an-err');if(!r.ok){if(er)er.textContent=r.error;haptic('error');return}haptic('success');toast(`Sent to ${r.count} user${r.count!==1?'s':''}`);back()}
function audit(){view='audit';draw()}
function drawAudit(){const r=Admin.audit();openSheet(`${MK}<div class="sheet-title">Audit Log</div>${r.ok&&r.log.length?r.log.map(a=>kv(escapeHtml(a.adminName)+' · '+escapeHtml(a.action),escapeHtml(a.target||'')+' · '+timeAgo(new Date(a.at).getTime()))).join(''):none(r.ok?'No admin actions yet':escapeHtml(r.error))}<button class="btn btn-secondary" style="margin-top:16px" onclick="DevMenu.back()">‹ Back</button>`)}
return{open,onClose,isOpen:()=>isOpenF,handleTap,refresh,setQ,setFlt,setSort,show,tab,back,role,announce,annTarget,send,audit}})();

/* ═══ SERVICE WORKER + INIT ═══ */
async function registerServiceWorker(){if(!('serviceWorker' in navigator)||!window.isSecureContext)return null;try{const code=`const C='logostics-v10';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./'])).catch(()=>{}));self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))));self.clients.claim()});self.addEventListener('fetch',e=>{const r=e.request;if(r.method!=='GET')return;e.respondWith(caches.match(r).then(c=>c||fetch(r).then(s=>{if(s&&s.status===200&&s.type==='basic'){const y=s.clone();caches.open(C).then(c=>c.put(r,y)).catch(()=>{})}return s}).catch(()=>c)))});`;return await navigator.serviceWorker.register(URL.createObjectURL(new Blob([code],{type:'application/javascript'})))}catch(e){return null}}
function presenceTick(){if(!me)return;const s=dbSig();if(s!==lastSig){lastSig=s;scheduleRender();refreshLive()}if(DevMenu.isOpen())DevMenu.refresh()}
async function init(){
try{const t=JSON.parse(localStorage.getItem('lg_theme')||'null');if(t)applyAppearance(t)}catch(e){}
try{await Store.init()}catch(e){console.error('Store init failed',e)}
registerServiceWorker();LifecycleManager.init();AppLockManager.init();GestureManager.init();
Accounts.restore();if(me){Store.loadUser();applyAppearance();seedSeen()}
Backend.subscribe(()=>{reloadDB();migrateDB(db);Bus.emit('db',{local:false})});Bus.on('db',onDb);Store.subscribe(scheduleRender);
try{const t=sessionStorage.getItem('logostics_tab');if(t&&['home','friends','goals','activity','notifications','profile','analytics'].includes(t))currentTab=t}catch(e){}
document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.tab===currentTab));
if(me&&Store.preferences.appLockEnabled&&AuthManager.hasCredential())AppLockManager.lock('startup');
render();if(me){beat();if(PatchNotes.hasUnseenVersion()&&Store.preferences.lastSeenVersion)setTimeout(openPatchNotes,800);else if(!Store.preferences.lastSeenVersion)PatchNotes.markSeen()}
setInterval(beat,30000);setInterval(presenceTick,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me){beat();scheduleRender()}});
window.addEventListener('pagehide',()=>{if(me&&db.users[me]){try{commit(d=>{if(d.users[me])d.users[me].online=false},{kind:'presence'})}catch(e){}}});
setTimeout(()=>NotificationScheduler.checkAndFire().catch(()=>{}),2000);setInterval(()=>NotificationScheduler.checkAndFire().catch(()=>{}),9e5);
window.addEventListener('online',()=>toast('Back online'));window.addEventListener('offline',()=>toast('Offline — data still saves locally'))}
if(document.readyState!=='loading')init();else document.addEventListener('DOMContentLoaded',init);

</script>
